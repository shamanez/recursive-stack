n the looped engine, so a looped model served without that work leaves two-fifths to half of its speed unclaimed, as other new models do in their first weeks.","caveats":"One GH200 and burst workloads; the headline table has three runs per cell, the rest mostly one. The baseline is an early research engine, not upstream vLLM or SGLang. Exactness is checked on GSM8K token sequences. There is no comparison with a dense model of equal quality.","numbers":[{"metric":"Ouro serving throughput, released defaults","value":"1.65 to 2.15x","baseline":"the vllm-rlt base engine","verification":"self-reported","setup":"one GH200, burst workloads"},{"metric":"Huginn serving throughput, released defaults","value":"1.77 to 3.16x","baseline":"the vllm-rlt base engine","verification":"self-reported","setup":"one GH200, burst workloads"},{"metric":"Fusing Ouro's loop submissions alone","value":"0.99x","baseline":"unfused, batch 1","verification":"self-reported","setup":"the small kernels, not the submissions, were the cost"}],"bears_on":[{"claim":"C6","direction":"supports","note":"A new architecture family brings per-pass overheads that general engines do not handle; exact engine work alone roughly doubled throughput."},{"claim":"C11","direction":"complicates","note":"Each pass repeats fixed per-layer costs, so a looped token costs more than its arithmetic suggests until the engine catches up."}],"also":[{"label":"Full text","url":"https://arxiv.org/html/2611.05150v1"}],"read":"opened","status":"active"},{"id":"2026-11-02-fireflash-agentic-rl-recipe","title":"Agentic RL recipe (FireFlash)","url":"https://agenteconomics.org/posts/agentic-rl-recipe","org":"agenteconomics.org","published":"2026-11-02","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"hand","venue":"any","gist":"An open recipe for reinforcement learning on a large open model for long terminal and coding tasks: separate trainer and rollout GPUs, a filter that keeps only tasks of middling difficulty, verification gates per task, and one harness for both training and evaluation. From the group behind InferenceForge, who say they will put this model into their optimisation loop.","changes":"Gives the price of the model lever when done fully: about 64 top-end GPUs for five days. And it links two levers: the model being trained is meant to become the agent that tunes its own serving.","caveats":"Self-reported in the authors' own harness, with no variance. The harness alone accounts for about half the gain. The cost per trial assumes the base model's list price. No code or weights are linked despite the word released.","numbers":[{"metric":"Terminal task benchmark, pass at first try","value":"35.8 to 46.2","baseline":"the base model; the harness alone gives 40.2","verification":"self-reported"},{"metric":"Cost per trial","value":"$0.72 against $22.02","baseline":"a frontier model at maximum effort, at list prices","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A tuned open model at a thirtieth of a frontier model's cost per trial on the authors' benchmark."},{"claim":"C5","direction":"supports","note":"The stated plan is to use this model as the agent in the inference loop. Still a plan."}],"read":"relayed","status":"retired","retired_why":"A recipe, with a plan to put the model into an optimisation loop that has not been reported since. The tuning evidence now rests on measured customer results. The recipe stays linked as a build part."},{"id":"2026-11-inferact-autonomous-inference-system","title":"Building an autonomous inference system","url":"https://inferact.ai/news/building-autonomous-inference-system","org":"Inferact","authors":"Simon Mo","published":"2026-11","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"The company behind vLLM sets out its north star: a system that watches production workloads, has agents write candidate kernels and engine paths, tests them alone and then end to end against shadow traffic, promotes winners to production and upstream, and revises its own process. Its internal agent system, Agent V, already runs bounded hillclimbs of 24 to 30 hours on single metrics. The author says plainly that the full loop is not built.","changes":"The clearest statement of the whole loop, from the people who maintain the most-used open engine, with production numbers on current models. It also shows the recursion in its weak form: Agent V runs mostly on a model Inferact serves itself.","caveats":"Every number is Inferact's own. The self-revising part is an illustrative day in the life, not a result. They state they cannot yet simulate traffic they have not seen, which is the step that would let the loop run without production access.","numbers":[{"metric":"TTFT at 800k context, Kimi K3.1 on GB300","value":"2.78x faster","baseline":"own engine before a 24-hour hillclimb","verification":"self-reported"},{"metric":"p99 time per output token, Kimi K3.1","value":"35% lower","baseline":"own engine before a 30-hour hillclimb","verification":"self-reported"},{"metric":"Throughput per GPU, Kimi K3 on GB300","value":"0.77M to 1.4M tokens/min (about 1.8x)","baseline":"own production, mid-September to end of October","verification":"self-reported"},{"metric":"Agent V sessions running on self-hosted Kimi K3","value":"79% of sessions, 53% of tokens","baseline":"remainder on other models","verification":"self-reported"},{"metric":"TTFT from expert-parallel prefill, MiniMax M3.1","value":"60 to 70% lower","baseline":"own engine before the patches","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Production hillclimbs on current models, with before-and-after numbers."},{"claim":"C4","direction":"supports","note":"Isolated wins often fail end to end, so every candidate must pass full serving benchmarks and shadow traffic. They cannot yet simulate unseen traffic."},{"claim":"C5","direction":"supports","note":"Agent V runs mostly on a model Inferact serves. Agents rewriting their own process is described as a goal, not shown."},{"claim":"C6","direction":"supports","note":"Day-zero images for a new model on two chip vendors; the search space is framed as thousands of models times a thousand chip architectures."},{"claim":"C7","direction":"supports","note":"Upstream-first by policy: every engine optimisation goes back to vLLM."},{"claim":"C3","direction":"complicates","note":"Promises to tailor the engine to each workload, but gives no per-customer mechanism or number."},{"claim":"C2","direction":"supports","note":"Tunes per workload target and per chip: separate day-zero builds for NVIDIA and AMD, and a search space counted in models times chip architectures."}],"also":[{"label":"Pipeline parallelism write-up","url":"https://inferact.ai/news/pipeline-parallelism-in-agentic-era"}],"read":"opened","status":"active"},{"id":"2026-11-baseten-speculative-encoding","title":"Speculative Encoding: Many-to-Many Cache Translation","url":"https://labs.baseten.co/articles/speculative-encoding-many-to-many-cache-translation","org":"Baseten (Base Labs) and Ramp Labs","authors":"Ben Geist (Ramp Labs), Thomas Villeneuve","published":"2026-11","added":"2026-11-26","kind":"paper","layers":["routing","serving","model"],"mechanism":"hand","venue":"any","gist":"One 2.35-billion-parameter network converts what a source model computed while reading a context into the form a different model needs, so the second model can continue without re-reading it. It covers seven open models of 8 to 14 billion parameters from four families, all 42 directions, where earlier translators needed one network per pair. A second network shrinks the translated cache to what a given question needs.","changes":"The tracker's map rests on a cache belonging to one model, so a session stays on its first model. This attacks that tie. Inside a pool of open models a switch could cost a fraction of a re-read and a few points of accuracy. It does nothing across a closed model's API.","caveats":"The authors' own results, on small models and multiple-choice questions over documents, with no agent sessions or tool calls. The loss grows with length, from 3% at 8,000 tokens to 8% at 32,000 and 17% at 128,000. Timings assume the source's side is already computed. The method needs the source's internal states and the target's weights, so closed models are out. No code, and no test of adding a model.","numbers":[{"metric":"Accuracy kept with a translated cache, documents up to 8,000 tokens","value":"96.9% on average, 93.1% in the worst direction","baseline":"the receiving model reading the text itself","verification":"self-reported","setup":"Seven models of 8 to 14 billion parameters, 42 directions, 12 tasks, three seeds"},{"metric":"Time to first token at 32,000 tokens","value":"4x faster, keeping over 90% of accuracy","baseline":"the receiving model re-reading the text","verification":"self-reported","setup":"One H200 with vLLM, the source's side already computed, median over 42 directions"},{"metric":"Time to first token at 128,000 tokens","value":"2.5x faster at 83% of accuracy; 6.1x and 7.5x for 1 to 2 points less with a shallower translator","baseline":"the receiving model re-reading the text","verification":"self-reported","setup":"Documents 16 times longer than any used in training"},{"metric":"Translated cache shrunk for one question","value":"up to 128x smaller within 2 points at 32,000 and 64,000 tokens; 4.3 points better at 128,000 and 64x","baseline":"the full translated cache","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Inside a pool of open models the cache need not pin a session to one model, if a few points of accuracy are acceptable. Across a closed model's API the claim's cache limit stands."}],"also":[{"label":"SwaT, the pair-by-pair method it builds on","url":"https://arxiv.org/abs/2610.15095"}],"read":"opened","status":"active"},{"id":"2026-10-30-no-free-loop","title":"There Is No Free Loop: When Does Looping a Trained Model Pay for Its Inference Compute?","url":"https://arxiv.org/abs/2610.42030","org":"Microsoft Applied Sciences Group","authors":"Rhea Sanjay Sukthanker, Pashmina Cameron","published":"2026-10-30","added":"2026-11-22","kind":"critique","layers":["model"],"mechanism":"frame","venue":"any","gist":"Tests loops added to Qwen3 and Qwen3.5 models after pretraining against two baselines: the same model trained identically without the loop, and the best unlooped use of the same inference compute. Loops are placed by calibrated perplexity on held-out text, never by benchmark answers. Training-free loops on released Qwen3 models from 1.7B to 32B are included, as are loops trained in with LoRA.","changes":"Prices the compute a loop costs. A loop added after training paid only at 0.8B. On Qwen3-8B a training-free loop gained up to two points, not significantly, and a plain 14B beat it on MATH-500 at 1.3 times the time. Looping pays when weight memory binds, and time does not.","caveats":"Two authors from one lab, with code promised only on acceptance. The benchmarks are mostly maths on reasoning models, so knowledge-heavy multiple choice, where the training-free paper found its gains, appears only as MMLU-Pro. The costliest 8B setting did help GSM8K and MMLU-Pro significantly, at 1.8 times the decoding time. Timing comes from one GPU at small batch.","numbers":[{"metric":"GSM8K, Qwen3-8B with a training-free loop","value":"91.4% (p=0.06)","baseline":"89.4%, the same model unlooped","verification":"third-party","setup":"1.25x layer passes, placed by calibrated perplexity"},{"metric":"MATH-500, the same loop","value":"76.6% (p=0.74)","baseline":"76.0%, unlooped","verification":"third-party","setup":"as above"},{"metric":"MATH-500, plain Qwen3-14B instead","value":"80.2% (p=0.01)","baseline":"76.6%, the looped 8B","verification":"third-party","setup":"the 14B takes about 1.3x the looped 8B's time"},{"metric":"Decoding time, costliest calibrated 8B loop","value":"1.80x","baseline":"unmodified Qwen3-8B","verification":"third-party","setup":"batch 8, one GPU"}],"bears_on":[{"claim":"C11","direction":"supports","note":"Loops added after training pay only under a fixed parameter budget; given more memory, a larger model is the better use of the compute."}],"also":[{"label":"Full text","url":"https://arxiv.org/html/2610.42030v1"}],"read":"opened","status":"active"},{"id":"2026-10-28-github-copilot-fusion","title":"Route and orchestrate models with GitHub Copilot Fusion","url":"https://github.blog/changelog/2026-10-28-route-and-orchestrate-models-with-github-copilot-fusion/","org":"GitHub","published":"2026-10-28","added":"2026-11-26","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"GitHub replaced its automatic model picker with a system that chooses and combines models for each prompt: one model alone, a cheap draft with a quality check and escalation, or a draft, a review by a second model and a revision. In November it joined a public terminal-task leaderboard. The models it names are all closed.","changes":"GitHub has changed sides. In June it routed only at session start and compaction to protect the cache; since October it decides for every prompt. It is also the first shipped router reported ahead of the leading single models on a public agentic board, at lower cost, by its own reading.","caveats":"The leaderboard is hosted by others, but the comparison is GitHub's own and the board itself was not opened. Neither post says how the cache is handled or priced when the model changes, which is the question this tracker cares about. A limited-time 30% discount applies to its use. No open-weight model is named in its pool.","numbers":[{"metric":"Tasks resolved on a public terminal-task leaderboard","value":"71.2%, 5.4 points ahead, at 57% and 88% lower cost","baseline":"the two leading single frontier models on the same board","verification":"self-reported","setup":"Its highest effort tier, November 2026"},{"metric":"Score on a coding-agent index","value":"60, within two points, at about half the cost per task and 40% less time","baseline":"a leading coding agent on one frontier model at its highest effort","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Models do share the work behind one harness, but the pool named is all closed and the choice is made per prompt, not per session."}],"also":[{"label":"November update with the leaderboard result","url":"https://github.blog/changelog/2026-11-17-github-copilot-fusion-updates-more-availability-benchmarks-and-models/"}],"read":"opened","status":"active"},{"id":"2026-10-28-decagon-autoresearch","title":"Building an inference stack that improves itself","url":"https://x.com/DecagonAI/status/2115511110120120437","org":"Decagon","authors":"Pavi Dhiman, Cyrus Asgari","published":"2026-10-28","added":"2026-11-19","kind":"blog","layers":["loop","serving","model","engine"],"mechanism":"agent","venue":"dedicated","gist":"Not an inference provider but a customer-service AI company tuning its own endpoints. An orchestrator replays redacted production traffic, profiles, and spawns sub-agents that must each return an explanation, an intervention, a prediction and a test that could falsify it. Confirmed gains become the new baseline.","changes":"The first case here of the loop being run by the workload's owner on its own traffic, not by a provider. It is the closest thing to a user-workload-aware stack, and it lives on rented cloud GPUs.","caveats":"Unverifiable. Each row uses a different baseline, so the gains do not add. The largest come from known levers (quantisation, n-gram speculation), not new engine work. People start the loop and approve deployment.","numbers":[{"metric":"Requests/s per GPU within the latency SLA, 8-bit weights plus n-gram speculation","value":"2.50x","baseline":"that endpoint's starting configuration","verification":"self-reported"},{"metric":"Combined engine patches","value":"1.99x","baseline":"that endpoint's starting configuration","verification":"self-reported"},{"metric":"Draft model adapted to own traffic","value":"1.34x","baseline":"the production draft model","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"supports","note":"One company, its own traffic, its own loop. The like-for-like part (the adapted drafter) is 1.34x."},{"claim":"C1","direction":"supports","note":"Sub-agents must state a falsifiable prediction before a change is accepted."},{"claim":"C4","direction":"supports","note":"Replayed production traffic is the evaluation rig."}],"read":"relayed","status":"active"},{"id":"2026-10-28-agent-loop-learns-new-accelerator","title":"A case study of a multi-agent kernel-optimization loop that learns a new AI accelerator","url":"https://arxiv.org/abs/2610.38329","org":"Byonggon Chun","published":"2026-10-28","kind":"paper","layers":["kernels","loop","hardware"],"mechanism":"agent","venue":"any","gist":"An agent loop built for a chip the models have barely seen: an NPU programmed in a new, thinly documented Rust DSL. The loop first builds its own knowledge of the target, by summarising and checking the documentation, microbenchmarking the chip and recording what the compiler allows, and rechecks it when the toolchain changes. Over 12 days it optimised three decode kernels for a 12B model.","changes":"The clearest case of the loop fitting itself to hardware it has to learn first. The knowledge it accumulates is its own and gets re-tested, which is the kind that seems to help.","caveats":"One author's case study and a competition entry. Three kernels measured alone on a shared device, with no end-to-end serving result. The abstract does not say how much a person steered it.","numbers":[{"metric":"Three decode kernels, geometric mean","value":"9.29x","baseline":"the vendor's official baseline kernels","verification":"self-reported","setup":"FuriosaAI RNGD NPU, Gemma-4-12B"}],"bears_on":[{"claim":"C6","direction":"supports","note":"A chip with almost no kernel ecosystem and sparse documentation, brought up by an agent loop in 12 days."},{"claim":"C2","direction":"supports","note":"The winning kernels came from measuring this chip's own limits, not from general CUDA knowledge."},{"claim":"C5","direction":"complicates","note":"The loop builds and re-tests its own knowledge of the target. That accumulation helped; it is not the loop improving itself."},{"claim":"C4","direction":"supports","note":"Device time was scarce and noisy, so cheap checks screened designs and late changes needed repeated comparisons."}],"added":"2026-11-19","read":"opened","status":"active"},{"id":"2026-10-26-autobench-do-routers-route","title":"Do LLM routers actually route? Quick answer: not much","url":"https://huggingface.co/blog/PeterKruger/router-benchmark-2026-10","org":"AutoBench","authors":"Peter Kruger","published":"2026-10-26","added":"2026-11-19","kind":"critique","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Seven commercial and open routers in 17 settings, tested on 252 open-ended prompts against a pool of 20 models. None beat simply always calling a cheap strong model on quality and cost together, and several collapsed to sending nearly everything to one model.","changes":"The counter-case for the model-choice lever. If a router cannot beat the cheap strong default, the lever reduces to picking that default well and revisiting it when models change.","caveats":"Single-turn prompts with an LLM judge; agentic work is left for later. Several routers could reach only part of the pool. The author sells router benchmarking.","numbers":[{"metric":"Routers beating the cheap strong model on cost and quality together","value":"0 of 17 settings","baseline":"always calling one cheap strong model","verification":"third-party"},{"metric":"Settings where one model received at least 90% of decisions","value":"5 of 17","baseline":"all settings tested","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"challenges","note":"Independent test: routing did not beat a fixed cheap model."},{"claim":"C4","direction":"supports","note":"Vendors report 30 to 60% savings; an outside test finds none. Same lever, different rig."}],"read":"relayed","status":"active"},{"id":"2026-10-23-vllm-matches-deepinfer","title":"Serving DeepSeek-V4.1-Flash at scale: vLLM matches DeepInfer","url":"https://vllm.ai/blog/2026-10-23-deepseek-v41-flash-pd-wide-ep","org":"Inferact and the vLLM team","published":"2026-10-23","added":"2026-11-19","kind":"blog","layers":["kernels","engine","serving"],"mechanism":"hand","venue":"any","gist":"With the model vendor's kernels integrated, upstream vLLM came close to the vendor's own bespoke engine on decode, then scaled out with prefill/decode disaggregation and wide expert parallelism.","changes":"The best evidence that the commons keeps pace: the general engine landed within a few percent of one built by the model's own authors for that single model.","caveats":"The vendor's figures were read off charts and its hardware is unstated. Prefill setups differ. The vendor's engine was itself originally built on vLLM.","numbers":[{"metric":"Decode against the model vendor's own engine","value":"within 6% across batch 8 to 256","baseline":"DeepInfer's published curve","verification":"self-reported","setup":"GB200"}],"bears_on":[{"claim":"C7","direction":"supports","note":"A general open engine within 6% of a single-model bespoke one."},{"claim":"C3","direction":"challenges","note":"If a bespoke engine for one model buys 6%, per-customer builds have little room."},{"claim":"C6","direction":"complicates","note":"This parity came from people integrating the vendor's kernels by hand, quickly. Churn was absorbed without an agent loop."}],"read":"relayed","status":"active"},{"id":"2026-10-19-together-post-training","title":"Together Post-Training","url":"https://www.together.ai/blog/together-post-training","org":"Together AI","published":"2026-10-19","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"A service for building custom models on open-weight bases by reinforcement learning or supervised fine-tuning. The customer writes the training loop and Together runs the trainer and the rollout fleet, which reuses its serving stack. Trained adapters can be swapped inside one deployment, and checkpoints are served on the numerics they were trained with.","changes":"Tuning the model is being sold as part of the serving stack by the same provider that sells the compiler and the router. Serving many adapters from one deployment is what keeps a tuned model per customer affordable.","caveats":"No benchmark or cost numbers: two customer statements and a promotional price. It does not say how training connects to the compiler or to speculative decoding.","numbers":[],"bears_on":[{"claim":"C10","direction":"supports","note":"A provider ships model tuning alongside its inference products, with one customer reporting a closed model's quality matched offline."},{"claim":"C3","direction":"supports","note":"Many adapters sharing one deployment lowers the cost of a model per customer."}],"read":"opened","status":"active"},{"id":"2026-10-16-vllm-kimi-k3-megakernel","title":"Hyper optimizing Kimi K3 in vLLM: moving fast and responsibly","url":"https://vllm.ai/blog/2026-10-16-kimi-k3-megakernel","org":"vLLM project (NVIDIA, Inferact, Red Hat)","authors":"Benjamin Chislett (NVIDIA)","published":"2026-10-16","added":"2026-11-19","kind":"blog","layers":["kernels","engine","loop"],"mechanism":"agent","venue":"any","gist":"Coding agents helped write a fused decode path for one model on one chip, merged into vLLM. The post's real subject is process: agent-written optimisations now arrive faster than maintainers can read them, so it proposes isolating them in per-model directories and having reviewers judge evidence (full-model evaluations plus kernel tests) instead of every line.","changes":"Public, merged proof that agent-written kernel work is in the main open engine, and an admission that human review is now the queue. Also the opposite bet to Together's on megakernels, in the same month.","caveats":"Agent-assisted, not autonomous; the loop is not described. Decode numbers exclude prefill, and the speculation figure uses a synthetic acceptance length. The AgentX gain of 1.8x compares 16 GPUs with an earlier run on 8. Standalone kernel tests missed a compiler reordering bug and numerical issues that only long evaluations caught. A reviewer's remark about unread kernel code comes from the pull request, read second-hand.","numbers":[{"metric":"Per-layer decode, Kimi K3 on GB300","value":"about 130 microseconds and 23 kernels, down to 69 and 13","baseline":"stock vLLM","verification":"public-run","setup":"merged pull request"},{"metric":"Aggregate decode throughput","value":"1.31x to 1.92x","baseline":"stock vLLM, batch 1 to 64","verification":"public-run"},{"metric":"Decode with speculation, one request","value":"842 vs 488 tok/s (1.73x)","baseline":"stock vLLM with the same speculation settings","verification":"public-run","setup":"16 GB300s, seven draft tokens, acceptance length fixed at 6, prefill excluded"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Agent-written kernel code, merged upstream, with model-level evaluations attached."},{"claim":"C4","direction":"supports","note":"Review capacity is the stated limit, and the existing test gates missed real bugs."},{"claim":"C7","direction":"supports","note":"The work landed in the commons the day it was announced."}],"also":[{"label":"RFC: fast-track for agent-written optimisations","url":"https://github.com/vllm-project/vllm/issues/59665"}],"read":"opened","status":"active"},{"id":"2026-10-14-vllm-byog-evals-rfc","title":"RFC: bring-your-own-GPU evaluations for model-optimisation changes","url":"https://github.com/vllm-project/vllm/issues/61698","org":"vLLM maintainers","authors":"Lucas Wilkinson","published":"2026-10-14","added":"2026-11-19","kind":"repo","layers":["loop","engine"],"mechanism":"frame","venue":"any","gist":"A proposal that vLLM's CI build a signed evaluation image per commit which anyone can run on their own GPUs, with results going to a public database. It states that greedy decoding is not bit-reproducible once batch composition changes, so correctness has to be judged by calibrated task-level tolerances plus a check on token probabilities.","changes":"Shows how weak the usual correctness gate is. In the discussion, a standard task benchmark caught one of seven known numerical bugs when they were replayed, and passed a run in which the engine had crashed.","caveats":"A proposal, still open; results would be informational, not blocking. The figures come from a comment in the thread, not a study.","numbers":[{"metric":"Known numerical bugs caught by a standard task-score gate","value":"1 of 7","baseline":"seven historical bugs replayed","verification":"third-party","setup":"reported in the RFC discussion"}],"bears_on":[{"claim":"C4","direction":"supports","note":"The gate most teams use misses six of seven real numerical bugs."},{"claim":"C7","direction":"supports","note":"The open engine is building shared evaluation infrastructure in public."}],"also":[{"label":"Fast-track RFC: the evidence bar","url":"https://github.com/vllm-project/vllm/issues/59665"}],"read":"relayed","status":"active"},{"id":"2026-10-09-blis-simulate-before-you-scale","title":"Simulate Before You Scale: High-Fidelity LLM Inference Planning Without GPUs","url":"https://arxiv.org/abs/2610.14255","org":"Dipanwita Guhathakurta and co-authors","authors":"Dipanwita Guhathakurta, Mert Toslali, Srinivasan Parthasarathy, Jing Chen, Michael Kalantar, Nicholas A. Masluk, Vishakha Ramani, Asser Tantawi, Fabio Oliveira","published":"2026-10-09","added":"2026-11-26","kind":"paper","layers":["serving","routing"],"mechanism":"frame","venue":"cluster","gist":"A simulator of the whole serving pipeline that runs on CPUs: admission, routing, scheduling, prefill and decode, cache and preemption. Its coefficients are fitted once, with no profiling per model or chip. Two policies developed entirely inside it were then checked on real hardware and merged into an open serving platform. Accepted at a performance-measurement conference.","changes":"The first simulator here whose winners held on real hardware, with an error figure. That is the cheap oracle C4 names, for scheduling and admission only. It moves judging configuration changes off GPUs, which is the cheap half of the rig. Nothing like it exists for engine or kernel code.","caveats":"Read from the abstract. The authors' own numbers, on a testbed and not production traffic. A 6.7% median error says little about the tail, and two configurations ranked within that margin could still be mis-ordered. It covers policies and layouts, not code changes. One older model anchors the configuration search.","numbers":[{"metric":"End-to-end prediction error","value":"6.7% median, about 200x faster than running","baseline":"real GPU runs: 36 experiments, six models, three GPU types","verification":"self-reported"},{"metric":"Admission policy developed in simulation, then run on hardware","value":"critical-tier P90 time to first token down by up to 82%","baseline":"the platform's policy before it","verification":"self-reported","setup":"Merged into llm-d"},{"metric":"Flow-control policy developed in simulation","value":"median end-to-end latency down 32 to 48% under overload","baseline":"the platform's policy before it","verification":"self-reported","setup":"Merged into llm-d"}],"bears_on":[{"claim":"C4","direction":"challenges","note":"A cheap oracle predicted real runs within about 7% and picked policies that held on hardware. It covers scheduling and admission, not engine code."}],"read":"opened","status":"active"},{"id":"2026-10-08-openrouter-cache-is-crucial","title":"Cache is crucial","url":"https://openrouter.ai/data/newsletter/cache-is-crucial","org":"OpenRouter","authors":"Peter Walker","published":"2026-10-08","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"frame","venue":"cluster","gist":"Gateway data on what agent traffic is made of. Almost all of it is context being re-read from cache, billed at a fraction of the input price, and generated output is about one percent of tokens. Cache hit rate therefore matters more to the bill than list price.","changes":"The single fact that ties the levers together. A cache belongs to one model on one machine, so it constrains which model answers, which machine takes the request and what gets evicted. Every router here is designed around it.","caveats":"One gateway, skewed to developers and price-sensitive traffic. It does not measure the cost of switching models directly.","numbers":[{"metric":"Cached prompt tokens as a share of agentic tokens","value":"just under 90%, up from about 60% in January","baseline":"the same gateway eight months earlier","verification":"self-reported"},{"metric":"Price of a cache read","value":"a tenth to a twentieth of fresh input","baseline":"list input price on current frontier models","verification":"self-reported"},{"metric":"Median provider cache hit rate","value":"44% to 85%","baseline":"the same gateway earlier in the year","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The shape of agent traffic, nine-tenths re-read context, is what every serving decision now turns on."},{"claim":"C9","direction":"complicates","note":"Switching model mid-session re-reads everything at full price, which caps how often a router can act."}],"read":"relayed","status":"active"},{"id":"2026-10-06-hybrid-latent-attention-looped","title":"Hybrid Latent Attention for Looped Language Models","url":"https://arxiv.org/abs/2610.07940","org":"Virginia Tech","authors":"Yuhan Chen, Siyuan Zhang, Nan Wang, Feiyang Kang, Ruoxi Jia","published":"2026-10-06","added":"2026-11-22","kind":"paper","layers":["model","serving"],"mechanism":"hand","venue":"cluster","gist":"A looped model that keeps a cache for every pass multiplies its cache by the number of passes, so Ouro 1.4B holds 768 KiB per token. This paper keeps exact keys and values only for recent tokens and turns older ones into small latents, training only the added parameters with the original weights frozen, and serves the result in vLLM.","changes":"Shows where a looped model's memory goes at serving scale. The cache limited batch size: shrinking it 10.7 times let one GPU hold 4 to 9 times as many sequences and decode 2.5 to 7.4 times faster. The saving on weights only survives if the cache is handled too.","caveats":"Self-reported, on A100s at 16-bit, against the full cache of the same model rather than a dense model of equal quality. Each model needs extra training for the added parameters, and it keeps a little over 97% of the original accuracy, so some is lost.","numbers":[{"metric":"Cache per token, Ouro 1.4B","value":"72 KiB (10.7x less)","baseline":"768 KiB, a full cache for each of four passes","verification":"self-reported","setup":"vLLM, A100 80 GB, 16-bit"},{"metric":"Concurrent sequences per GPU","value":"4.0 to 8.8x","baseline":"full cache, 1K to 16K tokens of context","verification":"self-reported","setup":"as above"},{"metric":"Peak decoding throughput","value":"2.5 to 7.4x","baseline":"full cache, 1K to 16K tokens of context","verification":"self-reported","setup":"as above"}],"bears_on":[{"claim":"C11","direction":"supports","note":"At serving batch sizes a looped model's cache binds, and the saving on weights is lost unless the cache is compressed or shared."}],"also":[{"label":"Full text","url":"https://arxiv.org/html/2610.07940v1"}],"read":"opened","status":"active"},{"id":"2026-10-05-together-link","title":"Together Link: frontier-quality open models in the harness you already use","url":"https://www.together.ai/blog/together-link-frontier-quality-open-models-in-the-harness-you-already-use","org":"Together AI","authors":"Will Van Eaton, Hassan El Mghari","published":"2026-10-05","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A one-command setup that points an existing coding agent (Claude Code, Codex and others) at open models hosted by Together. In auto mode a router reads the first task of each session and picks a model once. With the user's own Anthropic key it chooses between a closed frontier model and an open one; without it, between a strong open model and a fast one.","changes":"Open and frontier models sharing one harness, with the choice made by the serving side. Routing once per session is a design forced by the layer below: switching mid-session would throw away the prompt cache.","caveats":"No quality, latency or price benchmarks. The over-50% saving is against an all-frontier counterfactual with no method given. A session that gets harder stays on the model it started with.","numbers":[],"bears_on":[{"claim":"C9","direction":"supports","note":"A shipped product that splits sessions between an open model and a frontier one inside the same harness."},{"claim":"C2","direction":"supports","note":"How often the model can be chosen is set by the prompt cache, a property of the traffic, not of the router."}],"read":"opened","status":"active"},{"id":"2026-10-03-seis-self-evolving-inference","title":"SEIS: self-evolving inference systems","url":"https://arxiv.org/abs/2610.04646","org":"University of Chicago","published":"2026-10-03","added":"2026-11-19","kind":"paper","layers":["loop","engine","model"],"mechanism":"agent","venue":"any","gist":"Agents rewrite a whole small serving engine across chained two-hour sessions, each inheriting the previous session's code and written report, with no hints about techniques. 480 sessions compare independent runs, chains, and chains that periodically sync.","changes":"The only controlled look at whether an agent loop compounds when it inherits its own notes. It does climb, but the inherited reports also carried wrong conclusions forward, and the authors' own audit found engines that passed accuracy gates while computing only part of the output vocabulary.","caveats":"A 0.6B model, one request at a time, greedy decoding, no concurrency: far from production serving. People had to repair the evaluation repeatedly. No code link found and no cost figures.","numbers":[{"metric":"Single-request throughput","value":"594 to 1,942 tok/s (3.27x)","baseline":"the starting mini engine","verification":"self-reported","setup":"Qwen3-0.6B, one H100"},{"metric":"Against tuned production engines on the same workload","value":"2.81 to 3.10x","baseline":"vLLM, SGLang, TensorRT-LLM","verification":"self-reported"},{"metric":"Endpoints with audit or accuracy problems","value":"13","baseline":"the authors' own audit","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"complicates","note":"Chains that inherit notes do improve, and they also inherit mistakes."},{"claim":"C4","direction":"supports","note":"Engines passed the accuracy gate while skipping part of the vocabulary."},{"claim":"C3","direction":"complicates","note":"An engine written for one narrow workload beat general engines about threefold, on a toy setting."}],"read":"relayed","status":"active"},{"id":"2026-10-02-baseten-agentic-engine","title":"Agentic inference optimization: 50-90% faster engines","url":"https://www.baseten.co/blog/agentic-inference-optimization-faster-than-sota/","org":"Baseten","authors":"Shawn Rushefsky","published":"2026-10-02","added":"2026-11-19","kind":"blog","layers":["loop","engine","kernels","model"],"mechanism":"agent","venue":"dedicated","gist":"A coding agent was given a standing goal: beat a tuned vLLM by 20% on every metric with no accuracy loss. Running mostly on its own for about a week, it generated a custom engine for one model, reusing existing kernels where it could and using full-precision weights as the accuracy reference.","changes":"Gives the price of a bespoke engine: about a week, 200 GPU-hours and 1.7 billion tokens. That is cheap enough to do per model, and the author's own notes show why it is not yet safe to leave unattended.","caveats":"The engine code is not released and serves no production traffic. Best-case decode numbers are on repetitive text that favours speculation. The author had to steer the agent off overfitting one traffic shape, and warns that agents game the metric without accuracy constraints. A second, cheaper run on an image model reused the notes from the first; the author calls that suggestive, with no control.","numbers":[{"metric":"Single-stream decode","value":"1,792 vs 943 tok/s","baseline":"tuned vLLM 0.25.1","verification":"self-reported","setup":"Qwen-3.6-35B, one B200"},{"metric":"Time to first token","value":"12 ms vs 28 ms","baseline":"tuned vLLM 0.25.1","verification":"self-reported","setup":"Qwen-3.6-35B, one B200"},{"metric":"Output throughput at 32 concurrent requests","value":"10,307 vs 6,030 tok/s","baseline":"tuned vLLM 0.25.1","verification":"self-reported"},{"metric":"Cost of the run","value":"about 200 B200-hours and 1.7B tokens","baseline":"not applicable","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"A week of mostly unattended agent work produced an engine ahead of a tuned general one."},{"claim":"C3","direction":"supports","note":"At a couple of hundred GPU-hours, an engine per model or per large customer is affordable."},{"claim":"C7","direction":"challenges","note":"A private engine roughly 1.7 to 1.9x ahead of the tuned open one."},{"claim":"C4","direction":"supports","note":"The agent overfit one traffic shape until a person intervened."}],"read":"opened","status":"active"},{"id":"2026-09-30-magnitude-local-engine","title":"Magnitude (open-source local inference engine)","url":"https://github.com/magnitudedev/magnitude","org":"Magnitude","published":"2026-09-30","added":"2026-11-19","kind":"repo","layers":["kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"An open-source local engine that spends up to a minute at model download trying thread-group sizes, chunk sizes and prefetch distances on the actual chip, keeping the fastest combination that leaves outputs unchanged. Ships hand-written kernels for popular model families and a bundled draft model.","changes":"Shows the optimum is specific to the chip in hand: it searches existing settings once, on the actual device. It writes no code and does not look at what the user runs.","caveats":"Measured by the authors against a competitor at default settings, median of two requests. The gain cannot be split between autotuning, speculation and the hand-written kernels. Some wins are against a draft model that was barely drafting, and a few cases regress. The date is the launch post's; the repository is undated.","numbers":[{"metric":"Decode, average of 11 models on a Mac mini M4 Pro","value":"2.19x","baseline":"Ollama v0.35.1 at defaults","verification":"self-reported"},{"metric":"Decode, same models on a DGX Spark","value":"2.17x","baseline":"Ollama v0.35.1 at defaults","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The fastest settings differ enough per chip that it measures them on the actual device at install."}],"also":[{"label":"Benchmarks","url":"https://magnitude.dev/benchmarks"}],"read":"relayed","status":"retired","retired_why":"Cited by no lever, figure or tension, read second-hand, and its one point, that settings are specific to the chip in hand, is made by measured signals. Retired on the weekly deep pass to stay within the limit on active signals."},{"id":"2026-09-30-alibaba-herschel","title":"Herschel: Continuous Optimization of Production LLM Inference through On-Demand Profiling","url":"https://arxiv.org/abs/2609.40247","org":"Alibaba Group","authors":"Luping Wang and 13 others","published":"2026-09-30","added":"2026-11-23","kind":"paper","layers":["loop","engine","kernels"],"mechanism":"agent","venue":"cluster","gist":"Alibaba's model-as-a-service platform attaches a profiler to running deployments for windows of about 30 seconds, with no restart, and matches what it sees against 35 known kinds of waste drawn from over 20,000 open-source pull requests. Agents implement the matching reference fix and test it at reduced scale on idle GPUs; experts decide what goes to canary. Six months covered 17,000 traces from over 120 model variants on more than ten chip types.","changes":"A hyperscaler runs the loop in production, and publishes the most complete design for one. Live profiling picks the targets, agents write the fixes, people approve. Most fixes bought 3 to 6% across 50 to 100 deployments. It also shows two levers colliding, where splitting prefill from decode left drafted tokens nobody used.","caveats":"Self-reported, with no outside check. The paper does not separate the agents' share of the work from the pattern library's and the expert teams', and gives no cost for the experiments. One gain comes from offline tests of an upstream port, not production. Its largest number, 8 to 32% lower time per token, is on an in-house chip.","numbers":[{"metric":"Prefill throughput after overlapping KV object creation with execution","value":"3.3 to 5.7% higher, short contexts","baseline":"the same deployments before the fix","verification":"self-reported","setup":"about 50 GLM and Qwen deployments"},{"metric":"Time to first token after pruning prefill drafts that never reached decode","value":"about 6% lower, short contexts","baseline":"the same deployments before the fix","verification":"self-reported","setup":"about 100 hybrid-attention deployments with prefill and decode split"},{"metric":"Time per output token after re-laying out paged attention","value":"8 to 32% lower","baseline":"the previous layout on the same chip","verification":"self-reported","setup":"small dense models on an in-house accelerator, about 30 deployments"},{"metric":"Production traces matching a known inefficiency pattern","value":"23% of about 17,000","baseline":"six months of sampled traces, over 120 model variants, over ten chip types","verification":"self-reported"},{"metric":"Profiler overhead while recording","value":"under 0.5% on first-token time, up to 7% on time per token","baseline":"unprofiled runs","verification":"self-reported","setup":"8x H20, vLLM, Qwen3-32B and Qwen3-235B-A22B"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Agent-implemented engine and kernel fixes passed canary and are widely deployed at a hyperscaler, measured on production workloads."},{"claim":"C6","direction":"supports","note":"Its stated reason for the loop is breadth: over 120 model variants on more than ten chip types, too many combinations for experts to tune by hand."},{"claim":"C2","direction":"supports","note":"The same waste took 8% of one deployment's worker time and under 1% of another's, and one deployment's most common attention shape ran at 15% of the hardware bound."},{"claim":"C4","direction":"supports","note":"Most of the system gathers evidence and gates changes; the agent is one stage between a profiler and an expert review."},{"claim":"C3","direction":"complicates","note":"Fixes found in one deployment's profile were rolled out to 50 to 100 others, so the tuning is fleet-wide rather than per customer."}],"also":[{"label":"Full paper (HTML)","url":"https://arxiv.org/html/2609.40247"}],"read":"opened","status":"active"},{"id":"2026-09-23-modal-trillion-tokens","title":"Trillion tokens, trillion parameters","url":"https://modal.com/blog/trillion-tokens-trillion-parameters","org":"Modal","published":"2026-09-23","added":"2026-11-19","kind":"blog","layers":["model","engine","routing"],"mechanism":"hand","venue":"dedicated","gist":"How Modal tuned its shared Kimi K2.6 service for coding-agent traffic, sold directly and through OpenRouter: a drafter first trained on a generic mix, then fine-tuned on coding traces the target model produced, an 8-bit KV cache, a CPU-memory cache tier, and load-aware session routing.","changes":"A clean tuned-against-generic number at the level of the workload class: fine-tuning the drafter on the target model's own coding traces was worth about 20%. Modal says it then repeated the recipe, faster, for other models.","caveats":"Opened first-hand on 21 Nov. Nothing says the drafter saw one customer's traffic; it can keep training on production outputs, but the 20% is on representative traces. The recipe carried over to other models, not customers. The 2.8x and 5.6x headline figures are against an unoptimised replica.","numbers":[{"metric":"Speculative accept length after fine-tuning the draft on coding traces for the target model","value":"5.00 to 5.84 tokens per step, about 20% faster","baseline":"a generic draft model","verification":"self-reported"},{"metric":"Per-replica throughput","value":"5.6x","baseline":"an unoptimised replica, unspecified","verification":"self-reported","setup":"Kimi K2.6, B200"}],"bears_on":[{"claim":"C3","direction":"challenges","note":"Tuning a drafter to the coding-agent class, on the model's own outputs, was worth about 20%. This is class-level, not per-customer, tuning."},{"claim":"C2","direction":"supports","note":"The stack was designed around the shape of coding-agent traffic: 100k tokens in, 500 out."}],"read":"opened","status":"active"},{"id":"2026-09-22-swe-serve","title":"SWE-Serve: benchmarking agentic engineering for production inference serving","url":"https://arxiv.org/abs/2609.26777","org":"NVIDIA, UC Berkeley","published":"2026-09-22","added":"2026-11-19","kind":"benchmark","layers":["loop","engine","serving"],"mechanism":"frame","venue":"any","gist":"53 tasks rebuilt from real merged SGLang pull requests, graded with hidden tests, end-to-end serving tests and performance gates.","changes":"Quantifies the gap between a patch that passes unit tests and one that survives real serving: about a third of otherwise-passing patches fail once end-to-end checks are added.","caveats":"Only three tasks have performance gates and their pass rates are not reported, so it says little about optimisation as such. One engine, no multi-GPU.","numbers":[{"metric":"Best agents, mean first-try pass rate","value":"75%","baseline":"53 tasks from merged pull requests","verification":"third-party"},{"metric":"Pass rate on tasks with end-to-end tests","value":"45.9%, against 69.4% without those tests","baseline":"the same patches","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"A third of patches that look done fail real serving."},{"claim":"C1","direction":"complicates","note":"Agents handle most real serving-engine tasks, and fewer once tested properly."}],"read":"relayed","status":"active"},{"id":"2026-09-22-openrouter-token-state-of-play","title":"The token state of play","url":"https://openrouter.ai/data/newsletter/the-token-state-of-play","org":"OpenRouter","authors":"Peter Walker","published":"2026-09-22","added":"2026-11-19","kind":"blog","layers":["routing"],"mechanism":"frame","venue":"cluster","gist":"Gateway data on who serves what. Open-weight models have carried most tokens since April while closed models still take most of the money, and a new premium closed model pulls spend back within weeks. A second gateway reports the same pattern.","changes":"Coexistence, measured: volume goes to open models and money to closed ones. For a provider of open models this is the market, most of the tokens and a quarter of the spend.","caveats":"One gateway's developer-heavy traffic, with token and spend figures from different weeks. The second gateway's index corroborates the direction, not the exact shares.","numbers":[{"metric":"Open-weight share of tokens","value":"above 62% since April, peaking at 79%","baseline":"under half at the start of the year","verification":"self-reported"},{"metric":"Closed-weight share of spend","value":"73%, down from 89% in January","baseline":"the same gateway","verification":"self-reported"},{"metric":"Open-weight share on a second gateway","value":"71.5% of tokens for 22.6% of spend","baseline":"7.0% of tokens the previous December","verification":"self-reported","setup":"Vercel AI Gateway index"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Both kinds of model carry real traffic at once, split by volume and by money."},{"claim":"C6","direction":"supports","note":"The average start-up on the gateway uses 12 models and more than half changed their top model in a month."}],"also":[{"label":"Vercel AI Gateway production index","url":"https://vercel.com/blog/ai-gateway-production-index-october-2026"}],"read":"relayed","status":"active"},{"id":"2026-09-21-fireworks-frontier-is-a-router","title":"The frontier isn't a model. It's a router.","url":"https://fireworks.ai/blog/llm-model-routing-deepswe","org":"Fireworks AI","published":"2026-09-21","added":"2026-11-22","kind":"blog","layers":["routing"],"mechanism":"frame","venue":"cluster","gist":"Fireworks ran 18 models four times each on 113 Deep SWE tasks and asked what a perfect router would score if it chose one model per task, in hindsight, and kept it for the whole task. The best single model scored 74.1% at $6.52 a task; the hindsight choice 97.6% at $1.88, or 90.3% at $1.45 from open models alone. Three complementary models capture most of it. Its own router chooses per task and is cache-aware.","changes":"Puts a ceiling under T8: choosing once per task, with no switching, has 23 points and two-thirds of the cost to find, and three models get most of it. Fireworks now routes per task, which moves it to the once-per-session side of T7.","caveats":"The ceiling is hindsight, scored on the same tasks it picks from, which the authors say biases it upward. Costs were rescaled to the board's published figures because the raw trial costs disagreed. The production figure, 53% lower session cost, has no quality measure and is against Claude Opus 5 alone, not the best single model. The post cites a benchmark finding that routers often fail to beat simple baselines.","numbers":[{"metric":"Deep SWE pass rate and cost per task, perfect choice of one model per task","value":"97.6% at $1.88","baseline":"best single model, GPT-6 Astra: 74.1% at $6.52","verification":"self-reported","setup":"18 models, 113 tasks, pass@1 from four rollouts each"},{"metric":"The same, open-weight models only","value":"90.3% at $1.45","baseline":"best single model: 74.1% at $6.52","verification":"self-reported","setup":"six open models"},{"metric":"Pass rate of the best three models together","value":"91.2%","baseline":"74.1% for the best one, 97.6% for all eighteen","verification":"self-reported"},{"metric":"Session cost through its router, own coding traffic","value":"$7.42 (53% lower)","baseline":"$15.81 for Claude Opus 5 alone, 2,334 sessions over four weeks","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Open and frontier models are complementary enough that a perfect choice per task beats any one model by 23 points, and open models alone beat every closed one. No shipped router has been shown to capture it."}],"read":"opened","status":"active"},{"id":"2026-09-17-zai-glm-built-its-inference","title":"Toward recursive self-improvement: how GLM built its own inference infrastructure","url":"https://z.ai/blog/glm-built-its-inference-infrastructure","org":"Z.ai (Zhipu)","published":"2026-09-17","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine","serving","hardware"],"mechanism":"agent","venue":"cluster","gist":"An agent powered by GLM-5.3 did much of the work of bringing a GLM-5.3 variant from first run to production on a large cluster of Chinese-made accelerators. The stated key is dense feedback: correctness comparisons, microbenchmarks, traces and end-to-end metrics packaged as repeatable workflows the agent can call.","changes":"The most literal instance of the recursive framing: a model optimising the serving of its own family, on chips where no mature kernel library exists. It also says outright that this is not yet RSI.","caveats":"Self-reported and mostly unverifiable. The 3x is against the team's own first port. Engineers set objectives, built the feedback environment and reviewed anything touching architecture, concurrency or production risk; the human share is not quantified.","numbers":[{"metric":"End-to-end throughput","value":"about 3x in under two weeks","baseline":"the team's own initial port","verification":"self-reported"},{"metric":"One decode kernel","value":"1.71x","baseline":"before removing redundant per-tile computation","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"supports","note":"A model family building its own serving stack. The authors themselves say they are not there yet."},{"claim":"C6","direction":"supports","note":"New accelerators with no kernel ecosystem are where hand-tuning cannot keep up."},{"claim":"C4","direction":"supports","note":"The enabler was dense feedback, and people built it."}],"read":"relayed","status":"active"},{"id":"2026-09-14-vera-rubin-agentx","title":"Vera Rubin NVL72 agentic inference","url":"https://newsletter.semianalysis.com/p/vera-rubin-nvl72-agentic-inference","org":"SemiAnalysis","published":"2026-09-14","added":"2026-11-19","kind":"benchmark","layers":["hardware","engine"],"mechanism":"frame","venue":"cluster","gist":"First AgentX results for the next NVIDIA generation. The hardware step moves cost per token by more than any software specialisation reported elsewhere here, though the size of the multiple depends heavily on which software baseline it is measured against.","changes":"Two lessons. A hardware generation can swamp tuning gains. And the same hardware comparison swings by an order of magnitude with the software baseline, which is a measure of how much the software is worth.","caveats":"Pre-release software on one engine only, with vendor staff helping verify. Later sections are paywalled.","numbers":[{"metric":"Throughput per dollar of total cost at 60 to 100 tok/s per user","value":"1.4 to 3x","baseline":"the previous generation (GB300)","verification":"third-party"},{"metric":"Throughput per megawatt at 170 tok/s per user","value":"62.9x against one software stack, 5.56x against another","baseline":"GB300 on TensorRT-LLM, and GB300 on SGLang","verification":"third-party"}],"bears_on":[{"claim":"C6","direction":"supports","note":"A new generation arrives and every tuned stack starts again."},{"claim":"C2","direction":"complicates","note":"A hardware step can dwarf what workload tuning buys."}],"read":"relayed","status":"active"},{"id":"2026-09-11-rooflang","title":"RoofLang: enabling AI-driven architecting of LLM inference systems","url":"https://arxiv.org/abs/2609.12551","org":"Ziyue Yang, Yuting Jiang, Lei Qu, Peng Cheng","published":"2026-09-11","kind":"paper","layers":["loop","engine","serving"],"mechanism":"agent","venue":"any","gist":"Argues that agent loops driven by profiling can only tune the stack they are handed. It proposes a small language for describing inference workloads, a set of changes that can be checked, and an evaluator that does not depend on any one implementation, so an agent can search whole architectures. A persistent agent is reported to have found designs that raise throughput and interactivity on a current model.","changes":"An attempt at the thing C4 says is missing: a cheap way to judge a design without building and benchmarking it. If it holds up, evaluation stops being the bottleneck for architecture-level search.","caveats":"Abstract only. The agent-found gains (6 to 50%) have no named baseline, so they are not in the ledger. Nothing says the evaluator's predictions were checked against a real engine under real traffic.","numbers":[],"bears_on":[{"claim":"C4","direction":"complicates","note":"Proposes an evaluator independent of any implementation. Unproven, but a direct attempt at the cheap oracle."},{"claim":"C1","direction":"supports","note":"By the authors' account, a persistent agent found new architectures for a current model and chip, not only settings."}],"added":"2026-11-19","read":"opened","status":"retired","retired_why":"A proposed evaluator that needs no implementation. A simulator checked against real hardware now makes the point with numbers. Its roster entry stays."},{"id":"2026-09-08-vllm-agentx","title":"vLLM x AgentX: optimizing for real-world agentic serving","url":"https://vllm.ai/blog/2026-09-08-vllm-agentx","org":"vLLM team and Inferact","published":"2026-09-08","added":"2026-11-19","kind":"blog","layers":["engine","serving","routing","kernels"],"mechanism":"hand","venue":"any","gist":"The general-purpose open engine reworked for agent traffic: a shared KV block pool, cache retention aware of sessions, a cap on long prefills in the scheduler, and per-model parallelism choices. On this workload, simply keeping a session on the same server beat every load-balancing signal.","changes":"The workload class changed the engine's design, not only its settings. And because it happened in the commons, everyone got it.","caveats":"No before-optimisation baseline for the headline throughput. The prefill cap buys throughput by making long requests wait longer for a first token. The cost comparison with a closed model's API prices assumes a perfect cache hit rate and says nothing about quality. Hints from the agent harness are future work.","numbers":[{"metric":"Total tokens per GPU-second from a 512-token cap on long prefills","value":"up to 93% higher","baseline":"the same engine without the cap","verification":"public-run","setup":"DeepSeek V4 Pro, B300"},{"metric":"P90 interactivity from the same 512-token cap","value":"about 2.3x","baseline":"the same engine without the cap","verification":"public-run","setup":"DeepSeek V4 Pro, B300"},{"metric":"Prefill with context parallelism on a 32K prompt","value":"2.65x","baseline":"8-way tensor parallelism","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Agent sessions (median 43 turns, 142K input tokens, 96% prefix hits) needed different scheduling and caching from chat."},{"claim":"C7","direction":"supports","note":"Class-level specialisation landed upstream."},{"claim":"C3","direction":"challenges","note":"Changes for the whole class, in the shared engine, delivered the bulk of the gain with no per-customer work."}],"read":"opened","status":"active"},{"id":"2026-09-01-cachebridge","title":"CacheBridge: Efficient Cross-Model KV Transfer for Multi-Model LLM Serving","url":"https://arxiv.org/abs/2609.00891","org":"Xingyu Qu and co-authors","authors":"Xingyu Qu, Siyuan Lu, Zhiyu Chen, Sheng Wang, Tao Lin","published":"2026-09-01","added":"2026-11-26","kind":"paper","layers":["serving","routing"],"mechanism":"hand","venue":"any","gist":"A serving system built around moving a session's cache from one model to another, for routers, cascades and agent workflows. It pairs a compact mapper with serving-side optimisation so that a switch is faster end to end than re-reading, which the authors say earlier transfer methods were not. Tested on agent tasks under load on one pair, and on five pairs from three families for quality. Revised in November 2026.","changes":"The only result here on agent tasks under load. Switching from a 14B to a 32B model, first-token time fell 30 to 98% against re-reading at 1 to 24 requests a second, with task success about level. The authors say earlier transfer methods were slower than re-reading end to end, the test that matters.","caveats":"Read from the abstract. The load test covers one pair inside one family, and the five-pair quality figures name no context length. Task success is called comparable without a number. No engine, chip or code is named there, and it does not say whether each pair needs its own mapper.","numbers":[{"metric":"Mean time to first token after a model switch, agent tasks","value":"30 to 98% lower","baseline":"re-reading the history on the new model","verification":"self-reported","setup":"Qwen3 14B to 32B on tau-bench, 1 to 24 requests a second"},{"metric":"Task quality kept after a switch","value":"97.9% on chat and reasoning, 102.9% on retrieval tasks","baseline":"re-reading the history on the new model","verification":"self-reported","setup":"Five pairs from three families"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"A session could change model mid-task inside an open family without the full re-read the claim assumes."}],"read":"opened","status":"active"},{"id":"2026-08-31-fireworks-training-api","title":"Training API now GA: custom RL and fine-tuning loops","url":"https://fireworks.ai/blog/training-api-general-availability","org":"Fireworks AI","published":"2026-08-31","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"The customer writes the loss or reward, the data and the environment; Fireworks runs the distributed trainer and rollout deployment and serves the result. In November it added adapters served with no idle charge and a preview tool that builds evaluations from production traces. Its customer results are the fullest set published for this lever.","changes":"The most complete evidence that tuning an open model buys cost and latency on a narrow task. Its own changelog also shows the catch: tunable base models are added and withdrawn within weeks.","caveats":"All results are the vendor's or its customers'. No data volumes, compute or prices. The changelog shows managed reinforcement fine-tuning paused in October and one base model added to training and removed two months later.","numbers":[{"metric":"Real secrets caught at a 5% false-alarm budget","value":"about 70% against 59%","baseline":"a general frontier model","verification":"self-reported","setup":"two adapters on an open base, one customer"},{"metric":"Latency after moving off closed models","value":"3.5x lower","baseline":"the customer's previous closed-model setup","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"Named customers report a tuned open model beating a general one on their own narrow task."},{"claim":"C10","direction":"challenges","note":"The same provider paused one tuning method and cycled a base model in and out within two months."}],"also":[{"label":"Changelog","url":"https://docs.fireworks.ai/updates/changelog"},{"label":"Harvey case study","url":"https://fireworks.ai/customers/harvey-tenet-kimi-k3-post-training"}],"read":"relayed","status":"active"},{"id":"2026-08-26-harvey-tenet","title":"Harvey Tenet: post-training Kimi K3 for legal work","url":"https://fireworks.ai/customers/harvey-tenet-kimi-k3-post-training","org":"Fireworks AI and Harvey","published":"2026-08-26","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"A legal AI company post-trained an open model with reinforcement learning on tens of thousands of long agent runs per checkpoint, each over 50 turns. The trained model nearly doubled its pass rate on a legal agent benchmark at about the same cost per task, and the gain carried to two held-out legal benchmarks.","changes":"The strongest single result for tuning as an inference lever: nearly twice the quality for the same serving cost, on the customer's own kind of work.","caveats":"No comparison with a frontier model, and no training data or compute disclosed. Three months later an untuned general model scored 27.1% on the same benchmark against this tune's 19.7%, and Harvey post-trained four newer open models with another provider.","numbers":[{"metric":"Pass rate on a legal agent benchmark","value":"19.7% against 10.8%","baseline":"the same open model before tuning, at about the same cost per task","verification":"self-reported"},{"metric":"Cost per benchmark task","value":"$5.92 against $5.62","baseline":"the same open model before tuning","verification":"self-reported"},{"metric":"Held-out corporate law benchmark","value":"58.8% to 74.0%","baseline":"the same open model before tuning","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"Tuning nearly doubled quality on the customer's domain at flat cost."},{"claim":"C10","direction":"complicates","note":"Within two months general models appear to have caught up on the same leaderboard."}],"read":"opened","status":"active"},{"id":"2026-08-24-agentx-inferencex-v3","title":"AgentX 1.0 / InferenceX v3: does the CUDA moat hold up in agentic inferencing?","url":"https://newsletter.semianalysis.com/p/agentx-inferencexv3-does-cuda-moat","org":"SemiAnalysis","published":"2026-08-24","added":"2026-11-19","kind":"benchmark","layers":["loop","serving","routing","engine"],"mechanism":"frame","venue":"cluster","gist":"An open benchmark that replays 393 anonymised coding-agent sessions: many turns, contexts up to a million tokens, heavy prefix reuse, bursts of sub-agents. Every data point is a public CI run with its configuration committed. It replaced fixed-length request benchmarks as the number serving teams compete on.","changes":"This is the hill everyone is climbing. Almost every result tracked here is stated against it. A shared, replayable workload is what made agent-driven optimisation possible outside the companies that own traffic. It is also a single target the whole field can overfit.","caveats":"One organisation's coding traces now define good serving. The post counts upstream fixes inconsistently (50+ and 70+) and many were still open. Part of the article is paywalled.","numbers":[{"metric":"Throughput from one scheduler change (decode interval after prefill)","value":"+141%, with median TTFT rising from 36.5 s to 59 s","baseline":"the same engine before the patch","verification":"public-run"},{"metric":"Keeping KV on CPU memory in vLLM","value":"+81.7% throughput","baseline":"recomputing the context","verification":"public-run"},{"metric":"Prefix-cache hit rate after a checkpoint-retention fix on AMD","value":"5.6% to 96.45%","baseline":"before the fix","verification":"public-run"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Replaying real agent sessions instead of fixed-length requests changed which optimisations matter."},{"claim":"C4","direction":"complicates","note":"A public replayable workload lowers the traffic moat, and at the same time points everyone at one trace set."},{"claim":"C7","direction":"supports","note":"Fifty or more fixes it prompted went upstream into vLLM and SGLang."}],"also":[{"label":"Live scoreboard","url":"https://inferencex.semianalysis.com"}],"read":"relayed","status":"active"},{"id":"2026-08-18-dflash-2","title":"DFlash 2: keep drafting parallel","url":"https://inco.ai/blog/dflash2/","org":"Inco AI, with the original DFlash group","published":"2026-08-18","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"any","gist":"A block drafter that keeps several candidates per position and uses a tiny selector to pick one coherent path through them. Its published tables show speed-up against plain decoding at three load levels and five kinds of task.","changes":"The cleanest public numbers on what happens to speculation under load: a threefold gain for a single request falls to almost nothing at 32 concurrent, and rival drafters fall below break-even.","caveats":"Self-reported on one model and one GPU; training data is not disclosed and there is no paper. The tables by load are on the model card, not in the post. The rival DSpark drafter is a community build, which scored below the model's own head. The company offers to build drafters for customers' tuned models, which implies each tuned model needs its own.","numbers":[{"metric":"Speed-up, one request at a time","value":"2.67 to 3.43x","baseline":"plain decoding without speculation","verification":"self-reported","setup":"Qwen3.8-27B, one H200"},{"metric":"Speed-up at 8 concurrent requests","value":"2.27 to 2.85x","baseline":"plain decoding without speculation","verification":"self-reported","setup":"Qwen3.8-27B, SGLang, one H200"},{"metric":"Speed-up at 32 concurrent requests","value":"1.01 to 1.45x","baseline":"plain decoding without speculation","verification":"self-reported","setup":"Qwen3.8-27B, SGLang, one H200"},{"metric":"Rival drafters at 32 concurrent","value":"0.74 to 1.13x, below break-even on four of five tasks","baseline":"plain decoding without speculation","verification":"self-reported","setup":"Qwen3.8-27B, SGLang, one H200"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The same drafter is worth 3x or nothing depending on load and on the kind of text."},{"claim":"C10","direction":"complicates","note":"A drafter is tied to one exact model. Tune the model and the drafter has to be rebuilt."}],"also":[{"label":"Model card with the tables by load","url":"https://huggingface.co/incoai/Qwen3.8-27B-DFlash2"}],"read":"opened","status":"active"},{"id":"2026-08-17-llmd-sticky-until-saturated","title":"Sticky until saturated: token-aware routing","url":"https://llm-d.ai/blog/sticky-until-saturated-token-aware-routing","org":"llm-d (Google authors)","published":"2026-08-17","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"rules","venue":"any","gist":"The open Kubernetes inference router replaced a four-signal blend with one cache-affinity filter plus one load signal chosen to match the workload's bottleneck: uncached tokens in flight when prefill-bound, active streams when decode-bound. Stickiness lets go at a saturation limit calibrated per deployment.","changes":"An unusually candid like-for-like measurement of workload-aware routing: large where prefill dominates, nothing where decode does. The calibration does not transfer between models, chips or engines, a small concrete case of the optimum being specific to the deployment.","caveats":"Each point was run once. The baseline is round-robin, a weak one. The authors say a hand-tuned weight set can still beat their default on the workload it was tuned for.","numbers":[{"metric":"Code-generation input throughput","value":"46k vs 16k tok/s (2.9x)","baseline":"Kubernetes round-robin","verification":"self-reported","setup":"Qwen3-32B, H100"},{"metric":"Decode-bound reasoning workload","value":"7.0k vs 6.8k tok/s (parity)","baseline":"Kubernetes round-robin","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The right load signal depends on whether the workload is prefill-bound or decode-bound."},{"claim":"C3","direction":"complicates","note":"The per-deployment part is one calibrated threshold, not a bespoke stack."}],"read":"relayed","status":"active"},{"id":"2026-08-13-databricks-smart-routing","title":"Smart Routing in Unity AI Gateway: match frontier quality at 30%+ lower cost per task","url":"https://databricks.com/blog/smart-routing-unity-ai-gateway-match-frontier-quality-30-lower-cost-task","org":"Databricks","authors":"Ankit Mathur, Ivan Zhou, Bryan Qiu, Rohit Agrawal, Elise Gonzales, Kelly Albano","published":"2026-08-13","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A small classifier reads only the task description and start-of-session metadata, then one policy starts at a mid-size model and moves up or down. The model is fixed for the session because switching between turns breaks the prompt cache, which the post calls the main cost driver. Sub-agent launches are routed separately.","changes":"The clearest statement of why routing is done per session: per-request routing was rejected on cache cost. The team names its own next step as making a mid-session switch cheap, calls switching untenable at scale today, and says routers do well on benchmark tasks and worse on real sessions.","caveats":"Self-reported with no task counts or pool list. The documentation, read on 26 November, is narrower than the blog: only sub-agents are routed, the main session keeps its default model, routing for one harness is paused, and the feature is still beta. The post says a router with perfect foresight would beat every single model for a fraction of the spend.","numbers":[{"metric":"Cost per task on internal workloads","value":"65% of the frontier model's","baseline":"a leading frontier model; the post says the router also outperformed every single model","verification":"self-reported"},{"metric":"Cost on public coding benchmarks","value":"56% lower","baseline":"the frontier model alone, at matched quality","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Mixed pools of models behind one gateway, with a classifier choosing per session."},{"claim":"C9","direction":"complicates","note":"The shipped scope shrank to sub-agents only, and the same team says simply using cheaper models saves over half."}],"also":[{"label":"Documentation: what is routed today","url":"https://docs.databricks.com/aws/en/ai-gateway/coding-agent-model-selection"}],"read":"opened","status":"active"},{"id":"2026-08-11-thoughtworks-nemotron-test","title":"Putting NVIDIA Nemotron 3.5 Lightning to the test","url":"https://www.thoughtworks.com/insights/blog/generative-ai/putting-nvidia-nemotron-3-5-lightning-test","org":"Thoughtworks","published":"2026-08-11","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"frame","venue":"onprem","gist":"A consultancy with early access tested a small open model on its own hardware across two engines, two chips and three workloads. It trained a purpose-built draft head and legal and healthcare adapters, and compared them with what ships in the box.","changes":"Measured by someone other than the vendor. The custom-trained drafter only matched the one built into the model, while a domain adapter more than doubled accuracy on a legal task.","caveats":"No numeric head-to-head for the two draft heads, no test of whether the adapters hurt speculation, and no frontier comparison. An early-access partner, so not fully independent.","numbers":[{"metric":"Legal task accuracy with a domain adapter","value":"35% to 77%","baseline":"the same model without the adapter","verification":"third-party"},{"metric":"Built-in draft head","value":"1.46 to 1.96x","baseline":"decoding without speculation","verification":"third-party","setup":"2,091 measurements, concurrency 1 to 128"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A cheap adapter more than doubled accuracy on a domain task, measured by a third party."},{"claim":"C3","direction":"challenges","note":"A drafter trained specially for the deployment did no better than the one shipped with the model."}],"read":"relayed","status":"active"},{"id":"2026-08-11-goedecke-local-models-will-not-win","title":"No, local models will not win","url":"https://www.seangoedecke.com/local-models-will-not-win","org":"Sean Goedecke","published":"2026-08-11","added":"2026-11-19","kind":"essay","layers":["hardware","serving"],"mechanism":"frame","venue":"local","gist":"Argues datacenter inference is cheaper for structural reasons, not subsidy: batching serves many users for about the cost of one, a single local user has nothing to batch, and datacenter chips do more per watt. Users also choose the strongest model they can get.","changes":"The cleanest statement of why the loop's home is the datacenter. Every agent-loop result tracked here leans on batching and cache reuse across many sessions, which one user does not have.","caveats":"The 30x figure is a back-of-envelope product of the author's own estimates. It ignores speculation, several local agents sharing a batch, and privacy. He concedes a hybrid (local for fast, cloud for hard) is likely.","numbers":[{"metric":"Resources per unit of inference, local against datacenter","value":"about 30x","baseline":"the author's estimate from chip specifications and batching","verification":"unverified"}],"bears_on":[{"claim":"C8","direction":"challenges","note":"The economics that make the datacenter loop pay (batching, shared caches) are absent for one user."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-08-11-executorch-agentic-runtime","title":"Fast, on-device agentic AI with Muse Glimmer on ExecuTorch","url":"https://pytorch.org/blog/fast-ondevice-agentic-ai-with-executorch/","org":"PyTorch / Meta","published":"2026-08-11","added":"2026-11-19","kind":"blog","layers":["compiler","kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"A model and its decoding strategy are lowered ahead of time. On NVIDIA cards the export step compiles and autotunes kernels for the detected GPU architecture; on Apple silicon it targets MLX or custom Metal kernels. Speculative decoding is handled inside the exported artifact.","changes":"Tuning at export for the device in hand is now in a mainstream runtime, and the result is tied to that chip: the optimum is specific to what you have.","caveats":"No continuous batching or cache sharing across sessions yet. No comparison with llama.cpp or mlx-lm, and most results are charts only. The date shown is last-updated.","numbers":[{"metric":"Text plus image decode with speculative decoding","value":"21.6 to 33.0 tok/s (+52.8%)","baseline":"the same runtime without speculation","verification":"self-reported","setup":"M5 Pro, 64 GB"}],"bears_on":
