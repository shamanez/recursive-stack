evers that adapt inference to the load, in the order a request meets them, plus the loop that re-tunes them and a build order for the reader's position. Each lever says what it listens to in the load, how often it changes, what it has bought (with a baseline) and how it depends on its neighbours. Update a lever's status only when the evidence changes.","umbrella":"Inference is becoming load-aware. Seven parts of the stack that used to be set once now move with the traffic, each listening to a different signal on a different clock. They are tied together by the prompt cache and by the model, so changing one means redoing others. Agent loops are what make that redoing affordable.","levers":[{"id":"model","n":1,"name":"Which model answers","question":"Does this session need a frontier model, or will a cheaper open one do?","adapts":"The model a session is sent to: a small fast open model, a strong open model, or a closed frontier one. Sub-agents can be routed separately.","listens":"How hard the first task of the session looks, live load and price on each model, and whether a cache would be lost by switching.","clock":"request","status":"working","bought":"Vendors report 33 to 74% lower cost, each against its own baseline. Outside, seven shipped routers failed to beat a cheap default and one lost on its vendor's own board. Another topped a public agentic board at lower cost, by its vendor's reading.","connects":"Nine-tenths of agent tokens are cached re-reads, and a cache belongs to one model, so routes change only at session start, compaction or sub-agent launch. Research translators now move a cache between open models for a few points of accuracy. Each routed model needs its own drafter and engine.","signals":["2026-08-13-databricks-smart-routing","2026-10-05-together-link","2026-07-22-cursor-router","2026-10-08-openrouter-cache-is-crucial","2026-09-22-openrouter-token-state-of-play","2026-10-26-autobench-do-routers-route","2026-05-14-twinrouterbench","2026-11-06-openrouter-auto-code-routers","2026-11-baseten-speculative-encoding","2026-09-01-cachebridge","2026-08-04-cross-model-kv-transfer-linear","2026-10-28-github-copilot-fusion"],"claims":["C9"]},{"id":"worker","n":2,"name":"Which machine takes it","question":"Which server already holds this session's context?","adapts":"The server each request lands on, and when a session is allowed to move.","listens":"Where the session's cached context lives, and how many uncached tokens or active streams each server has in flight.","clock":"request","status":"working","bought":"2.9x input throughput on code generation against round-robin, and nothing on a decode-bound workload. The saturation threshold has to be recalibrated per model and chip.","connects":"Sticky routing is what makes the prompt cache pay, and the cache is most of an agent workload's cost. It needs the cache map kept by lever 3, and it can take hints from the agent harness about priority and expected length.","signals":["2026-08-17-llmd-sticky-until-saturated","nvidia-dynamo-agentic-inference","2026-09-08-vllm-agentx","2026-10-08-openrouter-cache-is-crucial"],"claims":["C2"]},{"id":"split","n":3,"name":"How the cluster is divided","question":"How much of the cluster should read prompts, and how much should write answers?","adapts":"The share of machines doing prefill against decode, the size of batches, and which cached contexts are kept or evicted.","listens":"The mix of long prompts and steady generation, and which contexts agents are still waiting to reuse.","clock":"minutes","status":"early","bought":"1.28x over the best fixed split as traffic shifts, in research. A prefill cap: up to 93% more tokens per GPU-second. A host-memory cache tier: 3.9x once sessions outgrew the GPU. A shared cache store cut one provider's prefill nodes from 58 to 34.","connects":"It decides how full batches are, which sets how much speculation (lever 4) is worth and which shapes the kernels (lever 5) see. Evicting the wrong context undoes lever 2. Splitting prefill from decode left one provider drafting tokens decode never used.","signals":["2026-11-09-evolving-infra","2026-09-08-vllm-agentx","2026-08-24-agentx-inferencex-v3","2026-11-23-llmd-sglang-tiered-kv-cache","2026-09-30-alibaba-herschel","2026-11-16-sarvam-token-factory"],"claims":["C2"]},{"id":"decode","n":4,"name":"How tokens get written","question":"How far ahead can a cheap draft guess before the big model has to check?","adapts":"The draft model, how many tokens it guesses ahead for this request, and whether to speculate at all at the current load. The drafter itself can keep training on live traffic.","listens":"How predictable the output is in this domain (code and maths speculate well, chat does not), how full the batches are right now, and how many recent guesses were accepted.","clock":"request","status":"working","bought":"About 3x for one request, 1 to 1.5x at 32 concurrent; on a large mixture-of-experts model the recipe setting lost from 16. A load-aware scheduler raised throughput by half. Draft length by batch size added up to 15%. A self-training drafter adds 1.25x.","connects":"A drafter fits one model and quantisation: tune or swap the model (levers 1 and 6) and it is rebuilt. One analysis says mixture-of-experts models pay most at small batches; one measurement shows the usual fade. Checking competes with real requests for batch room, so tune with lever 3.","signals":["2026-07-06-dspark","2026-08-18-dflash-2","2026-03-31-together-aurora","2026-03-19-speed-bench","2025-12-31-speculative-decoding-performance-or-illusion","2026-09-23-modal-trillion-tokens","2025-10-10-together-atlas","2025-12-27-nightjar","2026-06-22-doubleword-adaptive-speculation","2026-06-08-economics-of-speculative-decoding","2026-07-openzeka-kimi-k3-speculation-under-load"],"claims":["C2","C3"]},{"id":"engine","n":5,"name":"How the engine runs it","question":"What are the fastest kernels and settings for this model, on this chip, under this traffic?","adapts":"The kernels, how operations are fused, the parallelism layout and the engine's settings.","listens":"Batch sizes, sequence lengths, cache-hit rates, and which parts of the model real inputs actually exercise.","clock":"days","status":"working","bought":"43% more throughput under a per-user speed floor against the best published run. Merged agent-written kernels: 1.3 to 1.9x on decode. Kernel gains measured alone mostly vanish end to end. Fused decode chosen per step: 1.2 to 2.3x for one user, fading with load.","connects":"This is where agent loops do most of their work today. Every lever above changes the shapes this one sees, so re-tuning any of them can undo it. It is redone for each new model and each new chip.","signals":["2026-11-09-inferenceforge","2026-10-16-vllm-kimi-k3-megakernel","2026-11-04-together-compiler","2026-05-22-fastkernels","2026-11-18-vllm-flydsl-monokernels","2026-09-30-alibaba-herschel"],"claims":["C1","C2","C6"]},{"id":"weights","n":6,"name":"What the model is","base":true,"hint":"under every step above: the weights themselves, tuned to a domain","question":"Could a smaller model, trained on this domain, do the job a bigger general one does now?","adapts":"The weights: reinforcement learning or fine-tuning on a customer's tasks and tool formats, distilling a frontier model's outputs into a small one, and how hard they are quantised.","listens":"The domain's tasks and tool-calling format, logged production outputs to learn from, and where the general model fails or is slower than it needs to be.","clock":"release","status":"early","bought":"On one legal benchmark, tuning nearly doubled an open model's pass rate at flat cost in August; in November four re-tuned newer models gained 11 to 21 points and one passed the best closed model. 0.9 s against 45 s on one summarisation job.","connects":"A tuned model lets lever 1 send more sessions down the cheap path. It needs its own drafter (lever 4) and compiled engine (lever 5), and it dies when its base model is withdrawn. General models passed one tune within three months. Adapters sharing one deployment keep it affordable.","signals":["2026-08-26-harvey-tenet","2026-11-24-baseten-harvey-post-training","2026-11-18-datadog-fine-tune-baseten","2026-08-31-fireworks-training-api","2026-10-19-together-post-training","2026-11-04-cognition-swe-2-flash","2026-05-07-openai-fine-tuning-wind-down"],"claims":["C10"]},{"id":"depth","n":7,"name":"How deep each token goes","question":"Should this token run part of the model again, given how hard it is and how busy the machine is?","adapts":"How many passes a looped model makes through its shared middle layers, fixed at release today and per token where a model allows it, or where a token exits early. Weights stay the same.","listens":"How sure the model already is of the next token, how full the batches are, the request's latency budget, and how much cache memory each extra pass would take.","clock":"request","status":"early","bought":"Trained in, loops let one lab ship a 26B it says leads open models under 100B on coding, and a second pass on 7% of tokens adds 3 to 4 points. Retrofitted, a point or two; a plain 14B beat a looped 8B.","connects":"Extra passes compete for batch room like speculation (lever 4), and the window and step count are found per model like engine settings (lever 5). Trained loops keep a cache per pass over the prompt, so more passes mean fewer sequences per GPU. Training-free loops keep the cache size.","signals":["2026-11-20-inkling-2-mini","2025-11-11-think-at-hard","2025-10-29-ouro-looped-language-models","2026-10-30-no-free-loop","2026-05-22-training-free-looped-transformers","2026-10-06-hybrid-latent-attention-looped","2026-11-03-looped-model-serving-speed"],"claims":["C11"]}],"loop":{"name":"The loop","hint":"agents and a measuring rig re-tune every lever as the load changes","text":"None of the seven levers is new. What changed in 2026 is the cost of re-tuning them. Coding agents, pointed at a rig that replays real traffic and measures end to end, now do in a day what took a performance engineer a month, and can do it again when the model, the chip or the traffic changes.","connects":"Today the loop works mostly on lever 5, a little on levers 3 and 4, and has only begun on 1 and 6 (one company had an agent run its fine-tuning). Its limit is not the agent but the rig: knowing whether a change is real.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-10-28-decagon-autoresearch","2026-11-16-sarvam-token-factory"]},"build_intro":"Written for a provider serving many models. The order follows where others report the most gain for the least new code. Steps 4 to 7 repeat for every model, so do them for the few that carry most of your traffic and rely on the open engines for the rest. It is drawn from published accounts, not from a system anyone has documented end to end.","build":[{"name":"Record your traffic and learn to replay it","levers":["worker","split","engine"],"do":"Capture real sessions at your gateway with their timing, context lengths and cache behaviour, strip the content, and replay them against a candidate stack at real concurrency. Replayers exist; the capture and redaction side you write yourself.","bought":"Nothing by itself. It let an academic group with no customers top the public board, and drives one company's loop. Public agent traces overstated capacity by about 1.7x for four models and hid a routing bug.","watch":"Mean traces overstate throughput by 10 to 20%, reruns hit a warm cache, and traces from another model mislead. One provider's stored prompts leaked through an agent-committed credential; it now defaults new accounts to zero retention.","signals":["2026-08-24-agentx-inferencex-v3","2026-04-22-applied-compute-agentic-benchmark","2026-10-28-decagon-autoresearch","2026-03-19-speed-bench","2026-11-19-validation-driven-deployment","2026-11-21-together-prompt-leak"],"parts":[{"label":"AIPerf trace replay","url":"https://github.com/ai-dynamo/aiperf","note":"NVIDIA. Replays recorded agent sessions with their timing and shared prefixes against any OpenAI-compatible endpoint."},{"label":"AgentX harness","url":"https://github.com/SemiAnalysisAI/agentx-harness","note":"The public benchmark's own replayer, a fork of AIPerf, with 393 coding-agent traces."},{"label":"TraceLab","url":"https://github.com/uw-syfi/TraceLab","note":"University of Washington. Collects and sanitises agent session logs: sizes and timing, no content."},{"label":"trie","url":"https://github.com/Applied-Compute/trie","note":"Applied Compute. Under 1,000 lines; replays sessions by shape and reports cache-hit rates."},{"label":"TensorRT-LLM trace replay","url":"https://nvidia.github.io/TensorRT-LLM/blogs/tech_blog/blog27_Evaluating_Agentic_Serving_with_Trace_Replay_and_Job_Level_Metrics.html","note":"Adds jobs per hour, and computes the best achievable cache-hit rate without a GPU."}]},{"name":"Add gates that catch a fake win","levers":["engine"],"do":"Measure every change end to end inside the full engine, never a kernel alone. Check outputs in three layers: kernel tests across shapes, a token-probability comparison, and task evals that exercise the changed path. Fail on request errors.","bought":"Protection. Kernel speed-ups of 1.6 to 6.6x shrank to about 1x end to end, and one in sixteen agent runs in an independent benchmark gamed the measurement.","watch":"A standard task-score gate caught 1 of 7 known numerical bugs. Agents have been caught changing the benchmark. An upstream fused kernel shipped that garbled about one long code reply in nine.","signals":["2026-05-22-fastkernels","2026-10-14-vllm-byog-evals-rfc","2026-05-20-inferencebench","2026-10-03-seis-self-evolving-inference","2026-11-16-sarvam-token-factory"],"parts":[{"label":"vLLM fast-track RFC","url":"https://github.com/vllm-project/vllm/issues/59665","note":"The evidence an agent-written optimisation must carry: isolation, end-to-end evals, kernel tests, no regression above 1%."},{"label":"vLLM bring-your-own-GPU evals RFC","url":"https://github.com/vllm-project/vllm/issues/61698","note":"Task tolerances calibrated from repeated runs, plus a token-probability check."},{"label":"SGLang agent skills","url":"https://github.com/sgl-project/sglang/tree/main/.agents/skills","note":"Includes a test comparing each token's probability on the prefill and decode paths."},{"label":"klgate","url":"https://github.com/sansblues/klgate","note":"A prototype of the probability check with a permutation test in place of a fixed threshold."}]},{"name":"Tune what needs no new code","levers":["worker","split"],"do":"Search the settings you already have against the rig: cache-aware and sticky routing, the prefill and decode split, caps on long prefills, cache retention. Use plain search here, not agents. Screen candidates in a simulator first: one picked policies that held on hardware.","bought":"The largest reported gains for the least risk: 2.9x from cache-aware routing on code generation, 3.9x from a host-memory cache tier once sessions outgrew GPU memory, up to 93% from a prefill cap. One default flag explained 78% of a gap between two engines.","watch":"Plain search beat every coding agent here in an independent test. Prefill-bound gains do not appear on decode-bound work. A shared-storage cache tier added 14 to 66% to first-token time and paid only on failover.","signals":["2026-08-17-llmd-sticky-until-saturated","2026-09-08-vllm-agentx","2026-11-04-vllm-sglang-controlled-evaluation","2026-05-20-inferencebench","2026-11-23-llmd-sglang-tiered-kv-cache","2026-10-09-blis-simulate-before-you-scale"],"parts":[{"label":"llm-d","url":"https://github.com/llm-d/llm-d","note":"Cache-aware and load-aware routing on Kubernetes over vLLM and SGLang, with a latency predictor that retrains on live traffic."},{"label":"NVIDIA Dynamo","url":"https://github.com/ai-dynamo/dynamo","note":"Routing by cached-prefix overlap, hints from the agent harness, and a planner that forecasts load."},{"label":"DynoSim","url":"https://docs.nvidia.com/dynamo/knowledge-base/concepts/simulation/overview.md","note":"Simulates scheduling and caching without GPUs to shortlist settings. Confirm the shortlist on real hardware."},{"label":"BLIS","url":"https://arxiv.org/abs/2610.14255","note":"A simulator of the serving pipeline that runs on CPUs. 6.7% median error against real runs, and two policies found in it were merged into llm-d. For scheduling and admission, not engine code."}]},{"name":"Fit the decoding to the traffic","levers":["decode"],"do":"Measure how well your traffic speculates, by domain, by load and by model, before building anything. Train a draft model for each target model, and let the draft length follow the live batch size, down to zero.","bought":"About 3x for a single request, 1 to 1.5x at 32 concurrent. A load-aware scheduler with a new drafter: about half more live throughput. Draft length by batch size alone: up to 15%. Tuning the drafter to the workload: 20 to 45%.","watch":"Under load some drafters fall below break-even; the engines' recipe for one mixture-of-experts model lost from 16 concurrent. A purpose-trained drafter only matched the shipped one in an outside test. Rebuild it whenever the model changes.","signals":["2026-08-18-dflash-2","2026-07-06-dspark","2026-03-19-speed-bench","2026-08-11-thoughtworks-nemotron-test","2026-09-23-modal-trillion-tokens","2025-12-27-nightjar","2026-06-22-doubleword-adaptive-speculation","2026-06-08-economics-of-speculative-decoding","2026-07-openzeka-kimi-k3-speculation-under-load"],"parts":[{"label":"Speculators","url":"https://developers.redhat.com/articles/2026/06/04/speculators-v050-dflash-support-and-online-training","note":"vLLM project and Red Hat. Trains draft models from a running server's hidden states and serves them directly."},{"label":"SPEED-Bench","url":"https://huggingface.co/blog/nvidia/speed-bench","note":"Measures acceptance across 11 kinds of content, and throughput under load, inside production engines."},{"label":"Aurora","url":"https://www.together.ai/blog/aurora","note":"Together's open-source drafter that keeps training on live traffic."},{"label":"inference-lab","url":"https://github.com/doublewordai/inference-lab","note":"Doubleword, MIT licence. Simulates a vLLM-shaped engine so a draft-length policy can be priced before it is built. Its figures are upper bounds until calibrated against a real engine."}]},{"name":"Automate bringing up each new model","levers":["engine","decode"],"do":"Have an agent port each new model into your engine against an exact oracle: its outputs must match the reference layer by layer. Then run steps 3 and 4 for it from a script, not by hand.","bought":"On the public board, a new model's throughput per GPU rose 1.2 to 2.9x per chip in its first fortnight. Published skills let a coding agent port a model by chasing layer-by-layer divergence. A typical start-up changes its top model within a month.","watch":"Bring-up times show on the public board; no provider has published its own time or cost. Porting has an exact oracle and optimisation does not, so the gate for one will not do for the other.","signals":["2026-11-20-agentx-kimi-k31-first-fortnight","2026-06-18-modular-agent-skills","2026-07-02-sglang-agent-assisted-development","2026-11-inferact-autonomous-inference-system","2026-09-22-openrouter-token-state-of-play"],"parts":[{"label":"Modular agent skills","url":"https://modular.com/blog/modular-26-4-sota-moe-serving-model-bringup-via-agent-skills-mojo-beta-2-and-more","note":"Two published skills for porting a model: scaffold from the nearest architecture, then hunt divergence against the reference."},{"label":"MetaInfer","url":"https://github.com/HuangPuStar/MetaInfer","note":"Skills for porting models to less common accelerators, with a correctness gate that runs first."},{"label":"SGLang agent skills","url":"https://github.com/sgl-project/sglang/tree/main/.agents/skills","note":"Includes consistency tests between the prefill and decode paths, useful as a bring-up check."}]},{"name":"Point agents at the engine","levers":["engine"],"do":"Give coding agents the rig, an engine that reloads code in seconds, and a plain goal. Start with the models that carry most of your traffic, and let short profiles of live deployments pick the targets. People review the evidence and approve what ships.","bought":"43% under a speed floor in three days; merged kernels worth 1.3 to 1.9x on decode; a whole bespoke engine in a week for about 200 GPU-hours; across a hyperscaler's fleet, 3 to 6% per fix on 50 to 100 deployments.","watch":"Curated knowledge and expert playbooks made one team's agents worse. Review is the queue: patches arrive faster than people can read them.","signals":["2026-11-09-inferenceforge","2026-10-16-vllm-kimi-k3-megakernel","2026-10-02-baseten-agentic-engine","2026-11-16-together-deleted-megakernels","2026-09-30-alibaba-herschel"],"parts":[{"label":"SGLang agent skills","url":"https://github.com/sgl-project/sglang/tree/main/.agents/skills","note":"32 published skills: profiling, CUDA debugging, incident replay, consistency tests."},{"label":"Kernel Design Agents","url":"https://github.com/NVlabs/kda","note":"NVIDIA Research and MIT. A contract, plan and verify workflow for kernel work."},{"label":"MetaInfer","url":"https://github.com/HuangPuStar/MetaInfer","note":"A skills-only toolkit with a correctness gate that runs before profiling. One provider built a custom engine with it."}]},{"name":"Choose between models, and tune one where the job is narrow","levers":["model","weights"],"do":"Start from the best single model for the job and route only where the work is varied, deciding at session start or where no cache is lost. Post-train an open model only for single jobs where you have the data and a grader.","bought":"Routing: 33 to 74% lower cost by vendors' accounts. On public coding tasks single models beat one vendor's router; another vendor reports its router ahead on a public agentic board. Tuning: 11 to 21 points on a legal benchmark for four open models.","watch":"Nobody has tested a router on live sessions with the cache priced. A tune needs its own drafter and engine, has been passed by general models within three months, and dies with its base model.","signals":["2026-08-13-databricks-smart-routing","2026-11-06-openrouter-auto-code-routers","2026-10-26-autobench-do-routers-route","2026-08-26-harvey-tenet","2026-11-18-datadog-fine-tune-baseten","2026-11-04-cognition-swe-2-flash","2026-09-21-fireworks-frontier-is-a-router","2026-10-28-github-copilot-fusion","2026-11-24-baseten-harvey-post-training"],"parts":[{"label":"TwinRouterBench","url":"https://arxiv.org/abs/2605.18859","note":"Scores a router step by step with prompt caching priced in. Use it before trusting a router."},{"label":"OpenRouter router benchmarks","url":"https://openrouter.ai/benchmarks/routers","note":"Routers beside single models from the same pool on public tasks. Read it per benchmark, not the averaged chart."},{"label":"Agentic RL recipe","url":"https://agenteconomics.org/posts/agentic-rl-recipe","note":"An open recipe for reinforcement learning on a large open model: about 64 GPUs for five days."},{"label":"Together Post-Training","url":"https://www.together.ai/blog/together-post-training","note":"A hosted trainer where you write the loop. Adapters share one deployment."},{"label":"Fireworks Training API","url":"https://fireworks.ai/blog/training-api-general-availability","note":"The same shape from another provider. Check its changelog for which base models are still tunable."}]},{"name":"Close the loop","levers":["worker","split","decode","engine"],"do":"Detect when traffic has drifted, re-run the earlier steps, promote winners through shadow traffic, and send upstream whatever is not specific to you.","bought":"One provider shadowed all live traffic onto a new build before cutover. Another screens changes in a calibrated simulator, then live A/B tests, with an engineer approving each. Prompt lengths have been seen to rise about 80% within two weeks of a model release.","watch":"No provider has published how it detects drift, and nothing public compares a shadow's outputs with the live side. Nobody can yet simulate traffic they have not seen.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-11-09-evolving-infra","2026-11-16-sarvam-token-factory"],"parts":[{"label":"Gateway API request mirroring","url":"https://www.alibabacloud.com/help/en/ack/ack-managed-and-ack-dedicated/user-guide/use-ack-gateway-with-inference-extension-to-implement-traffic-mirroring-for-inference-service","note":"Copies live requests to a shadow service and discards its replies. Comparing the two sides is left to you."},{"label":"Dynamo planner","url":"https://docs.nvidia.com/dynamo/v1.0.0/design-docs/component-design/planner-design","note":"Forecasts load and tracks how far observed latency has drifted from the profile."},{"label":"TIDE","url":"https://arxiv.org/abs/2602.05145","note":"Research: keeps a drafter aligned with live traffic and turns speculation off when it stops paying."}]}],"build_note":"Written in-house because nothing public exists: capture and redaction at your gateway, comparing a shadow's outputs and latency with the live side, an engine that reloads candidate code in seconds, and the detector that decides when to re-tune. The cost of the whole thing is also missing from every public account; one figure exists for one step.","open_ground":[{"head":"How to tell that traffic has drifted","text":"Every loop re-tunes when the load changes. No provider has published how it detects that, with what signal, threshold or window. Alibaba sidesteps it, profiling live deployments in 30-second windows for known waste.","claims":["C2"],"checks":[],"signals":["2026-11-04-together-compiler","2026-11-inferact-autonomous-inference-system","2026-09-30-alibaba-herschel"]},{"head":"Judging a change on traffic you have not seen","text":"Replay covers only what was recorded; another model's traces overstated capacity by 1.7x. A simulator picks scheduling policies that hold on hardware. None judges engine or kernel changes or is checked against live traffic.","claims":["C4"],"checks":["W20"],"signals":["2026-11-inferact-autonomous-inference-system","2026-04-22-applied-compute-agentic-benchmark","2026-06-22-doubleword-adaptive-speculation","2026-11-19-validation-driven-deployment","2026-10-09-blis-simulate-before-you-scale","2026-11-16-sarvam-token-factory"]},{"head":"Tuning the levers together","text":"Each lever is tuned alone, yet they are coupled through the cache and the model. Two systems set speculation by load; nobody tunes routing, decoding and the engine jointly.","claims":["C2"],"checks":[],"signals":["2026-07-06-dspark","2026-10-08-openrouter-cache-is-crucial","2025-12-27-nightjar"]},{"head":"What the loop costs per model","text":"One figure exists: about 200 GPU-hours for one bespoke engine. With many models, cost per model per month decides whether any of this pays.","claims":["C3","C6"],"checks":["W12","W19"],"signals":["2026-10-02-baseten-agentic-engine"]},{"head":"Whether gains compound from one cycle to the next","text":"The recursive claim needs gain per cycle to rise, or a model trained on optimisation traces to beat its teacher. Nobody has shown either.","claims":["C5"],"checks":["W8"],"signals":["2026-10-03-seis-self-evolving-inference","2026-03-30-kernel-smith"]},{"head":"Moving a session between models without a re-read","text":"Three research systems translate a cache between open models for a few points of accuracy. None is in production or crosses a closed model's API, and one was tested on agent tasks.","claims":["C9"],"checks":["W25"],"signals":["2026-11-baseten-speculative-encoding","2026-09-01-cachebridge","2026-08-04-cross-model-kv-transfer-linear"]}]},"tensions":[{"id":"T1","question":"Megakernels: fuse the whole forward pass, or delete the idea?","sides":[{"held_by":"Together AI","position":"Deleted theirs. CUDA Graphs plus PDL recover 98% of the gain, and a megakernel bakes in one model shape and one chip, which breaks as soon as either changes.","signals":["2026-11-16-together-deleted-megakernels"]},{"held_by":"vLLM, SGLang, Inferact, AMD","position":"Shipping fused decode paths in upstream vLLM, some agent-written and some by hand, for a dozen model and chip pairs. Gains of 1.2 to 2x over the stock engine for one user.","signals":["2026-10-16-vllm-kimi-k3-megakernel","2026-07-02-sglang-agent-assisted-development","2026-11-inferact-autonomous-inference-system","2026-11-18-vllm-flydsl-monokernels"]}],"settles_when":"Someone runs the same model on the same chip on AgentX with a fused path against a CUDA Graphs plus PDL path, or either camp changes course.","lean":"Both, by load. With graph replay on both sides, fused decode won by 1.2 to 2.3x for one user on AMD chips, and the gain shrank as concurrency rose. The price is code: 12 per-model packages and 165k lines. Nobody has yet run fused against graphs plus PDL on one NVIDIA chip.","claims":["C6","C1"],"status":"leaning"},{"id":"T2","question":"Does accumulated knowledge make the optimising agents better, or worse?","sides":[{"held_by":"Together AI","position":"Worse. A curated knowledge base cut the final speed-up by about 19%, and expert-written strategies lost to a one-line instruction by about 26%.","signals":["2026-11-16-together-deleted-megakernels"]},{"held_by":"ModelBlaster, VibeServe, Z.ai, Meta","position":"Better. A persistent knowledge base is the agent's policy; a skills library raised the ceiling in ablation; search traces train the next model.","signals":["2026-11-03-modelblaster","2026-05-07-vibeserve","2026-09-17-zai-glm-built-its-inference","2026-04-02-meta-kernelevolve"]},{"held_by":"SEIS","position":"Both. Chains that inherit their own reports climb further, and also carry wrong conclusions forward.","signals":["2026-10-03-seis-self-evolving-inference"]}],"settles_when":"A second team publishes an ablation of machine-accumulated (not hand-curated) memory on a production-scale task.","lean":"The split may be between knowledge people wrote down, which hurts, and knowledge the loop accumulated and can re-test, which helps until it carries an error. That distinction is the whole of the RSI question in miniature.","claims":["C5"],"status":"open"},{"id":"T3","question":"Is this a job for agents, or for plain search?","sides":[{"held_by":"InferenceBench","position":"With the same budget, a simple hyperparameter search beat every agent. Agents know the techniques but explore one configuration and stop.","signals":["2026-05-20-inferencebench"]},{"held_by":"InferenceForge, Together, vLLM","position":"The gains came from new code (kernel fixes, fused paths) that no search over existing knobs could reach.","signals":["2026-11-09-inferenceforge","2026-11-04-together-compiler","2026-10-16-vllm-kimi-k3-megakernel"]}],"settles_when":"A benchmark separates gains from configuration and gains from new code on the same task, or InferenceBench runs a matched-budget search next to the newest agents.","lean":"Both, at different layers. Knobs belong to search; kernels and engine paths belong to agents. The strongest systems already combine them: Together prunes parallelism layouts with a cost model before any agent runs.","claims":["C1"],"status":"leaning"},{"id":"T4","question":"Is the moat the traffic, or just the harness?","sides":[{"held_by":"Inferact, Together, Decagon, an llm-d rollout","position":"You need real traffic. Synthetic inputs mislead the agents, nobody can yet simulate traffic they have not seen, and four models sized on public traces reached about 60% of that throughput on their own.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-16-together-deleted-megakernels","2026-10-28-decagon-autoresearch","2026-11-19-validation-driven-deployment"]},{"held_by":"InferenceForge, AgentX","position":"A public set of replayable traces was enough for an academic group with no customers to top the scoreboard.","signals":["2026-11-09-inferenceforge","2026-08-24-agentx-inferencex-v3"]}],"settles_when":"A stack tuned only on the public benchmark is deployed on real traffic and someone reports whether the gains hold.","claims":["C4","C7"],"status":"leaning","lean":"Toward the traffic, for sizing. Public agent traces overstated four models' capacity by about 1.7x and hid a routing bug. Nobody has yet carried tuning gains, as opposed to capacity, from the public board to real traffic."},{"id":"T5","question":"Does specialisation stop at the workload class, or go down to each customer?","sides":[{"held_by":"Modal, vLLM, Alibaba","position":"Class level is most of it. Tuning a drafter to the coding-agent class was worth about 20%, a general engine came within 6% of a bespoke one, and one hyperscaler rolls each tested fix out to 50 to 100 deployments.","signals":["2026-09-23-modal-trillion-tokens","2026-09-08-vllm-agentx","2026-10-23-vllm-matches-deepinfer","2026-09-30-alibaba-herschel"]},{"held_by":"Together, Baseten, Decagon","position":"Per deployment, continuously. A bespoke engine now costs a couple of hundred GPU-hours, and one company running the loop on its own traffic reports gains at every layer.","signals":["2026-11-04-together-compiler","2026-10-02-baseten-agentic-engine","2026-10-28-decagon-autoresearch","2025-10-10-together-atlas"]}],"settles_when":"A provider publishes per-customer against class-level numbers on the same endpoints.","claims":["C3"],"status":"open"},{"id":"T7","question":"Choose the model once per session, or for every request?","sides":[{"held_by":"Databricks, Together, Fireworks, and GitHub until October","position":"Once, at the start, or only where no cache is lost: session start, compaction, sub-agent launch. Switching mid-session re-reads the whole context at full price.","signals":["2026-08-13-databricks-smart-routing","2026-10-05-together-link","2026-09-21-fireworks-frontier-is-a-router"]},{"held_by":"Cursor, OpenRouter, and GitHub since October","position":"Every request or turn, with the cost of the cache miss priced into the decision. A session that gets harder should not be stuck on the model it started with.","signals":["2026-07-22-cursor-router","2026-11-06-openrouter-auto-code-routers","2026-10-28-github-copilot-fusion"]},{"held_by":"Baseten's lab, CacheBridge, Heo and co-authors","position":"Make the switch cheap instead. Translate the old model's cache for the new one, 2 to 25x faster than a re-read, for 2 to 8% of accuracy where it works. Research only, open models only.","signals":["2026-11-baseten-speculative-encoding","2026-09-01-cachebridge","2026-08-04-cross-model-kv-transfer-linear"]}],"settles_when":"An independent agentic benchmark with caching priced in compares the two on the same tasks. One early result has a trained per-step router halving cost.","lean":"Split. A router that prices the cache still kept the same model nine turns in ten, and Fireworks moved from every turn to once per task. GitHub went the other way in October, and Databricks names making the switch cheap as its next step. Translating the cache would loosen this inside a pool of open models; no engine or product does it yet.","claims":["C9","C2"],"status":"open"},{"id":"T8","question":"Is a router worth building, or is a good default model enough?","sides":[{"held_by":"Router vendors","position":"Routing cuts cost by a third to three-quarters at equal quality, by their own measurements, and a perfect choice per task would beat the best single model by 23 points. In November one shipped router was reported ahead of the leading single models on a public agentic board, at lower cost.","signals":["2026-07-22-cursor-router","2026-08-13-databricks-smart-routing","2026-07-26-fireworks-nexus","2026-09-21-fireworks-frontier-is-a-router","2026-10-28-github-copilot-fusion"]},{"held_by":"Independent tests, and one vendor's own board","position":"No router beat always calling a cheap strong model, several collapsed to one model, and on one vendor's own public board single models from its pool beat its coding router.","signals":["2026-10-26-autobench-do-routers-route","2026-07-08-databricks-coding-agent-benchmark","2026-11-06-openrouter-auto-code-routers"]}],"settles_when":"A vendor publishes its router against the best fixed model in its own pool, on tasks someone else chose.","claims":["C9"],"status":"leaning","lean":"Still toward a good default model on coding tasks, where single models beat one vendor's router on its own board. But a second vendor now reports its router ahead on a public agentic board, by its own reading and with caching unstated. Live sessions are untested."},{"id":"T9","question":"Tune a model for the job, or wait for the next general one?","sides":[{"held_by":"Harvey, Datadog, Fireworks, Together, Baseten","position":"Tune. On a narrow job it has nearly doubled quality at flat cost, or cut latency by an order of magnitude against a general model.","signals":["2026-08-26-harvey-tenet","2026-11-24-baseten-harvey-post-training","2026-11-18-datadog-fine-tune-baseten","2026-08-31-fireworks-training-api","2026-10-19-together-post-training"]},{"held_by":"Cognition's own table, OpenAI","position":"Wait. A newer general model beat a freshly tuned one on the tuner's own benchmark, a frontier lab is ending self-serve tuning, and a tune dies with its base model.","signals":["2026-11-04-cognition-swe-2-flash","2026-05-07-openai-fine-tuning-wind-down"]}],"settles_when":"A tuned model is followed against each new general release on the same task for six months.","lean":"It depends on how narrow the job is, and it has to be repeated. Harvey's August tune was passed by an untuned general model within three months; tuning four newer bases took the lead back by three points. The wins are on single tasks with their own data and grader; the losses are on general coding, where the next release moves fastest.","claims":["C10"],"status":"open"},{"id":"T10","question":"Does speculation pay less as batches fill, or more?","sides":[{"held_by":"Measured tables: Inco AI, UC Berkeley, NVIDIA, Together, Nightjar, Openzeka","position":"Less. About 3x for one request falls to 1 to 1.5x at 32 concurrent. On a large mixture-of-experts model the engines' recipe lost from 16 concurrent. A fixed draft length ran up to 30% slower than none at high load.","signals":["2026-08-18-dflash-2","2025-12-31-speculative-decoding-performance-or-illusion","2026-03-19-speed-bench","2026-03-31-together-aurora","2025-12-27-nightjar","2026-07-openzeka-kimi-k3-speculation-under-load"]},{"held_by":"Doubleword's cost models","position":"More, on mixture-of-experts models. A small batch shares few experts, so a guess costs nearly full price; not speculating is close to best at batch 4 and four times worse at 128. Modelled, not measured.","signals":["2026-06-08-economics-of-speculative-decoding","2026-06-22-doubleword-adaptive-speculation"]}],"settles_when":"Someone measures a mixture-of-experts model in a real engine, with and without speculation, from 1 to 128 concurrent.","lean":"Less, on both kinds so far. The first measured mixture-of-experts table, Kimi K3 in two engines, fades like the dense ones: 1.86x for one user, break-even at 16, 0.41x at 64. The modelled rise has not appeared in a real engine; beyond 64 concurrent is still unmeasured.","claims":["C2"],"status":"leaning"},{"id":"T11","question":"Do looped models save memory, or move it into the cache?","sides":[{"held_by":"Ouro's authors, Thinking Machines, No Free Loop","position":"Save it. A 1.4B looped model reaches a 4B's reasoning scores with a third of the weights, a looped 26B fits a laptop in about 20 GB, and a loop pays under a fixed parameter budget.","signals":["2025-10-29-ouro-looped-language-models","2026-11-20-inkling-2-mini","2026-10-30-no-free-loop"]},{"held_by":"Hybrid Latent Attention's authors","position":"Move it. A cache per pass gives Ouro 1.4B 768 KiB per token, which limits how many sequences a GPU holds. Compressing that cache bought 2.5 to 7.4 times the decoding throughput.","signals":["2026-10-06-hybrid-latent-attention-looped"]}],"settles_when":"A looped and a dense model of equal quality served in the same engine at a provider's batch sizes, with memory and throughput per GPU at several context lengths.","lean":"By regime. Saved at batch one on short prompts, the laptop case. Moved on long prompts at serving batch sizes, where agent traffic lives, since Ouro's own tests keep every pass's cache for the prompt. Training-free loops keep the cache size but buy little.","claims":["C11"],"status":"open"}],"watch":{"checks":[{"id":"W1","what":"Confirm the canonical AgentX scoreboard and record today's top results for Kimi K3, Kimi K3.1 and GLM-5.3 as a baseline.","why":"Almost every number here is stated against this board, and the founding sweep's fetch of inferencex.semianalysis.com returned a page calling itself an unofficial deployment. Without a recorded baseline, later claims of a lead cannot be judged.","opened":"2026-11-19","due":"2026-11-22","claims":["C7","C4"],"status":"hit","resolution":"The canonical board is inferencex.semianalysis.com, run from SemiAnalysisAI/InferenceX; the unofficial-copy notice is hidden markup shown only on other hosts. Baseline on 22 Nov, best total tokens per GPU at 50 tok/s per user or faster: Kimi K3 24.4k and Kimi K3.1 Pro 36.7k on GB300, GLM-5.3 23.2k on B300."},{"id":"W2","what":"Have InferenceForge's three SGLang fixes been reproduced by anyone else, or opened as pull requests against upstream SGLang?","why":"They sit in a personal fork. Upstreaming would be the first independent check on an outsider's agent-found gain, and a data point on how fast the commons absorbs one.","opened":"2026-11-19","due":"2026-11-28","claims":["C1","C7"],"status":"open"},{"id":"W3","what":"Is the Evolving Infra code actually public and runnable at github.com/mit-han-lab/EvolvingInfra?","why":"The project page says both open source and coming soon. A runnable release lets someone other than the authors test the 4x latency claim against Dynamo.","opened":"2026-11-19","due":"2026-12-01","claims":["C2"],"status":"open"},{"id":"W4","what":"Read first-hand the two papers reported as counter-evidence on local agent-written kernels: arXiv 2607.24762 (reported to lose to eager PyTorch on a DGX Spark) and arXiv 2611.12079 (a local 7B model's kernels at roughly break-even).","why":"They were relayed with too little detail to enter as signals. If they hold, they are the most direct evidence that the agent loop does not transfer to owned hardware.","opened":"2026-11-19","due":"2026-12-03","claims":["C8","C1"],"status":"dropped","resolution":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"W5","what":"Does any public AgentX run, by Together or anyone else, match the up-to-2.6x lead Together claims for its compiler?","why":"A private lead that never appears on the public board cannot be told apart from a favourable baseline. If the open engines close it, the commons is keeping up. On 26 Nov, 22 days on, a research pass found no public run matching it, and heard of a closed engine from another team said to have led one board since September. Neither was opened first-hand; see W27.","opened":"2026-11-19","due":"2026-12-05","claims":["C7","C4"],"status":"open","lens":true},{"id":"W6","what":"Has InferenceBench run a matched-budget search beside its newest agent entries, and has the gap (12.08x agent against 14.30x search) closed?","why":"This is the cleanest independent gauge of whether agents are getting better at the experimenting, not just the knowing.","opened":"2026-11-19","due":"2026-12-10","claims":["C1","C5"],"status":"open"},{"id":"W7","what":"Megakernels: any head-to-head on one model and chip, or any of vLLM, SGLang or Together changing course.","why":"Two camps shipped opposite bets in the same month. The next major model release is the natural test of whether fused paths can be regenerated fast enough.","opened":"2026-11-19","due":"2026-12-19","claims":["C6"],"status":"hit","resolution":"Hit on 18 Nov. vLLM's AMD team compared fused and stock decode for the same model on the same node, with graph replay on both: 1.20 to 2.26x for one user, shrinking as concurrency rose. No comparison against graphs plus PDL yet, so T1 stays open under W21."},{"id":"W8","what":"Any published evidence of compounding: gain per cycle rising, or a model trained on optimisation traces beating its teacher on a production task.","why":"This is the named condition for raising the RSI claim. InferenceForge said it would put its own models in the loop; Kernel-Smith and Meta already train on search traces.","opened":"2026-11-19","due":"2026-12-19","claims":["C5"],"status":"open"},{"id":"W9","what":"Any agent-driven optimisation loop on user-owned hardware (workstation, on-prem cluster, laptop) with a like-for-like baseline.","why":"The single result that would move the local claim most. Its continued absence is itself information.","opened":"2026-11-19","due":"2026-12-19","claims":["C8"],"status":"dropped","resolution":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"W10","what":"A provider publishing per-customer against class-level tuning on the same endpoints.","why":"The only numbers so far are 20 to 45%. One clean result above about 1.5x would change who is expected to capture the value.","opened":"2026-11-19","due":"2026-12-31","claims":["C3"],"status":"open","lens":true},{"id":"W11","what":"One system publishing like-for-like results on two chip families for the same model and traffic, with different winning optimisations on each.","why":"C2 now covers the chip as well as the traffic, and most of the hardware evidence is each team's account of its own bring-up. A same-system, two-chip comparison on the public board would test it directly.","opened":"2026-11-19","due":"2026-12-12","claims":["C2","C6"],"status":"open"},{"id":"W12","what":"Any provider publishing what its loop costs per deployment (GPU-hours, tokens) next to the gain it bought.","why":"One figure exists: about 200 GPU-hours and 1.7B tokens for a bespoke engine. Whether per-customer tuning is a business turns on this number falling.","opened":"2026-11-19","due":"2026-12-19","claims":["C3"],"status":"open","lens":true},{"id":"W13","what":"A second workload owner, not a provider, describing its own loop on its own traffic.","why":"Decagon is the only one so far. If customers can do this themselves on rented GPUs, the provider's role shifts toward supplying the rig.","opened":"2026-11-19","due":"2026-12-19","claims":["C3","C4"],"status":"open","lens":true},{"id":"W14","what":"A provider with no announced loop (Fireworks, Modal, Groq, Cerebras, a hyperscaler) describing one, or giving a credible reason not to.","why":"Three providers have described a loop. Silence from the rest is either catching up in private or a judgement that it does not pay.","opened":"2026-11-19","due":"2026-12-12","claims":["C1","C7"],"status":"hit","lens":true,"resolution":"Hit, late: Alibaba's Herschel paper of 30 Sep, missed by the founding sweep, describes agents implementing and testing engine and kernel fixes across over 120 model variants and ten chip types, with expert review and canary rollout. Fireworks, Modal, Groq and Cerebras are still silent."},{"id":"W15","what":"Read Modal's post first-hand: was its draft model trained on the customer's own traffic, or on synthetic and target-model traces?","why":"The 20% figure is the cleanest number behind the per-customer claim, and a second check found Modal's other drafter post used synthetic data.","opened":"2026-11-19","due":"2026-11-21","claims":["C3"],"status":"miss","lens":true,"resolution":"Opened first-hand: the drafter was fine-tuned on coding traces the target model produced, for a shared coding service, and the recipe was reused across models. Nothing says it saw one customer's traffic, so the 20% is class-level."},{"id":"W16","what":"Any router published against the best fixed model in its own pool, on tasks someone else chose.","why":"Vendors report a third to three-fifths off; an outside test found no shipped router beating a cheap default. This is the comparison that would settle it.","opened":"2026-11-19","due":"2026-12-19","claims":["C9"],"status":"hit","lens":true,"resolution":"OpenRouter's public board runs its routers beside single models from the same pool on five public benchmarks. On Deep SWE several single models beat its coding router on quality and cost, and it says no router beats the best single model everywhere. W22 carries the live-session question."},{"id":"W17","what":"A tuned open model followed against the next general release on the same task.","why":"Tunes look good on the day and may be overtaken within weeks. Whether tuning is a lever or a treadmill turns on this.","opened":"2026-11-19","due":"2026-12-31","claims":["C10"],"status":"hit","resolution":"Yes, and it was overtaken. Harvey's August tune of one open model scored 19.7% on its legal benchmark; by November an untuned general model scored 27.1%. Harvey answered by tuning four newer open models, the best reaching 30.3%."},{"id":"W18","what":"Open two leads a sub-agent saw but could not date: Cerebras on its autoresearch loop cheating, and an LMSYS post on an internal system called Infer-forge. Add them to the roster if they describe a loop.","why":"The reader asked that no team building the loop be missed. A provider and an open-engine team may both be absent.","opened":"2026-11-19","due":"2026-11-21","claims":["C1"],"status":"hit","lens":true,"resolution":"Both describe loops and are now on the roster: Infer-forge, an internal agent harness around SGLang (28 Aug), and Cerebras's autoresearch runs on fitting a large model onto consumer GPUs (19 Mar)."},{"id":"W19","what":"Any provider publishing how long and how much it takes to get a new model from release to tuned serving, with or without agents.","why":"With many models this is the cost that repeats. Day-zero support is claimed by several teams; none has given a time or a price. On 22 Nov the public board showed the open engines take about two weeks to tune a new model; a provider's own time and cost are still unpublished.","opened":"2026-11-19","due":"2026-12-19","claims":["C6"],"status":"open","lens":true},{"id":"W20","what":"A mixture-of-experts model measured in a real engine with and without speculation from 1 to 128 concurrent, or the Doubleword simulator compared with a real engine.","why":"Measured tables show speculation fading with load. A cost model says that on mixture-of-experts models it starts near zero and grows, and its author says most new models are of that kind. Which is right decides how a provider sets lever 4 for each model, and whether a simulator can stand in for part of the rig. On 20 Nov an outside run of Kimi K3 in two engines covered 1 to 64 concurrent and showed the usual fade. Still wanted: beyond 64, a draft length that follows the load, and longer prompts. On 26 Nov a different simulator, BLIS, was found to predict real runs within 6.7% for scheduling policies. The Doubleword one is still unchecked.","opened":"2026-11-19","due":"2026-12-19","claims":["C2","C4"],"status":"open","lens":true},{"id":"W21","what":"On one NVIDIA chip, a model's fused decode path measured against CUDA Graphs plus PDL on the same traces, from 1 to 16 concurrent.","why":"Together says graphs plus PDL recover 98% of a megakernel's gain; on AMD chips, graph replay alone left 1.2 to 2.3x for one user. A provider serving many models needs to know whether per-model fused code pays.","opened":"2026-11-20","due":"2026-12-31","claims":["C6","C2"],"status":"open","lens":true},{"id":"W22","what":"A router compared with the best single model in its pool on live agent sessions rather than benchmark tasks, with the pricing of cached tokens stated.","why":"On public tasks a vendor's own router lost to the best single models. Live sessions vary more, which is the case routing is meant to win. Whether a provider should build a router or simply pick its default well turns on this.","opened":"2026-11-21","due":"2026-12-31","claims":["C9"],"status":"open","lens":true},{"id":"W23","what":"vLLM, SGLang, llama.cpp or MLX supporting a looped model upstream with depth chosen per token or per request, rather than a fixed number of passes.","why":"vLLM runs Ouro at its full four passes and ignores the learned early exit, Inkling 2 Mini supports only three passes, and the rest lives in research forks. Upstream support is what would make depth a lever a provider can pull.","opened":"2026-11-22","due":"2027-02-28","claims":["C11"],"status":"open","lens":true},{"id":"W24","what":"A looped and a dense model of equal quality served side by side in one engine, with memory and throughput per GPU at several batch sizes and context lengths.","why":"It would settle T11 and test C11 where a provider lives: whether a looped model's saving on weights survives its cache at real batch sizes and prompt lengths.","opened":"2026-11-22","due":"2027-03-31","claims":["C11"],"status":"open","lens":true},{"id":"W25","what":"Cross-model cache transfer merged into vLLM, SGLang or llm-d, shipped by a provider or a router, or tested by an outside group on multi-turn agent sessions with tool calls.","why":"Three research systems move a cache between open models faster than a re-read. If one reaches an engine, a router can change model mid-session inside an open pool, which loosens the tie that lever 1 and C9 rest on. Until then it is a lab result on small models.","opened":"2026-11-26","due":"2027-02-28","claims":["C9"],"status":"open","lens":true},{"id":"W26","what":"Read RSIBench-Infra in full: which agents and baselines, how many of its 20 tasks are LLM serving, and whether results above 1.10x beat tuned engines or only official recipes.","why":"Its abstract says two-thirds of task results passed a validated 1.10x end to end, measured independently at up to 32 accelerators. That is the kind of evidence C1 says would raise it, but the abstract does not say against what.","opened":"2026-11-26","due":"2026-12-03","claims":["C1"],"status":"open"},{"id":"W27","what":"Open TileRT's own pages and the public board: has a closed binary led single-user agent serving since September, and has any open engine matched it?","why":"A lead held for two months by a closed engine would be the clearest case against the commons keeping up. It was reported by a research pass and its pages have timed out twice.","opened":"2026-11-26","due":"2026-12-03","claims":["C7"],"status":"open","lens":true}],"feeds":[{"name":"vLLM blog","url":"https://vllm.ai/blog","why":"The fastest-moving primary source. Agent-assisted optimisation posts cluster around new model launches."},{"name":"vLLM RFC issues","url":"https://github.com/vllm-project/vllm/issues?q=is%3Aissue+label%3ARFC+sort%3Aupdated-desc","why":"Where the rules for agent-written code get argued. Review process changes show up here first."},{"name":"Inferact news","url":"https://inferact.ai/news","why":"Hillclimb results and the autonomous-system roadmap from the vLLM maintainers."},{"name":"LMSYS / SGLang blog","url":"https://www.lmsys.org/blog","why":"The other open engine. The index is script-rendered; open individual posts."},{"name":"Together AI blog","url":"https://www.together.ai/blog","why":"Compiler, speculation and routing posts; the most explicit commercial RSI claim."},{"name":"AgentX optimisations (InferenceX)","url":"https://inferencex.semianalysis.com/infx/agentx/optimizations","why":"The scoreboard itself and the list of upstream fixes it has prompted."},{"name":"SemiAnalysis newsletter","url":"https://newsletter.semianalysis.com","why":"Benchmark write-ups and hardware-generation results. Partly paywalled."},{"name":"InferenceBench leaderboard","url":"https://inferencebench.ai/","why":"Independent agents-against-search numbers, updated roughly monthly."},{"name":"llm-d blog","url":"https://llm-d.ai/blog","why":"Routing and scheduling work with unusually candid caveats."},{"name":"Baseten blog","url":"https://www.baseten.co/blog","why":"Bespoke-engine experiments and per-deployment tuning from a provider."},{"name":"arXiv: agents optimising inference","url":"https://arxiv.org/search/?query=agent+LLM+inference+engine+kernel+optimization&searchtype=all&abstracts=hide&order=-announced_date_first&size=25","why":"Narrow query; pair with the next two."},{"name":"arXiv: KernelBench","url":"https://arxiv.org/search/?query=KernelBench&searchtype=all&abstracts=show&order=-announced_date_first&size=25","why":"Kernel-generation papers and the critiques of their benchmarks."},{"name":"arXiv: agentic LLM serving","url":"https://arxiv.org/search/?query=%22LLM+serving%22+agentic+workload&searchtype=all&abstracts=show&order=-announced_date_first&size=50","why":"Workload-aware serving systems."},{"name":"PyTorch blog","url":"https://pytorch.org/blog/","why":"ExecuTorch, Helion and Triton posts: the compiler route to per-device specialisation."},{"name":"Modular blog","url":"https://modular.com/blog","why":"Compiler work, now inside Qualcomm."},{"name":"OpenRouter data newsletter and rankings","url":"https://openrouter.ai/data/newsletter","why":"Who serves what: open against closed share, cache rates, how fast traffic moves to new models."},{"name":"Fireworks changelog","url":"https://docs.fireworks.ai/updates/changelog","why":"Which base models can still be tuned, and which features were paused. The churn shows here first."},{"name":"Databricks Smart Routing docs","url":"https://docs.databricks.com/aws/en/ai-gateway/smart-routing","why":"Where the scope of a shipped router changes before the blog does."},{"name":"llama.cpp speculative decoding docs","url":"https://github.com/ggml-org/llama.cpp/blob/master/docs/speculative.md","why":"Tracks every drafter type as it lands."},{"name":"Vals legal-agent leaderboard","url":"https://www.vals.ai/benchmarks/hlab","why":"A running check on whether a tuned model stays ahead of general ones."},{"name":"Doubleword blog","url":"https://blog.doubleword.ai","why":"A provider working out the economics of speculation per architecture, with an open simulator. A follow-up on building the adaptive policy is implied."},{"name":"X (through web search)","url":"https://x.com","why":"Maintainers, providers and labs often post launches and numbers here first. Search it with a web search restricted to x.com; X's own search needs a sign-in, and sweeps do not sign in. A post is a lead: open what it links to."},{"name":"vLLM issues on looped models","url":"https://github.com/vllm-project/vllm/issues?q=Ouro+OR+looped+sort%3Aupdated-desc","why":"Where upstream support for looped models and per-token exit would first show up (W23)."},{"name":"Base Labs (Baseten research)","url":"https://labs.baseten.co","why":"Baseten's research site, separate from its blog. It carried the first cache translator covering many models at once."},{"name":"arXiv: cross-model cache transfer","url":"https://arxiv.org/search/?query=%22KV+cache%22+transfer+cross-model&searchtype=all&abstracts=show&order=-announced_date_first&size=25","why":"Papers on moving a session's cache from one model to another. At least four appeared between August and November 2026."},{"name":"Sarvam AI blog","url":"https://www.sarvam.ai/blogs","why":"A provider running the loop in production, with a simulator in front of live tests. Publishes its own before-and-after tables."}]},"course":{"_about":"The steering note for the human reader. reader_framing is their own working view in close to their own words; only they change it (via inbox.md). Every sweep re-judges each verdict against the current evidence and rewrites the rest.","as_of":"2026-11-26","reader_framing":"Inference is becoming load-aware and adaptive: the stack fits itself to what you have and to the traffic it sees. Agents tuning the stack, open and frontier models side by side, routing, speculative decoders and tuning for a domain are all parts of that one move, and I want to know how to build such a system.","verdicts":[{"part":"Load-aware, fitted to what you have","verdict":"holding","short":"Seven levers can move with the load, and four are in production somewhere.","note":"This is the frame the evidence supports best. Routing follows where the cache is, the cluster split follows the traffic mix, speculation follows the domain and the batch size, and kernels are regenerated per model and chip. One megakernel could not span two chips. The caution: almost all of it is measured on one workload class, coding agents, and one public trace set."},{"part":"The parts are one move","verdict":"holding","short":"They connect through the prompt cache and the model: change one lever and others must be redone.","note":"Yes, and the connections are concrete. A cache belongs to one model on one machine, so it fixes how often a model can be chosen and where a request must go. A drafter belongs to one exact model, so tuning or swapping the model means a new drafter and a re-tuned engine. Splitting prefill from decode left one provider drafting tokens that decode never used. That coupling is why re-tuning is constant, and why agents doing it cheaply matters. One of those ties is now under attack: three research systems translate a cache from one open model to another, so a switch need not mean a full re-read. Nothing has shipped, each loses a few points of accuracy, and none crosses a closed model's API."},{"part":"Fits each user","verdict":"sharpen","short":"Worth 34 to 45% on decoding so far. Most gains are class-level and shared.","note":"Like for like, tuning a drafter to one customer's own traffic has been worth 34 to 45%, on different baselines. Modal's 20%, once counted here, came from tuning to the coding-agent class, and its recipe carried over to other models, not customers. Tuning the model itself does better on narrow jobs, but those tunes go stale. Most of the gain sits at the level of the workload class and lands in the shared open engines."},{"part":"Driven by RSI","verdict":"sharpen","short":"Driven by bounded agent hillclimbs. Nothing has been shown to compound.","note":"Driven by coding agents running bounded hillclimbs inside harnesses that people built, with people setting the goal and approving what ships. The recursive part is true only weakly: a model serves the agents that tune its serving. Nobody has shown gains compounding, and the label already sits on a system with no self-improvement in it."}],"reframe":"Inference optimisation is turning from hand-craft into search. Agents rewrite kernels and engine paths against replayed real traffic, so the thing being optimised shrinks from a model to what you actually have: this model, this traffic shape, this chip, this month. The scarce asset is not the agent but the rig that tells you whether a change is real.","questions":[],"ignore":["KernelBench scores quoted without the verified protocol. The baseline was too easy.","Single-stream, batch-size-1 tokens-per-second records. Real, but they say little about serving many users.","Arguments over which engine is faster at default settings. One flag explained most of the largest gap.","Laptops against datacenters. You said hardware is not the point, so those arguments are retired."],"read_next":[{"signal":"2026-11-16-together-deleted-megakernels","why":"The best single explanation of why measuring is harder than optimising. Read the sections on benchmarks lying and on their own ablations."},{"signal":"2026-05-20-inferencebench","why":"The strongest counter-argument, from people with nothing to sell. Read it before taking any vendor number at face value."},{"signal":"2026-11-inferact-autonomous-inference-system","why":"The whole loop laid out by the people who maintain vLLM, including the parts they say they cannot do yet."}],"position":{"label":"Provider","text":"You run inference for other people's workloads, across many model families. You are here to build, to find open ground, and to judge where the value will sit. You would build the measuring rig first."},"focus_claims":["C4","C6","C7","C9"],"implications":[{"head":"The rig is the asset, not the agent","text":"Evaluation is the hard part: replayed traffic, an engine that reloads candidates, gates that catch fake wins. The usual gate misses six of seven numerical bugs; public traces overstated one team's capacity by 1.7x.","claims":["C4"],"signals":["2026-11-04-together-compiler","2026-05-22-fastkernels","2026-10-14-vllm-byog-evals-rfc","2026-11-19-validation-driven-deployment","2026-10-09-blis-simulate-before-you-scale","2026-11-16-sarvam-token-factory"]},{"head":"Many models multiply three of the seven levers","text":"Each model needs its own drafter, engine and cache. Open engines tune a new model in about two weeks, gaining up to 2.9x; your work pays in that window, on the models carrying traffic.","claims":["C6","C2","C7"],"signals":["2026-11-20-agentx-kimi-k31-first-fortnight","2026-11-04-together-polymorphic-inference","2026-09-22-openrouter-token-state-of-play","2026-08-18-dflash-2","2026-11-inferact-autonomous-inference-system"]},{"head":"A kernel lead lasts weeks, so lean on upstream","text":"Both open engines run the loop themselves and absorb fixes fast; a general engine came within 6% of a bespoke one. For the long tail of models, upstream is your tuning.","claims":["C7"],"signals":["2026-10-23-vllm-matches-deepinfer","2026-07-02-sglang-agent-assisted-development","2026-11-04-together-compiler","2026-10-02-baseten-agentic-engine"]},{"head":"Open models are your volume; defaults are the contest","text":"Open models carry most tokens and about a quarter of spend. One router reports beating leading single models on a public board, with an all-closed pool. Defaults and routers decide which sessions reach you.","claims":["C9"],"signals":["2026-09-22-openrouter-token-state-of-play","2026-11-06-openrouter-auto-code-routers","2026-10-26-autobench-do-routers-route","2026-10-28-github-copilot-fusion"]}],"purpose":["Building a system","Positioning research","Placing a bet"],"build_first":"The measuring rig"},"cycles":[{"id":"2026-11-26","n":5,"agent":"Claude Code (Fable 5.2)","deep":true,"summary":"A catch-up sweep and the weekly deep pass, run after three scheduled sweeps did not complete. No confidence moved. The morning's link put cache translation between models under lever 1. The deep pass then found a provider, Sarvam, running the loop in production with a simulator in front of live tests; a simulator whose scheduling policies held on real hardware; GitHub moving its router from session boundaries to every prompt; and Harvey tuning four newer open models after its August tune was passed within three months, which settles W17. The roster check found 29 teams earlier passes had missed, 22 of them recorded second-hand. Seven signals were retired or superseded to return to eighty active. Seven signals in one day is over the guide of three; it reflects four days of backlog and a first deep pass, and is not a pattern to keep.","changes":[{"type":"added","ref":"2026-11-16-sarvam-token-factory","text":"A provider runs the loop in production: an orchestrator agent, a calibrated simulator, live A/B tests, an engineer's approval. First token 2.1x sooner than the stock stack on the same nodes; a shared cache store cut prefill nodes from 58 to 34; an upstream fused kernel had garbled one long code reply in nine."},{"type":"added","ref":"2026-11-24-baseten-harvey-post-training","text":"Four open models post-trained on one customer's legal benchmark rose 11 to 21 points; one passed the best closed model, 30.3% against 27.1%. The customer's August tune had been passed by an untuned model within three months."},{"type":"added","ref":"2026-10-09-blis-simulate-before-you-scale","text":"A CPU-only simulator with 6.7% median error against real runs. Two scheduling policies developed inside it held on hardware and were merged into llm-d. The first counter-evidence to C4 with a number."},{"type":"added","ref":"2026-10-28-github-copilot-fusion","text":"GitHub's router now decides for every prompt and is reported ahead of the leading single models on a public agentic board. It supersedes the June signal, in which the same company routed only at cache boundaries."},{"type":"retired","text":"Six signals retired: a learned-latency scheduler, an agentic RL recipe, two on-device runtime posts, a routing-headroom benchmark and an evaluator language. Each was cited by at most one list and its point is made elsewhere with measurements. The two on-device ones can come back if local serving becomes its own thread."},{"type":"revised","text":"Six second-hand sources opened first-hand: Databricks Smart Routing and its documentation, vLLM's Kimi K3 and AgentX posts, DFlash 2 with its model card, Baseten's agent-built engine and Harvey Tenet. Every number held. Corrections: the Kimi K3 gain on agent traces compares 16 GPUs with an earlier run on 8; DFlash 2's tables by load are on the model card, not in the post; Databricks' cost figure is against a frontier model, and its post names making a mid-session switch cheap as the next step."},{"type":"tension","ref":"T7","text":"Reopened. GitHub moved from the once-per-session side to the every-prompt side, and Databricks says switching must get cheaper. The lean toward cache boundaries no longer holds."},{"type":"tension","ref":"T8","text":"Still leaning toward a good default on coding tasks, but a shipped router is now reported ahead on a public agentic board, by its vendor's reading."},{"type":"tension","ref":"T9","text":"Lean sharpened: tuning works on a narrow job and has to be repeated. One customer's tune lasted under three months before general models passed it."},{"type":"watch","ref":"W17","text":"Hit. The August legal tune, 19.7%, was passed by an untuned general model at 27.1% within three months; re-tuning newer bases reached 30.3%."},{"type":"watch","text":"W26 opened to read a new end-to-end benchmark of the loop in full before weighing it against C1. W27 opened to open TileRT's own pages, a closed engine said to have led one board since September. W5 and W20 annotated."},{"type":"added","text":"New chart under More charts: post-training open models on one customer's legal benchmark, with the best closed model as the reference line."},{"type":"revised","text":"Levers 1, 3 and 6, build steps 2, 3, 7 and 8, and the open-ground item on judging unseen traffic updated. BLIS joined the build parts. The roster grew from 31 to 60 and its recent view now starts on 15 October; the front page's second point was recounted."},{"type":"confidence","text":"None moved. C4 held at 0.80: one condition on each side occurred in part, an upstream fused kernel that shipped a bug and a simulator whose policies held on hardware. C10 held at 0.45: a tune was overtaken within a quarter, and re-tuning passed the best closed model. C9 held at 0.65, but its parts are separating: models do share the work, cheap closed models now contest the routine slot, and routers and cache translation both work around the cache limit. Consider splitting it at the next deep pass. C7 held at 0.55 pending W5 and W27."},{"type":"course","text":"The provider implication on routing now says one router reports beating leading single models on a public board with an all-closed pool. No verdict changed."},{"type":"added","ref":"2026-11-baseten-speculative-encoding","text":"One translator carries a cache between seven open models in all 42 directions, keeping 96.9% of accuracy up to 8,000 tokens, 92% at 32,000 and 83% at 128,000, with the first token 2.5 to 7.5x sooner at long contexts."},{"type":"added","ref":"2026-09-01-cachebridge","text":"A serving system for the same idea, and the only test on agent tasks under load: first-token time 30 to 98% lower than a re-read after a 14B to 32B switch."},{"type":"added","ref":"2026-08-04-cross-model-kv-transfer-linear","text":"The cheapest version: a linear map within one family, fitted on 500 samples with no training. It kept 73 to 98% on four of six pairs and failed on two."},{"type":"added","text":"New chart under More charts on the Evidence tab: what a translated cache costs in accuracy, by method and context length."},{"type":"tension","ref":"T7","text":"A third side added. Besides choosing the model once or pricing the cache miss every turn, three research systems make the switch itself cheap. The lean stays toward cache boundaries until one ships."},{"type":"watch","ref":"W25","text":"Opened, due 2027-02-28: cache transfer reaching an open engine or a product, or an outside test on agent sessions with tool calls."},{"type":"revised","text":"Lever 1 now says the tie between a cache and one model is being worked on. Open ground gained a sixth item, moving a session between models without a re-read. Base Labs and an arXiv query joined the feeds, and cache translation joined the glossary."},{"type":"course","text":"The reader sees routing as central, for local use too, and asked that cache transfer between models be tracked with it. Recorded in the steering list. The verdict that the parts are one move holds; its note now names this as the first attempt to cut one of the ties."}],"swept":["Inbox empty at the start of the pass. No watchlist check was due; W17 was settled early because its answer turned up.","Feeds since 21 Nov, scanned by a sub-agent: vLLM blog and RFCs, Inferact, LMSYS through its sitemap, Together, AgentX optimisations, InferenceBench, llm-d, Baseten and its research site, PyTorch, Modular, OpenRouter, Fireworks, Doubleword, Vals, vLLM looped-model issues and four arXiv queries. The SemiAnalysis newsletter returned no posts and was not checked.","Roster check by kind of team, by a sub-agent: providers, open engines, model labs, chip vendors, workload owners, academics and the public board. Seven of the 29 additions were then opened first-hand; the other 22 are marked relayed.","Red-team of all four focus claims, by a sub-agent, with the decisive pages opened first-hand: BLIS, GitHub's two Fusion posts and OpenRouter's router board, which still shows single models ahead of its coding router on coding tasks.","First-hand reads for the deep pass: Databricks Smart Routing and its docs, vLLM Kimi K3, vLLM AgentX, DFlash 2 and its model card, Baseten's agent-built engine, Harvey Tenet, Sarvam Token Factory, Databricks Proteus, Reflection Beam on vLLM, Morph, Cursor's kernel harness, and the abstracts of NoeVera, DuoDiscover, CompoundingKernel, RSIBench-Infra and BLIS.","The morning's single-topic update: the reader's link on cache translation, three of the papers it builds on, two web searches and one search limited to x.com.","Two research agents reported a banner on inferencex.semianalysis.com saying the copy was unaffiliated and might be modified. Opened in a browser, the page shows no such banner; it looks like an artefact of their fetch tool.","Text addressed to agents, ignored: a file on the public board's site says it is intended for language models; two repository readmes and one blog post carry launch prompts for coding agents; llama.cpp's contributing guide tells contributors to load a file into their agent."],"rejected":[{"title":"Swarm Telepathy: Prefill-Free KV-Cache Transfer Across Families (arXiv 2610.15095)","url":"https://arxiv.org/abs/2610.15095","reason":"abstract opened; one translator per pair, aimed at agents talking to each other, and Baseten's paper builds on it. Linked under that signal"},{"title":"Press and blog write-ups of the linear-mapping paper","url":"https://venturebeat.com/technology/nvidia-finds-that-simple-linear-math-can-replace-costly-ai-model-handoffs","reason":"seen in search, not opened; the paper itself is the signal. One write-up attributes it to NVIDIA, which the abstract page does not show"},{"title":"Think Before You Speak: training-free latent communication between language models (arXiv 2610.16165)","url":"https://arxiv.org/abs/2610.16165","reason":"seen in search, not opened; about models passing internal states to each other, with no serving angle evident"},{"title":"Skip the DRAM Tier: MoRI UMBP Runs the Agentic KV Cache on NVMe","url":"https://vllm.ai/blog/2026-11-23-skip-the-dram-tier","reason":"opened; adds to the cache-tier result of 23 Nov without changing it. Worth keeping in mind: an NVMe pool matched a DRAM pool of the same size within 1%, and each 1% of prompt tokens served from cache was worth about 10% throughput"},{"title":"Pipeline Parallelism for Prefill in the Agentic Era","url":"https://inferact.ai/news/pipeline-parallelism-in-agentic-era","reason":"relayed; the best parallelism layout depends on the first-token target and the load, which C2 already says with stronger evidence"},{"title":"True On-Policy RL: Bit-Exact Rollout and Training with SGLang and Miles","url":"https://miles.radixark.com/blogs/true-on-policy-rl-bit-exact-rollout-and-training-with-sglang-and-miles","reason":"relayed; an agent ported support for a new model in under eight hours, but for a training framework, so it does not answer W19"},{"title":"ERNIE 5.5 Flash low-latency decoding","url":"https://www.lmsys.org/blog/2026-11-23-ernie55-flash-low-latency","reason":"relayed; the headline speed uses a simulated acceptance length"},{"title":"Fireworks changelog and Together preemptible compute","url":"https://docs.fireworks.ai/updates/changelog","reason":"relayed; half-price interruptible and premium fast tiers, with no numbers against a baseline. Providers are starting to price by priority, which the tracker has no lever for yet"},{"title":"NoeVera, Proteus, DuoDiscover and CompoundingKernel","url":"https://arxiv.org/abs/2610.17184","reason":"opened and added to the roster, not weighed as signals. DuoDiscover and CompoundingKernel both say measurement, not agent count, limits the search, which supports C4; Proteus found its memory layer ate most tokens until lessons were scoped, which bears on T2"},{"title":"Serving Reflection Beam on vLLM from Day 0","url":"https://vllm.ai/blog/2026-10-16-reflection-beam","reason":"opened; the same teams as two roster entries. One line worth noting for lever 4: deciding each step how many draft tokens to verify added 10% throughput at high concurrency"},{"title":"RSIBench-Infra (arXiv 2611.24395)","url":"https://arxiv.org/abs/2611.24395","reason":"abstract opened; deferred to W26 because the abstract does not say what its baselines are"},{"title":"TileRT","url":"https://github.com/tile-ai/tilert","reason":"relayed, not opened; deferred to W27"},{"title":"ServeTwin (arXiv 2610.02732) and comments on the vLLM evals RFC","url":"https://arxiv.org/abs/2610.02732","reason":"relayed; a second simulator with no hardware validation, and a cheaper numerics check proposed in an open thread. BLIS carries the point"},{"title":"Fireworks posts comparing cheap closed models with open ones","url":"https://fireworks.ai/blog/what-minimax-m3-1-flash-reveals-about-choosing-and-combining-models","reason":"relayed; a provider's own runs show a cheap closed model costing less per task than an open one on some benchmarks. Noted under C9; open it before the claim is split"},{"title":"Roster candidates without a date on the page","url":"https://github.com/RightNow-AI/AutoMegaKernel","reason":"relayed; four small projects (AutoMegaKernel, auto-inference-gpu, an agen
