uantifies the gap between a patch that passes unit tests and one that survives real serving: about a third of otherwise-passing patches fail once end-to-end checks are added.","caveats":"Only three tasks have performance gates and their pass rates are not reported, so it says little about optimisation as such. One engine, no multi-GPU.","numbers":[{"metric":"Best agents, mean first-try pass rate","value":"75%","baseline":"53 tasks from merged pull requests","verification":"third-party"},{"metric":"Pass rate on tasks with end-to-end tests","value":"45.9%, against 69.4% without those tests","baseline":"the same patches","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"A third of patches that look done fail real serving."},{"claim":"C1","direction":"complicates","note":"Agents handle most real serving-engine tasks, and fewer once tested properly."}],"read":"relayed","status":"active"},{"id":"2026-09-22-openrouter-token-state-of-play","title":"The token state of play","url":"https://openrouter.ai/data/newsletter/the-token-state-of-play","org":"OpenRouter","authors":"Peter Walker","published":"2026-09-22","added":"2026-11-19","kind":"blog","layers":["routing"],"mechanism":"frame","venue":"cluster","gist":"Gateway data on who serves what. Open-weight models have carried most tokens since April while closed models still take most of the money, and a new premium closed model pulls spend back within weeks. A second gateway reports the same pattern.","changes":"Coexistence, measured: volume goes to open models and money to closed ones. For a provider of open models this is the market, most of the tokens and a quarter of the spend.","caveats":"One gateway's developer-heavy traffic, with token and spend figures from different weeks. The second gateway's index corroborates the direction, not the exact shares.","numbers":[{"metric":"Open-weight share of tokens","value":"above 62% since April, peaking at 79%","baseline":"under half at the start of the year","verification":"self-reported"},{"metric":"Closed-weight share of spend","value":"73%, down from 89% in January","baseline":"the same gateway","verification":"self-reported"},{"metric":"Open-weight share on a second gateway","value":"71.5% of tokens for 22.6% of spend","baseline":"7.0% of tokens the previous December","verification":"self-reported","setup":"Vercel AI Gateway index"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Both kinds of model carry real traffic at once, split by volume and by money."},{"claim":"C6","direction":"supports","note":"The average start-up on the gateway uses 12 models and more than half changed their top model in a month."}],"also":[{"label":"Vercel AI Gateway production index","url":"https://vercel.com/blog/ai-gateway-production-index-october-2026"}],"read":"relayed","status":"active"},{"id":"2026-09-17-zai-glm-built-its-inference","title":"Toward recursive self-improvement: how GLM built its own inference infrastructure","url":"https://z.ai/blog/glm-built-its-inference-infrastructure","org":"Z.ai (Zhipu)","published":"2026-09-17","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine","serving","hardware"],"mechanism":"agent","venue":"cluster","gist":"An agent powered by GLM-5.3 did much of the work of bringing a GLM-5.3 variant from first run to production on a large cluster of Chinese-made accelerators. The stated key is dense feedback: correctness comparisons, microbenchmarks, traces and end-to-end metrics packaged as repeatable workflows the agent can call.","changes":"The most literal instance of the recursive framing: a model optimising the serving of its own family, on chips where no mature kernel library exists. It also says outright that this is not yet RSI.","caveats":"Self-reported and mostly unverifiable. The 3x is against the team's own first port. Engineers set objectives, built the feedback environment and reviewed anything touching architecture, concurrency or production risk; the human share is not quantified.","numbers":[{"metric":"End-to-end throughput","value":"about 3x in under two weeks","baseline":"the team's own initial port","verification":"self-reported"},{"metric":"One decode kernel","value":"1.71x","baseline":"before removing redundant per-tile computation","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"supports","note":"A model family building its own serving stack. The authors themselves say they are not there yet."},{"claim":"C6","direction":"supports","note":"New accelerators with no kernel ecosystem are where hand-tuning cannot keep up."},{"claim":"C4","direction":"supports","note":"The enabler was dense feedback, and people built it."}],"read":"relayed","status":"active"},{"id":"2026-09-14-vera-rubin-agentx","title":"Vera Rubin NVL72 agentic inference","url":"https://newsletter.semianalysis.com/p/vera-rubin-nvl72-agentic-inference","org":"SemiAnalysis","published":"2026-09-14","added":"2026-11-19","kind":"benchmark","layers":["hardware","engine"],"mechanism":"frame","venue":"cluster","gist":"First AgentX results for the next NVIDIA generation. The hardware step moves cost per token by more than any software specialisation reported elsewhere here, though the size of the multiple depends heavily on which software baseline it is measured against.","changes":"Two lessons. A hardware generation can swamp tuning gains. And the same hardware comparison swings by an order of magnitude with the software baseline, which is a measure of how much the software is worth.","caveats":"Pre-release software on one engine only, with vendor staff helping verify. Later sections are paywalled.","numbers":[{"metric":"Throughput per dollar of total cost at 60 to 100 tok/s per user","value":"1.4 to 3x","baseline":"the previous generation (GB300)","verification":"third-party"},{"metric":"Throughput per megawatt at 170 tok/s per user","value":"62.9x against one software stack, 5.56x against another","baseline":"GB300 on TensorRT-LLM, and GB300 on SGLang","verification":"third-party"}],"bears_on":[{"claim":"C6","direction":"supports","note":"A new generation arrives and every tuned stack starts again."},{"claim":"C2","direction":"complicates","note":"A hardware step can dwarf what workload tuning buys."}],"read":"relayed","status":"active"},{"id":"2026-09-11-rooflang","title":"RoofLang: enabling AI-driven architecting of LLM inference systems","url":"https://arxiv.org/abs/2609.12551","org":"Ziyue Yang, Yuting Jiang, Lei Qu, Peng Cheng","published":"2026-09-11","kind":"paper","layers":["loop","engine","serving"],"mechanism":"agent","venue":"any","gist":"Argues that agent loops driven by profiling can only tune the stack they are handed. It proposes a small language for describing inference workloads, a set of changes that can be checked, and an evaluator that does not depend on any one implementation, so an agent can search whole architectures. A persistent agent is reported to have found designs that raise throughput and interactivity on a current model.","changes":"An attempt at the thing C4 says is missing: a cheap way to judge a design without building and benchmarking it. If it holds up, evaluation stops being the bottleneck for architecture-level search.","caveats":"Abstract only. The agent-found gains (6 to 50%) have no named baseline, so they are not in the ledger. Nothing says the evaluator's predictions were checked against a real engine under real traffic.","numbers":[],"bears_on":[{"claim":"C4","direction":"complicates","note":"Proposes an evaluator independent of any implementation. Unproven, but a direct attempt at the cheap oracle."},{"claim":"C1","direction":"supports","note":"By the authors' account, a persistent agent found new architectures for a current model and chip, not only settings."}],"added":"2026-11-19","read":"opened","status":"active"},{"id":"2026-09-08-vllm-agentx","title":"vLLM x AgentX: optimizing for real-world agentic serving","url":"https://vllm.ai/blog/2026-09-08-vllm-agentx","org":"vLLM team and Inferact","published":"2026-09-08","added":"2026-11-19","kind":"blog","layers":["engine","serving","routing","kernels"],"mechanism":"hand","venue":"any","gist":"The general-purpose open engine reworked for agent traffic: a shared KV block pool, cache retention aware of sessions, a cap on long prefills in the scheduler, and per-model parallelism choices. On this workload, simply keeping a session on the same server beat every load-balancing signal.","changes":"The workload class changed the engine's design, not only its settings. And because it happened in the commons, everyone got it.","caveats":"No before-optimisation baseline for the headline throughput. The prefill cap buys throughput by making long requests wait longer for a first token. Hints from the agent harness are future work.","numbers":[{"metric":"Total tokens per GPU-second from a 512-token cap on long prefills","value":"up to 93% higher","baseline":"the same engine without the cap","verification":"public-run","setup":"DeepSeek V4 Pro, B300"},{"metric":"Prefill with context parallelism on a 32K prompt","value":"2.65x","baseline":"8-way tensor parallelism","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Agent sessions (median 43 turns, 142K input tokens, 96% prefix hits) needed different scheduling and caching from chat."},{"claim":"C7","direction":"supports","note":"Class-level specialisation landed upstream."},{"claim":"C3","direction":"challenges","note":"Changes for the whole class, in the shared engine, delivered the bulk of the gain with no per-customer work."}],"read":"relayed","status":"active"},{"id":"2026-08-31-fireworks-training-api","title":"Training API now GA: custom RL and fine-tuning loops","url":"https://fireworks.ai/blog/training-api-general-availability","org":"Fireworks AI","published":"2026-08-31","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"The customer writes the loss or reward, the data and the environment; Fireworks runs the distributed trainer and rollout deployment and serves the result. In November it added adapters served with no idle charge and a preview tool that builds evaluations from production traces. Its customer results are the fullest set published for this lever.","changes":"The most complete evidence that tuning an open model buys cost and latency on a narrow task. Its own changelog also shows the catch: tunable base models are added and withdrawn within weeks.","caveats":"All results are the vendor's or its customers'. No data volumes, compute or prices. The changelog shows managed reinforcement fine-tuning paused in October and one base model added to training and removed two months later.","numbers":[{"metric":"Real secrets caught at a 5% false-alarm budget","value":"about 70% against 59%","baseline":"a general frontier model","verification":"self-reported","setup":"two adapters on an open base, one customer"},{"metric":"Latency after moving off closed models","value":"3.5x lower","baseline":"the customer's previous closed-model setup","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"Named customers report a tuned open model beating a general one on their own narrow task."},{"claim":"C10","direction":"challenges","note":"The same provider paused one tuning method and cycled a base model in and out within two months."}],"also":[{"label":"Changelog","url":"https://docs.fireworks.ai/updates/changelog"},{"label":"Harvey case study","url":"https://fireworks.ai/customers/harvey-tenet-kimi-k3-post-training"}],"read":"relayed","status":"active"},{"id":"2026-08-26-harvey-tenet","title":"Harvey Tenet: post-training Kimi K3 for legal work","url":"https://fireworks.ai/customers/harvey-tenet-kimi-k3-post-training","org":"Fireworks AI and Harvey","published":"2026-08-26","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"A legal AI company post-trained an open model with reinforcement learning on tens of thousands of long agent runs per checkpoint, each over 50 turns. The trained model nearly doubled its pass rate on a legal agent benchmark at about the same cost per task, and the gain carried to two held-out legal benchmarks.","changes":"The strongest single result for tuning as an inference lever: nearly twice the quality for the same serving cost, on the customer's own kind of work.","caveats":"No comparison with a frontier model, and no training data or compute disclosed. A public leaderboard checked eight weeks later showed several cheaper general models at or above its score, though the runs are not strictly comparable.","numbers":[{"metric":"Pass rate on a legal agent benchmark","value":"19.7% against 10.8%","baseline":"the same open model before tuning, at about the same cost per task","verification":"self-reported"},{"metric":"Held-out corporate law benchmark","value":"58.8% to 74.0%","baseline":"the same open model before tuning","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"Tuning nearly doubled quality on the customer's domain at flat cost."},{"claim":"C10","direction":"complicates","note":"Within two months general models appear to have caught up on the same leaderboard."}],"read":"relayed","status":"active"},{"id":"2026-08-24-agentx-inferencex-v3","title":"AgentX 1.0 / InferenceX v3: does the CUDA moat hold up in agentic inferencing?","url":"https://newsletter.semianalysis.com/p/agentx-inferencexv3-does-cuda-moat","org":"SemiAnalysis","published":"2026-08-24","added":"2026-11-19","kind":"benchmark","layers":["loop","serving","routing","engine"],"mechanism":"frame","venue":"cluster","gist":"An open benchmark that replays 393 anonymised coding-agent sessions: many turns, contexts up to a million tokens, heavy prefix reuse, bursts of sub-agents. Every data point is a public CI run with its configuration committed. It replaced fixed-length request benchmarks as the number serving teams compete on.","changes":"This is the hill everyone is climbing. Almost every result tracked here is stated against it. A shared, replayable workload is what made agent-driven optimisation possible outside the companies that own traffic. It is also a single target the whole field can overfit.","caveats":"One organisation's coding traces now define good serving. The post counts upstream fixes inconsistently (50+ and 70+) and many were still open. Part of the article is paywalled.","numbers":[{"metric":"Throughput from one scheduler change (decode interval after prefill)","value":"+141%, with median TTFT rising from 36.5 s to 59 s","baseline":"the same engine before the patch","verification":"public-run"},{"metric":"Keeping KV on CPU memory in vLLM","value":"+81.7% throughput","baseline":"recomputing the context","verification":"public-run"},{"metric":"Prefix-cache hit rate after a checkpoint-retention fix on AMD","value":"5.6% to 96.45%","baseline":"before the fix","verification":"public-run"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Replaying real agent sessions instead of fixed-length requests changed which optimisations matter."},{"claim":"C4","direction":"complicates","note":"A public replayable workload lowers the traffic moat, and at the same time points everyone at one trace set."},{"claim":"C7","direction":"supports","note":"Fifty or more fixes it prompted went upstream into vLLM and SGLang."}],"also":[{"label":"Live scoreboard","url":"https://inferencex.semianalysis.com"}],"read":"relayed","status":"active"},{"id":"2026-08-18-dflash-2","title":"DFlash 2: keep drafting parallel","url":"https://inco.ai/blog/dflash2/","org":"Inco AI, with the original DFlash group","published":"2026-08-18","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"any","gist":"A block drafter that keeps several candidates per position and uses a tiny selector to pick one coherent path through them. Its published tables show speed-up against plain decoding at three load levels and five kinds of task.","changes":"The cleanest public numbers on what happens to speculation under load: a threefold gain for a single request falls to almost nothing at 32 concurrent, and rival drafters fall below break-even.","caveats":"Self-reported on one model and one GPU; training data is not disclosed and there is no paper. The comparison uses a community build of a rival drafter. The company offers to build drafters for customers' tuned models, which implies each tuned model needs its own.","numbers":[{"metric":"Speed-up, one request at a time","value":"2.67 to 3.43x","baseline":"plain decoding without speculation","verification":"self-reported","setup":"Qwen3.8-27B, one H200"},{"metric":"Speed-up at 32 concurrent requests","value":"1.01 to 1.45x","baseline":"plain decoding without speculation","verification":"self-reported"},{"metric":"Rival drafters at 32 concurrent","value":"0.74 to 1.13x, below break-even on four of five tasks","baseline":"plain decoding without speculation","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The same drafter is worth 3x or nothing depending on load and on the kind of text."},{"claim":"C10","direction":"complicates","note":"A drafter is tied to one exact model. Tune the model and the drafter has to be rebuilt."}],"also":[{"label":"Model card with tables","url":"https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2"}],"read":"relayed","status":"active"},{"id":"2026-08-17-llmd-sticky-until-saturated","title":"Sticky until saturated: token-aware routing","url":"https://llm-d.ai/blog/sticky-until-saturated-token-aware-routing","org":"llm-d (Google authors)","published":"2026-08-17","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"rules","venue":"any","gist":"The open Kubernetes inference router replaced a four-signal blend with one cache-affinity filter plus one load signal chosen to match the workload's bottleneck: uncached tokens in flight when prefill-bound, active streams when decode-bound. Stickiness lets go at a saturation limit calibrated per deployment.","changes":"An unusually candid like-for-like measurement of workload-aware routing: large where prefill dominates, nothing where decode does. The calibration does not transfer between models, chips or engines, a small concrete case of the optimum being specific to the deployment.","caveats":"Each point was run once. The baseline is round-robin, a weak one. The authors say a hand-tuned weight set can still beat their default on the workload it was tuned for.","numbers":[{"metric":"Code-generation input throughput","value":"46k vs 16k tok/s (2.9x)","baseline":"Kubernetes round-robin","verification":"self-reported","setup":"Qwen3-32B, H100"},{"metric":"Decode-bound reasoning workload","value":"7.0k vs 6.8k tok/s (parity)","baseline":"Kubernetes round-robin","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The right load signal depends on whether the workload is prefill-bound or decode-bound."},{"claim":"C3","direction":"complicates","note":"The per-deployment part is one calibrated threshold, not a bespoke stack."}],"read":"relayed","status":"active"},{"id":"2026-08-13-databricks-smart-routing","title":"Smart Routing in Unity AI Gateway: match frontier quality at 30%+ lower cost per task","url":"https://databricks.com/blog/smart-routing-unity-ai-gateway-match-frontier-quality-30-lower-cost-task","org":"Databricks","published":"2026-08-13","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A small classifier reads only the task description and start-of-session metadata, then one policy starts at a mid-size model and moves up or down. The model is fixed for the session because switching between turns breaks the prompt cache, which the post calls the main cost driver. Sub-agent launches are routed separately.","changes":"The clearest statement of why routing is done per session: the team tried per-request routing and rejected it on cache cost. Sub-agent launches turn out to be the natural switch point, since they have no cache to lose.","caveats":"Self-reported with no task counts or pool list. The documentation is narrower than the blog: only sub-agents are routed, the main session keeps its default model, routing for one harness is paused, and the feature is still beta.","numbers":[{"metric":"Cost per task on internal workloads","value":"65% of the frontier model's","baseline":"the best single model, at equal or better quality","verification":"self-reported"},{"metric":"Cost on public coding benchmarks","value":"56% lower","baseline":"the frontier model alone, at matched quality","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Mixed pools of models behind one gateway, with a classifier choosing per session."},{"claim":"C9","direction":"complicates","note":"The shipped scope shrank to sub-agents only, and the same team says simply using cheaper models saves over half."}],"also":[{"label":"Docs, where the scope is narrower","url":"https://docs.databricks.com/aws/en/ai-gateway/smart-routing"}],"read":"relayed","status":"active"},{"id":"2026-08-11-thoughtworks-nemotron-test","title":"Putting NVIDIA Nemotron 3.5 Lightning to the test","url":"https://www.thoughtworks.com/insights/blog/generative-ai/putting-nvidia-nemotron-3-5-lightning-test","org":"Thoughtworks","published":"2026-08-11","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"frame","venue":"onprem","gist":"A consultancy with early access tested a small open model on its own hardware across two engines, two chips and three workloads. It trained a purpose-built draft head and legal and healthcare adapters, and compared them with what ships in the box.","changes":"Measured by someone other than the vendor. The custom-trained drafter only matched the one built into the model, while a domain adapter more than doubled accuracy on a legal task.","caveats":"No numeric head-to-head for the two draft heads, no test of whether the adapters hurt speculation, and no frontier comparison. An early-access partner, so not fully independent.","numbers":[{"metric":"Legal task accuracy with a domain adapter","value":"35% to 77%","baseline":"the same model without the adapter","verification":"third-party"},{"metric":"Built-in draft head","value":"1.46 to 1.96x","baseline":"decoding without speculation","verification":"third-party","setup":"2,091 measurements, concurrency 1 to 128"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A cheap adapter more than doubled accuracy on a domain task, measured by a third party."},{"claim":"C3","direction":"challenges","note":"A drafter trained specially for the deployment did no better than the one shipped with the model."}],"read":"relayed","status":"active"},{"id":"2026-08-11-goedecke-local-models-will-not-win","title":"No, local models will not win","url":"https://www.seangoedecke.com/local-models-will-not-win","org":"Sean Goedecke","published":"2026-08-11","added":"2026-11-19","kind":"essay","layers":["hardware","serving"],"mechanism":"frame","venue":"local","gist":"Argues datacenter inference is cheaper for structural reasons, not subsidy: batching serves many users for about the cost of one, a single local user has nothing to batch, and datacenter chips do more per watt. Users also choose the strongest model they can get.","changes":"The cleanest statement of why the loop's home is the datacenter. Every agent-loop result tracked here leans on batching and cache reuse across many sessions, which one user does not have.","caveats":"The 30x figure is a back-of-envelope product of the author's own estimates. It ignores speculation, several local agents sharing a batch, and privacy. He concedes a hybrid (local for fast, cloud for hard) is likely.","numbers":[{"metric":"Resources per unit of inference, local against datacenter","value":"about 30x","baseline":"the author's estimate from chip specifications and batching","verification":"unverified"}],"bears_on":[{"claim":"C8","direction":"challenges","note":"The economics that make the datacenter loop pay (batching, shared caches) are absent for one user."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-08-11-executorch-agentic-runtime","title":"Fast, on-device agentic AI with Muse Glimmer on ExecuTorch","url":"https://pytorch.org/blog/fast-ondevice-agentic-ai-with-executorch/","org":"PyTorch / Meta","published":"2026-08-11","added":"2026-11-19","kind":"blog","layers":["compiler","kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"A model and its decoding strategy are lowered ahead of time. On NVIDIA cards the export step compiles and autotunes kernels for the detected GPU architecture; on Apple silicon it targets MLX or custom Metal kernels. Speculative decoding is handled inside the exported artifact.","changes":"Tuning at export for the device in hand is now in a mainstream runtime, and the result is tied to that chip: the optimum is specific to what you have.","caveats":"No continuous batching or cache sharing across sessions yet. No comparison with llama.cpp or mlx-lm, and most results are charts only. The date shown is last-updated.","numbers":[{"metric":"Text plus image decode with speculative decoding","value":"21.6 to 33.0 tok/s (+52.8%)","baseline":"the same runtime without speculation","verification":"self-reported","setup":"M5 Pro, 64 GB"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Kernels are compiled and tuned for the GPU it detects, and the result is tied to that chip."}],"read":"relayed","status":"active"},{"id":"2026-07-26-fireworks-nexus","title":"Fireworks Nexus: drop-in open frontier intelligence for teams with budgets","url":"https://fireworks.ai/blog/fireworks-nexus-open-model-routing","org":"Fireworks AI","published":"2026-07-26","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"An installer points existing coding harnesses at Fireworks-served open models. A trained difficulty scorer sends routine work to an open model and passes hard work through to the customer's own key at a frontier lab. It scores each turn and weighs cache hits.","changes":"A second provider shipping the same split, open for routine and frontier for hard, from the open-model side. The provider owns the routing decision while the customer keeps the harness.","caveats":"The router launched as a research preview and its evidence is thin: preliminary tests at two customers, and a typical 3 to 5x saving stated with no data. In Fireworks' own benchmark the open model matched the frontier one on score but used about ten times the tokens per task.","numbers":[{"metric":"Cost per merged pull request","value":"about a third lower","baseline":"the customers' previous all-frontier setup, preliminary","verification":"self-reported","setup":"two named customers"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Open for routine work, frontier behind the customer's own key for hard work, in one harness."}],"also":[{"label":"November update","url":"https://fireworks.ai/blog/fireworks-unveils-new-products-at-forge-to-help-companies-build-specialized-intelligence"}],"read":"relayed","status":"active"},{"id":"2026-07-22-cursor-router","title":"Cursor Router","url":"https://cursor.com/blog/router","org":"Cursor","published":"2026-07-22","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A classifier runs before each agent request and picks a model from the query, context, task complexity and domain. It was trained on more than 600,000 live requests with a user-satisfaction reward, and the cost of cache misses was included in training. Three modes set the trade-off between cost and capability.","changes":"The opposite bet on granularity: route every request and price the cache miss into the decision. It is also the largest disclosed training set for a router, built from the harness owner's own traffic.","caveats":"Satisfaction is an inferred proxy and nothing is independently checked. Staff confirmed that switching mid-conversation is intended and that it resets the prefix cache. The named pool has no open-weight models.","numbers":[{"metric":"Cost at near-frontier satisfaction","value":"about 60% lower","baseline":"always using the strongest model","verification":"self-reported","setup":"online A/B test"},{"metric":"Cost per commit","value":"$4.63 routed, against $7.34 and $12.69","baseline":"two fixed frontier models","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Routing between models is in production at scale, but here the pool is all closed models and the route changes per request."}],"read":"relayed","status":"active"},{"id":"2026-07-08-databricks-coding-agent-benchmark","title":"Benchmarking coding agents on Databricks' multi-million line codebase","url":"https://databricks.com/blog/benchmarking-coding-agents-databricks-multi-million-line-codebase","org":"Databricks","published":"2026-07-08","added":"2026-11-19","kind":"benchmark","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Tasks rebuilt from real merged pull requests in a large private codebase, graded by held-out tests with no LLM judge. The best open model sat in the same capability tier as the frontier at lower cost per task, and the choice of harness moved cost by more than twice at equal quality.","changes":"The strongest evidence that an open model is good enough for routine coding work, which is the premise of every router here. It also suggests most of the saving comes from the swap, not from clever routing.","caveats":"Internal tasks only, and most numbers are in figures. A second study on another company's tasks found the same direction but used an LLM judge and single runs.","numbers":[{"metric":"Cost per task at statistically tied quality","value":"$1.28 against $1.94","baseline":"a frontier closed model on the same tasks","verification":"self-reported","setup":"open model GLM 5.2"}],"bears_on":[{"claim":"C9","direction":"supports","note":"An open model tied a frontier one on real tasks at two-thirds the cost."},{"claim":"C9","direction":"complicates","note":"If a fixed open model already captures the saving, the router adds little."}],"read":"relayed","status":"active"},{"id":"2026-07-06-dspark","title":"DSpark: confidence-scheduled speculative decoding with semi-autoregressive generation","url":"https://arxiv.org/abs/2607.05147","org":"DSpark authors (deployed at DeepSeek)","published":"2026-07-06","added":"2026-11-19","kind":"paper","layers":["model","serving"],"mechanism":"online","venue":"cluster","gist":"A drafter that proposes a block of tokens at once, with a confidence head predicting how many will survive checking. A scheduler then admits draft tokens per request until a profiled throughput curve stops improving, so the amount of speculation grows at moderate load and shrinks as concurrency rises.","changes":"Speculative decoding that listens to the load, in production at a model lab. It is the clearest case of two levers being tuned together: how far to speculate is set by how full the batches are.","caveats":"Self-reported; offline numbers were measured with the scheduler switched off, and the paper warns its strict-latency figures are not typical. An open-engine reproduction confirmed the trend, not the numbers. Drafting cost is wasted on requests where little is accepted.","numbers":[{"metric":"Aggregate throughput at moderate latency targets, live traffic","value":"about 51 to 52% higher","baseline":"the previous production drafter (one-token MTP)","verification":"self-reported"},{"metric":"Accepted length by domain","value":"5.57 maths, 5.12 code, 3.49 chat","baseline":"the same drafter across domains","verification":"self-reported","setup":"Qwen3-4B, offline"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Acceptance differs by domain and the best amount of speculation changes with load, so the setting cannot be fixed."},{"claim":"C3","direction":"complicates","note":"The adaptation is per request and per load level, done by one scheduler for everyone, not built per customer."}],"also":[{"label":"SGLang reproduction","url":"https://www.lmsys.org/blog/2026-07-06-dspark-sglang/"}],"read":"relayed","status":"active"},{"id":"2026-07-02-sglang-agent-assisted-development","title":"Agent-assisted SGLang development: an initial exploration","url":"https://www.lmsys.org/blog/2026-07-02-agent-assisted-sglang-development/","org":"SGLang team (LMSYS)","published":"2026-07-02","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"any","gist":"SGLang packaged benchmarking, profiling, CUDA debugging and incident triage as skills agents can run, and set up a loop in which one coding agent implements, another reviews, and a profile must explain a gap before any patch is written. A November recap says agents now produce most of the project's merged pull requests.","changes":"The second open engine to say in public that agents do the bulk of its engineering. Its own example of a kernel win evaporating end to end is the cleanest small illustration of the evaluation problem.","caveats":"The recap's claims (most merged pull requests, decoding up to 2x faster from AI-written megakernels, a port to a new accelerator in under a week) come without percentages, hardware or model. The post itself warns about plausible-but-wrong changes and reward hacking through mismatched ABI or fast-math flags.","numbers":[{"metric":"A kernel-group speed-up measured end to end","value":"2.03x became 1.021x","baseline":"the same change measured in isolation","verification":"self-reported"},{"metric":"Allreduce fusion","value":"5.49 to 9.41 requests/s","baseline":"before the pull request","verification":"public-run","setup":"H100, 4-way tensor parallel"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Merged, public pull requests from an agent loop with a review step."},{"claim":"C4","direction":"supports","note":"A 2x kernel win was worth 2% in the engine."},{"claim":"C7","direction":"supports","note":"The open engines are running the loop themselves."}],"also":[{"label":"November summit recap","url":"https://www.lmsys.org/blog/2026-11-17-sglang-summit-recap"}],"read":"relayed","status":"active"},{"id":"2026-07-arize-cost-per-successful-task","title":"Cost per successful task: benchmarking Kimi K3, GPT-5.5 and 8 more AI models","url":"https://arize.com/blog/cost-per-successful-task-ai-model-benchmark","org":"Arize AI with Fireworks","authors":"Laurie Voss","published":"2026-07","added":"2026-11-19","kind":"benchmark","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Argues token price is the wrong signal for choosing a model; cost per successful task, counting retries and runs that hit the budget, is the right one. It measures the gap between perfect routing, a simple escalation ladder and blind escalation.","changes":"Puts a ceiling and a floor on the model-choice lever. Perfect routing solves more tasks at a third of the cost of the best single model; careless escalation costs twice as much as any single model.","caveats":"A vendor-partnered study on 40 tasks chosen where models disagree, which flatters routing. The agent is a thin loop with no prompt-cache or long-context effects.","numbers":[{"metric":"Cost per success with hindsight-perfect routing","value":"$0.228, solving 34 of 40","baseline":"$0.636 and 25 of 40 for the best single model","verification":"third-party","setup":"40 tasks, 10 models, 6 trials"},{"metric":"Cost per success with naive escalation through every model","value":"$1.319","baseline":"$0.636 for the best single model","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"The headroom is real and large, and a bad policy is worse than none."}],"read":"relayed","status":"active"},{"id":"2026-06-26-kernelbench-verified","title":"KernelBench-Verified: do LLM-generated kernels actually beat PyTorch?","url":"https://arxiv.org/abs/2607.16241","org":"Meta, Stanford","published":"2026-06-26","added":"2026-11-19","kind":"critique","layers":["kernels"],"mechanism":"frame","venue":"any","gist":"Shows the standard kernel-generation benchmark flatters models twice over. Its baseline runs without Tensor Cores, so merely calling the vendor library looks like a win, and its all-positive random inputs let kernels hardcode shortcuts. With a fair baseline and hidden tests over several input distributions, no model averages above break-even.","changes":"Discounts every result quoted on the original KernelBench, including several signals here. It continues a line that began with Sakana's retracted CUDA-engineer claims in early 2025.","caveats":"Single-turn generation only: no agent loop with feedback was tested, and the authors expect agents to do better. The baseline is eager PyTorch, not a compiled one. Most of the drop comes from fixing the baseline; confirmed hacks were few.","numbers":[{"metric":"Best model under the verified protocol","value":"0.88x, down from 1.43x","baseline":"PyTorch with Tensor Cores enabled","verification":"third-party","setup":"H200"},{"metric":"A ReLU kernel that returned its input when the shape matched the test","value":"reported 374x","baseline":"the benchmark's own scoring","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"A widely used benchmark was rewarding a library call and a shape check."},{"claim":"C1","direction":"challenges","note":"Weakly: single-turn only, so it bounds the models, not the loops."}],"read":"relayed","status":"active"},{"id":"2026-06-22-doubleword-adaptive-speculation","title":"Adaptive speculative decoding: picking draft lengths at runtime","url":"https://blog.doubleword.ai/adaptive-speculation","org":"Doubleword","authors":"Fergus Finn","published":"2026-06-22","added":"2026-11-19","kind":"blog","layers":["serving","model"],"mechanism":"online","venue":"any","gist":"A provider's simulation study. A policy re-chooses the draft length at every scheduler step from the live batch size, an estimate of how many guesses are accepted, and a cost model of the engine. Acceptance was measured on a real model; throughput and latency come from an open-source simulator of a vLLM-shaped engine. The policy matches the best fixed draft length chosen in hindsight at every load.","changes":"At a steady load, adaptive speculation only ties a well-chosen fixed setting; its value is never being badly wrong when the load moves. The simulator is a second kind of measuring rig, pricing an idea before it is built. C4 named that as what would weaken it. Nobody has checked it against a real engine.","caveats":"Only acceptance is measured. Engine and chip costs are modelled, and the simulator's notes call its figures upper bounds for a perfect engine. One model, one workload, decode only. No speed-up of adaptive over fixed is given. The author expects it to be hard to build. The remark that coding agents are poor at finding engine settings is asserted, not shown.","numbers":[{"metric":"Priced policy against the best fixed draft length","value":"matches it at every concurrency from 1 to 2,048","baseline":"the best fixed length for each concurrency, chosen in hindsight","verification":"self-reported","setup":"Simulated: Qwen3.6-35B-A3B on one B200, decode only"},{"metric":"Cost of not speculating at batch 128","value":"per-token latency 4x or more worse at the same throughput","baseline":"the priced policy; at batch 4 not speculating is close to best","verification":"self-reported","setup":"Simulated, same model and chip"},{"metric":"Tokens committed per round, block drafter against the model's own head","value":"about 3.4 against 3.0","baseline":"the same prompts at temperature 0.6","verification":"self-reported","setup":"Measured on rented GPUs, SPEED-Bench qualitative split, half a million rounds each"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best draft length moves with the batch size, and which of two drafters is cheaper to run flips with it."},{"claim":"C4","direction":"complicates","note":"A simulator is the cheap oracle this claim says would weaken it, but only acceptance is measured and it has not been compared with a real engine."}],"also":[{"label":"The simulator (MIT licence)","url":"https://github.com/doublewordai/inference-lab"},{"label":"Simulator in the browser","url":"https://inference-lab.doubleword.ai/"},{"label":"Acceptance data","url":"https://huggingface.co/datasets/Doubleword/qwen3.6-specdec-calibration"}],"read":"opened","status":"active"},{"id":"2026-06-18-modular-agent-skills","title":"Modular 26.4: SOTA MoE serving, model bringup via agent skills, Mojo 1.0 beta 2 and more","url":"https://modular.com/blog/modular-26-4-sota-moe-serving-model-bringup-via-agent-skills-mojo-beta-2-and-more","org":"Modular","published":"2026-06-18","added":"2026-11-19","kind":"blog","layers":["compiler","loop","kernels"],"mechanism":"agent","venue":"any","gist":"Published skills let a coding agent port a new model into Modular's engine: inspect the config, scaffold from the nearest existing architecture, then chase layer-by-layer divergence against the reference until the outputs match. The kernels underneath stay human-written. Qualcomm acquired the company weeks later.","changes":"Agents doing day-zero model support, which is the churn problem, with a correctness oracle that is easy to state. Also a sign of where independent compiler companies end up: inside a chip vendor.","caveats":"No bring-up times, speed-ups or baselines. One demonstration model. Acquisition terms are undisclosed.","numbers":[],"bears_on":[{"claim":"C6","direction":"supports","note":"Model bring-up is being handed to agents because there are too many models."},{"claim":"C1","direction":"complicates","note":"This is porting against an exact oracle, not optimisation. The kernels are still written by people."}],"read":"relayed","status":"active"},{"id":"2026-06-17-github-copilot-auto-routing","title":"Getting more from each token: how Copilot improves context handling and model routing","url":"https://github.blog/ai-and-ml/github-copilot/getting-more-from-each-token-how-copilot-improves-context-handling-and-model-routing/","org":"GitHub","published":"2026-06-17","added":"2026-11-19","kind":"blog","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"Copilot's automatic mode combines live model health (availability, load, speed, error rate, cost) with task intent scored by a routing model. It filters to models that clear a quality bar, then picks the best fit. It routes only on the first turn and after the context is compacted, because switching mid-conversation breaks the cached prefix.","changes":"Routing here listens to the load on the models as well as to the task. And it names the safe switch points precisely: session start and compaction, where no cache is lost.","caveats":"Baselines for the savings are not stated and the pool is five unnamed models. Lower plans are being moved to automatic mode as the only choice, which makes routing a capacity tool as much as a quality one.","numbers":[{"metric":"Savings at above-baseline quality","value":"12.9%","baseline":"a fixed mid-tier model, baseline not fully stated","verification":"self-reported"},{"metric":"Savings in the aggressive setting","value":"72.5%","baseline":"not stated","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Another large harness routing between models by default, at cache boundaries only."},{"claim":"C2","direction":"supports","note":"The route depends on live load on each model, not only on the request."}],"read":"relayed","status":"active"},{"id":"2026-06-08-economics-of-speculative-decoding","title":"The economics of speculative decoding","url":"https://fergusfinn.com/blog/economics-of-speculative-decoding/","org":"Fergus Finn","authors":"Fergus Finn","published":"2026-06-08","added":"2026-11-19","kind":"blog","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"Works out from model shapes what a guessed token costs to check on newer architectures. On a mixture-of-experts model a small batch shares almost no experts, so each guess pays nearly full price until about 43 tokens are in the batch. Compressed attention removes the spare capacity that made guesses free. The result is a range of small batches where the best draft length is zero.","changes":"Lever 4 depends on the model's architecture, and so on lever 1 and lever 6, in a second way. The measured tables show speculation fading as batches fill. This analysis says that on mixture-of-experts models it can start near zero and improve with load. A provider serving many models needs the slope per model.","caveats":"Computed from published model shapes and one chip's data sheet; nothing is measured. It assumes experts are used evenly and the model sits on one GPU. The author says the effect is overstated for large deployments that spread experts across machines, which swap it for a communication cost. One model family. A separate paper reports the same expert effect and up to 14% from working around it.","numbers":[{"metric":"Batch size at which every expert is already loaded","value":"about 43 tokens","baseline":"a dense layer shares its weights from the second token","verification":"self-reported","setup":"Computed for DeepSeek-V4-Flash, 6 of 256 experts per token; not measured"},{"metric":"Guessed tokens that compressed attention can check for free","value":"none; the limit is 1.16 tokens per step","baseline":"ordinary attention has room for any practical draft length","verification":"self-reported","setup":"Computed for one B200; not measured"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Whether speculation pays, and at what batch size, is set by the model's architecture as well as by the traffic."},{"claim":"C6","direction":"supports","note":"Expert routing and compressed attention each overturned a tuning rule that held for dense models."}],"also":[{"label":"XShare, a paper on the same expert effect","url":"https://arxiv.org/abs/2602.07265"}],"read":"opened","status":"active"},{"id":"2026-06-apple-core-ai","title":"Dive into Core AI model authoring and optimization (WWDC26 session 325)","url":"https://developer.apple.com/videos/play/wwdc2026/325","org":"Apple","published":"2026-06","added":"2026-11-19","kind":"talk","layers":["compiler","kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"Apple's successor to Core ML. A model is converted to an asset that is specialised to the exact hardware and OS on first load, then cached. Developers can embed hand-written Metal kernels paired with reference functions, and Apple ships skills for coding assistants alongside.","changes":"Fitting a model to the exact device becomes a platform default. The fitting is done by a vendor compiler; the kernels are still written by people.","caveats":"Apple silicon only and opaque. No LLM tokens-per-second figures and no comparison with MLX or llama.cpp. The date is the conference month; the session page itself is undated.","numbers":[],"bears_on":[{"claim":"C2","direction":"supports","note":"A platform now specialises each model to the exact hardware and OS on first load."}],"read":"relayed","status":"active"},{"id":"2026-05-22-fastkernels","title":"FastKernels: benchmarking GPU kernel generation in production","url":"https://arxiv.org/abs/2605.23215","org":"Snowflake AI Research, CMU, UCSD","published":"2026-05-22","added":"2026-11-19","kind":"benchmark","layers":["kernels","engine","loop"],"mechanism":"frame","venue":"any","gist":"384 kernel tasks taken from 47 real architectures, with baselines set to the kernels that production frameworks actually ship. Each candidate is scored alone and again after being swapped into the full model on the production path. Five agent systems were run for 6,900 agent-hours.","changes":"Puts a number on how much isolated kernel results overstate. This is the discount to apply to every kernel speed-up quoted elsewhere on this site.","caveats":"One GPU type. Equivalence was checked with a few forward passes, not task accuracy. No public leaderboard yet.","numbers":[{"metric":"Kernel-level speed-up once swapped into the full model","value":"1.6 to 6.6x shrinks to 0.96 to 1.25x","baseline":"kernels shipped by production frameworks","verification":"third-party","setup":"B200"},{"metric":"Winning kernel sets that ran correctly unmodified","value":"22 of 110 (20%)","baseline":"all winning sets","verification":"third-party"},{"metric":"LLM serving end to end","value":"within about 6% either way","baseline":"production kernels","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Isolated scores even mis-ranked the agents: the one that looked equal alone was three times better end to end."},{"claim":"C1","direction":"challenges","note":"For LLM serving specifically, agents landed at parity with what already ships."}],"read":"relayed","status":"active"},{"id":"2026-05-20-inferencebench","title":"InferenceBench: open-ended LLM inference optimization by AI agents","url":"https://arxiv.org/abs/2607.20468","org":"ELLIS Institute Tübingen, MPI-IS","authors":"Jehyeok Yeon, Ben Rank, Maksym Andriushchenko","published":"2026-05-20","added":"2026-11-19","kind":"benchmark","layers":["loop","engine","serving"],"mechanism":"frame","venue":"any","gist":"An independent benchmark: an agent gets one H100, a target model and two hours to stand up the fastest server it can. Agents beat naive PyTorch easily and often beat default vLLM, but a plain hyperparameter search with the same budget beat every agent. Nearly all runs shipped vLLM, and the median run tried a single non-default configuration.","changes":"The strongest counterweight to the autumn announcements. It locates the agents' weakness in systematic experimentation, not knowledge, which is exactly the part the vendors' harnesses supply.","caveats":"A small model, one GPU, two hours and ordinary requests. It measures configuration search, not kernel or engine rewriting, and it predates the systems it gets used to argue against. The newest leaderboard entries narrow the gap but have no matched-budget search beside them.","numbers":[{"metric":"Best agent","value":"8.08x","baseline":"naive PyTorch; default vLLM scores 4.05x","verification":"third-party","setup":"Mistral-7B, one H100, two hours"},{"metric":"Budget-matched hyperparameter search","value":"11.53x","baseline":"naive PyTorch","verification":"third-party"},{"metric":"Runs flagged for subverting the measurement","value":"6.1% of 180","baseline":"integrity judge plus manual audit","verification":"third-party"},{"metric":"Leaderboard top agent, November 2026","value":"12.08x","baseline":"14.30x for the best non-agent search composite","verification":"third-party"}],"bears_on":[{"claim":"C1","direction":"challenges","note":"On configuration, plain search still wins, and giving agents four or eight hours did not reliably help."},{"claim":"C4","direction":"supports","note":"One in sixteen runs gamed the measurement, including one reporting 118 million tokens per second."},{"claim":"C5","direction":"challenges","note":"More time did not produce more gain. No sign of compounding inside a run."}],"also":[{"label":"Leaderboard","url":"https://inferencebench.ai/"}],"read":"opened","status":"active"},{"id":"2026-05-17-offline-llm-energy-use","title":"Offline LLM energy use","url":"https://williamangel.net/blog/2026/05/17/offline-llm-energy-use.html","org":"William Angel","published":"2026-05-17","added":"2026-11-19","kind":"blog","layers":["hardware"],"mechanism":"frame","venue":"local","gist":"A measured cost-per-token analysis of running a model on a high-end laptop against buying the same model through an API aggregator.","changes":"Puts local at parity in the best case and about ten times dearer in the worst, with the hardware's depreciation, not electricity, as the dominant cost.","caveats":"One machine and one author's assumptions about depreciation and utilisation. The title is taken from the URL; check the page for its exact wording.","numbers":[{"metric":"Cost per million tokens on an M5 Max","value":"$0.40 to $4.79","baseline":"$0.38 to $0.50 for the same model via OpenRouter","verification":"self-reported"}],"bears_on":[{"claim":"C8","direction":"challenges","note":"Owned hardware is at best cost-neutral per token before any loop is run on it."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-05-14-twinrouterbench","title":"TwinRouterBench: fast static and live dynamic evaluation for realistic agentic LLM routing","url":"https://arxiv.org/abs/2605.18859","org":"Pei Yang and 17 others","published":"2026-05-14","added":"2026-11-19","kind":"paper","layers":["routing"],"mechanism":"frame","venue":"any","gist":"A router benchmark that scores routing at each step of an agent's work against an always-top-tier baseline, with prompt caching priced in, and then validates live with real spend. The pool mixes closed and open models.","changes":"The one independent result where routing pays with caching counted, and it shows what kind: a trained step-level router halves cost at equal quality, while a rule-based one costs three times as much as not routing.","caveats":"The 100 live cases are not a random sample, and the models are a generation old. The result depends on a fixed pool and one price snapshot.","numbers":[{"metric":"API cost for a trained step-level router at equal tasks resolved","value":"$25.66 against $54.73 (53% lower)","baseline":"the top-tier model unrouted","verification":"third-party","setup":"100 live cases"},{"metric":"API cost for a rule-based router","value":"$172.56, about three times higher","baseline":"the top-tier model unrouted","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"supports","note":"With caching priced in, a trained router still halved cost at equal quality."},{"claim":"C9","direction":"complicates","note":"A naive router was three times worse than no router. The gain is in the training, not the idea."}],"read":"relayed","status":"active"},{"id":"2026-05-08-ronacher-local-focus-and-polish","title":"Pushing local models with focus and polish","url":"https://lucumr.pocoo.org/2026/5/8/local-models/","org":"Armin Ronacher","published":"2026-05-08","added":"2026-11-19","kind":"essay","layers":["engine"],"mechanism":"frame","venue":"local","gist":"Argues the local gap is polish, not model quality: users must pick engine, quantisation, template and context size, and any choice can silently degrade the model. Proposes one model, one serving path and one harness on one hardware configuration, pointing to a narrow single-model engine built with heavy help from coding agents.","changes":"Specialisation as the local strategy: not a general runtime tuned per device, but a narrow engine per model. It is the same move the datacenter is making, arrived at from the usability side.","caveats":"Advocacy without measurements. He concedes the hardware it needs is expensive and scarce.","numbers":[],"bears_on":[{"claim":"C8","direction":"supports","note":"Weakly: a narrow, agent-built engine per model is a plausible local form of the same idea. No numbers yet."}],"also":[{"label":"ds4, the single-model engine","url":"https://github.com/antirez/ds4"}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-05-07-vibeserve","title":"VibeServe: can AI agents build bespoke LLM serving systems?","url":"https://arxiv.org/abs/2605.06068","org":"University of Washington","published":"2026-05-07","added":"2026-11-19","kind":"paper","layers":["loop","engine","serving","model"],"mechanism":"agent","venue":"any","gist":"A planner with long-term memory and an issue tracker drives an inner loop of implementer, accuracy judge and performance evaluator to build a whole serving stack for one model, one chip and one workload.","changes":"A direct test of bespoke-per-workload: parity with general engines in the standard case, large wins only where the scenario is unusual. That is about where the value of specialisation should be expected to sit.","caveats":"In the standard setting the result is a tie after 25 hours. The biggest win is against a baseline the authors had to patch to run. Single node, and it relies on a correctness checker the user supplies.","numbers":[{"metric":"Standard setting","value":"matches vLLM, about 5% over SGLang","baseline":"tuned general engines","verification":"self-reported","setup":"Llama-3.1-8B, H100, 60 rounds"},{"metric":"A 397B MoE on AMD accelerators","value":"2.33x goodput","baseline":"SGLang, patched by the authors to run","verification":"self-reported","setup":"4x MI300A"},{"metric":"Non-standard scenarios","value":"1.69 to 6.27x","baseline":"general engines","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"complicates","note":"Bespoke only pays where the workload is unusual. In the common case it ties."},{"claim":"C1","direction":"supports","note":"Agents built a whole stack that matches a mature engine."},{"claim":"C5","direction":"supports","note":"Removing the skills library lowered the ceiling. Here accumulated knowledge helped, the opposite of Together's finding."}],"read":"relayed","status":"active"},{"id":"2026-05-07-openai-fine-tuning-wind-down","title":"OpenAI API deprecations: self-serve fine-tuning","url":"https://developers.openai.com/api/docs/deprecations","org":"OpenAI","published":"2026-05-07","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"frame","venue":"cluster","gist":"OpenAI is closing self-serve fine-tuning in stages: to new organisations in May 2026, to inactive ones in July, and to everyone in January 2027. Tuned models keep serving only until their base model is retired.","changes":"The largest counter-signal for the model lever. A frontier lab is withdrawing tuning, reportedly because prompting has become cheaper and faster, and every tune there dies with its base model.","caveats":"This concerns tuning closed models, not open weights. The stated reason is second-hand, from a company that sells alternatives. Two cloud providers moved the other way and added reinforcement fine-tuning this year, without customer numbers. The date is that of the notice; the page itself is undated.","numbers":[],"bears_on":[{"claim":"C10","direction":"challenges","note":"A frontier lab is ending self-serve tuning, and tuned models retire with their base."}],"read":"relayed","status":"active"},{"id":"2026-04-22-applied-compute-agentic-benchmark","title":"An inference benchmark for agentic workloads","url":"https://www.appliedcompute.com/research/inference-benchmark","org":"Applied Compute","published":"2026-04-22","added":"2026-11-19","kind":"benchmark","layers":["loop","serving"],"mechanism":"frame","venue":"any","gist":"A small open harness that replays agent sessions described only by their shape: turns, prompt and output lengths, tool waits. A session holds a concurrency slot through its tool waits, as real agents do. On their traces the two main open engines performed about the same.","changes":"A second public replay harness besides AgentX, and a measured warning about shortcuts: replaying one averaged trace instead of the real spread overstates throughput.","caveats":"Prompts are random per trace, so prefixes shared across sessions are not modelled and cache hits read low. No capture tool and no recorded arrival times. The title here is descriptive; check the page for its own.","numbers":[{"metric":"Throughput overstated by replaying a mean trace","value":"10 to 20%","baseline":"replaying the real distribution of sessions","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Averaging the workload before replaying it gives an answer 10 to 20% too good."}],"also":[{"label":"trie, the harness","url":"https://github.com/Applied-Compute/trie"}],"read":"relayed","status":"active"},{"id":"2026-04-02-meta-kernelevolve","title":"KernelEvolve: how Meta's ranking engineer agent optimizes AI infrastructure","url":"https://engineering.fb.com/2026/04/02/developer-tools/kernelevolve-how-metas-ranking-engineer-agent-optimizes-ai-infrastructure/","org":"Meta","published":"2026-04-02","added":"2026-11-19","kind":"blog","layers":["loop","kernels","compiler","hardware"],"mechanism":"agent","venue":"onprem","gist":"Kernel generation as tree search over candidates in six kernel languages across NVIDIA, AMD and Meta's own chips, fed by retrieval over hardware documentation and profiler diagnostics. Search trajectories are reused to train smaller specialist models, with measured kernel speed as the reward.","changes":"Evidence that the loop works at scale on an operator's own mixed fleet, and a concrete flywheel: the search trains the next searcher. It is ads ranking, not LLM serving.","caveats":"Unverifiable from outside. No search budget, cost or failures given. Its perfect KernelBench score uses the protocol shown to be inflated. Engineers still choose the operator, the chip and the goal.","numbers":[{"metric":"Inference throughput, an ads model on NVIDIA GPUs","value":"over 60% higher","baseline":"a baseline already using torch.compile and vendor libraries","verification":"self-reported"},{"metric":"Training throughput on Meta's own chip","value":"over 25% higher","baseline":"before","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"In production on a ranking workload, against an already-compiled baseline."},{"claim":"C5","direction":"supports","note":"Trajectories train specialist models. That is a real feedback path from search to searcher."},{"claim":"C6","direction":"supports","note":"Three chip families, one of them in-house silicon with no outside ecosystem."}],"also":[{"label":"Paper","url":"https://arxiv.org/abs/2512.23236"}],"read":"relayed","status":"active"},{"id":"2026-03-31-together-aurora","title":"Aurora","url":"https://www.together.ai/blog/aurora","org":"Together AI","published":"2026-03-31","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"online","venue":"cluster","gist":"The serving engine streams accepted and rejected draft tokens to a buffer; a separate training server keeps updating a copy of the drafter and hot-swaps it into serving. The drafter follows the traffic and changes to the target model with no offline pipeline. Its production version is called ATLAS-2.","changes":"A lever that re-tunes itself from live traffic with no agent involved: classical online learning inside the decoding path. It also puts a number on drift, about ten thousand requests to recover after traffic changes abruptly.","caveats":"The traffic shift is simulated and the evaluation sets are small. The cost of running the training server is not given. The gain shrinks with batch size, as with every drafter.","numbers":[{"metric":"Speed-up from an online-trained drafter","value":"about 1.25x","baseline":"a well-trained static drafter","verification":"self-reported","setup":"simulated stream over five domains"},{"metric":"Speed-up as batch size grows","value":"1.92x at batch 1 to 1.57x at batch 32","baseline":"no speculation","verification":"self-reported","setup":"Qwen3-Coder-Next"}],"bears_on":[{"claim":"C2","direction":"supports","note":"A drafter trained once goes stale as traffic moves; one that keeps learning stays about a quarter faster."},{"claim":"C1","direction":"complicates","note":"This lever adapts by online learning, with no agent writing code."}],"also":[{"label":"ATLAS-2 announcement","url":"https://www.together.ai/blog/ai-native-conf-research-and-product-announcements"}],"read":"relayed","status":"active"},{"id":"2026-03-30-ollama-mlx","title":"Ollama is now powered by MLX on Apple silicon","url":"https://ollama.com/blog/mlx","org":"Ollama","published":"2026-03-30","added":"2026-11-19","kind":"blog","layers":["engine","kernels","model","serving"],"mechanism":"hand","venue":"local","gist":"The most-used local runner swapped its Apple-silicon backend to MLX, added a 4-bit weight format from NVIDIA, and reworked its prompt cache to be reused across conversations and to keep shared prefixes. A June follow-up fuses operations into single Metal kernels and moves sampling to the GPU.","changes":"Local stacks are getting the same class of work as datacenter engines (kernel fusion, cache retention policy), about a year behind and done by hand.","caveats":"The comparison changes engine and quantisation at once and does not name the chip. Needs more than 32 GB of memory. A competitor found its draft model barely drafting on some models.","numbers":[{"metric":"Decode","value":"58 to 112 tok/s","baseline":"Ollama 0.18 with a different quantisation","verification":"self-reported","setup":"Qwen3.5-35B, chip not named"}],"bears_on":[{"claim":"C8","direction":"complicates","note":"Serious optimisation is reaching local runtimes. People are doing it, by hand, for everyone at once."}],"also":[{"label":"June follow-up","url":"https://ollama.com/blog/mlx-performance"}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-03-30-kernel-smith","title":"Kernel-Smith: a unified recipe for evolutionary kernel optimization","url":"https://arxiv.org/abs/2603.28342","org":"Shanghai AI Laboratory, Fudan University, MetaX","published":"2026-03-30","added":"2026-11-19","kind":"paper","layers":["kernels","loop"],"mechanism":"agent","venue":"any","gist":"An evolutionary agent keeps a population of runnable kernel candidates with compile, correctness and speed feedback, and recycles its search trajectories into training data for a specialised model. Targets NVIDIA and a Chinese GPU vendor.","changes":"Its kernels were merged into production engines, and its own numbers show the dilution: a kernel 4.78x faster alone was worth about 1% end to end.","caveats":"The merged pull requests have not been checked. Evaluated on the benchmark protocol later shown to be inflated. Data on request only.","numbers":[{"metric":"A kernel merged into SGLang","value":"4.78x alone; -0.35% to +1.75% end to end","baseline":"the existing kernel","verification":"self-reported"},{"metric":"A kernel merged into LMDeploy","value":"1.36x alone; 1.85 to 3.0% throughput","baseline":"the existing kernel","verification":"self-reported"}],"bears_on":[{"claim":"C4","direction":"supports","note":"The authors' own end-to-end numbers are two orders smaller than their kernel numbers."},{"claim":"C5","direction":"supports","note":"Search trajectories become training data for the next model."},{"claim":"C1","direction":"complicates","note":"The code landed in real engines. The effect was about one percent."}],"read":"relayed","status":"active"},{"id":"2026-03-19-speed-bench","title":"SPEED-Bench: a unified and diverse benchmark for speculative decoding","url":"https://huggingface.co/blog/nvidia/speed-bench","org":"NVIDIA","published":"2026-03-19","added":"2026-11-19","kind":"benchmark","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"880 prompts across 11 kinds of content measure how many draft tokens are accepted, and a separate split measures throughput at long inputs and high concurrency inside production engines. Its argument is that acceptance is a property of the workload, not of the drafter.","changes":"A way to measure the decoding lever on your own mix of domains before building anything. It also quantifies a rig error: load tests on random tokens overstate throughput by about a quarter.","caveats":"Published by a company that ships its own drafters. The blog gives figures, not tables, for speed-up against concurrency.","numbers":[{"metric":"Accepted length, coding against roleplay","value":"2.46 against 1.87","baseline":"the same drafter and model","verification":"third-party","setup":"batch 32, draft length 3"},{"metric":"Mean speed-up at batch 32","value":"1.20 to 1.34x; 0.88x for n-gram drafting","baseline":"no speculation","verification":"third-party"},{"metric":"Throughput overstated by random-token load tests","value":"about 23%","baseline":"realistic prompts","verification":"third-party"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Acceptance follows the content: code and maths speculate well, chat and roleplay do not."},{"claim":"C4","direction":"supports","note":"A load test on random tokens is a quarter too optimistic."}],"read":"relayed","status":"active"},{"id":"2026-03-13-llmd-predicted-latency","title":"Predicted-latency based scheduling for LLMs","url":"https://llm-d.ai/blog/predicted-latency-based-scheduling-for-llms","org":"llm-d (Google authors)","published":"2026-03-13","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"online","venue":"any","gist":"A small gradient-boosted model, retrained continuously on live traffic, predicts time to first token and per-token time for each candidate server and routes accordingly, replacing hand-set weights.","changes":"A working example of the stack learning its own deployment online with no LLM involved. Classical online learning already does workload-aware at the per-request timescale.","caveats":"The headline is against round-robin; against the best hand heuristic the gain is about a third. One of five scenarios showed no advantage. Assumes identical servers.","numbers":[{"metric":"Median end-to-end latency","value":"9.06 s vs 13.42 s","baseline":"the best hand-tuned heuristic (round-robin: 15.98 s)","verification":"self-reported","setup":"Qwen3-480B, H200"},{"metric":"Median TTFT","value":"0.97 s vs 3.38 s","baseline":"the best hand-tuned heuristic","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"A model retrained on the deployment's own traffic beat fixed weights."},{"claim":"C1","direction":"complicates","note":"A learned controller did this, not a coding agent."}],"read":"relayed","status":"active"},{"id":"2025-12-31-speculative-decoding-performance-or-illusion","title":"Speculative decoding: performance or illusion?","url":"https://arxiv.org/abs/2601.11580","org":"UC Berkeley","published":"2025-12-31","added":"2026-11-19","kind":"paper","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"An independent study of speculative decoding variants inside a production engine, across workloads and batch sizes. Gains shrink as load rises and some variants fall below break-even; which method wins depends on the dataset.","changes":"Cuts both ways. Fixed speculation is fragile under real load, which undercuts single-stream headline numbers. But an oracle choosing the method per token position does far better than any fixed choice, which is measured headroom for adaptivity.","caveats":"The adaptive result assumes a perfect oracle. No practical predictor was built.","numbers":[{"metric":"One speculation method's speed-up as load rises","value":"1.73x at batch 1 falls to 1.21x at batch 128","baseline":"no speculation","verification":"third-party","setup":"Llama 3.1 8B in vLLM"},{"metric":"An oracle choosing the method per position","value":"up to 2.2x","baseline":"the best fixed method","verification":"third-party"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The winning method changes with the dataset, the request and even the token position."}],"read":"relayed","status":"active"},{"id":"2025-12-27-nightjar","title":"Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving","url":"https://arxiv.org/abs/2512.22420","org":"Rui Li and co-authors","authors":"Rui Li, Zhaoning Zhang, Libo Zhang, Huaimin Wang, Xiang Fu, Zhiquan Lai","published":"2025-12-27","added":"2026-11-19","kind":"paper","layers":["serving","model"],"mechanism":"online","venue":"any","gist":"An extension to vLLM in which a planner learns by trial which draft length works at each batch size and turns speculation off when it stops paying. While it is off, the draft model can be moved out of GPU memory to make room for a larger cache and batch. First posted in December 2025; the fifth version is dated June 2026.","changes":"Adapting the draft length to batch size bought up to about 15% more throughput than fixed speculation, measured. That is far below the 2.2x an oracle reaches, and below the 51% a lab reported when it changed the drafter too. The plain version of this idea is worth tens of percent at most.","caveats":"The authors' own figures, on dense models of 7 to 32 billion parameters and single small GPUs, so nothing here speaks to mixture-of-experts models or provider-scale batches. The baseline is a draft length fixed at 3, not one tuned for each load. The abstract's latency figure could not be traced to a table. No code is linked.","numbers":[{"metric":"Throughput under changing request rates","value":"8% higher on average, up to 14.76%","baseline":"speculative decoding with the draft length fixed at 3","verification":"self-reported","setup":"vLLM; 7B and 13B models on one RTX 4090 or one A100"},{"metric":"Fixed-length speculation as load rises","value":"15.5% faster at 15 requests a second, up to 30% slower at high load","baseline":"no speculation","verification":"self-reported","setup":"7B model on one RTX 4090, ShareGPT prompts"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best draft length changes with batch size by enough that a fixed one gives up 8 to 15%, and loses to no speculation at high load."}],"read":"opened","status":"active"},{"id":"2025-11-11-intelligence-per-watt","title":"Intelligence per watt: measuring intelligence efficiency of local AI","url":"https://arxiv.org/abs/2511.07885","org":"Saad-Falcon, Hennessy, Mirhoseini, Ré et al.","published":"2025-11-11","added":"2026-11-19","kind":"paper","layers":["hardware","routing"],"mechanism":"frame","venue":"local","gist":"Measures task accuracy per unit of power for more than 20 local models on 8 accelerators over a million real single-turn queries, and argues a large and rising share of everyday queries can be answered locally, which favours hybrid routing.","changes":"The quantitative case for local: most queries do not need the frontier. Its own data also show local accelerators doing less per watt than cloud ones on the same model.","caveats":"Single-turn chat and reasoning only. It says nothing about agent workloads with long contexts, which are what the rest of this site is about.","numbers":[{"metric":"Share of queries local models answer correctly","value":"88.7%","baseline":"1M real single-turn queries","verification":"self-reported"},{"metric":"Locally serviceable share over 2023 to 2025","value":"23.2% to 71.3%","baseline":"the same measure two years earlier","verification":"self-reported"},{"metric":"Efficiency of local accelerators on identical models","value":"at least 1.4x worse","baseline":"cloud accelerators","verification":"self-reported"}],"bears_on":[{"claim":"C8","direction":"complicates","note":"Local is good enough for most single-turn queries and less efficient per watt. Agent workloads are untested."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2025-10-10-together-atlas","title":"ATLAS: adaptive-learning speculator system","url":"https://www.together.ai/blog/adaptive-learning-speculator-system-atlas","org":"Together AI","published":"2025-10-10","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"online","venue":"dedicated","gist":"A speculative decoding setup that learns at runtime: a fixed draft model gives a floor, a lightweight one learns from live traffic, and a controller chooses between them and sets how far to look ahead.","changes":"The origin of the learn-from-live-traffic line in production serving, a year before the agent announcements. Its predecessor post gives one of the few like-for-like figures for customer-specific tuning.","caveats":"Batch size 1 on narrow traffic is the best case. Does not say whether learning is isolated per customer. No outside check.","numbers":[{"metric":"Decode, fully adapted","value":"about 500 vs 105 tok/s","baseline":"8-bit baseline without speculation","verification":"self-reported","setup":"DeepSeek-V3.1, 4x B200, batch 1"},{"metric":"A customer-trained speculator (May 2025 post)","value":"1.23 to 1.45x","baseline":"Together's generic speculator","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"supports","note":"Like for like, customer-specific tuning was worth 23 to 45% here."},{"claim":"C2","direction":"supports","note":"A draft model goes stale as traffic drifts; this was built to fix that."}],"read":"relayed","status":"active"},{"id":"nvidia-dynamo-agentic-inference","title":"Full-stack optimizations for agentic inference with Dynamo","url":"https://docs.nvidia.com/dynamo/v1.1.0/blog/agentic-inference","org":"NVIDIA","published":"undated","added":"2026-11-19","kind":"blog","layers":["routing","serving","engine"],"mechanism":"online","venue":"any","gist":"The agent harness passes per-request hints down to the serving stack: priority, expected output length, and a signal to warm a worker while a tool call is in flight. The router places requests using a global index of cached blocks, and eviction can follow priority instead of plain recency.","changes":"A different route to workload awareness: the workload tells the stack about itself, instead of the stack inferring it. If this interface standardises, per-user adaptation needs no private traffic analysis at all.","caveats":"Undated. Hardware unspecified, and several features are described as being built. The cache-hit figures quoted come from a managed API, not from Dynamo.","numbers":[{"metric":"Median TTFT with a custom router that learns by sampling","value":"4x lower","baseline":"Dynamo's default routing","verification":"self-reported"},{"metric":"Median TTFT with priority tagging","value":"up to 63% lower","baseline":"no tagging","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Hints about each request's shape change how it should be scheduled."},{"claim":"C3","direction":"complicates","note":"Per-request hints give per-user adaptation without building anything per customer."}],"read":"relayed","status":"active"}],"figures":[{"id":"kernel-dilution","type":"pairs","title":"A kernel speed-up, before and after honest measurement","takeaway":"Gains of several times shrink to about nothing.","unit":"x","from_label":"as first measured","to_label":"measured properly","reference":1,"reference_label":"no gain","rows":[{"label":"Best agent on FastKernels","from":6.6
