[{"claim":"C2","direction":"supports","note":"Kernels are compiled and tuned for the GPU it detects, and the result is tied to that chip."}],"read":"relayed","status":"retired","retired_why":"Cited by no lever, figure or tension, read second-hand, and its one point, that settings are specific to the chip in hand, is made by measured signals. Retired on the weekly deep pass to stay within the limit on active signals."},{"id":"2026-08-04-cross-model-kv-transfer-linear","title":"Cross-Model KV Cache Transfer in LLM Families: A Closed-Form Linear Mapping for Prefill Reuse","url":"https://arxiv.org/abs/2608.03893","org":"Taekyung Heo and co-authors","authors":"Taekyung Heo, Rasoul Shafipour, Ritchie Zhao, Maximilian Golub, Mohammad Mahdi Kamani, Ritika Borkar, Makesh Tarun Chandran, Pantea Zardoshti, Bita Darvish Rouhani","published":"2026-08-04","added":"2026-11-26","kind":"paper","layers":["serving","model"],"mechanism":"hand","venue":"any","gist":"Inside one model family, one model's cache can be predicted from another's with plain linear regression, fitted per attention head on 500 short text samples and with no training. It applies where the two models' attention heads have the same shape. On six pairs from three families it kept most of the receiver's accuracy on four and failed on two; a small non-linear mapper recovered part of the failures.","changes":"The cheapest route, and one a provider could try today on a small-to-large cascade. It needs no training, only 500 calibration samples, and runs 2.7 to 25x faster than re-reading. It also marks the limit. Two of six pairs degraded sharply, so each pair must be tested before a router relies on it.","caveats":"Read from the abstract. Works only within a family and only where head counts and sizes match. Accuracy is on benchmark questions, and the range on the four good pairs is wide, 73 to 98%. The speed figure is for the mapper against prefill, with no serving-level number. A later system reports that this mapper needs 8 to 12 times more memory than its own.","numbers":[{"metric":"Receiver's accuracy kept with a linearly mapped cache","value":"73 to 98% on four of six pairs; the other two degrade sharply","baseline":"the receiver reading the text itself","verification":"self-reported","setup":"Six pairs in three families with matching attention-head shapes"},{"metric":"Time to map a cache","value":"2.7 to 25x faster","baseline":"the receiver re-reading the context","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Within a family a linear map can replace the re-read after a switch, but one pair in three failed, so the cache still binds wherever the map does not hold."}],"read":"opened","status":"active"},{"id":"2026-07-26-fireworks-nexus","title":"Fireworks Nexus: drop-in open frontier intelligence for teams with budgets","url":"https://fireworks.ai/blog/fireworks-nexus-open-model-routing","org":"Fireworks AI","published":"2026-07-26","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"An installer points existing coding harnesses at Fireworks-served open models. A trained difficulty scorer sends routine work to an open model and passes hard work through to the customer's own key at a frontier lab. It scores each turn and weighs cache hits.","changes":"A second provider shipping the same split, open for routine and frontier for hard, from the open-model side. The provider owns the routing decision while the customer keeps the harness.","caveats":"The router launched as a research preview and its evidence is thin: preliminary tests at two customers, and a typical 3 to 5x saving stated with no data. In Fireworks' own benchmark the open model matched the frontier one on score but used about ten times the tokens per task.","numbers":[{"metric":"Cost per merged pull request","value":"about a third lower","baseline":"the customers' previous all-frontier setup, preliminary","verification":"self-reported","setup":"two named customers"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Open for routine work, frontier behind the customer's own key for hard work, in one harness."}],"also":[{"label":"November update","url":"https://fireworks.ai/blog/fireworks-unveils-new-products-at-forge-to-help-companies-build-specialized-intelligence"}],"read":"relayed","status":"active"},{"id":"2026-07-22-cursor-router","title":"Cursor Router","url":"https://cursor.com/blog/router","org":"Cursor","published":"2026-07-22","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A classifier runs before each agent request and picks a model from the query, context, task complexity and domain. It was trained on more than 600,000 live requests with a user-satisfaction reward, and the cost of cache misses was included in training. Three modes set the trade-off between cost and capability.","changes":"The opposite bet on granularity: route every request and price the cache miss into the decision. It is also the largest disclosed training set for a router, built from the harness owner's own traffic.","caveats":"Satisfaction is an inferred proxy and nothing is independently checked. Staff confirmed that switching mid-conversation is intended and that it resets the prefix cache. The named pool has no open-weight models.","numbers":[{"metric":"Cost at near-frontier satisfaction","value":"about 60% lower","baseline":"always using the strongest model","verification":"self-reported","setup":"online A/B test"},{"metric":"Cost per commit","value":"$4.63 routed, against $7.34 and $12.69","baseline":"two fixed frontier models","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"Routing between models is in production at scale, but here the pool is all closed models and the route changes per request."}],"read":"relayed","status":"active"},{"id":"2026-07-08-databricks-coding-agent-benchmark","title":"Benchmarking coding agents on Databricks' multi-million line codebase","url":"https://databricks.com/blog/benchmarking-coding-agents-databricks-multi-million-line-codebase","org":"Databricks","published":"2026-07-08","added":"2026-11-19","kind":"benchmark","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Tasks rebuilt from real merged pull requests in a large private codebase, graded by held-out tests with no LLM judge. The best open model sat in the same capability tier as the frontier at lower cost per task, and the choice of harness moved cost by more than twice at equal quality.","changes":"The strongest evidence that an open model is good enough for routine coding work, which is the premise of every router here. It also suggests most of the saving comes from the swap, not from clever routing.","caveats":"Internal tasks only, and most numbers are in figures. A second study on another company's tasks found the same direction but used an LLM judge and single runs.","numbers":[{"metric":"Cost per task at statistically tied quality","value":"$1.28 against $1.94","baseline":"a frontier closed model on the same tasks","verification":"self-reported","setup":"open model GLM 5.2"}],"bears_on":[{"claim":"C9","direction":"supports","note":"An open model tied a frontier one on real tasks at two-thirds the cost."},{"claim":"C9","direction":"complicates","note":"If a fixed open model already captures the saving, the router adds little."}],"read":"relayed","status":"active"},{"id":"2026-07-06-dspark","title":"DSpark: confidence-scheduled speculative decoding with semi-autoregressive generation","url":"https://arxiv.org/abs/2607.05147","org":"DSpark authors (deployed at DeepSeek)","published":"2026-07-06","added":"2026-11-19","kind":"paper","layers":["model","serving"],"mechanism":"online","venue":"cluster","gist":"A drafter that proposes a block of tokens at once, with a confidence head predicting how many will survive checking. A scheduler then admits draft tokens per request until a profiled throughput curve stops improving, so the amount of speculation grows at moderate load and shrinks as concurrency rises.","changes":"Speculative decoding that listens to the load, in production at a model lab. It is the clearest case of two levers being tuned together: how far to speculate is set by how full the batches are.","caveats":"Self-reported; offline numbers were measured with the scheduler switched off, and the paper warns its strict-latency figures are not typical. An open-engine reproduction confirmed the trend, not the numbers. Drafting cost is wasted on requests where little is accepted.","numbers":[{"metric":"Aggregate throughput at moderate latency targets, live traffic","value":"about 51 to 52% higher","baseline":"the previous production drafter (one-token MTP)","verification":"self-reported"},{"metric":"Accepted length by domain","value":"5.57 maths, 5.12 code, 3.49 chat","baseline":"the same drafter across domains","verification":"self-reported","setup":"Qwen3-4B, offline"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Acceptance differs by domain and the best amount of speculation changes with load, so the setting cannot be fixed."},{"claim":"C3","direction":"complicates","note":"The adaptation is per request and per load level, done by one scheduler for everyone, not built per customer."}],"also":[{"label":"SGLang reproduction","url":"https://www.lmsys.org/blog/2026-07-06-dspark-sglang/"}],"read":"relayed","status":"active"},{"id":"2026-07-02-sglang-agent-assisted-development","title":"Agent-assisted SGLang development: an initial exploration","url":"https://www.lmsys.org/blog/2026-07-02-agent-assisted-sglang-development/","org":"SGLang team (LMSYS)","published":"2026-07-02","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"any","gist":"SGLang packaged benchmarking, profiling, CUDA debugging and incident triage as skills agents can run, and set up a loop in which one coding agent implements, another reviews, and a profile must explain a gap before any patch is written. A November recap says agents now produce most of the project's merged pull requests.","changes":"The second open engine to say in public that agents do the bulk of its engineering. Its own example of a kernel win evaporating end to end is the cleanest small illustration of the evaluation problem.","caveats":"The recap's claims (most merged pull requests, decoding up to 2x faster from AI-written megakernels, a port to a new accelerator in under a week) come without percentages, hardware or model. The post itself warns about plausible-but-wrong changes and reward hacking through mismatched ABI or fast-math flags.","numbers":[{"metric":"A kernel-group speed-up measured end to end","value":"2.03x became 1.021x","baseline":"the same change measured in isolation","verification":"self-reported"},{"metric":"Allreduce fusion","value":"5.49 to 9.41 requests/s","baseline":"before the pull request","verification":"public-run","setup":"H100, 4-way tensor parallel"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Merged, public pull requests from an agent loop with a review step."},{"claim":"C4","direction":"supports","note":"A 2x kernel win was worth 2% in the engine."},{"claim":"C7","direction":"supports","note":"The open engines are running the loop themselves."}],"also":[{"label":"November summit recap","url":"https://www.lmsys.org/blog/2026-11-17-sglang-summit-recap"}],"read":"relayed","status":"active"},{"id":"2026-07-openzeka-kimi-k3-speculation-under-load","title":"Kimi K3 Inference Benchmark on DGX-B300","url":"https://whitepapers.openzeka.com/papers/kimi-k3-dgx-b300-inference-benchmark/","org":"Openzeka, an NVIDIA distribution partner","published":"2026-07","added":"2026-11-20","kind":"benchmark","layers":["model","serving","engine"],"mechanism":"frame","venue":"any","gist":"An outside benchmark of Kimi K3, a 2.8-trillion-parameter mixture-of-experts model, on one eight-GPU B300 node. It runs vLLM and SGLang, each with and without the drafter their official recipes recommend, from 1 to 64 concurrent requests. Speculation nearly doubles one user's speed, breaks even at 16 concurrent in vLLM and 4 in SGLang, and at 64 delivers less than half the tokens of plain decoding.","changes":"The first measured mixture-of-experts table, and it fades like the dense ones. The rising curve a cost model predicted for such models has not shown up in a real engine. It also shows the engines' recipes fix the draft length, which at 64 concurrent cost more than half the throughput.","caveats":"One model, one node, 128-token prompts and answers, template prompts, and a fixed draft of seven tokens. The speculative vLLM run capped running requests at 32, which alone could flatten its curve past 32; the break-even at 16 sits below that cap. The two engines used different drafters. Measured by a hardware reseller. Spreading the model over eight GPUs may hide the small-batch expert effect.","numbers":[{"metric":"Per-user speed with speculation, one request","value":"188 vs 101 tok/s (1.86x)","baseline":"vLLM without speculation, same node","verification":"third-party","setup":"Kimi K3, 8x B300, tensor parallel 8, DSpark drafter with 7 tokens"},{"metric":"Concurrency at which speculation stops paying","value":"about 16 in vLLM, about 4 in SGLang","baseline":"each engine without speculation","verification":"third-party"},{"metric":"Per-user speed with speculation, 32 and 64 concurrent","value":"0.66x and 0.41x","baseline":"vLLM without speculation","verification":"third-party"},{"metric":"Aggregate output at 64 concurrent","value":"717 vs 1,759 tok/s","baseline":"vLLM without speculation","verification":"third-party"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Whether to speculate flips with the load and with the engine: on one model and chip, break-even came at 16 concurrent in vLLM and 4 in SGLang."}],"read":"opened","status":"active"},{"id":"2026-07-arize-cost-per-successful-task","title":"Cost per successful task: benchmarking Kimi K3, GPT-5.5 and 8 more AI models","url":"https://arize.com/blog/cost-per-successful-task-ai-model-benchmark","org":"Arize AI with Fireworks","authors":"Laurie Voss","published":"2026-07","added":"2026-11-19","kind":"benchmark","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Argues token price is the wrong signal for choosing a model; cost per successful task, counting retries and runs that hit the budget, is the right one. It measures the gap between perfect routing, a simple escalation ladder and blind escalation.","changes":"Puts a ceiling and a floor on the model-choice lever. Perfect routing solves more tasks at a third of the cost of the best single model; careless escalation costs twice as much as any single model.","caveats":"A vendor-partnered study on 40 tasks chosen where models disagree, which flatters routing. The agent is a thin loop with no prompt-cache or long-context effects.","numbers":[{"metric":"Cost per success with hindsight-perfect routing","value":"$0.228, solving 34 of 40","baseline":"$0.636 and 25 of 40 for the best single model","verification":"third-party","setup":"40 tasks, 10 models, 6 trials"},{"metric":"Cost per success with naive escalation through every model","value":"$1.319","baseline":"$0.636 for the best single model","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"complicates","note":"The headroom is real and large, and a bad policy is worse than none."}],"read":"relayed","status":"retired","retired_why":"Nothing on the page cited it, and its headroom for perfect routing is now acknowledged first-hand by a router vendor."},{"id":"2026-06-26-kernelbench-verified","title":"KernelBench-Verified: do LLM-generated kernels actually beat PyTorch?","url":"https://arxiv.org/abs/2607.16241","org":"Meta, Stanford","published":"2026-06-26","added":"2026-11-19","kind":"critique","layers":["kernels"],"mechanism":"frame","venue":"any","gist":"Shows the standard kernel-generation benchmark flatters models twice over. Its baseline runs without Tensor Cores, so merely calling the vendor library looks like a win, and its all-positive random inputs let kernels hardcode shortcuts. With a fair baseline and hidden tests over several input distributions, no model averages above break-even.","changes":"Discounts every result quoted on the original KernelBench, including several signals here. It continues a line that began with Sakana's retracted CUDA-engineer claims in early 2025.","caveats":"Single-turn generation only: no agent loop with feedback was tested, and the authors expect agents to do better. The baseline is eager PyTorch, not a compiled one. Most of the drop comes from fixing the baseline; confirmed hacks were few.","numbers":[{"metric":"Best model under the verified protocol","value":"0.88x, down from 1.43x","baseline":"PyTorch with Tensor Cores enabled","verification":"third-party","setup":"H200"},{"metric":"A ReLU kernel that returned its input when the shape matched the test","value":"reported 374x","baseline":"the benchmark's own scoring","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"A widely used benchmark was rewarding a library call and a shape check."},{"claim":"C1","direction":"challenges","note":"Weakly: single-turn only, so it bounds the models, not the loops."}],"read":"relayed","status":"active"},{"id":"2026-06-22-doubleword-adaptive-speculation","title":"Adaptive speculative decoding: picking draft lengths at runtime","url":"https://blog.doubleword.ai/adaptive-speculation","org":"Doubleword","authors":"Fergus Finn","published":"2026-06-22","added":"2026-11-19","kind":"blog","layers":["serving","model"],"mechanism":"online","venue":"any","gist":"A provider's simulation study. A policy re-chooses the draft length at every scheduler step from the live batch size, an estimate of how many guesses are accepted, and a cost model of the engine. Acceptance was measured on a real model; throughput and latency come from an open-source simulator of a vLLM-shaped engine. The policy matches the best fixed draft length chosen in hindsight at every load.","changes":"At a steady load, adaptive speculation only ties a well-chosen fixed setting; its value is never being badly wrong when the load moves. The simulator is a second kind of measuring rig, pricing an idea before it is built. C4 named that as what would weaken it. Nobody has checked it against a real engine.","caveats":"Only acceptance is measured. Engine and chip costs are modelled, and the simulator's notes call its figures upper bounds for a perfect engine. One model, one workload, decode only. No speed-up of adaptive over fixed is given. The author expects it to be hard to build. The remark that coding agents are poor at finding engine settings is asserted, not shown.","numbers":[{"metric":"Priced policy against the best fixed draft length","value":"matches it at every concurrency from 1 to 2,048","baseline":"the best fixed length for each concurrency, chosen in hindsight","verification":"self-reported","setup":"Simulated: Qwen3.6-35B-A3B on one B200, decode only"},{"metric":"Cost of not speculating at batch 128","value":"per-token latency 4x or more worse at the same throughput","baseline":"the priced policy; at batch 4 not speculating is close to best","verification":"self-reported","setup":"Simulated, same model and chip"},{"metric":"Tokens committed per round, block drafter against the model's own head","value":"about 3.4 against 3.0","baseline":"the same prompts at temperature 0.6","verification":"self-reported","setup":"Measured on rented GPUs, SPEED-Bench qualitative split, half a million rounds each"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best draft length moves with the batch size, and which of two drafters is cheaper to run flips with it."},{"claim":"C4","direction":"complicates","note":"A simulator is the cheap oracle this claim says would weaken it, but only acceptance is measured and it has not been compared with a real engine."}],"also":[{"label":"The simulator (MIT licence)","url":"https://github.com/doublewordai/inference-lab"},{"label":"Simulator in the browser","url":"https://inference-lab.doubleword.ai/"},{"label":"Acceptance data","url":"https://huggingface.co/datasets/Doubleword/qwen3.6-specdec-calibration"}],"read":"opened","status":"active"},{"id":"2026-06-18-modular-agent-skills","title":"Modular 26.4: SOTA MoE serving, model bringup via agent skills, Mojo 1.0 beta 2 and more","url":"https://modular.com/blog/modular-26-4-sota-moe-serving-model-bringup-via-agent-skills-mojo-beta-2-and-more","org":"Modular","published":"2026-06-18","added":"2026-11-19","kind":"blog","layers":["compiler","loop","kernels"],"mechanism":"agent","venue":"any","gist":"Published skills let a coding agent port a new model into Modular's engine: inspect the config, scaffold from the nearest existing architecture, then chase layer-by-layer divergence against the reference until the outputs match. The kernels underneath stay human-written. Qualcomm acquired the company weeks later.","changes":"Agents doing day-zero model support, which is the churn problem, with a correctness oracle that is easy to state. Also a sign of where independent compiler companies end up: inside a chip vendor.","caveats":"No bring-up times, speed-ups or baselines. One demonstration model. Acquisition terms are undisclosed.","numbers":[],"bears_on":[{"claim":"C6","direction":"supports","note":"Model bring-up is being handed to agents because there are too many models."},{"claim":"C1","direction":"complicates","note":"This is porting against an exact oracle, not optimisation. The kernels are still written by people."}],"read":"relayed","status":"active"},{"id":"2026-06-17-github-copilot-auto-routing","title":"Getting more from each token: how Copilot improves context handling and model routing","url":"https://github.blog/ai-and-ml/github-copilot/getting-more-from-each-token-how-copilot-improves-context-handling-and-model-routing/","org":"GitHub","published":"2026-06-17","added":"2026-11-19","kind":"blog","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"Copilot's automatic mode combines live model health (availability, load, speed, error rate, cost) with task intent scored by a routing model. It filters to models that clear a quality bar, then picks the best fit. It routes only on the first turn and after the context is compacted, because switching mid-conversation breaks the cached prefix.","changes":"Routing here listens to the load on the models as well as to the task. And it names the safe switch points precisely: session start and compaction, where no cache is lost.","caveats":"Baselines for the savings are not stated and the pool is five unnamed models. Lower plans are being moved to automatic mode as the only choice, which makes routing a capacity tool as much as a quality one.","numbers":[{"metric":"Savings at above-baseline quality","value":"12.9%","baseline":"a fixed mid-tier model, baseline not fully stated","verification":"self-reported"},{"metric":"Savings in the aggressive setting","value":"72.5%","baseline":"not stated","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"supports","note":"Another large harness routing between models by default, at cache boundaries only."},{"claim":"C2","direction":"supports","note":"The route depends on live load on each model, not only on the request."}],"read":"relayed","status":"superseded","superseded_by":"2026-10-28-github-copilot-fusion","retired_why":"GitHub replaced this router in October with one that decides for every prompt, so its account of routing only at cache boundaries no longer describes the product."},{"id":"2026-06-08-economics-of-speculative-decoding","title":"The economics of speculative decoding","url":"https://fergusfinn.com/blog/economics-of-speculative-decoding/","org":"Fergus Finn","authors":"Fergus Finn","published":"2026-06-08","added":"2026-11-19","kind":"blog","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"Works out from model shapes what a guessed token costs to check on newer architectures. On a mixture-of-experts model a small batch shares almost no experts, so each guess pays nearly full price until about 43 tokens are in the batch. Compressed attention removes the spare capacity that made guesses free. The result is a range of small batches where the best draft length is zero.","changes":"Lever 4 depends on the model's architecture, and so on lever 1 and lever 6, in a second way. The measured tables show speculation fading as batches fill. This analysis says that on mixture-of-experts models it can start near zero and improve with load. A provider serving many models needs the slope per model.","caveats":"Computed from published model shapes and one chip's data sheet; nothing is measured. It assumes experts are used evenly and the model sits on one GPU. The author says the effect is overstated for large deployments that spread experts across machines, which swap it for a communication cost. One model family. A separate paper reports the same expert effect and up to 14% from working around it.","numbers":[{"metric":"Batch size at which every expert is already loaded","value":"about 43 tokens","baseline":"a dense layer shares its weights from the second token","verification":"self-reported","setup":"Computed for DeepSeek-V4-Flash, 6 of 256 experts per token; not measured"},{"metric":"Guessed tokens that compressed attention can check for free","value":"none; the limit is 1.16 tokens per step","baseline":"ordinary attention has room for any practical draft length","verification":"self-reported","setup":"Computed for one B200; not measured"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Whether speculation pays, and at what batch size, is set by the model's architecture as well as by the traffic."},{"claim":"C6","direction":"supports","note":"Expert routing and compressed attention each overturned a tuning rule that held for dense models."}],"also":[{"label":"XShare, a paper on the same expert effect","url":"https://arxiv.org/abs/2602.07265"}],"read":"opened","status":"active"},{"id":"2026-06-apple-core-ai","title":"Dive into Core AI model authoring and optimization (WWDC26 session 325)","url":"https://developer.apple.com/videos/play/wwdc2026/325","org":"Apple","published":"2026-06","added":"2026-11-19","kind":"talk","layers":["compiler","kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"Apple's successor to Core ML. A model is converted to an asset that is specialised to the exact hardware and OS on first load, then cached. Developers can embed hand-written Metal kernels paired with reference functions, and Apple ships skills for coding assistants alongside.","changes":"Fitting a model to the exact device becomes a platform default. The fitting is done by a vendor compiler; the kernels are still written by people.","caveats":"Apple silicon only and opaque. No LLM tokens-per-second figures and no comparison with MLX or llama.cpp. The date is the conference month; the session page itself is undated.","numbers":[],"bears_on":[{"claim":"C2","direction":"supports","note":"A platform now specialises each model to the exact hardware and OS on first load."}],"read":"relayed","status":"retired","retired_why":"Retired on 23 Nov to stay under eighty active signals. A vendor compiler fitting a model to one phone or laptop says nothing about fitting the stack to the load, and C2 has over thirty other supporting signals."},{"id":"2026-05-22-training-free-looped-transformers","title":"Training-Free Looped Transformers","url":"https://arxiv.org/abs/2605.23872","org":"University of Texas at Austin","authors":"Lizhang Chen, Jonathan Li, Chen Liang, Ni Lao, Qiang Liu","published":"2026-05-22","added":"2026-11-22","kind":"paper","layers":["model"],"mechanism":"hand","venue":"any","gist":"Re-runs a block of four layers in the middle of a released model at inference time, with no training. Plain repetition breaks the model, so each pass takes a damped fraction of the step the block was trained to make. Mixture-of-experts models loop one layer at a time so their expert choices stay fixed. The cache keeps one entry per layer, as in the original model.","changes":"Shows depth can be a setting on a model already in service. More passes give more compute per token with the same weights and the same cache size, which opens lever 7. The gains are a point or two, and finding the block took a search per model and benchmark.","caveats":"The abstract says there was no per-cell tuning, but an appendix describes a per-cell search over about 720 settings. Only the 30B check was fixed in advance, and it gained at most 1.1 points in a table that leaves out cells where both settings lost. No intervals. Looping every generated token cost 22% more time. The authors' code repository returned 404 on 22 November.","numbers":[{"metric":"MMLU-Pro, Qwen3-4B-Instruct","value":"59.8% (+2.64 points)","baseline":"57.1%, the same model unlooped","verification":"self-reported","setup":"best of a per-cell search; 5-shot chain of thought; H100"},{"metric":"CommonsenseQA, Qwen3-30B-A3B-Instruct","value":"79.9% (+1.14 points)","baseline":"78.7%, unlooped","verification":"self-reported","setup":"setting fixed before scoring"},{"metric":"Time per query, looping every generated token","value":"+21.6%","baseline":"the same model unlooped","verification":"self-reported","setup":"Qwen3-4B, 200 GSM8K questions, three sub-steps over 4 of 36 layers"}],"bears_on":[{"claim":"C11","direction":"complicates","note":"Depth can be added with no training and no growth in the cache, but the gain is a point or two for extra compute on every looped token."}],"also":[{"label":"Full text","url":"https://arxiv.org/html/2605.23872v1"}],"read":"opened","status":"active"},{"id":"2026-05-22-fastkernels","title":"FastKernels: benchmarking GPU kernel generation in production","url":"https://arxiv.org/abs/2605.23215","org":"Snowflake AI Research, CMU, UCSD","published":"2026-05-22","added":"2026-11-19","kind":"benchmark","layers":["kernels","engine","loop"],"mechanism":"frame","venue":"any","gist":"384 kernel tasks taken from 47 real architectures, with baselines set to the kernels that production frameworks actually ship. Each candidate is scored alone and again after being swapped into the full model on the production path. Five agent systems were run for 6,900 agent-hours.","changes":"Puts a number on how much isolated kernel results overstate. This is the discount to apply to every kernel speed-up quoted elsewhere on this site.","caveats":"One GPU type. Equivalence was checked with a few forward passes, not task accuracy. No public leaderboard yet.","numbers":[{"metric":"Kernel-level speed-up once swapped into the full model","value":"1.6 to 6.6x shrinks to 0.96 to 1.25x","baseline":"kernels shipped by production frameworks","verification":"third-party","setup":"B200"},{"metric":"Winning kernel sets that ran correctly unmodified","value":"22 of 110 (20%)","baseline":"all winning sets","verification":"third-party"},{"metric":"LLM serving end to end","value":"within about 6% either way","baseline":"production kernels","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Isolated scores even mis-ranked the agents: the one that looked equal alone was three times better end to end."},{"claim":"C1","direction":"challenges","note":"For LLM serving specifically, agents landed at parity with what already ships."}],"read":"relayed","status":"active"},{"id":"2026-05-20-inferencebench","title":"InferenceBench: open-ended LLM inference optimization by AI agents","url":"https://arxiv.org/abs/2607.20468","org":"ELLIS Institute Tübingen, MPI-IS","authors":"Jehyeok Yeon, Ben Rank, Maksym Andriushchenko","published":"2026-05-20","added":"2026-11-19","kind":"benchmark","layers":["loop","engine","serving"],"mechanism":"frame","venue":"any","gist":"An independent benchmark: an agent gets one H100, a target model and two hours to stand up the fastest server it can. Agents beat naive PyTorch easily and often beat default vLLM, but a plain hyperparameter search with the same budget beat every agent. Nearly all runs shipped vLLM, and the median run tried a single non-default configuration.","changes":"The strongest counterweight to the autumn announcements. It locates the agents' weakness in systematic experimentation, not knowledge, which is exactly the part the vendors' harnesses supply.","caveats":"A small model, one GPU, two hours and ordinary requests. It measures configuration search, not kernel or engine rewriting, and it predates the systems it gets used to argue against. The newest leaderboard entries narrow the gap but have no matched-budget search beside them.","numbers":[{"metric":"Best agent","value":"8.08x","baseline":"naive PyTorch; default vLLM scores 4.05x","verification":"third-party","setup":"Mistral-7B, one H100, two hours"},{"metric":"Budget-matched hyperparameter search","value":"11.53x","baseline":"naive PyTorch","verification":"third-party"},{"metric":"Runs flagged for subverting the measurement","value":"6.1% of 180","baseline":"integrity judge plus manual audit","verification":"third-party"},{"metric":"Leaderboard top agent, November 2026","value":"12.08x","baseline":"14.30x for the best non-agent search composite","verification":"third-party"}],"bears_on":[{"claim":"C1","direction":"challenges","note":"On configuration, plain search still wins, and giving agents four or eight hours did not reliably help."},{"claim":"C4","direction":"supports","note":"One in sixteen runs gamed the measurement, including one reporting 118 million tokens per second."},{"claim":"C5","direction":"challenges","note":"More time did not produce more gain. No sign of compounding inside a run."}],"also":[{"label":"Leaderboard","url":"https://inferencebench.ai/"}],"read":"opened","status":"active"},{"id":"2026-05-17-offline-llm-energy-use","title":"Offline LLM energy use","url":"https://williamangel.net/blog/2026/05/17/offline-llm-energy-use.html","org":"William Angel","published":"2026-05-17","added":"2026-11-19","kind":"blog","layers":["hardware"],"mechanism":"frame","venue":"local","gist":"A measured cost-per-token analysis of running a model on a high-end laptop against buying the same model through an API aggregator.","changes":"Puts local at parity in the best case and about ten times dearer in the worst, with the hardware's depreciation, not electricity, as the dominant cost.","caveats":"One machine and one author's assumptions about depreciation and utilisation. The title is taken from the URL; check the page for its exact wording.","numbers":[{"metric":"Cost per million tokens on an M5 Max","value":"$0.40 to $4.79","baseline":"$0.38 to $0.50 for the same model via OpenRouter","verification":"self-reported"}],"bears_on":[{"claim":"C8","direction":"challenges","note":"Owned hardware is at best cost-neutral per token before any loop is run on it."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-05-14-twinrouterbench","title":"TwinRouterBench: fast static and live dynamic evaluation for realistic agentic LLM routing","url":"https://arxiv.org/abs/2605.18859","org":"Pei Yang and 17 others","published":"2026-05-14","added":"2026-11-19","kind":"paper","layers":["routing"],"mechanism":"frame","venue":"any","gist":"A router benchmark that scores routing at each step of an agent's work against an always-top-tier baseline, with prompt caching priced in, and then validates live with real spend. The pool mixes closed and open models.","changes":"The one independent result where routing pays with caching counted, and it shows what kind: a trained step-level router halves cost at equal quality, while a rule-based one costs three times as much as not routing.","caveats":"The 100 live cases are not a random sample, and the models are a generation old. The result depends on a fixed pool and one price snapshot.","numbers":[{"metric":"API cost for a trained step-level router at equal tasks resolved","value":"$25.66 against $54.73 (53% lower)","baseline":"the top-tier model unrouted","verification":"third-party","setup":"100 live cases"},{"metric":"API cost for a rule-based router","value":"$172.56, about three times higher","baseline":"the top-tier model unrouted","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"supports","note":"With caching priced in, a trained router still halved cost at equal quality."},{"claim":"C9","direction":"complicates","note":"A naive router was three times worse than no router. The gain is in the training, not the idea."}],"read":"relayed","status":"active"},{"id":"2026-05-08-ronacher-local-focus-and-polish","title":"Pushing local models with focus and polish","url":"https://lucumr.pocoo.org/2026/5/8/local-models/","org":"Armin Ronacher","published":"2026-05-08","added":"2026-11-19","kind":"essay","layers":["engine"],"mechanism":"frame","venue":"local","gist":"Argues the local gap is polish, not model quality: users must pick engine, quantisation, template and context size, and any choice can silently degrade the model. Proposes one model, one serving path and one harness on one hardware configuration, pointing to a narrow single-model engine built with heavy help from coding agents.","changes":"Specialisation as the local strategy: not a general runtime tuned per device, but a narrow engine per model. It is the same move the datacenter is making, arrived at from the usability side.","caveats":"Advocacy without measurements. He concedes the hardware it needs is expensive and scarce.","numbers":[],"bears_on":[{"claim":"C8","direction":"supports","note":"Weakly: a narrow, agent-built engine per model is a plausible local form of the same idea. No numbers yet."}],"also":[{"label":"ds4, the single-model engine","url":"https://github.com/antirez/ds4"}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-05-07-vibeserve","title":"VibeServe: can AI agents build bespoke LLM serving systems?","url":"https://arxiv.org/abs/2605.06068","org":"University of Washington","published":"2026-05-07","added":"2026-11-19","kind":"paper","layers":["loop","engine","serving","model"],"mechanism":"agent","venue":"any","gist":"A planner with long-term memory and an issue tracker drives an inner loop of implementer, accuracy judge and performance evaluator to build a whole serving stack for one model, one chip and one workload.","changes":"A direct test of bespoke-per-workload: parity with general engines in the standard case, large wins only where the scenario is unusual. That is about where the value of specialisation should be expected to sit.","caveats":"In the standard setting the result is a tie after 25 hours. The biggest win is against a baseline the authors had to patch to run. Single node, and it relies on a correctness checker the user supplies.","numbers":[{"metric":"Standard setting","value":"matches vLLM, about 5% over SGLang","baseline":"tuned general engines","verification":"self-reported","setup":"Llama-3.1-8B, H100, 60 rounds"},{"metric":"A 397B MoE on AMD accelerators","value":"2.33x goodput","baseline":"SGLang, patched by the authors to run","verification":"self-reported","setup":"4x MI300A"},{"metric":"Non-standard scenarios","value":"1.69 to 6.27x","baseline":"general engines","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"complicates","note":"Bespoke only pays where the workload is unusual. In the common case it ties."},{"claim":"C1","direction":"supports","note":"Agents built a whole stack that matches a mature engine."},{"claim":"C5","direction":"supports","note":"Removing the skills library lowered the ceiling. Here accumulated knowledge helped, the opposite of Together's finding."}],"read":"relayed","status":"active"},{"id":"2026-05-07-openai-fine-tuning-wind-down","title":"OpenAI API deprecations: self-serve fine-tuning","url":"https://developers.openai.com/api/docs/deprecations","org":"OpenAI","published":"2026-05-07","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"frame","venue":"cluster","gist":"OpenAI is closing self-serve fine-tuning in stages: to new organisations in May 2026, to inactive ones in July, and to everyone in January 2027. Tuned models keep serving only until their base model is retired.","changes":"The largest counter-signal for the model lever. A frontier lab is withdrawing tuning, reportedly because prompting has become cheaper and faster, and every tune there dies with its base model.","caveats":"This concerns tuning closed models, not open weights. The stated reason is second-hand, from a company that sells alternatives. Two cloud providers moved the other way and added reinforcement fine-tuning this year, without customer numbers. The date is that of the notice; the page itself is undated.","numbers":[],"bears_on":[{"claim":"C10","direction":"challenges","note":"A frontier lab is ending self-serve tuning, and tuned models retire with their base."}],"read":"relayed","status":"active"},{"id":"2026-04-22-applied-compute-agentic-benchmark","title":"An inference benchmark for agentic workloads","url":"https://www.appliedcompute.com/research/inference-benchmark","org":"Applied Compute","published":"2026-04-22","added":"2026-11-19","kind":"benchmark","layers":["loop","serving"],"mechanism":"frame","venue":"any","gist":"A small open harness that replays agent sessions described only by their shape: turns, prompt and output lengths, tool waits. A session holds a concurrency slot through its tool waits, as real agents do. On their traces the two main open engines performed about the same.","changes":"A second public replay harness besides AgentX, and a measured warning about shortcuts: replaying one averaged trace instead of the real spread overstates throughput.","caveats":"Prompts are random per trace, so prefixes shared across sessions are not modelled and cache hits read low. No capture tool and no recorded arrival times. The title here is descriptive; check the page for its own.","numbers":[{"metric":"Throughput overstated by replaying a mean trace","value":"10 to 20%","baseline":"replaying the real distribution of sessions","verification":"third-party"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Averaging the workload before replaying it gives an answer 10 to 20% too good."}],"also":[{"label":"trie, the harness","url":"https://github.com/Applied-Compute/trie"}],"read":"relayed","status":"active"},{"id":"2026-04-02-meta-kernelevolve","title":"KernelEvolve: how Meta's ranking engineer agent optimizes AI infrastructure","url":"https://engineering.fb.com/2026/04/02/developer-tools/kernelevolve-how-metas-ranking-engineer-agent-optimizes-ai-infrastructure/","org":"Meta","published":"2026-04-02","added":"2026-11-19","kind":"blog","layers":["loop","kernels","compiler","hardware"],"mechanism":"agent","venue":"onprem","gist":"Kernel generation as tree search over candidates in six kernel languages across NVIDIA, AMD and Meta's own chips, fed by retrieval over hardware documentation and profiler diagnostics. Search trajectories are reused to train smaller specialist models, with measured kernel speed as the reward.","changes":"Evidence that the loop works at scale on an operator's own mixed fleet, and a concrete flywheel: the search trains the next searcher. It is ads ranking, not LLM serving.","caveats":"Unverifiable from outside. No search budget, cost or failures given. Its perfect KernelBench score uses the protocol shown to be inflated. Engineers still choose the operator, the chip and the goal.","numbers":[{"metric":"Inference throughput, an ads model on NVIDIA GPUs","value":"over 60% higher","baseline":"a baseline already using torch.compile and vendor libraries","verification":"self-reported"},{"metric":"Training throughput on Meta's own chip","value":"over 25% higher","baseline":"before","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"In production on a ranking workload, against an already-compiled baseline."},{"claim":"C5","direction":"supports","note":"Trajectories train specialist models. That is a real feedback path from search to searcher."},{"claim":"C6","direction":"supports","note":"Three chip families, one of them in-house silicon with no outside ecosystem."}],"also":[{"label":"Paper","url":"https://arxiv.org/abs/2512.23236"}],"read":"relayed","status":"active"},{"id":"2026-03-31-together-aurora","title":"Aurora","url":"https://www.together.ai/blog/aurora","org":"Together AI","published":"2026-03-31","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"online","venue":"cluster","gist":"The serving engine streams accepted and rejected draft tokens to a buffer; a separate training server keeps updating a copy of the drafter and hot-swaps it into serving. The drafter follows the traffic and changes to the target model with no offline pipeline. Its production version is called ATLAS-2.","changes":"A lever that re-tunes itself from live traffic with no agent involved: classical online learning inside the decoding path. It also puts a number on drift, about ten thousand requests to recover after traffic changes abruptly.","caveats":"The traffic shift is simulated and the evaluation sets are small. The cost of running the training server is not given. The gain shrinks with batch size, as with every drafter.","numbers":[{"metric":"Speed-up from an online-trained drafter","value":"about 1.25x","baseline":"a well-trained static drafter","verification":"self-reported","setup":"simulated stream over five domains"},{"metric":"Speed-up as batch size grows","value":"1.92x at batch 1 to 1.57x at batch 32","baseline":"no speculation","verification":"self-reported","setup":"Qwen3-Coder-Next"}],"bears_on":[{"claim":"C2","direction":"supports","note":"A drafter trained once goes stale as traffic moves; one that keeps learning stays about a quarter faster."},{"claim":"C1","direction":"complicates","note":"This lever adapts by online learning, with no agent writing code."}],"also":[{"label":"ATLAS-2 announcement","url":"https://www.together.ai/blog/ai-native-conf-research-and-product-announcements"}],"read":"relayed","status":"active"},{"id":"2026-03-30-ollama-mlx","title":"Ollama is now powered by MLX on Apple silicon","url":"https://ollama.com/blog/mlx","org":"Ollama","published":"2026-03-30","added":"2026-11-19","kind":"blog","layers":["engine","kernels","model","serving"],"mechanism":"hand","venue":"local","gist":"The most-used local runner swapped its Apple-silicon backend to MLX, added a 4-bit weight format from NVIDIA, and reworked its prompt cache to be reused across conversations and to keep shared prefixes. A June follow-up fuses operations into single Metal kernels and moves sampling to the GPU.","changes":"Local stacks are getting the same class of work as datacenter engines (kernel fusion, cache retention policy), about a year behind and done by hand.","caveats":"The comparison changes engine and quantisation at once and does not name the chip. Needs more than 32 GB of memory. A competitor found its draft model barely drafting on some models.","numbers":[{"metric":"Decode","value":"58 to 112 tok/s","baseline":"Ollama 0.18 with a different quantisation","verification":"self-reported","setup":"Qwen3.5-35B, chip not named"}],"bears_on":[{"claim":"C8","direction":"complicates","note":"Serious optimisation is reaching local runtimes. People are doing it, by hand, for everyone at once."}],"also":[{"label":"June follow-up","url":"https://ollama.com/blog/mlx-performance"}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2026-03-30-kernel-smith","title":"Kernel-Smith: a unified recipe for evolutionary kernel optimization","url":"https://arxiv.org/abs/2603.28342","org":"Shanghai AI Laboratory, Fudan University, MetaX","published":"2026-03-30","added":"2026-11-19","kind":"paper","layers":["kernels","loop"],"mechanism":"agent","venue":"any","gist":"An evolutionary agent keeps a population of runnable kernel candidates with compile, correctness and speed feedback, and recycles its search trajectories into training data for a specialised model. Targets NVIDIA and a Chinese GPU vendor.","changes":"Its kernels were merged into production engines, and its own numbers show the dilution: a kernel 4.78x faster alone was worth about 1% end to end.","caveats":"The merged pull requests have not been checked. Evaluated on the benchmark protocol later shown to be inflated. Data on request only.","numbers":[{"metric":"A kernel merged into SGLang","value":"4.78x alone; -0.35% to +1.75% end to end","baseline":"the existing kernel","verification":"self-reported"},{"metric":"A kernel merged into LMDeploy","value":"1.36x alone; 1.85 to 3.0% throughput","baseline":"the existing kernel","verification":"self-reported"}],"bears_on":[{"claim":"C4","direction":"supports","note":"The authors' own end-to-end numbers are two orders smaller than their kernel numbers."},{"claim":"C5","direction":"supports","note":"Search trajectories become training data for the next model."},{"claim":"C1","direction":"complicates","note":"The code landed in real engines. The effect was about one percent."}],"read":"relayed","status":"active"},{"id":"2026-03-19-speed-bench","title":"SPEED-Bench: a unified and diverse benchmark for speculative decoding","url":"https://huggingface.co/blog/nvidia/speed-bench","org":"NVIDIA","published":"2026-03-19","added":"2026-11-19","kind":"benchmark","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"880 prompts across 11 kinds of content measure how many draft tokens are accepted, and a separate split measures throughput at long inputs and high concurrency inside production engines. Its argument is that acceptance is a property of the workload, not of the drafter.","changes":"A way to measure the decoding lever on your own mix of domains before building anything. It also quantifies a rig error: load tests on random tokens overstate throughput by about a quarter.","caveats":"Published by a company that ships its own drafters. The blog gives figures, not tables, for speed-up against concurrency.","numbers":[{"metric":"Accepted length, coding against roleplay","value":"2.46 against 1.87","baseline":"the same drafter and model","verification":"third-party","setup":"batch 32, draft length 3"},{"metric":"Mean speed-up at batch 32","value":"1.20 to 1.34x; 0.88x for n-gram drafting","baseline":"no speculation","verification":"third-party"},{"metric":"Throughput overstated by random-token load tests","value":"about 23%","baseline":"realistic prompts","verification":"third-party"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Acceptance follows the content: code and maths speculate well, chat and roleplay do not."},{"claim":"C4","direction":"supports","note":"A load test on random tokens is a quarter too optimistic."}],"read":"relayed","status":"active"},{"id":"2026-03-13-llmd-predicted-latency","title":"Predicted-latency based scheduling for LLMs","url":"https://llm-d.ai/blog/predicted-latency-based-scheduling-for-llms","org":"llm-d (Google authors)","published":"2026-03-13","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"online","venue":"any","gist":"A small gradient-boosted model, retrained continuously on live traffic, predicts time to first token and per-token time for each candidate server and routes accordingly, replacing hand-set weights.","changes":"A working example of the stack learning its own deployment online with no LLM involved. Classical online learning already does workload-aware at the per-request timescale.","caveats":"The headline is against round-robin; against the best hand heuristic the gain is about a third. One of five scenarios showed no advantage. Assumes identical servers.","numbers":[{"metric":"Median end-to-end latency","value":"9.06 s vs 13.42 s","baseline":"the best hand-tuned heuristic (round-robin: 15.98 s)","verification":"self-reported","setup":"Qwen3-480B, H200"},{"metric":"Median TTFT","value":"0.97 s vs 3.38 s","baseline":"the best hand-tuned heuristic","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"A model retrained on the deployment's own traffic beat fixed weights."},{"claim":"C1","direction":"complicates","note":"A learned controller did this, not a coding agent."}],"read":"relayed","status":"retired","retired_why":"Its point, that a controller trained on the deployment's own traffic beats fixed weights with no agent involved, is carried by the speculation and cluster-split signals. Read second-hand and cited by one list."},{"id":"2025-12-31-speculative-decoding-performance-or-illusion","title":"Speculative decoding: performance or illusion?","url":"https://arxiv.org/abs/2601.11580","org":"UC Berkeley","published":"2025-12-31","added":"2026-11-19","kind":"paper","layers":["model","engine"],"mechanism":"frame","venue":"any","gist":"An independent study of speculative decoding variants inside a production engine, across workloads and batch sizes. Gains shrink as load rises and some variants fall below break-even; which method wins depends on the dataset.","changes":"Cuts both ways. Fixed speculation is fragile under real load, which undercuts single-stream headline numbers. But an oracle choosing the method per token position does far better than any fixed choice, which is measured headroom for adaptivity.","caveats":"The adaptive result assumes a perfect oracle. No practical predictor was built.","numbers":[{"metric":"One speculation method's speed-up as load rises","value":"1.73x at batch 1 falls to 1.21x at batch 128","baseline":"no speculation","verification":"third-party","setup":"Llama 3.1 8B in vLLM"},{"metric":"An oracle choosing the method per position","value":"up to 2.2x","baseline":"the best fixed method","verification":"third-party"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The winning method changes with the dataset, the request and even the token position."}],"read":"relayed","status":"active"},{"id":"2025-12-27-nightjar","title":"Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving","url":"https://arxiv.org/abs/2512.22420","org":"Rui Li and co-authors","authors":"Rui Li, Zhaoning Zhang, Libo Zhang, Huaimin Wang, Xiang Fu, Zhiquan Lai","published":"2025-12-27","added":"2026-11-19","kind":"paper","layers":["serving","model"],"mechanism":"online","venue":"any","gist":"An extension to vLLM in which a planner learns by trial which draft length works at each batch size and turns speculation off when it stops paying. While it is off, the draft model can be moved out of GPU memory to make room for a larger cache and batch. First posted in December 2025; the fifth version is dated June 2026.","changes":"Adapting the draft length to batch size bought up to about 15% more throughput than fixed speculation, measured. That is far below the 2.2x an oracle reaches, and below the 51% a lab reported when it changed the drafter too. The plain version of this idea is worth tens of percent at most.","caveats":"The authors' own figures, on dense models of 7 to 32 billion parameters and single small GPUs, so nothing here speaks to mixture-of-experts models or provider-scale batches. The baseline is a draft length fixed at 3, not one tuned for each load. The abstract's latency figure could not be traced to a table. No code is linked.","numbers":[{"metric":"Throughput under changing request rates","value":"8% higher on average, up to 14.76%","baseline":"speculative decoding with the draft length fixed at 3","verification":"self-reported","setup":"vLLM; 7B and 13B models on one RTX 4090 or one A100"},{"metric":"Fixed-length speculation as load rises","value":"15.5% faster at 15 requests a second, up to 30% slower at high load","baseline":"no speculation","verification":"self-reported","setup":"7B model on one RTX 4090, ShareGPT prompts"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best draft length changes with batch size by enough that a fixed one gives up 8 to 15%, and loses to no speculation at high load."}],"read":"opened","status":"active"},{"id":"2025-11-11-think-at-hard","title":"Think-at-Hard: Dynamic Looped Transformers for Improved Reasoning","url":"https://arxiv.org/abs/2511.08577","org":"Tsinghua University, Infinigence AI, Shanghai Jiao Tong University","authors":"Tianyu Fu, Yichen You, Zekai Chen, Guohao Dai, Huazhong Yang, Yu Wang","published":"2025-11-11","added":"2026-11-22","kind":"paper","layers":["model"],"mechanism":"online","venue":"any","gist":"Fine-tunes Qwen3 base models of 0.6B and 1.7B into looped models that run a second pass only on tokens a small learned decider flags as likely wrong, with LoRA adapters active on the extra pass. The authors find most tokens are already right after one pass, and that looping every token sometimes turns right answers wrong.","changes":"The clearest case for depth chosen per token, which is lever 7's question. Skipping the extra pass on 93% of tokens beat looping every token by about 4 points and a single pass by 3 to 3.8, for 4 to 5% more compute and memory traffic per token.","caveats":"Self-reported, on small models fine-tuned on 100,000 reasoning samples, against baselines trained on the same data. Each model needs its own decider and adapters. Timing is from one A800 in the authors' own implementation. No serving engine runs it yet.","numbers":[{"metric":"Average over nine reasoning benchmarks, Qwen3-1.7B","value":"+3.8 points","baseline":"a single-pass model fine-tuned on the same data","verification":"self-reported","setup":"1.07 passes per token on average"},{"metric":"Same, against looping every token","value":"+3.8 to 4.4 points","baseline":"an always-loop model trained on the same data","verification":"self-reported","setup":"93% of tokens skip the extra pass"},{"metric":"Compute and memory traffic per token","value":"+4 to 5%","baseline":"a single pass","verification":"self-reported","setup":"looping every token costs 2.08 to 2.18x"}],"bears_on":[{"claim":"C11","direction":"complicates","note":"Looping only the hard tokens adds about 5% traffic and still gains, which softens the time cost the claim rests on."}],"also":[{"label":"Code","url":"https://github.com/thu-nics/TaH"}],"read":"opened","status":"active"},{"id":"2025-11-11-intelligence-per-watt","title":"Intelligence per watt: measuring intelligence efficiency of local AI","url":"https://arxiv.org/abs/2511.07885","org":"Saad-Falcon, Hennessy, Mirhoseini, Ré et al.","published":"2025-11-11","added":"2026-11-19","kind":"paper","layers":["hardware","routing"],"mechanism":"frame","venue":"local","gist":"Measures task accuracy per unit of power for more than 20 local models on 8 accelerators over a million real single-turn queries, and argues a large and rising share of everyday queries can be answered locally, which favours hybrid routing.","changes":"The quantitative case for local: most queries do not need the frontier. Its own data also show local accelerators doing less per watt than cloud ones on the same model.","caveats":"Single-turn chat and reasoning only. It says nothing about agent workloads with long contexts, which are what the rest of this site is about.","numbers":[{"metric":"Share of queries local models answer correctly","value":"88.7%","baseline":"1M real single-turn queries","verification":"self-reported"},{"metric":"Locally serviceable share over 2023 to 2025","value":"23.2% to 71.3%","baseline":"the same measure two years earlier","verification":"self-reported"},{"metric":"Efficiency of local accelerators on identical models","value":"at least 1.4x worse","baseline":"cloud accelerators","verification":"self-reported"}],"bears_on":[{"claim":"C8","direction":"complicates","note":"Local is good enough for most single-turn queries and less efficient per watt. Agent workloads are untested."}],"read":"relayed","status":"retired","retired_why":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"2025-10-29-ouro-looped-language-models","title":"Scaling Latent Reasoning via Looped Language Models","url":"https://arxiv.org/abs/2510.25741","org":"ByteDance Seed, with UC Santa Cruz, Princeton, Mila and others","authors":"Rui-Jie Zhu, Zixuan Wang, Kai Hua, Tianyu Zhang and 29 others","published":"2025-10-29","added":"2026-11-22","kind":"paper","layers":["model"],"mechanism":"online","venue":"any","gist":"Open looped models, Ouro, pretrained on 7.7 trillion tokens. A 1.4B or 2.6B stack of layers runs four times per token, and a learned gate can stop early on easy tokens. The authors report the 1.4B roughly matching a 4B dense model and the 2.6B beating an 8B on several reasoning benchmarks, with about a third of the weights.","changes":"The strongest case for depth as a lever. When the loop is learned in pretraining, a small model does much of a larger one's job, so weights per unit of quality fall about threefold. Serving pays instead, with four passes per token and a cache for each pass over the prompt.","caveats":"Self-reported, against other labs' base models run through the authors' own pipeline, and Qwen3 saw 36 trillion tokens to Ouro's 7.7. The 1.4B trails Qwen3-4B on MMLU, 67.4 against 73.2. Its model card says vLLM always runs all four passes and ignores the early exit, and it pins an older transformers release.","numbers":[{"metric":"BBH, Ouro 1.4B at four passes","value":"71.0","baseline":"71.0, Qwen3-4B base","verification":"self-reported","setup":"the authors' lm-eval pipeline for every model"},{"metric":"GSM8K, Ouro 1.4B","value":"78.9","baseline":"72.9, Qwen3-4B base","verification":"self-reported","setup":"as above"},{"metric":"MMLU-Pro, Ouro 2.6B","value":"55.7","baseline":"53.7, Qwen3-8B base","verification":"self-reported","setup":"as above"},{"metric":"Decoding cache, last pass only","value":"4x less memory (MATH-500 80.4)","baseline":"a cache per pass (82.4)","verification":"self-reported","setup":"Ouro 1.4B; the prompt still needs all four"}],"bears_on":[{"claim":"C11","direction":"supports","note":"Learned loops buy quality per byte, a third of the weights for similar reasoning scores, at four passes of compute per token."}],"also":[{"label":"Model card","url":"https://huggingface.co/ByteDance/Ouro-2.6B"}],"read":"opened","status":"active"},{"id":"2025-10-10-together-atlas","title":"ATLAS: adaptive-learning speculator system","url":"https://www.together.ai/blog/adaptive-learning-speculator-system-atlas","org":"Together AI","published":"2025-10-10","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"online","venue":"dedicated","gist":"A speculative decoding setup that learns at runtime: a fixed draft model gives a floor, a lightweight one learns from live traffic, and a controller chooses between them and sets how far to look ahead.","changes":"The origin of the learn-from-live-traffic line in production serving, a year before the agent announcements. Its predecessor post gives one of the few like-for-like figures for customer-specific tuning.","caveats":"Batch size 1 on narrow traffic is the best case. Does not say whether learning is isolated per customer. No outside check.","numbers":[{"metric":"Decode, fully adapted","value":"about 500 vs 105 tok/s","baseline":"8-bit baseline without speculation","verification":"self-reported","setup":"DeepSeek-V3.1, 4x B200, batch 1"},{"metric":"A customer-trained speculator (May 2025 post)","value":"1.23 to 1.45x","baseline":"Together's generic speculator","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"supports","note":"Like for like, customer-specific tuning was worth 23 to 45% here."},{"claim":"C2","direction":"supports","note":"A draft model goes stale as traffic drifts; this was built to fix that."}],"read":"relayed","status":"active"},{"id":"nvidia-dynamo-agentic-inference","title":"Full-stack optimizations for agentic inference with Dynamo","url":"https://docs.nvidia.com/dynamo/v1.1.0/blog/agentic-inference","org":"NVIDIA","published":"undated","added":"2026-11-19","kind":"blog","layers":["routing","serving","engine"],"mechanism":"online","venue":"any","gist":"The agent harness passes per-request hints down to the serving stack: priority, expected output length, and a signal to warm a worker while a tool call is in flight. The router places requests using a global index of cached blocks, and eviction can follow priority instead of plain recency.","changes":"A different route to workload awareness: the workload tells the stack about itself, instead of the stack inferring it. If this interface standardises, per-user adaptation needs no private traffic analysis at all.","caveats":"Undated. Hardware unspecified, and several features are described as being built. The cache-hit figures quoted come from a managed API, not from Dynamo.","numbers":[{"metric":"Median TTFT with a custom router that learns by sampling","value":"4x lower","baseline":"Dynamo's default routing","verification":"self-reported"},{"metric":"Median TTFT with priority tagging","value":"up to 63% lower","baseline":"no tagging","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Hints about each request's shape change how it should be scheduled."},{"claim":"C3","direction":"complicates","note":"Per-request hints give per-user adaptation without building anything per customer."}],"read":"relayed","status":"active"}],"figures":[{"id":"kernel-dilution","type":"pairs","title":"A kernel speed-up, before and after honest measurement","takeaway":"Gains of several times shrink to about nothing.","unit":"x","from_label":"as first measured","to_label":"measured properly","reference":1,"reference_label":"no gain","rows":[{"label":"Best agent on FastKernels","from":6.6,"to":1.25,"note":"Kernel alone, then swapped into the full model","signal":"2026-05-22-fastkernels"},{"label":"Kernel-Smith kernel in SGLang","from":4.78,"to":1.02,"note":"Kernel alone, then end to end (upper figure)","signal":"2026-03-30-kernel-smith"},{"label":"SGLang kernel group","from":2.03,"to":1.02,"note":"Kernel group alone, then end to end","signal":"2026-07-02-sglang-agent-assisted-development"},{"label":"Best model on KernelBench","from":1.43,"to":0.88,"note":"Against an easy baseline, then a fair one","signal":"2026-06-26-kernelbench-verified"}],"caption":"Speed-up over the existing kernel. Four separate sources.","claims":["C4","C1"],"featured":true},{"id":"agents-vs-search","type":"bars","title":"Agents against plain search at tuning a server","takeaway":"With the same two hours, a simple parameter search still wins.","unit":"x","groups":[{"id":"agent","name":"Coding agent"},{"id":"search","name":"Plain search"},{"id":"base","name":"Untuned engine"}],"rows":[{"label":"Default vLLM","value":4.05,"group":"base","signal":"2026-05-20-inferencebench"},{"label":"Best agent, May paper","value":8.08,"group":"agent","signal":"2026-05-20-inferencebench"},{"label":"Matched search, May paper","value":11.53,"group":"search","signal":"2026-05-20-inferencebench"},{"label":"Best agent, November board","value":12.08,"group":"agent","signal":"2026-05-20-inferencebench"},{"label":"Best search composite, November","value":14.3,"group":"search","signal":"2026-05-20-inferencebench"}],"caption":"Speed-up over naive PyTorch. One H100, a 7B model, two hours. InferenceBench.","claims":["C1"],"featured":true},{"id":"class-vs-customer","type":"bars","title":"What specialising buys, by how narrow it is","takeaway":"Tuning to a workload class buys multiples. Tuning to one customer has bought tens of percent.","unit":"x","reference":1,"reference_label":"no gain","groups":[{"id":"class","name":"For a workload class"},{"id":"one","name":"For one customer or model"}],"rows":[{"label":"Cache-aware routing, code generation","value":2.9,"group":"class","note":"llm-d, against round-robin","signal":"2026-08-17-llmd-sticky-until-saturated"},{"label":"Decode scheduling for agent traffic","value":2.41,"group":"class","note":"An AgentX-driven fix; first-token time got worse","signal":"2026-08-24-agentx-inferencex-v3"},{"label":"Cap on long prefills in vLLM","value":1.93,"group":"class","note":"Upper end","signal":"2026-09-08-vllm-agentx"},{"label":"Re-splitting as traffic shifts","value":1.28,"group":"class","note":"Evolving Infra, against the best static split","signal":"2026-11-09-evolving-infra"},{"label":"Customer-trained speculator","value":1.45,"group":"one","note":"Together, upper end, against its generic speculator","signal":"2025-10-10-together-atlas"},{"label":"Drafter adapted to own traffic","value":1.34,"group":"one","note":"Decagon, against its production drafter","signal":"2026-10-28-decagon-autoresearch"},{"label":"Draft model tuned on workload traces","value":1.2,"group":"one","note":"Modal, against a generic draft model; whether it used the customer's own traffic is unconfirmed","signal":"2026-09-23-modal-trillion-tokens"},{"label":"Bespoke single-model engine","value":1.06,"group":"one","note":"DeepSeek's own engine over upstream vLLM, at most","signal":"2026-10-23-vllm-matches-deepinfer"}],"caption":"Each bar is a gain over that source's own baseline, and the baselines differ. Read the order of magnitude, not the decimals.","claims":["C3","C2"],"featured":true},{"id":"speculation-under-load","type":"pairs","title":"Speculative decoding, alone and under load","takeaway":"The speed-up shrinks as batches fill, and some drafters fall below break-even.","unit":"x","from_label":"one request at a time","to_label":"32 or more at once","reference":1,"reference_label":"no gain","rows":[{"label":"Newest block drafter, best task","from":3.43,"to":1.45,"note":"DFlash 2, concurrency 1 then 32","signal":"2026-08-18-dflash-2"},{"label":"Rival drafters, best task","from":2.69,"to":1.13,"note":"Built-in MTP head and a community DSpark build; below 1x on four of five tasks at 32","signal":"2026-08-18-dflash-2"},{"label":"Online-trained drafter","from":1.92,"to":1.57,"note":"Together Aurora, batch 1 then 32","signal":"2026-03-31-together-aurora"},{"label":"Older drafter, independent study","from":1.73,"to":1.21,"note":"EAGLE in vLLM, batch 1 then 128","signal":"2025-12-31-speculative-decoding-performance-or-illusion"},{"label":"Mixture-of-experts model, recipe drafter","from":1.86,"to":0.66,"note":"Kimi K3 in vLLM with DSpark, 1 then 32 concurrent; 0.41x at 64. Measured by an outsider","signal":"2026-07-openzeka-kimi-k3-speculation-under-load"}],"caption":"Speed-up over plain decoding. Different models and drafters; read each row as a slope. The one mixture-of-experts row falls below break-even, against a cost model that predicted the opposite slope.","claims":["C2"],"featured":true},{"id":"adaptive-speculation-gain","type":"bars","title":"What making speculation adaptive adds","takeaway":"Over a fixed setting, adapting has bought 8 to 50% in practice. An oracle shows about 2x is there to find.","unit":"x","reference":1,"reference_label":"a fixed setting","groups":[{"id":"measured","name":"Measured on a real engine"},{"id":"bound","name":"Upper bound or simulation"}],"rows":[{"label":"Oracle picking the method per token","value":2.2,"group":"bound","note":"UC Berkeley: an upper bound, against the best fixed method","signal":"2025-12-31-speculative-decoding-performance-or-illusion"},{"label":"Load-aware scheduler with a new drafter","value":1.51,"group":"measured","note":"DSpark at DeepSeek, live traffic, against the previous production drafter","signal":"2026-07-06-dspark"},{"label":"Drafter that keeps training on traffic","value":1.25,"group":"measured","note":"Together Aurora, against a well-trained static drafter","signal":"2026-03-31-together-aurora"},{"label":"Draft length chosen by batch size, best case","value":1.15,"group":"measured","note":"Nightjar in vLLM, against a draft length fixed at 3; 1.08x on average","signal":"2025-12-27-nightjar"},{"label":"Draft length priced each step, steady load","value":1.0,"group":"bound","note":"Doubleword simulation: ties the best fixed length chosen in hindsight","signal":"2026-06-22-doubleword-adaptive-speculation"}],"caption":"Each bar is a gain over that source's own fixed baseline, and the baselines differ. At a steady load an adaptive policy can only tie the best fixed setting; the gain comes when the load moves.","claims":["C2"],"featured":false},{"id":"routing-savings","type":"bars","title":"What choosing the model saves, by who measured it","takeaway":"Vendors claim a third to three-quarters off. Hindsight shows 71% is there; no shipped router has yet beaten the best single model.","unit":"%","groups":[{"id":"vendor","name":"Measured by the vendor"},{"id":"outside","name":"Measured by someone else"},{"id":"ceiling","name":"Upper bound, in hindsight"}],"rows":[{"label":"OpenRouter Auto Code","value":74,"group":"vendor","note":"against Claude Opus 5.5, the dearest model in its pool"  of its speed. Kernels only.","url":"https://arxiv.org/abs/2611.03517","read":"relayed"},{"who":"Meta (PyTorch)","system":"KernelAgent","kind":"Open framework","when":"2026-03-06","means":"agent","stage":"research","gist":"Agents profile, diagnose, fix and benchmark Triton kernels with hardware counters: 1.56x over default compilation on 100 benchmark tasks.","url":"https://pytorch.org/blog/kernelagent-hardware-guided-gpu-kernel-optimization-via-multi-agent-orchestration/","read":"relayed"},{"who":"Gimlet Labs","system":"KForge","kind":"Startup","when":"2026-06-01","means":"agent","stage":"research","gist":"A generation agent and a profiling agent write kernels across chips. End to end it was worth about 2% over a vendor engine on one model.","url":"https://arxiv.org/abs/2606.02963","read":"relayed"},{"who":"Red Hat","system":"LLM-Tuna 2.0","kind":"Open-source vendor","when":"2026-09-25","means":"agent","stage":"claimed","gist":"A conference talk describes an agent that reads vLLM logs, triggers profiling, keeps a knowledge base and tunes configuration. No numbers on the page.","url":"https://pretalx.devconf.info/devconf-us-2026/talk/9SMF9X/","read":"relayed"},{"who":"Alibaba Group","system":"Atrex Kernel Agent","kind":"Hyperscaler","when":"2026-11","means":"agent","stage":"claimed","gist":"An open kernel-agent loop for NVIDIA, AMD and its own chips. Claims up to 1.55x over production baselines on its model's operators.","url":"https://github.com/alibaba/atrex-kernel-agent","read":"relayed"},{"who":"Authors of arXiv 2611.04998","system":"ForgeKernel","kind":"Research group, affiliation not shown","when":"2026-11-03","means":"agent","stage":"research","gist":"An agent wrote kernels 1.10x faster on average than expert references on 29 NVIDIA configurations, and 25% over the public best on a Huawei accelerator.","url":"https://arxiv.org/abs/2611.04998","read":"relayed"},{"who":"Authors of arXiv 2610.36434","system":"JustGoal","kind":"Research group, affiliation not shown","when":"2026-10-27","means":"agent","stage":"research","gist":"An agent given only a goal, no workflow, beat open libraries on 8 of 10 operators on one NVIDIA chip, by 1.14 to 2.34x.","url":"https://arxiv.org/abs/2610.36434","read":"relayed"},{"who":"Authors of arXiv 2609.12379","system":"ForgeMegakernel","kind":"Research group, affiliation not shown","when":"2026-09-11","means":"agent","stage":"research","gist":"Agent-written fused decode paths: 1.21x on average over one open engine.","url":"https://arxiv.org/abs/2609.12379","read":"relayed"},{"who":"Authors of arXiv 2610.36848","system":"Evolving Agent Teams","kind":"Research group, affiliation not shown","when":"2026-10-27","means":"agent","stage":"research","gist":"A team of agents that reorganises itself beat a production attention kernel by 1.2x on average, winning 36 of 47 workloads.","url":"https://arxiv.org/abs/2610.36848","read":"relayed"},{"who":"Authors of arXiv 2608.12629","system":"CAKE","kind":"Research group, affiliation not shown","when":"2026-08-12","means":"agent","stage":"research","gist":"Agent-written attention kernels 2.05x over the official ones for one model; four changes were sent upstream as pull requests.","url":"https://arxiv.org/abs/2608.12629","read":"relayed"},{"who":"Authors of arXiv 2610.31034","system":"CANNBot-CAKE","kind":"Research group, affiliation not shown","when":"2026-10-22","means":"agent","stage":"research","gist":"A kernel agent for Huawei's accelerators: 1.33x on 53 operators against a baseline the abstract does not define.","url":"https://arxiv.org/abs/2610.31034","read":"relayed"},{"who":"Intel Labs","system":"Xe-Forge","kind":"Chip vendor","when":"2026-04-16","means":"agent","stage":"research","gist":"A kernel agent for Intel's graphics cards: 1.17x on average over plain PyTorch.","url":"https://arxiv.org/abs/2605.26118","read":"relayed"},{"who":"Authors of arXiv 2511.15915","system":"AccelOpt","kind":"Research group, affiliation not shown","when":"2025-11-19","updated":"2026-04-15","means":"agent","stage":"research","gist":"A self-improving agent wrote kernels for Amazon's accelerator, raising them from 49% to 61% of peak throughput.","url":"https://arxiv.org/abs/2511.15915","read":"relayed"},{"who":"Intellifusion","system":"Houmao","kind":"Chip vendor","when":"2026-05-25","means":"agent","stage":"research","gist":"An agent's fused mixture-of-experts kernel ran 1.71x over the reference library in a systems-conference kernel contest.","url":"https://arxiv.org/abs/2608.14560","read":"relayed"},{"who":"Authors of arXiv 2611.04331","system":"Warpline","kind":"Research group, affiliation not shown","when":"2026-11-03","updated":"2026-11-17","means":"agent","stage":"research","gist":"A kernel-agent pipeline reached 7.69x on ten benchmark problems, against 6.94x for a bare agent and 6.13x for an earlier agent workflow.","url":"https://arxiv.org/abs/2611.04331","read":"relayed"},{"who":"Authors of arXiv 2603.10085","system":"KernelClaw","kind":"Research group, affiliation not shown","when":"2026-03-10","updated":"2026-10-18","means":"agent","stage":"research","gist":"A kernel agent scoring 6.98x over plain PyTorch on the easiest tier of a kernel benchmark.","url":"https://arxiv.org/abs/2603.10085","read":"relayed"},{"who":"Authors of arXiv 2609.30059","system":"KernelOPT","kind":"Research group, affiliation not shown","when":"2026-09-24","updated":"2026-11-19","means":"agent","stage":"research","gist":"A kernel agent reaching 1.40x over PyTorch's compiler on the easiest benchmark tier, on one NVIDIA chip.","url":"https://arxiv.org/abs/2609.30059","read":"relayed"},{"who":"Authors of arXiv 2608.25124","system":"FABRICA","kind":"Research group, affiliation not shown","when":"2026-08-25","means":"agent","stage":"research","gist":"Agents translate CUDA kernels to a wafer-scale chip's toolchain: 3.47x over the reference on that chip.","url":"https://arxiv.org/abs/2608.25124","read":"relayed"}]},"map":{"_about":"The big picture. Seven l
