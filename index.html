,"to":1.25,"note":"Kernel alone, then swapped into the full model","signal":"2026-05-22-fastkernels"},{"label":"Kernel-Smith kernel in SGLang","from":4.78,"to":1.02,"note":"Kernel alone, then end to end (upper figure)","signal":"2026-03-30-kernel-smith"},{"label":"SGLang kernel group","from":2.03,"to":1.02,"note":"Kernel group alone, then end to end","signal":"2026-07-02-sglang-agent-assisted-development"},{"label":"Best model on KernelBench","from":1.43,"to":0.88,"note":"Against an easy baseline, then a fair one","signal":"2026-06-26-kernelbench-verified"}],"caption":"Speed-up over the existing kernel. Four separate sources.","claims":["C4","C1"],"featured":true},{"id":"agents-vs-search","type":"bars","title":"Agents against plain search at tuning a server","takeaway":"With the same two hours, a simple parameter search still wins.","unit":"x","groups":[{"id":"agent","name":"Coding agent"},{"id":"search","name":"Plain search"},{"id":"base","name":"Untuned engine"}],"rows":[{"label":"Default vLLM","value":4.05,"group":"base","signal":"2026-05-20-inferencebench"},{"label":"Best agent, May paper","value":8.08,"group":"agent","signal":"2026-05-20-inferencebench"},{"label":"Matched search, May paper","value":11.53,"group":"search","signal":"2026-05-20-inferencebench"},{"label":"Best agent, November board","value":12.08,"group":"agent","signal":"2026-05-20-inferencebench"},{"label":"Best search composite, November","value":14.3,"group":"search","signal":"2026-05-20-inferencebench"}],"caption":"Speed-up over naive PyTorch. One H100, a 7B model, two hours. InferenceBench.","claims":["C1"],"featured":true},{"id":"class-vs-customer","type":"bars","title":"What specialising buys, by how narrow it is","takeaway":"Tuning to a workload class buys multiples. Tuning to one customer has bought tens of percent.","unit":"x","reference":1,"reference_label":"no gain","groups":[{"id":"class","name":"For a workload class"},{"id":"one","name":"For one customer or model"}],"rows":[{"label":"Cache-aware routing, code generation","value":2.9,"group":"class","note":"llm-d, against round-robin","signal":"2026-08-17-llmd-sticky-until-saturated"},{"label":"Decode scheduling for agent traffic","value":2.41,"group":"class","note":"An AgentX-driven fix; first-token time got worse","signal":"2026-08-24-agentx-inferencex-v3"},{"label":"Cap on long prefills in vLLM","value":1.93,"group":"class","note":"Upper end","signal":"2026-09-08-vllm-agentx"},{"label":"Re-splitting as traffic shifts","value":1.28,"group":"class","note":"Evolving Infra, against the best static split","signal":"2026-11-09-evolving-infra"},{"label":"Customer-trained speculator","value":1.45,"group":"one","note":"Together, upper end, against its generic speculator","signal":"2025-10-10-together-atlas"},{"label":"Drafter adapted to own traffic","value":1.34,"group":"one","note":"Decagon, against its production drafter","signal":"2026-10-28-decagon-autoresearch"},{"label":"Draft model tuned on workload traces","value":1.2,"group":"one","note":"Modal, against a generic draft model; whether it used the customer's own traffic is unconfirmed","signal":"2026-09-23-modal-trillion-tokens"},{"label":"Bespoke single-model engine","value":1.06,"group":"one","note":"DeepSeek's own engine over upstream vLLM, at most","signal":"2026-10-23-vllm-matches-deepinfer"}],"caption":"Each bar is a gain over that source's own baseline, and the baselines differ. Read the order of magnitude, not the decimals.","claims":["C3","C2"],"featured":true},{"id":"speculation-under-load","type":"pairs","title":"Speculative decoding, alone and under load","takeaway":"The speed-up shrinks as batches fill, and some drafters fall below break-even.","unit":"x","from_label":"one request at a time","to_label":"32 or more at once","reference":1,"reference_label":"no gain","rows":[{"label":"Newest block drafter, best task","from":3.43,"to":1.45,"note":"DFlash 2, concurrency 1 then 32","signal":"2026-08-18-dflash-2"},{"label":"Rival drafters, best task","from":2.69,"to":1.13,"note":"Built-in MTP head and a community DSpark build; below 1x on four of five tasks at 32","signal":"2026-08-18-dflash-2"},{"label":"Online-trained drafter","from":1.92,"to":1.57,"note":"Together Aurora, batch 1 then 32","signal":"2026-03-31-together-aurora"},{"label":"Older drafter, independent study","from":1.73,"to":1.21,"note":"EAGLE in vLLM, batch 1 then 128","signal":"2025-12-31-speculative-decoding-performance-or-illusion"}],"caption":"Speed-up over plain decoding. Different models and drafters; read each row as a slope. A cost model of mixture-of-experts models predicts the opposite slope, and nobody has measured it.","claims":["C2"],"featured":true},{"id":"adaptive-speculation-gain","type":"bars","title":"What making speculation adaptive adds","takeaway":"Over a fixed setting, adapting has bought 8 to 50% in practice. An oracle shows about 2x is there to find.","unit":"x","reference":1,"reference_label":"a fixed setting","groups":[{"id":"measured","name":"Measured on a real engine"},{"id":"bound","name":"Upper bound or simulation"}],"rows":[{"label":"Oracle picking the method per token","value":2.2,"group":"bound","note":"UC Berkeley: an upper bound, against the best fixed method","signal":"2025-12-31-speculative-decoding-performance-or-illusion"},{"label":"Load-aware scheduler with a new drafter","value":1.51,"group":"measured","note":"DSpark at DeepSeek, live traffic, against the previous production drafter","signal":"2026-07-06-dspark"},{"label":"Drafter that keeps training on traffic","value":1.25,"group":"measured","note":"Together Aurora, against a well-trained static drafter","signal":"2026-03-31-together-aurora"},{"label":"Draft length chosen by batch size, best case","value":1.15,"group":"measured","note":"Nightjar in vLLM, against a draft length fixed at 3; 1.08x on average","signal":"2025-12-27-nightjar"},{"label":"Draft length priced each step, steady load","value":1.0,"group":"bound","note":"Doubleword simulation: ties the best fixed length chosen in hindsight","signal":"2026-06-22-doubleword-adaptive-speculation"}],"caption":"Each bar is a gain over that source's own fixed baseline, and the baselines differ. At a steady load an adaptive policy can only tie the best fixed setting; the gain comes when the load moves.","claims":["C2"],"featured":false},{"id":"routing-savings","type":"bars","title":"What choosing the model saves, by who measured it","takeaway":"Vendors report a third to three-fifths off. Outside, a trained router halved cost; no shipped router beat a cheap default.","unit":"%","groups":[{"id":"vendor","name":"Measured by the vendor"},{"id":"outside","name":"Measured by someone else"}],"rows":[{"label":"Cursor Router","value":60,"group":"vendor","note":"at near-frontier user satisfaction","signal":"2026-07-22-cursor-router"},{"label":"Together Link","value":50,"group":"vendor","note":"over half, no baseline method given","signal":"2026-10-05-together-link"},{"label":"Databricks Smart Routing","value":35,"group":"vendor","note":"internal workloads, against the best single model","signal":"2026-08-13-databricks-smart-routing"},{"label":"Fireworks Nexus","value":33,"group":"vendor","note":"cost per merged pull request, preliminary","signal":"2026-07-26-fireworks-nexus"},{"label":"Trained step-level router","value":53,"group":"outside","note":"TwinRouterBench, caching priced in, 100 live cases","signal":"2026-05-14-twinrouterbench"},{"label":"Seven shipped routers","value":0,"group":"outside","note":"AutoBench: none beat always using a cheap strong model","signal":"2026-10-26-autobench-do-routers-route"}],"caption":"Cost reduction at claimed equal quality, each against its own baseline. The baselines differ.","claims":["C9"],"featured":false}],"roster":{"_about":"Who has described an optimisation loop for inference, one line each. An entry needs either a signal (it has been weighed against the thesis) or a url (noted, not yet weighed). 'when' is when it was first described; 'updated' is a later post that matters. recent_from sets what the front page shows before 'show all'. Every sweep checks for teams missing from this list.","recent_from":"2026-10-01","entries":[{"who":"Inferact","system":"Agent V","kind":"Inference provider, maintains vLLM","when":"2026-11","means":"agent","stage":"production","gist":"Agents run 24 to 30 hour hillclimbs on production vLLM. Winners ship and go upstream. A fully self-running loop is the stated goal, not yet built.","signal":"2026-11-inferact-autonomous-inference-system","read":"opened"},{"who":"Together AI","system":"Together Compiler","kind":"Inference provider","when":"2026-11-04","updated":"2026-11-16","means":"agent","stage":"production","gist":"Parallel agents rewrite the engine's forward pass for a given traffic shape, model and chip, and recompile as traffic drifts.","signal":"2026-11-04-together-compiler","read":"opened"},{"who":"Jesse Cai and co-authors","system":"InferenceForge","kind":"Independent research group","when":"2026-11-09","means":"agent","stage":"research","gist":"An off-the-shelf coding agent found three kernel fixes for agent traffic in SGLang and topped the public benchmark with no production traffic.","signal":"2026-11-09-inferenceforge","read":"opened"},{"who":"Shengjun Kris Dong and co-authors","system":"ModelBlaster","kind":"Academic group","when":"2026-11-03","means":"agent","stage":"research","gist":"One agent with a persistent knowledge base writes kernels for a datacenter GPU, a phone GPU and a RISC-V chip.","signal":"2026-11-03-modelblaster","read":"relayed"},{"who":"Decagon","system":"AutoResearch","kind":"Workload owner","when":"2026-10-28","means":"agent","stage":"production","gist":"A customer-service AI company runs the loop on its own endpoints. Sub-agents must make a prediction that could fail before a change is kept.","signal":"2026-10-28-decagon-autoresearch","read":"relayed"},{"who":"Byonggon Chun","system":"NPU kernel loop","kind":"Independent researcher","when":"2026-10-28","means":"agent","stage":"research","gist":"A multi-agent loop taught itself a thinly documented NPU and its Rust DSL, then sped up three decode kernels about ninefold.","signal":"2026-10-28-agent-loop-learns-new-accelerator","read":"opened"},{"who":"vLLM project","system":"Kimi K3 fused decode path","kind":"Open engine","when":"2026-10-16","means":"agent","stage":"upstream","gist":"Agent-written kernels merged for one model on one chip. Proposes that reviewers judge evidence, since patches now outrun reading.","signal":"2026-10-16-vllm-kimi-k3-megakernel","read":"relayed"},{"who":"University of Chicago","system":"SEIS","kind":"Academic group","when":"2026-10-03","means":"agent","stage":"research","gist":"Agents rewrite a whole small engine across chained sessions that inherit their own notes, including the wrong ones.","signal":"2026-10-03-seis-self-evolving-inference","read":"relayed"},{"who":"Baseten","system":"Agent-built custom engine","kind":"Inference provider","when":"2026-10-02","updated":"2026-11-02","means":"agent","stage":"research","gist":"A coding agent with a standing goal built a custom engine for one model in about a week. Not serving production traffic.","signal":"2026-10-02-baseten-agentic-engine","read":"relayed"},{"who":"MIT HAN Lab and others","system":"Evolving Infra","kind":"Academic group","when":"2026-11-09","means":"online","stage":"research","gist":"Not an agent loop. A controller re-splits the cluster as traffic shifts; no code is written. Listed because it sits under the same RSI label.","signal":"2026-11-09-evolving-infra","read":"opened"},{"who":"SGLang team","system":"SOTA performance loop","kind":"Open engine","when":"2026-07-02","updated":"2026-11-17","means":"agent","stage":"upstream","gist":"One agent implements, another reviews, and a profile must explain a gap first. Agents now produce most merged pull requests.","signal":"2026-07-02-sglang-agent-assisted-development","read":"relayed"},{"who":"Z.ai","system":"Infra Agent","kind":"Model lab","when":"2026-09-17","means":"agent","stage":"production","gist":"A GLM-powered agent brought a GLM model to production on domestic accelerators. The authors say it is not yet RSI.","signal":"2026-09-17-zai-glm-built-its-inference","read":"relayed"},{"who":"Unity","system":"FlashVector","kind":"Workload owner","when":"2026-09-15","means":"agent","stage":"production","gist":"An agent tunes the whole serving stack for ads models, from kernels to the model server. Recommenders, not LLMs.","url":"https://arxiv.org/abs/2609.17391","read":"opened"},{"who":"Yang, Jiang, Qu, Cheng","system":"RoofLang","kind":"Academic group","when":"2026-09-11","means":"agent","stage":"research","gist":"A language for describing inference workloads so an agent can search whole architectures, with an evaluator that needs no implementation.","signal":"2026-09-11-rooflang","read":"opened"},{"who":"Asari AI","system":"Self-improving agents","kind":"Startup","when":"2026-07-28","means":"agent","stage":"claimed","gist":"Says its agents beat vLLM by up to 16% on eight GPUs. No code and no outside check.","url":"https://asari.ai/blog/inference-optimization","read":"relayed"},{"who":"Authors of arXiv 2607.12875","system":"MetaInfer","kind":"Academic group","when":"2026-07-14","means":"agent","stage":"research","gist":"An agent ports models to less common accelerators by following a costed map of routes. Baseten's engine run built on it.","url":"https://arxiv.org/abs/2607.12875","read":"relayed"},{"who":"Modular","system":"Agent skills for model bring-up","kind":"Compiler company, now Qualcomm","when":"2026-06-18","means":"agent","stage":"production","gist":"Published skills let a coding agent port a new model into its engine. The kernels underneath stay human-written.","signal":"2026-06-18-modular-agent-skills","read":"relayed"},{"who":"NVIDIA Research and MIT HAN Lab","system":"Kernel Design Agents (KDA)","kind":"Chip vendor with academics","when":"2026-05","means":"agent","stage":"research","gist":"A contract, plan and verify workflow for coding agents on CUDA kernels. Took the top three places in the MLSys kernel contest.","url":"https://github.com/NVlabs/kda","read":"opened"},{"who":"University of Washington","system":"VibeServe","kind":"Academic group","when":"2026-05-07","means":"agent","stage":"research","gist":"Agents build a whole serving stack per model, chip and workload. Ties general engines in the common case, wins in unusual ones.","signal":"2026-05-07-vibeserve","read":"relayed"},{"who":"SkyPilot","system":"Research-driven agents on llama.cpp","kind":"Tooling company","when":"2026-04-09","means":"agent","stage":"research","gist":"An autoresearch loop pointed at llama.cpp. Small CPU gains, nothing upstreamed, and most experiments failed.","url":"https://skypilot.ai/blog/research-driven-agents","read":"relayed"},{"who":"Meta","system":"KernelEvolve","kind":"Hyperscaler","when":"2026-04-02","means":"agent","stage":"production","gist":"Tree search over kernels across NVIDIA, AMD and in-house chips; search traces train the next model. Ads ranking, not LLMs.","signal":"2026-04-02-meta-kernelevolve","read":"relayed"},{"who":"Shanghai AI Laboratory","system":"Kernel-Smith","kind":"Academic group","when":"2026-03-30","means":"agent","stage":"upstream","gist":"An evolutionary kernel agent. Its kernels were merged into two engines and were worth about 1% end to end.","signal":"2026-03-30-kernel-smith","read":"relayed"},{"who":"Chen, Ye, Xu and others","system":"AVO","kind":"Academic and industry group","when":"2026-03-25","means":"agent","stage":"research","gist":"A coding agent replaces the mutation step of evolutionary search. A week of it beat vendor attention kernels by a few percent.","url":"https://arxiv.org/abs/2603.24517","read":"relayed"},{"who":"Stanford","system":"Astra","kind":"Academic group","when":"2025-09-09","means":"agent","stage":"research","gist":"The first multi-agent system for GPU kernel optimisation, starting from SGLang's own kernels: 1.32x on average.","url":"https://arxiv.org/abs/2509.07506","read":"opened"},{"who":"Sakana AI","system":"AI CUDA Engineer","kind":"Startup","when":"2025-02","means":"agent","stage":"retracted","gist":"Claimed 10 to 100x from an agentic CUDA pipeline, then walked it back: the system had been gaming its own evaluation.","url":"https://techcrunch.com/2025/02/21/sakana-walks-back-claims-that-its-ai-can-dramatically-speed-up-model-training/","read":"relayed"}]},"map":{"_about":"The big picture. Six levers that adapt inference to the load, in the order a request meets them, plus the loop that re-tunes them and a build order for the reader's position. Each lever says what it listens to in the load, how often it changes, what it has bought (with a baseline) and how it depends on its neighbours. Update a lever's status only when the evidence changes.","umbrella":"Inference is becoming load-aware. Six parts of the stack that used to be set once now move with the traffic, each listening to a different signal on a different clock. They are tied together by the prompt cache and by the model, so changing one means redoing others. Agent loops are what make that redoing affordable.","levers":[{"id":"model","n":1,"name":"Which model answers","question":"Does this session need a frontier model, or will a cheaper open one do?","adapts":"The model a session is sent to: a small fast open model, a strong open model, or a closed frontier one. Sub-agents can be routed separately.","listens":"How hard the first task of the session looks, live load and price on each model, and whether a cache would be lost by switching.","clock":"request","status":"working","bought":"Vendors report 33 to 60% lower cost at equal quality. Outside tests split: a trained router halved cost with caching priced in; seven shipped routers failed to beat a cheap default.","connects":"Nine-tenths of agent tokens are cached re-reads, and a cache belongs to one model. So the route is fixed per session, or changed only at compaction and sub-agent launch. Every model you route to needs its own drafter and tuned engine.","signals":["2026-08-13-databricks-smart-routing","2026-10-05-together-link","2026-07-22-cursor-router","2026-10-08-openrouter-cache-is-crucial","2026-09-22-openrouter-token-state-of-play","2026-10-26-autobench-do-routers-route","2026-05-14-twinrouterbench"],"claims":["C9"]},{"id":"worker","n":2,"name":"Which machine takes it","question":"Which server already holds this session's context?","adapts":"The server each request lands on, and when a session is allowed to move.","listens":"Where the session's cached context lives, and how many uncached tokens or active streams each server has in flight.","clock":"request","status":"working","bought":"2.9x input throughput on code generation against round-robin, and nothing on a decode-bound workload. The saturation threshold has to be recalibrated per model and chip.","connects":"Sticky routing is what makes the prompt cache pay, and the cache is most of an agent workload's cost. It needs the cache map kept by lever 3, and it can take hints from the agent harness about priority and expected length.","signals":["2026-08-17-llmd-sticky-until-saturated","2026-03-13-llmd-predicted-latency","nvidia-dynamo-agentic-inference","2026-09-08-vllm-agentx","2026-10-08-openrouter-cache-is-crucial"],"claims":["C2"]},{"id":"split","n":3,"name":"How the cluster is divided","question":"How much of the cluster should read prompts, and how much should write answers?","adapts":"The share of machines doing prefill against decode, the size of batches, and which cached contexts are kept or evicted.","listens":"The mix of long prompts and steady generation, and which contexts agents are still waiting to reuse.","clock":"minutes","status":"early","bought":"1.28x over the best fixed split once traffic shifts, in a research system. In vLLM, a cap on long prefills raised tokens per GPU-second by up to 93%, at the cost of first-token time.","connects":"It decides how full batches are, which sets how much speculation (lever 4) is worth and which shapes the kernels (lever 5) see. Evicting the wrong context undoes lever 2.","signals":["2026-11-09-evolving-infra","2026-09-08-vllm-agentx","2026-08-24-agentx-inferencex-v3"],"claims":["C2"]},{"id":"decode","n":4,"name":"How tokens get written","question":"How far ahead can a cheap draft guess before the big model has to check?","adapts":"The draft model, how many tokens it guesses ahead for this request, and whether to speculate at all at the current load. The drafter itself can keep training on live traffic.","listens":"How predictable the output is in this domain (code and maths speculate well, chat does not), how full the batches are right now, and how many recent guesses were accepted.","clock":"request","status":"working","bought":"About 3x for one request, falling to 1 to 1.5x at 32 concurrent. A load-aware scheduler with a new drafter raised live throughput by half. Choosing draft length by batch size alone added up to 15%. A drafter that keeps learning adds 1.25x.","connects":"A drafter fits one model and quantisation: tune or swap the model (levers 1 and 6) and it is rebuilt. Architecture also sets what a guess costs; on mixture-of-experts models, by one analysis, most at small batches. Checking competes with real requests for batch room, so tune with lever 3.","signals":["2026-07-06-dspark","2026-08-18-dflash-2","2026-03-31-together-aurora","2026-03-19-speed-bench","2025-12-31-speculative-decoding-performance-or-illusion","2026-09-23-modal-trillion-tokens","2025-10-10-together-atlas","2025-12-27-nightjar","2026-06-22-doubleword-adaptive-speculation","2026-06-08-economics-of-speculative-decoding"],"claims":["C2","C3"]},{"id":"engine","n":5,"name":"How the engine runs it","question":"What are the fastest kernels and settings for this model, on this chip, under this traffic?","adapts":"The kernels, how operations are fused, the parallelism layout and the engine's settings.","listens":"Batch sizes, sequence lengths, cache-hit rates, and which parts of the model real inputs actually exercise.","clock":"days","status":"working","bought":"43% more throughput under a per-user speed floor against the best published run. Merged agent-written kernels: 1.3 to 1.9x on decode. Kernel gains measured alone mostly vanish end to end.","connects":"This is where agent loops do most of their work today. Every lever above changes the shapes this one sees, so re-tuning any of them can undo it. It is redone for each new model and each new chip.","signals":["2026-11-09-inferenceforge","2026-10-16-vllm-kimi-k3-megakernel","2026-11-04-together-compiler","2026-05-22-fastkernels"],"claims":["C1","C2","C6"]},{"id":"weights","n":6,"name":"What the model is","base":true,"hint":"under every step above: the weights themselves, tuned to a domain","question":"Could a smaller model, trained on this domain, do the job a bigger general one does now?","adapts":"The weights: reinforcement learning or fine-tuning on a customer's tasks and tool formats, distilling a frontier model's outputs into a small one, and how hard they are quantised.","listens":"The domain's tasks and tool-calling format, logged production outputs to learn from, and where the general model fails or is slower than it needs to be.","clock":"release","status":"early","bought":"On narrow jobs: nearly double the pass rate at flat cost for a legal agent, and 0.9 s against 45 s for one summarisation task. On general coding, a newer untuned model beat a tuned one.","connects":"A tuned model lets lever 1 send more sessions down the cheap path. It needs its own drafter (lever 4) and compiled engine (lever 5), and it dies when its base model is withdrawn. Adapters sharing one deployment keep it affordable.","signals":["2026-08-26-harvey-tenet","2026-11-18-datadog-fine-tune-baseten","2026-08-31-fireworks-training-api","2026-10-19-together-post-training","2026-11-02-fireflash-agentic-rl-recipe","2026-11-04-cognition-swe-2-flash","2026-05-07-openai-fine-tuning-wind-down"],"claims":["C10"]}],"loop":{"name":"The loop","hint":"agents and a measuring rig re-tune every lever as the load changes","text":"None of the six levers is new. What changed in 2026 is the cost of re-tuning them. Coding agents, pointed at a rig that replays real traffic and measures end to end, now do in a day what took a performance engineer a month, and can do it again when the model, the chip or the traffic changes.","connects":"Today the loop works mostly on lever 5, a little on levers 3 and 4, and has only begun on 1 and 6 (one company had an agent run its fine-tuning). Its limit is not the agent but the rig: knowing whether a change is real.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-10-28-decagon-autoresearch"]},"build_intro":"Written for a provider serving many models. The order follows where others report the most gain for the least new code. Steps 4 to 7 repeat for every model, so do them for the few that carry most of your traffic and rely on the open engines for the rest. It is drawn from published accounts, not from a system anyone has documented end to end.","build":[{"name":"Record your traffic and learn to replay it","levers":["worker","split","engine"],"do":"Capture real sessions at your gateway with their timing, context lengths and cache behaviour, strip the content, and replay them against a candidate stack at real concurrency. Replayers exist; the capture and redaction side you write yourself.","bought":"Nothing by itself. It is what let an academic group with no customers top the public board, and what one company replays to drive its own loop.","watch":"A mean trace overstates throughput by 10 to 20%, random tokens by about a quarter. Repeated runs reuse the cache and flatter the result.","signals":["2026-08-24-agentx-inferencex-v3","2026-04-22-applied-compute-agentic-benchmark","2026-10-28-decagon-autoresearch","2026-03-19-speed-bench"],"parts":[{"label":"AIPerf trace replay","url":"https://github.com/ai-dynamo/aiperf","note":"NVIDIA. Replays recorded agent sessions with their timing and shared prefixes against any OpenAI-compatible endpoint."},{"label":"AgentX harness","url":"https://github.com/SemiAnalysisAI/agentx-harness","note":"The public benchmark's own replayer, a fork of AIPerf, with 393 coding-agent traces."},{"label":"TraceLab","url":"https://github.com/uw-syfi/TraceLab","note":"University of Washington. Collects and sanitises agent session logs: sizes and timing, no content."},{"label":"trie","url":"https://github.com/Applied-Compute/trie","note":"Applied Compute. Under 1,000 lines; replays sessions by shape and reports cache-hit rates."},{"label":"TensorRT-LLM trace replay","url":"https://nvidia.github.io/TensorRT-LLM/blogs/tech_blog/blog27_Evaluating_Agentic_Serving_with_Trace_Replay_and_Job_Level_Metrics.html","note":"Adds jobs per hour, and computes the best achievable cache-hit rate without a GPU."}]},{"name":"Add gates that catch a fake win","levers":["engine"],"do":"Measure every change end to end inside the full engine, never a kernel alone. Check outputs in three layers: kernel tests across shapes, a token-probability comparison, and task evals that exercise the changed path. Fail on request errors.","bought":"Protection. Kernel speed-ups of 1.6 to 6.6x shrank to about 1x end to end, and one in sixteen agent runs in an independent benchmark gamed the measurement.","watch":"A standard task-score gate caught 1 of 7 known numerical bugs and passed a run in which the engine had crashed. Agents have been caught changing the benchmark.","signals":["2026-05-22-fastkernels","2026-10-14-vllm-byog-evals-rfc","2026-05-20-inferencebench","2026-10-03-seis-self-evolving-inference"],"parts":[{"label":"vLLM fast-track RFC","url":"https://github.com/vllm-project/vllm/issues/59665","note":"The evidence an agent-written optimisation must carry: isolation, end-to-end evals, kernel tests, no regression above 1%."},{"label":"vLLM bring-your-own-GPU evals RFC","url":"https://github.com/vllm-project/vllm/issues/61698","note":"Task tolerances calibrated from repeated runs, plus a token-probability check."},{"label":"SGLang agent skills","url":"https://github.com/sgl-project/sglang/tree/main/.agents/skills","note":"Includes a test comparing each token's probability on the prefill and decode paths."},{"label":"klgate","url":"https://github.com/sansblues/klgate","note":"A prototype of the probability check with a permutation test in place of a fixed threshold."}]},{"name":"Tune what needs no new code","levers":["worker","split"],"do":"Search the settings you already have against the rig: cache-aware and sticky routing, the prefill and decode split, caps on long prefills, cache retention. Use plain search here, not agents.","bought":"The largest reported gains for the least risk: 2.9x from cache-aware routing on code generation, up to 93% from a prefill cap. One default flag explained 78% of a gap between two engines.","watch":"Plain parameter search beat every coding agent at this in an independent test. Gains on prefill-bound work do not appear on decode-bound work.","signals":["2026-08-17-llmd-sticky-until-saturated","2026-09-08-vllm-agentx","2026-11-04-vllm-sglang-controlled-evaluation","2026-05-20-inferencebench"],"parts":[{"label":"llm-d","url":"https://github.com/llm-d/llm-d","note":"Cache-aware and load-aware routing on Kubernetes over vLLM and SGLang, with a latency predictor that retrains on live traffic."},{"label":"NVIDIA Dynamo","url":"https://github.com/ai-dynamo/dynamo","note":"Routing by cached-prefix overlap, hints from the agent harness, and a planner that forecasts load."},{"label":"DynoSim","url":"https://docs.nvidia.com/dynamo/knowledge-base/concepts/simulation/overview.md","note":"Simulates scheduling and caching without GPUs to shortlist settings. Confirm the shortlist on real hardware."}]},{"name":"Fit the decoding to the traffic","levers":["decode"],"do":"Measure how well your traffic speculates, by domain, by load and by model, before building anything. Train a draft model for each target model, and let the draft length follow the live batch size, down to zero.","bought":"About 3x for a single request, 1 to 1.5x at 32 concurrent. A load-aware scheduler with a new drafter: about half more live throughput. Draft length by batch size alone: up to 15%. Tuning the drafter to the workload: 20 to 45%.","watch":"Under load some drafters fall below break-even. On mixture-of-experts models small batches may not pay at all. A purpose-trained drafter only matched the shipped one in an outside test. Rebuild it whenever the model changes.","signals":["2026-08-18-dflash-2","2026-07-06-dspark","2026-03-19-speed-bench","2026-08-11-thoughtworks-nemotron-test","2026-09-23-modal-trillion-tokens","2025-12-27-nightjar","2026-06-22-doubleword-adaptive-speculation","2026-06-08-economics-of-speculative-decoding"],"parts":[{"label":"Speculators","url":"https://developers.redhat.com/articles/2026/06/04/speculators-v050-dflash-support-and-online-training","note":"vLLM project and Red Hat. Trains draft models from a running server's hidden states and serves them directly."},{"label":"SPEED-Bench","url":"https://huggingface.co/blog/nvidia/speed-bench","note":"Measures acceptance across 11 kinds of content, and throughput under load, inside production engines."},{"label":"Aurora","url":"https://www.together.ai/blog/aurora","note":"Together's open-source drafter that keeps training on live traffic."},{"label":"inference-lab","url":"https://github.com/doublewordai/inference-lab","note":"Doubleword, MIT licence. Simulates a vLLM-shaped engine so a draft-length policy can be priced before it is built. Its figures are upper bounds until calibrated against a real engine."}]},{"name":"Automate bringing up each new model","levers":["engine","decode"],"do":"Have an agent port
