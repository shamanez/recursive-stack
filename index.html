blog/together-post-training","note":"A hosted trainer where you write the loop. Adapters share one deployment."},{"label":"Fireworks Training API","url":"https://fireworks.ai/blog/training-api-general-availability","note":"The same shape from another provider. Check its changelog for which base models are still tunable."}]},{"name":"Close the loop","levers":["worker","split","decode","engine"],"do":"Detect when traffic has drifted, re-run the earlier steps, promote winners through shadow traffic, and send upstream whatever is not specific to you.","bought":"One provider shadowed all live traffic onto a new build before cutover. Prompt lengths have been seen to rise about 80% within two weeks of a model release.","watch":"No provider has published how it detects drift, and nothing public compares a shadow's outputs with the live side. Nobody can yet simulate traffic they have not seen.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-11-09-evolving-infra"],"parts":[{"label":"Gateway API request mirroring","url":"https://www.alibabacloud.com/help/en/ack/ack-managed-and-ack-dedicated/user-guide/use-ack-gateway-with-inference-extension-to-implement-traffic-mirroring-for-inference-service","note":"Copies live requests to a shadow service and discards its replies. Comparing the two sides is left to you."},{"label":"Dynamo planner","url":"https://docs.nvidia.com/dynamo/v1.0.0/design-docs/component-design/planner-design","note":"Forecasts load and tracks how far observed latency has drifted from the profile."},{"label":"TIDE","url":"https://arxiv.org/abs/2602.05145","note":"Research: keeps a drafter aligned with live traffic and turns speculation off when it stops paying."}]}],"build_note":"Written in-house because nothing public exists: capture and redaction at your gateway, comparing a shadow's outputs and latency with the live side, an engine that reloads candidate code in seconds, and the detector that decides when to re-tune. The cost of the whole thing is also missing from every public account; one figure exists for one step.","open_ground":[{"head":"How to tell that traffic has drifted","text":"Every loop re-tunes when the load changes. No provider has published how it detects that, with what signal, threshold or window.","claims":["C2"],"checks":[],"signals":["2026-11-04-together-compiler","2026-11-inferact-autonomous-inference-system"]},{"head":"Judging a change on traffic you have not seen","text":"Replay only covers what was recorded. vLLM's maintainers say they cannot yet simulate unseen traffic. One provider has published an engine simulator; nobody has shown how well one predicts a real engine.","claims":["C4"],"checks":["W20"],"signals":["2026-11-inferact-autonomous-inference-system","2026-04-22-applied-compute-agentic-benchmark","2026-06-22-doubleword-adaptive-speculation"]},{"head":"Tuning the levers together","text":"Each lever is tuned alone, yet they are coupled through the cache and the model. Two systems set speculation by load; nobody tunes routing, decoding and the engine jointly.","claims":["C2"],"checks":[],"signals":["2026-07-06-dspark","2026-10-08-openrouter-cache-is-crucial","2025-12-27-nightjar"]},{"head":"What the loop costs per model","text":"One figure exists: about 200 GPU-hours for one bespoke engine. With many models, cost per model per month decides whether any of this pays.","claims":["C3","C6"],"checks":["W12","W19"],"signals":["2026-10-02-baseten-agentic-engine"]},{"head":"A router against the best fixed model, fairly","text":"Vendors report large savings; an outside test found none. Nobody has compared a shipped router with the best single model in its pool on agentic work with caching priced in.","claims":["C9"],"checks":["W16"],"signals":["2026-10-26-autobench-do-routers-route","2026-05-14-twinrouterbench"]},{"head":"Whether gains compound from one cycle to the next","text":"The recursive claim needs gain per cycle to rise, or a model trained on optimisation traces to beat its teacher. Nobody has shown either.","claims":["C5"],"checks":["W8"],"signals":["2026-10-03-seis-self-evolving-inference","2026-03-30-kernel-smith"]}]},"tensions":[{"id":"T1","question":"Megakernels: fuse the whole forward pass, or delete the idea?","sides":[{"held_by":"Together AI","position":"Deleted theirs. CUDA Graphs plus PDL recover 98% of the gain, and a megakernel bakes in one model shape and one chip, which breaks as soon as either changes.","signals":["2026-11-16-together-deleted-megakernels"]},{"held_by":"vLLM, SGLang, Inferact","position":"Shipping agent-written fused decode paths now, with merged pull requests and gains of 1.3 to 2x over the stock engine.","signals":["2026-10-16-vllm-kimi-k3-megakernel","2026-07-02-sglang-agent-assisted-development","2026-11-inferact-autonomous-inference-system"]}],"settles_when":"Someone runs the same model on the same chip on AgentX with a fused path against a CUDA Graphs plus PDL path, or either camp changes course.","lean":"Possibly both are right. A megakernel's cost was that people had to maintain it. If agents regenerate it per model in a day, the rigidity matters less. Watch whether the fused paths survive the next model release.","claims":["C6","C1"],"status":"open"},{"id":"T2","question":"Does accumulated knowledge make the optimising agents better, or worse?","sides":[{"held_by":"Together AI","position":"Worse. A curated knowledge base cut the final speed-up by about 19%, and expert-written strategies lost to a one-line instruction by about 26%.","signals":["2026-11-16-together-deleted-megakernels"]},{"held_by":"ModelBlaster, VibeServe, Z.ai, Meta","position":"Better. A persistent knowledge base is the agent's policy; a skills library raised the ceiling in ablation; search traces train the next model.","signals":["2026-11-03-modelblaster","2026-05-07-vibeserve","2026-09-17-zai-glm-built-its-inference","2026-04-02-meta-kernelevolve"]},{"held_by":"SEIS","position":"Both. Chains that inherit their own reports climb further, and also carry wrong conclusions forward.","signals":["2026-10-03-seis-self-evolving-inference"]}],"settles_when":"A second team publishes an ablation of machine-accumulated (not hand-curated) memory on a production-scale task.","lean":"The split may be between knowledge people wrote down, which hurts, and knowledge the loop accumulated and can re-test, which helps until it carries an error. That distinction is the whole of the RSI question in miniature.","claims":["C5"],"status":"open"},{"id":"T3","question":"Is this a job for agents, or for plain search?","sides":[{"held_by":"InferenceBench","position":"With the same budget, a simple hyperparameter search beat every agent. Agents know the techniques but explore one configuration and stop.","signals":["2026-05-20-inferencebench"]},{"held_by":"InferenceForge, Together, vLLM","position":"The gains came from new code (kernel fixes, fused paths) that no search over existing knobs could reach.","signals":["2026-11-09-inferenceforge","2026-11-04-together-compiler","2026-10-16-vllm-kimi-k3-megakernel"]}],"settles_when":"A benchmark separates gains from configuration and gains from new code on the same task, or InferenceBench runs a matched-budget search next to the newest agents.","lean":"Both, at different layers. Knobs belong to search; kernels and engine paths belong to agents. The strongest systems already combine them: Together prunes parallelism layouts with a cost model before any agent runs.","claims":["C1"],"status":"leaning"},{"id":"T4","question":"Is the moat the traffic, or just the harness?","sides":[{"held_by":"Inferact, Together, Decagon","position":"You need real traffic. Synthetic inputs mislead the agents, and nobody can yet simulate traffic they have not seen.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-16-together-deleted-megakernels","2026-10-28-decagon-autoresearch"]},{"held_by":"InferenceForge, AgentX","position":"A public set of replayable traces was enough for an academic group with no customers to top the scoreboard.","signals":["2026-11-09-inferenceforge","2026-08-24-agentx-inferencex-v3"]}],"settles_when":"A stack tuned only on the public benchmark is deployed on real traffic and someone reports whether the gains hold.","claims":["C4","C7"],"status":"open"},{"id":"T5","question":"Does specialisation stop at the workload class, or go down to each customer?","sides":[{"held_by":"Modal, vLLM","position":"Class level is most of it. Per-customer tuning was worth about 20% like for like, the recipe transferred to other customers, and a general engine came within 6% of a bespoke one.","signals":["2026-09-23-modal-trillion-tokens","2026-09-08-vllm-agentx","2026-10-23-vllm-matches-deepinfer"]},{"held_by":"Together, Baseten, Decagon","position":"Per deployment, continuously. A bespoke engine now costs a couple of hundred GPU-hours, and one company running the loop on its own traffic reports gains at every layer.","signals":["2026-11-04-together-compiler","2026-10-02-baseten-agentic-engine","2026-10-28-decagon-autoresearch","2025-10-10-together-atlas"]}],"settles_when":"A provider publishes per-customer against class-level numbers on the same endpoints.","claims":["C3"],"status":"open"},{"id":"T7","question":"Choose the model once per session, or for every request?","sides":[{"held_by":"Databricks, Together, GitHub","position":"Once, at the start, or only where no cache is lost: session start, compaction, sub-agent launch. Switching mid-session re-reads the whole context at full price.","signals":["2026-08-13-databricks-smart-routing","2026-10-05-together-link","2026-06-17-github-copilot-auto-routing"]},{"held_by":"Cursor, Fireworks","position":"Every request or turn, with the cost of the cache miss priced into the decision. A session that gets harder should not be stuck on the model it started with.","signals":["2026-07-22-cursor-router","2026-07-26-fireworks-nexus"]}],"settles_when":"An independent agentic benchmark with caching priced in compares the two on the same tasks. One early result has a trained per-step router halving cost.","lean":"Toward cache boundaries. The team that tried per-request routing and published why moved away from it, and nine-tenths of agent tokens are cached re-reads.","claims":["C9","C2"],"status":"leaning"},{"id":"T8","question":"Is a router worth building, or is a good default model enough?","sides":[{"held_by":"Router vendors","position":"Routing cuts cost by 30 to 60% at equal quality, by their own measurements.","signals":["2026-07-22-cursor-router","2026-08-13-databricks-smart-routing","2026-07-26-fireworks-nexus"]},{"held_by":"Independent tests","position":"No router beat always calling a cheap strong model, several collapsed to one model, and a fixed open model already tied a frontier one at two-thirds the cost.","signals":["2026-10-26-autobench-do-routers-route","2026-07-08-databricks-coding-agent-benchmark"]}],"settles_when":"A vendor publishes its router against the best fixed model in its own pool, on tasks someone else chose.","claims":["C9"],"status":"open"},{"id":"T9","question":"Tune a model for the job, or wait for the next general one?","sides":[{"held_by":"Harvey, Datadog, Fireworks, Together","position":"Tune. On a narrow job it has nearly doubled quality at flat cost, or cut latency by an order of magnitude against a general model.","signals":["2026-08-26-harvey-tenet","2026-11-18-datadog-fine-tune-baseten","2026-08-31-fireworks-training-api","2026-10-19-together-post-training"]},{"held_by":"Cognition's own table, OpenAI","position":"Wait. A newer general model beat a freshly tuned one on the tuner's own benchmark, a frontier lab is ending self-serve tuning, and a tune dies with its base model.","signals":["2026-11-04-cognition-swe-2-flash","2026-05-07-openai-fine-tuning-wind-down"]}],"settles_when":"A tuned model is followed against each new general release on the same task for six months.","lean":"It depends on how narrow the job is. The wins are on single tasks with their own data and grader; the losses are on general coding, where the next release moves fastest.","claims":["C10"],"status":"open"},{"id":"T10","question":"Does speculation pay less as batches fill, or more?","sides":[{"held_by":"Measured tables: Inco AI, UC Berkeley, NVIDIA, Together, Nightjar","position":"Less. About 3x for one request falls to 1 to 1.5x at 32 concurrent, and a fixed draft length ran up to 30% slower than no speculation at high load.","signals":["2026-08-18-dflash-2","2025-12-31-speculative-decoding-performance-or-illusion","2026-03-19-speed-bench","2026-03-31-together-aurora","2025-12-27-nightjar"]},{"held_by":"Doubleword's cost models","position":"More, on mixture-of-experts models. A small batch shares few experts, so a guess costs nearly full price; not speculating is close to best at batch 4 and four times worse at 128. Modelled, not measured.","signals":["2026-06-08-economics-of-speculative-decoding","2026-06-22-doubleword-adaptive-speculation"]}],"settles_when":"Someone measures a mixture-of-experts model in a real engine, with and without speculation, from 1 to 128 concurrent.","lean":"Probably both, by architecture. The measured tables that name their models used dense ones. If the slope belongs to the model, a provider serving many models has to measure it for each.","claims":["C2"],"status":"open"}],"watch":{"checks":[{"id":"W1","what":"Confirm the canonical AgentX scoreboard and record today's top results for Kimi K3, Kimi K3.1 and GLM-5.3 as a baseline.","why":"Almost every number here is stated against this board, and the founding sweep's fetch of inferencex.semianalysis.com returned a page calling itself an unofficial deployment. Without a recorded baseline, later claims of a lead cannot be judged.","opened":"2026-11-19","due":"2026-11-22","claims":["C7","C4"],"status":"open"},{"id":"W2","what":"Have InferenceForge's three SGLang fixes been reproduced by anyone else, or opened as pull requests against upstream SGLang?","why":"They sit in a personal fork. Upstreaming would be the first independent check on an outsider's agent-found gain, and a data point on how fast the commons absorbs one.","opened":"2026-11-19","due":"2026-11-28","claims":["C1","C7"],"status":"open"},{"id":"W3","what":"Is the Evolving Infra code actually public and runnable at github.com/mit-han-lab/EvolvingInfra?","why":"The project page says both open source and coming soon. A runnable release lets someone other than the authors test the 4x latency claim against Dynamo.","opened":"2026-11-19","due":"2026-12-01","claims":["C2"],"status":"open"},{"id":"W4","what":"Read first-hand the two papers reported as counter-evidence on local agent-written kernels: arXiv 2607.24762 (reported to lose to eager PyTorch on a DGX Spark) and arXiv 2611.12079 (a local 7B model's kernels at roughly break-even).","why":"They were relayed with too little detail to enter as signals. If they hold, they are the most direct evidence that the agent loop does not transfer to owned hardware.","opened":"2026-11-19","due":"2026-12-03","claims":["C8","C1"],"status":"dropped","resolution":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"W5","what":"Does any public AgentX run, by Together or anyone else, match the up-to-2.6x lead Together claims for its compiler?","why":"A private lead that never appears on the public board cannot be told apart from a favourable baseline. If the open engines close it, the commons is keeping up.","opened":"2026-11-19","due":"2026-12-05","claims":["C7","C4"],"status":"open","lens":true},{"id":"W6","what":"Has InferenceBench run a matched-budget search beside its newest agent entries, and has the gap (12.08x agent against 14.30x search) closed?","why":"This is the cleanest independent gauge of whether agents are getting better at the experimenting, not just the knowing.","opened":"2026-11-19","due":"2026-12-10","claims":["C1","C5"],"status":"open"},{"id":"W7","what":"Megakernels: any head-to-head on one model and chip, or any of vLLM, SGLang or Together changing course.","why":"Two camps shipped opposite bets in the same month. The next major model release is the natural test of whether fused paths can be regenerated fast enough.","opened":"2026-11-19","due":"2026-12-19","claims":["C6"],"status":"open"},{"id":"W8","what":"Any published evidence of compounding: gain per cycle rising, or a model trained on optimisation traces beating its teacher on a production task.","why":"This is the named condition for raising the RSI claim. InferenceForge said it would put its own models in the loop; Kernel-Smith and Meta already train on search traces.","opened":"2026-11-19","due":"2026-12-19","claims":["C5"],"status":"open"},{"id":"W9","what":"Any agent-driven optimisation loop on user-owned hardware (workstation, on-prem cluster, laptop) with a like-for-like baseline.","why":"The single result that would move the local claim most. Its continued absence is itself information.","opened":"2026-11-19","due":"2026-12-19","claims":["C8"],"status":"dropped","resolution":"Out of scope. On 19 Nov the reader clarified that local means fitted to what you have (different devices), not on-device hardware, so the on-device question is no longer tracked."},{"id":"W10","what":"A provider publishing per-customer against class-level tuning on the same endpoints.","why":"The only numbers so far are 20 to 45%. One clean result above about 1.5x would change who is expected to capture the value.","opened":"2026-11-19","due":"2026-12-31","claims":["C3"],"status":"open","lens":true},{"id":"W11","what":"One system publishing like-for-like results on two chip families for the same model and traffic, with different winning optimisations on each.","why":"C2 now covers the chip as well as the traffic, and most of the hardware evidence is each team's account of its own bring-up. A same-system, two-chip comparison on the public board would test it directly.","opened":"2026-11-19","due":"2026-12-12","claims":["C2","C6"],"status":"open"},{"id":"W12","what":"Any provider publishing what its loop costs per deployment (GPU-hours, tokens) next to the gain it bought.","why":"One figure exists: about 200 GPU-hours and 1.7B tokens for a bespoke engine. Whether per-customer tuning is a business turns on this number falling.","opened":"2026-11-19","due":"2026-12-19","claims":["C3"],"status":"open","lens":true},{"id":"W13","what":"A second workload owner, not a provider, describing its own loop on its own traffic.","why":"Decagon is the only one so far. If customers can do this themselves on rented GPUs, the provider's role shifts toward supplying the rig.","opened":"2026-11-19","due":"2026-12-19","claims":["C3","C4"],"status":"open","lens":true},{"id":"W14","what":"A provider with no announced loop (Fireworks, Modal, Groq, Cerebras, a hyperscaler) describing one, or giving a credible reason not to.","why":"Three providers have described a loop. Silence from the rest is either catching up in private or a judgement that it does not pay.","opened":"2026-11-19","due":"2026-12-12","claims":["C1","C7"],"status":"open","lens":true},{"id":"W15","what":"Read Modal's post first-hand: was its draft model trained on the customer's own traffic, or on synthetic and target-model traces?","why":"The 20% figure is the cleanest number behind the per-customer claim, and a second check found Modal's other drafter post used synthetic data.","opened":"2026-11-19","due":"2026-11-21","claims":["C3"],"status":"open","lens":true},{"id":"W16","what":"Any router published against the best fixed model in its own pool, on tasks someone else chose.","why":"Vendors report a third to three-fifths off; an outside test found no shipped router beating a cheap default. This is the comparison that would settle it.","opened":"2026-11-19","due":"2026-12-19","claims":["C9"],"status":"open","lens":true},{"id":"W17","what":"A tuned open model followed against the next general release on the same task.","why":"Tunes look good on the day and may be overtaken within weeks. Whether tuning is a lever or a treadmill turns on this.","opened":"2026-11-19","due":"2026-12-31","claims":["C10"],"status":"open"},{"id":"W18","what":"Open two leads a sub-agent saw but could not date: Cerebras on its autoresearch loop cheating, and an LMSYS post on an internal system called Infer-forge. Add them to the roster if they describe a loop.","why":"The reader asked that no team building the loop be missed. A provider and an open-engine team may both be absent.","opened":"2026-11-19","due":"2026-11-21","claims":["C1"],"status":"open","lens":true},{"id":"W19","what":"Any provider publishing how long and how much it takes to get a new model from release to tuned serving, with or without agents.","why":"With many models this is the cost that repeats. Day-zero support is claimed by several teams; none has given a time or a price.","opened":"2026-11-19","due":"2026-12-19","claims":["C6"],"status":"open","lens":true},{"id":"W20","what":"A mixture-of-experts model measured in a real engine with and without speculation from 1 to 128 concurrent, or the Doubleword simulator compared with a real engine.","why":"Measured tables show speculation fading with load. A cost model says that on mixture-of-experts models it starts near zero and grows, and its author says most new models are of that kind. Which is right decides how a provider sets lever 4 for each model, and whether a simulator can stand in for part of the rig.","opened":"2026-11-19","due":"2026-12-19","claims":["C2","C4"],"status":"open","lens":true}],"feeds":[{"name":"vLLM blog","url":"https://vllm.ai/blog","why":"The fastest-moving primary source. Agent-assisted optimisation posts cluster around new model launches."},{"name":"vLLM RFC issues","url":"https://github.com/vllm-project/vllm/issues?q=is%3Aissue+label%3ARFC+sort%3Aupdated-desc","why":"Where the rules for agent-written code get argued. Review process changes show up here first."},{"name":"Inferact news","url":"https://inferact.ai/news","why":"Hillclimb results and the autonomous-system roadmap from the vLLM maintainers."},{"name":"LMSYS / SGLang blog","url":"https://www.lmsys.org/blog","why":"The other open engine. The index is script-rendered; open individual posts."},{"name":"Together AI blog","url":"https://www.together.ai/blog","why":"Compiler, speculation and routing posts; the most explicit commercial RSI claim."},{"name":"AgentX optimisations (InferenceX)","url":"https://inferencex.semianalysis.com/infx/agentx/optimizations","why":"The scoreboard itself and the list of upstream fixes it has prompted."},{"name":"SemiAnalysis newsletter","url":"https://newsletter.semianalysis.com","why":"Benchmark write-ups and hardware-generation results. Partly paywalled."},{"name":"InferenceBench leaderboard","url":"https://inferencebench.ai/","why":"Independent agents-against-search numbers, updated roughly monthly."},{"name":"llm-d blog","url":"https://llm-d.ai/blog","why":"Routing and scheduling work with unusually candid caveats."},{"name":"Baseten blog","url":"https://www.baseten.co/blog","why":"Bespoke-engine experiments and per-deployment tuning from a provider."},{"name":"arXiv: agents optimising inference","url":"https://arxiv.org/search/?query=agent+LLM+inference+engine+kernel+optimization&searchtype=all&abstracts=hide&order=-announced_date_first&size=25","why":"Narrow query; pair with the next two."},{"name":"arXiv: KernelBench","url":"https://arxiv.org/search/?query=KernelBench&searchtype=all&abstracts=show&order=-announced_date_first&size=25","why":"Kernel-generation papers and the critiques of their benchmarks."},{"name":"arXiv: agentic LLM serving","url":"https://arxiv.org/search/?query=%22LLM+serving%22+agentic+workload&searchtype=all&abstracts=show&order=-announced_date_first&size=50","why":"Workload-aware serving systems."},{"name":"PyTorch blog","url":"https://pytorch.org/blog/","why":"ExecuTorch, Helion and Triton posts: the compiler route to per-device specialisation."},{"name":"Modular blog","url":"https://modular.com/blog","why":"Compiler work, now inside Qualcomm."},{"name":"OpenRouter data newsletter and rankings","url":"https://openrouter.ai/data/newsletter","why":"Who serves what: open against closed share, cache rates, how fast traffic moves to new models."},{"name":"Fireworks changelog","url":"https://docs.fireworks.ai/updates/changelog","why":"Which base models can still be tuned, and which features were paused. The churn shows here first."},{"name":"Databricks Smart Routing docs","url":"https://docs.databricks.com/aws/en/ai-gateway/smart-routing","why":"Where the scope of a shipped router changes before the blog does."},{"name":"llama.cpp speculative decoding docs","url":"https://github.com/ggml-org/llama.cpp/blob/master/docs/speculative.md","why":"Tracks every drafter type as it lands."},{"name":"Vals legal-agent leaderboard","url":"https://www.vals.ai/benchmarks/hlab","why":"A running check on whether a tuned model stays ahead of general ones."},{"name":"Doubleword blog","url":"https://blog.doubleword.ai","why":"A provider working out the economics of speculation per architecture, with an open simulator. A follow-up on building the adaptive policy is implied."}]},"course":{"_about":"The steering note for the human reader. reader_framing is their own working view in close to their own words; only they change it (via inbox.md). Every sweep re-judges each verdict against the current evidence and rewrites the rest.","as_of":"2026-11-19","reader_framing":"Inference is becoming load-aware and adaptive: the stack fits itself to what you have and to the traffic it sees. Agents tuning the stack, open and frontier models side by side, routing, speculative decoders and tuning for a domain are all parts of that one move, and I want to know how to build such a system.","verdicts":[{"part":"Load-aware, fitted to what you have","verdict":"holding","short":"Six levers now move with the load, and four are in production somewhere.","note":"This is the frame the evidence supports best. Routing follows where the cache is, the cluster split follows the traffic mix, speculation follows the domain and the batch size, and kernels are regenerated per model and chip. One megakernel could not span two chips. The caution: almost all of it is measured on one workload class, coding agents, and one public trace set."},{"part":"The parts are one move","verdict":"holding","short":"They connect through the prompt cache and the model: change one lever and others must be redone.","note":"Yes, and the connections are concrete. A cache belongs to one model on one machine, so it fixes how often a model can be chosen and where a request must go. A drafter belongs to one exact model, so tuning or swapping the model means a new drafter and a re-tuned engine. That coupling is why re-tuning is constant, and why agents doing it cheaply matters."},{"part":"Fits each user","verdict":"sharpen","short":"Worth 20 to 45% so far. Most gains are class-level and shared.","note":"Like for like, tuning to a single customer has been worth 20 to 45% on decoding, and at least one provider reports its recipe carried straight over to other customers. Tuning the model itself does better on narrow jobs, but those tunes go stale. Most of the gain is at the level of the workload class and lands in the shared open engines."},{"part":"Driven by RSI","verdict":"sharpen","short":"Driven by bounded agent hillclimbs. Nothing has been shown to compound.","note":"Driven by coding agents running bounded hillclimbs inside harnesses that people built, with people setting the goal and approving what ships. The recursive part is true only weakly: a model serves the agents that tune its serving. Nobody has shown gains compounding, and the label already sits on a system with no self-improvement in it."}],"reframe":"Inference optimisation is turning from hand-craft into search. Agents rewrite kernels and engine paths against replayed real traffic, so the thing being optimised shrinks from a model to what you actually have: this model, this traffic shape, this chip, this month. The scarce asset is not the agent but the rig that tells you whether a change is real.","questions":[],"ignore":["KernelBench scores quoted without the verified protocol. The baseline was too easy.","Single-stream, batch-size-1 tokens-per-second records. Real, but they say little about serving many users.","Arguments over which engine is faster at default settings. One flag explained most of the largest gap.","Laptops against datacenters. You said hardware is not the point, so those arguments are retired."],"read_next":[{"signal":"2026-11-16-together-deleted-megakernels","why":"The best single explanation of why measuring is harder than optimising. Read the sections on benchmarks lying and on their own ablations."},{"signal":"2026-05-20-inferencebench","why":"The strongest counter-argument, from people with nothing to sell. Read it before taking any vendor number at face value."},{"signal":"2026-11-inferact-autonomous-inference-system","why":"The whole loop laid out by the people who maintain vLLM, including the parts they say they cannot do yet."}],"position":{"label":"Provider","text":"You run inference for other people's workloads, across many model families. You are here to build, to find open ground, and to judge where the value will sit. You would build the measuring rig first."},"focus_claims":["C4","C6","C7","C9"],"implications":[{"head":"The rig is the asset, not the agent","text":"Everyone building this says evaluation is the hard part: replayed traffic, an engine that reloads candidates, gates that catch fake wins. The usual gate misses six of seven numerical bugs.","claims":["C4"],"signals":["2026-11-04-together-compiler","2026-05-22-fastkernels","2026-10-14-vllm-byog-evals-rfc"]},{"head":"Many models multiply three of the six levers","text":"Each model needs its own drafter, its own tuned engine and its own cache. Traffic moves to new models within weeks, so spend that work on the few that carry most of it.","claims":["C6","C2"],"signals":["2026-11-04-together-polymorphic-inference","2026-09-22-openrouter-token-state-of-play","2026-08-18-dflash-2","2026-11-inferact-autonomous-inference-system"]},{"head":"A kernel lead lasts weeks, so lean on upstream","text":"Both open engines run the loop themselves and absorb fixes fast; a general engine came within 6% of a bespoke one. For the long tail of models, upstream is your tuning.","claims":["C7"],"signals":["2026-10-23-vllm-matches-deepinfer","2026-07-02-sglang-agent-assisted-development","2026-11-04-together-compiler","2026-10-02-baseten-agentic-engine"]},{"head":"Open models are your volume; routing is the contest","text":"Open models carry most tokens and about a quarter of spend. Whoever owns the harness or the router decides which sessions reach you, and decides once per session.","claims":["C9"],"signals":["2026-09-22-openrouter-token-state-of-play","2026-10-05-together-link","2026-07-22-cursor-router"]}],"purpose":["Building a system","Positioning research","Placing a bet"],"build_first":"The measuring rig"},"cycles":[{"id":"2026-11-19","n":0,"agent":"Claude Code (Fable 5.2)","summary":"Founding sweep, steered seven times the same day. The reader clarified that local means fitted to what you have, said they read this as a provider, asked for every team building the loop, and then widened the frame: inference becoming load-aware, how the levers connect, and how to build one. The thesis is now a map of six levers with the agent loop around them. A link on adaptive speculative decoding added three signals, a figure and a tension late in the day; no confidence moved. 65 signals are active.","changes":[{"type":"added","ref":"2026-06-22-doubleword-adaptive-speculation","text":"The reader sent a provider's simulation of a policy that re-chooses the draft length at every step. It ties the best fixed length at a steady load; the gain is in not being wrong when load moves. Its open simulator is a candidate for the cheap oracle C4 names."},{"type":"added","ref":"2026-06-08-economics-of-speculative-decoding","text":"The companion analysis: on mixture-of-experts models a guessed token costs most at small batches, so the best draft length can be zero there. Lever 4 now says it depends on the model's architecture."},{"type":"added","ref":"2025-12-27-nightjar","text":"A measured figure for adaptive over fixed speculation: 8% on average and up to 15% in vLLM, with fixed speculation up to 30% slower than none at high load."},{"type":"added","text":"New figure on the Evidence tab: what making speculation adaptive adds, from 1.0x in a steady-load simulation to 1.5x live and a 2.2x oracle bound."},{"type":"tension","ref":"T10","text":"Opened. Measured tables show speculation fading as batches fill; a cost model of mixture-of-experts models predicts the opposite. Nobody has measured it."},{"type":"watch","ref":"W20","text":"Opened, due 2026-12-19: a mixture-of-experts model measured with and without speculation across load, or the simulator checked against a real engine."},{"type":"revised","text":"Lever 4, the decoding build step and two open-ground items updated. A simulator joined the reusable parts, the Doubleword blog joined the feeds, and draft length joined the glossary."},{"type":"revised","text":"Page: charts not marked featured now appear under More charts on the Evidence tab, and the bars in every chart share one scale. Rows had been sized separately, so bars in one chart could start and end at slightly different points."},{"type":"course","text":"The reader answered the two open questions: build the measuring rig first, and the tracker is for building, positioning research and placing a bet. Open ground (six things nobody has shown) added to the big picture. The repository and page were made public."},{"type":"course","text":"The reader serves many model families. Churn (C6) joins the claims their position rests on, the provider view now leads with the work that repeats per model, and bringing up a new model is its own step in the build order. W19 opened."},{"type":"course","text":"The reader widened the frame to inference becoming load-aware and adaptive, and asked how the parts connect and how to build one. Framing restated; all four parts re-judged."},{"type":"added","text":"The big picture: six levers (which model, which machine, the cluster split, decoding, the engine, the model itself), what each listens to and has bought, how they connect through the prompt cache, and a seven-step build order with reusable parts."},{"type":"added","ref":"C9","text":"Open and frontier models share the work, opened at 0.7. Coexistence is measured on two gateways; whether a router beats a cheap default is disputed."},{"type":"added","ref":"C10","text":"The model itself becomes a setting, opened at 0.45. Real gains on narrow jobs; tunes go stale and a newer general model beat one."},{"type":"added","text":"25 signals for the new levers and the rig, 3 read first-hand. Tensions T7 to T9 and checks W15 to W18 opened."},{"type":"revised","ref":"2026-09-23-modal-trillion-tokens","text":"No longer described as trained on customer traffic. A second check found Modal's other drafter used synthetic data; W15 is to read the post first-hand."},{"type":"model","text":"Cadence changed to daily with a weekly deep pass. The repeated procedures (add a signal, act on a steer, roster check, page check) are now playbooks and skills for both agents."},{"type":"course","text":"The reader is tracking this as a provider. Added what the evidence implies for a provider, flagged the three claims that position rests on (C4, C7, C3), and opened three provider-side checks (W12 to W14)."},{"type":"course","text":"The reader clarified that local means fitted to what you have (different devices), not on-device hardware. The framing is restated in those terms and that part now holds."},{"type":"added","text":"A roster of every team found that has described the loop: 25 entries with a one-line gist each. A second check found five not seen before (RoofLang, an NPU kernel loop, KDA, FlashVector, Astra); five the first sweep saw and left out are now listed too. Two became signals."},{"type":"revised","ref":"C2","text":"Widened from the workload to what you have: traffic, model and chip together. Confidence unchanged at 0.8."},{"type":"retired","ref":"C8","text":"The on-device claim is retired as out of scope, with five signals that only argued for or against local hardware. Four that show per-device specialisation now count under C2."},{"type":"tension","ref":"T6","text":"Dropped. It was premised on the on-device reading."},{"type":"watch","text":"W4 and W9 dropped as out of scope. W11 opened: one system showing different winners on two chip families."},{"type":"added","text":"Eight claims opened, C1 to C8, each with a starting confidence and named conditions for moving it."},{"type":"course","text":"The reader's framing judged for the first time. Workload-aware holds. Local and RSI do not, in the senses those words usually carry."},{"type":"added","text":"40 signals: 7 read first-hand, 33 relayed by research sub-agents and marked as such. Relayed ones should be opened and confirmed over the next few sweeps, most load-bearing first."},{"type":"tension","text":"Six tensions opened. The megakernel split (T1) is the most concrete: two camps shipped opposite bets in the same month."},{"type":"watch","text":"Ten dated checks opened. The first due is confirming the canonical AgentX scoreboard and recording today's top results as a baseline."},{"type":"model","text":"Vocabulary fixed: eight stack layers, five ways an optimisation gets produced, five venues, four timescales, five loop stages."},{"type":"revised","ref":"2026-11-09-evolving-infra","text":"inference-rsi.com resolved: it is the project page for Evolving Infra (MIT HAN Lab and others, arXiv 2611.12304). Despite the domain, neither page nor paper claims self-improvement."}],"swept":["The five reader-supplied sources and the pages they cite","Agent-driven and self-improving inference optimisation, February to November 2026, including critiques and failed replications","Workload-aware and per-customer serving across providers, open engines and papers","Local runtimes, ML compilers and kernel generation, plus essays for and against local inference","A second check for loop announcements missed: other providers, chip vendors, model labs and the public scoreboard","Model choice: routers, open models inside frontier harnesses, gateway market data, counter-evidence","Domain tuning and speculative decoding that adapts to the workload","Open-source building blocks for the evaluation rig and the adaptive serving pieces","Adaptive speculative decoding: a reader-supplied post, its companion, and a search for other work that sets draft length at run time"],"rejected":[{"title":"AVO: agentic variation operators (arXiv 2603.24517)","url":"https://arxiv.org/abs/2603.24517","reason":"single-digit gains on one kernel family after a week of compute; no end-to-end measurement"},{"title":"MLSys 2026 FlashInfer kernel generation contest","url":"https://mlsys26.flashinfer.ai/","reason":"placements only, no published speed-ups; FastKernels covers the same ground with numbers"},{"title":"Ave: agentic GPU optimisation with data-flow invariants (arXiv 2604.18616)","url":"https://arxiv.org/abs/2604.18616","reason":"matches hand-tuned code without beating it; the point is already carried by FastKernels and Kernel-Smith"},{"title":"Sakana walks back its AI CUDA engineer claims (2025)","url":"https://techcrunch.com/2025/02/21/sakana-walks-back-claims-that-its-ai-can-dramatically-speed-up-model-training/","reason":"the origin of the benchmark-gaming line; cited inside KernelBench-Verified instead of standing alone"},{"title":"MorphServe: runtime quantised layer swapping (arXiv 2506.02006)","url":"https://arxiv.org/abs/2506.02006","reason":"no provider ships it, and the baseline is not a tuned quantised deployment"},{"title":"llama.cpp multi-token-prediction speculative decoding (PR 22673)","url":"https://github.com/ggml-org/llama.cpp/pull/22673","reason":"good third-party numbers, but a hand-built feature that moves no claim"},{"title":"LlamaWeb: WebGPU backend for llama.cpp","url":"https://www.alphaxiv.org/abs/2605.20706.md","reason":"portability engineering; moves no claim"},{"title":"exo: DGX Spark plus Mac Studio clustering","url":"https://blog.exolabs.net/nvidia-dgx-spark","reason":"2025, one model and one prompt length; moves no claim"},{"title":"Luminal raises funding for a search-based compiler","url":"https://github.com/luminal-ai/luminal","reason":"funding news with no performance baselines"},{"title":"Baseten: inference engineering for DeepSeek V4 Pro","url":"https://www.baseten.co/blog/inference-engineering-for-deepseek-v4-pro-0813","reason":"states an intent to train per-deployment speculators; no numbers"},{"title":"AlphaEvolve (arXiv 2506.13131)","url":"https://arxiv.org/abs/2506.13131","reason":"foundational, but not about inference and no 2026 inference-specific update found"},{"title":"Asari AI, MetaInfer, Herschel, Applied Compute's agentic benchmark, SkyPilot's research-driven agents","reason":"all verified by a sub-agent and below the cut: small or unverifiable gains, or abstracts only"},{"title":"Agent-written kernels on a DGX Spark (arXiv 2607.24762) and from a local 7B model (arXiv 2611.12079)","reason":"reported as counter-evidence for the local claim but relayed with too little detail; queued as watch item W4 to read first-hand"},{"title":"HeyGen Auto-Optim","url":"https://www.heygen.com/research/auto-optim-ai-model-inference-speedup","reason":"an agent made a video decoder 3x faster; not LLM serving"},{"title":"Fireworks product launches at Forge (3 Nov)","url":"https://fireworks.ai/blog/fireworks-unveils-new-products-at-forge-to-help-companies-build-specialized-intelligence","reason":"a faster tier, caching and on-customer-GPU deployment; nothing about an optimisation loop"},{"title":"TileRT tops AgentX on AMD (AMD technical article)","url":"https://www.amd.com/en/developer/resources/technical-articles/2026/tilert-agentx-on-amd-instinct-gpus.html","reason":"the page timed out, so how its kernels are produced is unknown; try again next sweep"},{"title":"ISO-Bench (arXiv 2602.19594) and TokenSpeed","reason":"a benchmark of coding agents on inference workloads, and a community engine not described as agent-optimised; seen in search results only"},{"title":"OpenAI ends automatic switching between its fast and thinking models (secondary report)","url":"https://mixed-news.com/en/chatgpt-plus-pro-stop-switching-to-thinking-gpt-5-5-retires-october-14/","reason":"relevant counter-evidence for routing, but the primary source could not be opened"},{"title":"AdaSpark and AdaFlash (arXiv 2610.05774, 2607.19223)","url":"https://arxiv.org/abs/2610.05774","reason":"abstracts only; results in a hobby engine say little about serving many users"},{"title":"NVIDIA on DFlash (blog) and the DFlash paper","url":"https://developer.nvidia.com/blog/boost-inference-performance-up-to-15x-on-nvidia-blackwell-using-dflash-speculative-decoding/","reason":"covered by DFlash 2 and SPEED-Bench; its headline applies only at an extreme speed target"},{"title":"Not Diamond, Ramp Router, Baseten Switch","reason":"more routers with unbaselined savings; the lever already has five"},{"title":"RoofLang, DynoSim, Vidur as cheap evaluators","reason":"listed as parts in the build order; none reports accuracy against a measured system"},{"title":"TurboSpec and SmartSpec: goodput-driven speculation control (arXiv 2406.14066)","url":"https://arxiv.org/abs/2406.14066","reason":"seen in search, not opened; 2024 work on the same idea, and Nightjar gives a newer measured figure"},{"title":"XShare: in-batch expert sharing for mixture-of-experts inference (arXiv 2602.07265)","url":"https://arxiv.org/abs/2602.07265","reason":"abstract only, no engine or baseline named; kept as a link under the economics signal because it reports the same expert effect"},{"title":"Speculative Decoding in Production: Free Tokens and Hidden Traps","url":"https://tianpan.co/blog/2026-04-17-speculative-decoding-production-hidden-traps","reason":"seen in search, not opened; a practitioner post with no controlled numbers"}],"next_due":"2026-11-20","deep":true}],"glossary":[{"term":"AgentX","def":"The long-context, multi-turn workload inside SemiAnalysis's InferenceX benchmark. It imitates coding-agent traffic: a few very long contexts mixed with many short ones. It has become the shared scoreboard for the work tracked here."},{"term":"autotuning","aka":["autotunes","autotune"],"def":"Trying many settings of existing knobs (tile sizes, thread counts) on the target machine and keeping the fastest. No new code is written; contrast with agent search."},{"term":"compaction","def":"When an agent's history gets too long and the harness summarises it and starts a fresh context. The prompt cache is lost at that moment anyway, so it is a free point to switch model."},{"term":"concurrency","def":"How many requests a server is handling at once. Most speed tricks look best at a concurrency of one and fade as it rises."},{"term":"continuous compilation","aka":["continual compilation","Continuous Compilation"],"def":"Together AI's term for re-running its agent-driven optimiser as a deployment's traffic drifts, rather than compiling once at release."},{"term":"CUDA Graphs","def":"A way to record a fixed sequence of kernel launches once and replay it with far less per-launch overhead."},{"term":"decode","def":"The second phase: generating output tokens one at a time. Bound by memory bandwidth, and steady rather than bursty."},{"term":"draft length","aka":["draft lengths","speculation length","speculative length"],"def":"How many tokens the draft model guesses ahead before the large model checks them. Longer drafts gain more when the guesses are good and waste more when they are not, so the best length moves with the load."},{"term":"draft model","aka":["drafter","drafters","draft models","speculator","speculators"],"def":"The small fast model in speculative decoding that guesses the next few tokens for the large model to check. It is built for one exact target model."},{"term":"Dynamo","def":"NVIDIA's production framework for distributed LLM serving. The baseline several of these papers compare against."},{"term":"FlashInfer","def":"An open library of GPU kernels for LLM serving, used underneath SGLang and vLLM."},{"term":"harness","aka":["harnesses"],"def":"The program around the model that makes it an agent: the loop that sends prompts, runs tools and feeds results back. Claude Code and Codex are harnesses. Whoever owns it decides which model is called."},{"term":"hillclimb","aka":["hillclimbing","hillclimbs"],"def":"Inferact's word for a bounded optimisation run: agents repeatedly propose a change, measure it against a target, and keep it only if the number improves. Typically 24 to 30 hours on one metric."},{"term":"InferenceX","def":"SemiAnalysis's open benchmark of accelerators and serving engines. Every data point is a public GitHub Actions run, so results can be inspected rather than taken on trust."},{"term":"kernel","aka":["kernels"],"def":"A single program that runs on the GPU, such as one attention step or one matrix multiply. A forward pass is a sequence of kernel launches."},{"term":"KernelBench","def":"An academic benchmark that asks a model to rewrite PyTorch operators as faster GPU kernels and scores correctness and speed-up. Measures kernels in isolation, which is its main weakness."},{"term":"KV cache","aka":["KV caches"],"def":"The stored attention keys and values for tokens already processed. Reusing it means a long conversation does not have to be re-read from the start on every turn. For agents, which re-send huge contexts constantly, it is most of the cost."},{"term":"LoRA","aka":["adapter","adapters"],"def":"A small set of extra weights trained on top of a frozen model to specialise it. Many can be served from one copy of the base model, which is what makes a tuned model per customer affordable."},{"term":"megakernel","aka":["megakernels"],"def":"One long-running GPU program that executes a model's whole forward pass, instead of hundreds of small kernels launched one after another. Removes launch overhead, but is rigid: it bakes in one model shape and one chip."},{"term":"MoE","def":"Mixture of experts: a model architecture in which each token is routed to a few of many sub-networks. Which experts fire depends on the input, so benchmarks on random tokens mislead, and a small batch shares few of them.","aka":["mixture of experts","mixture-of-experts"]},{"term":"MTP","def":"Multi-token prediction: extra output heads trained into a model so it can draft its own next few tokens, removing the need for a separate draft model in speculative decoding."},{"term":"NVFP4","def":"NVIDIA's 4-bit floating-point weight format for Blackwell-generation chips. Cuts memory roughly fourfold against 16-bit weights."},{"term":"PD disaggregation","aka":["prefill-decode","PD split","prefill/decode split"],"def":"Running prefill and decode on separate groups of machines, because the two phases stress hardware differently. The split ratio is a tuning knob that goes stale when traffic changes."},{"term":"PDL","aka":["Programmatic Dependent Launch"],"def":"Programmatic Dependent Launch: a CUDA feature that lets the next kernel begin setting up before the previous one finishes. Recovers much of what a megakernel gains, without the fusion."},{"term":"post-training","aka":["post-train","post-trained"],"def":"Further training of an already-trained model on a specific domain or task, by fine-tuning on examples or by reinforcement learning against a grader."},{"term":"prefill","def":"The first phase of serving a request: running the whole prompt through the model to build its KV cache. Compute-bound and bursty."},{"term":"prompt cache","aka":["prompt caching","prefix cache"],"def":"Keeping the computed state of a prompt's opening so that a later request with the same opening does not pay to process it again. For agents, which re-send their whole history every turn, it is most of the bill. A cache belongs to one model on one machine."},{"term":"router","aka":["routers"],"def":"Software that chooses where something goes. Two different kinds appear here: one picks which model answers a session, the other picks which machine serves a request."},{"term":"RSI","aka":["recursive self-improvement"],"def":"Recursive self-improvement: a system that improves the thing that does the improving, so gains compound. In this field the term is used loosely for any agent loop that optimises inference. The strict version needs the loop to get better at optimising, not just to keep optimising."},{"term":"SGLang","def":"An open-source LLM serving engine, vLLM's main open rival. The base for both InferenceForge and Evolving Infra."},{"term":"shadow traffic","def":"Copying live production requests to a candidate system whose answers are discarded. Lets a change be judged on real workload before any user depends on it."},{"term":"SLA","def":"Service-level agreement. Here, a floor on per-user speed (for example 30 tokens per second per user) that a configuration must hold while throughput is pushed up. Throughput without an SLA is a much easier number to inflate."},{"term":"speculative decoding","def":"A small, fast draft model guesses several tokens ahead and the large model checks them in one pass. Speeds up decode when the guesses are usually right, which depends heavily on the workload."},{"term":"sub-agent","aka":["sub-agents","subagents"],"def":"A helper agent a main agent starts for a side task, with its own fresh context. Because it has no cache yet, it can be sent to a different model at no extra cost."},{"term":"TPOT","aka":["time per output token"],"def":"Time per output token during decode. The p99 version (the slowest 1% of tokens) is what users feel as stutter."},{"term":"trace replay","aka":["replay","replays","replayed"],"def":"Recording real sessions (their timing, lengths and shared openings, without the content) and playing them back against a candidate system, so it is judged on realistic load."},{"term":"TTFT","aka":["time to first token"],"def":"Time to first token: how long a user waits before any output appears. Dominated by prefill, so it grows with prompt length."},{"term":"vLLM","def":"The most widely used open-source LLM serving engine. Maintained largely by Inferact, the company founded by its creators."}]};</script>
<script>
(function () {
  'use strict';
  const D = window.DATA;
  const app = document.getElementById('app');
  if (!D) { app.textContent = 'No data in this file. Run: python3 scripts/build.py'; return; }

  // ---------- tiny DOM helpers (data is only ever inserted as text)
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  }
  function svg(tag, attrs, ...kids) {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
    for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: carry on */ } }
  };

  // ---------- dates
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmt = iso => { if (!iso || iso === 'undated') return 'undated'; const [y, m, d] = iso.split('-').map(Number); return d ? `${d} ${MON[m - 1]} ${y}` : `${MON[m - 1]} ${y}`; };
  const utc = iso => { const [y, m, d = 1] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const todayUtc = () => { const t = new Date(); return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayDiff = iso => Math.round((utc(iso) - todayUtc()) / 864e5);
  const rel = iso => { const n = dayDiff(iso); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; return n > 0 ? `in ${n} days` : `${-n} days ago`; };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const pct = v => Math.round(v * 100) + '%';

  // ---------- indexes
  const M = D.model;
  const allClaims = D.thesis.claims;
  const claims = allClaims.filter(c => c.status === 'active');
  const claimById = Object.fromEntries(allClaims.map(c => [c.id, c]));
  const sigById = Object.fromEntries(D.signals.map(s => [s.id, s]));
  const active = D.signals.filter(s => s.status === 'active');
  const latest = D.cycles[0] || {};
  const nameOf = (list, id) => (list.find(x => x.id === id) || { name: id }).name;
  const evidence = id => active.flatMap(s => (s.bears_on || []).filter(b => b.claim === id).map(b => ({ s, direction: b.direction, note: b.note })));
  const DIRS = [['supports', 'for'], ['complicates', 'mixed'], ['challenges', 'against']];
  const checks = (D.watch.checks || []);
  const openChecks = checks.filter(c => c.status === 'open').sort((a, b) => a.due.localeCompare(b.due));
  const seenKey = 'recursive-stack.seen';
  const seen = store.get(seenKey);
  const isNew = s => seen && s.added > seen;
  const orgShort = s => s.org.split(/[,(]/)[0].trim();

  const VERDICT = { holding: ['good', '✓', 'Holding'], sharpen: ['warn', '◐', 'Sharpen it'], unsupported: ['serious', '?', 'Unsupported so far'], wrong: ['crit', '✕', 'Contradicted'] };
  const VERIF = { 'third-party': ['good', '✓', 'Third-party'], 'public-run': ['good', '✓', 'Public run'], 'self-reported': ['warn', '!', 'Self-reported'], 'unverified': ['serious', '?', 'Unverified'] };
  const TSTAT = { open: ['serious', '?', 'Open'], leaning: ['warn', '◐', 'Leaning'], settled: ['good', '✓', 'Settled'] };
  const WSTAT = { open: ['warn', '◐', 'Open'], hit: ['good', '✓', 'Happened'], miss: ['crit', '✕', 'Did not happen'], dropped: ['serious', '–', 'Dropped'] };
  const LSTAT = { working: ['good', '✓', 'Works today'], bottleneck: ['warn', '!', 'Binding constraint'], unproven: ['serious', '?', 'Not yet shown'] };
  const pill = ([tone, icon, label]) => el('span', { class: `pill t-${tone}` }, el('span', { class: 'pill-i', 'aria-hidden': 'true' }, icon), label);
  const mech = id => el('i', { class: `mg m-${id}`, 'aria-hidden': 'true' });
  const sigLink = (s, label) => el('button', { class: 'link', type: 'button', onclick: () => openSignal(s.id) }, label || s.title);
  // One chip per source, labelled by publisher; when a publisher appears twice, add the start of the title to tell them apart.
  const srcChips = ids => { const list = [...new Set(ids)].filter(id => sigById[id]); const seen = {}; list.forEach(id => { const o = orgShort(sigById[id]); seen[o] = (seen[o] || 0) + 1; });
    return el('div', { class: 'chips' }, list.map(id => { const s = sigById[id], o = orgShort(s); return el('button', { class: 'chip', type: 'button', 'data-tip': s.title, onclick: () => openSignal(id) }, seen[o] > 1 ? `${o} · ${s.title.split(/[\s:,]+/).slice(0, 2).join(' ')}` : o); })); };
  const claimChip = (id, direction) => el('button', { class: 'chip', type: 'button', 'data-tip': claimById[id] ? claimById[id].statement : id, onclick: () => { closeSheet(); state.focusClaim = id; go('thesis'); } },
    direction ? el('span', { class: `dir dir-${direction}` }) : null, id, direction ? ` ${direction}` : null);
  const refLabel = ref => !ref ? '' : ` · ${sigById[ref] ? orgShort(sigById[ref]) : ref}`;
  const head = (eyebrow, title, sub) => el('div', { class: 'view-head' }, el('p', { class: 'eyebrow' }, eyebrow), el('h1', null, title), sub ? el('p', { 'data-prose': true }, sub) : null);
  const section = (title, note, ...body) => el('section', { class: 'sec' }, el('h2', null, title), note ? el('p', { class: 'sec-note', 'data-prose': true }, note) : null, body);
  const mechLegend = () => el('div', { class: 'legend' }, M.mechanisms.map(m => el('span', { 'data-tip': m.desc, tabindex: '0' }, mech(m.id), m.name)));

  const state = { mapMode: 'mechanism', loopSel: null, roster: 'recent', lever: null, sig: { q: '', layer: '', mechanism: '', venue: '', claim: '', kind: '', off: false }, led: { q: '', ver: '' }, focusClaim: null };

  // =====================================================================
  // FIGURES
  // =====================================================================
  function figShift() {

    return [head('Written before the answer is known', 'Watchlist', 'Dated checks. Each sweep resolves the ones that are due before it reads anything new.'),
      figWatch(),
      section('Pending', null, openChecks.length ? table(openChecks) : el('p', { class: 'muted' }, 'Nothing pending.')),
      closed.length ? section('Resolved', null, table(closed)) : null,
      section('Where each sweep looks', 'The standing sources. Hover one for why it is on the list.',
        el('div', { class: 'chips' }, (D.watch.feeds || []).map(f => el('a', { class: 'chip', href: f.url, target: '_blank', rel: 'noopener', 'data-tip': f.why, style: 'text-decoration:none' }, f.name))))];
  }

  // =====================================================================
  // SIGNALS
  // =====================================================================
  function signalCard(s) {
    return el('article', { class: 'card' + (s.status === 'active' ? '' : ' is-off') },
      el('p', { class: 'metaline' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, orgShort(s)), el('span', null, fmt(s.published)), el('span', null, nameOf(M.venues, s.venue)),
        s.status === 'active' ? null : el('span', null, s.status), s.read === 'relayed' ? el('span', { 'data-tip': 'Reported by a research sub-agent. The sweep agent has not yet read the page itself.', tabindex: '0' }, 'relayed') : null),
      el('h3', null, sigLink(s), isNew(s) ? el('span', { class: 'badge-new' }, 'new') : null),
      el('p', { 'data-prose': true }, s.changes),
      (s.bears_on || []).length ? el('div', { class: 'chips' }, s.bears_on.map(b => claimChip(b.claim, b.direction))) : null);
  }
  function viewSignals() {
    const st = state.sig;
    const listEl = el('div', { class: 'cards' });
    const count = el('span', { class: 'result-n' });
    const draw = () => {
      const q = st.q.toLowerCase();
      const hits = D.signals.filter(s => (st.off || s.status === 'active') && (!st.layer || s.layers.includes(st.layer)) && (!st.mechanism || s.mechanism === st.mechanism) && (!st.venue || s.venue === st.venue) && (!st.kind || s.kind === st.kind) && (!st.claim || (s.bears_on || []).some(b => b.claim === st.claim)) && (!q || [s.title, s.org, s.gist, s.changes, s.caveats, s.authors].join(' ').toLowerCase().includes(q)));
      count.textContent = `${hits.length} of ${D.signals.length}`;
      listEl.replaceChildren(...(hits.length ? hits.map(signalCard) : [el('p', { class: 'muted' }, 'Nothing matches. Clear a filter.')]));
      annotate(listEl);
    };
    const sel = (key, label, opts) => el('select', { id: `sig-${key}`, 'aria-label': label, onchange: e => { st[key] = e.target.value; draw(); } }, el('option', { value: '' }, label), opts.map(([v, t]) => el('option', { value: v, selected: st[key] === v }, t)));
    const kinds = [...new Set(D.signals.map(s => s.kind))].sort();
    const controls = el('div', { class: 'controls' },
      el('input', { type: 'search', id: 'sig-q', placeholder: 'Search signals', 'aria-label': 'Search signals', value: st.q, oninput: e => { st.q = e.target.value; draw(); } }),
      sel('claim', 'Any claim', claims.map(c => [c.id, `${c.id} · ${c.short}`])), sel('mechanism', 'Any means', M.mechanisms.map(l => [l.id, l.name])),
      sel('venue', 'Any place', M.venues.map(l => [l.id, l.name])), sel('layer', 'Any layer', M.layers.map(l => [l.id, l.name])), sel('kind', 'Any kind', kinds.map(k => [k, k])),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', id: 'sig-off', checked: st.off, onchange: e => { st.off = e.target.checked; draw(); } }), 'Show retired'), count);
    draw();
    return [head('The raw material', 'Signals', 'Each card says what the source changes. Select a title for the detail and the link.'),
      histogram(active), el('div', { class: 'sec' }, controls, listEl)];
  }

  // =====================================================================
  // LOG, GLOSSARY
  // =====================================================================
  function viewLog() {
    const every = D.meta.cadence_days === 1 ? 'One sweep a day' : `One sweep every ${D.meta.cadence_days} days`;
    const card = c => el('article', { class: 'card' },
        el('p', { class: 'metaline' }, el('span', null, `Cycle ${c.n}`), el('span', null, fmt(c.id)), el('span', null, c.agent), c.deep ? el('span', null, 'deep pass') : null, el('span', null, `next due ${fmt(c.next_due)}`)),
        (c.changes || []).length ? null : el('span', { class: 'tag' }, 'quiet day'),
        el('p', { style: 'color:var(--ink);font-size:15px', 'data-prose': true }, c.summary),
        el('ul', { class: 'changes' }, c.changes.map(ch => el('li', null, el('span', { class: 'tag' }, ch.type, refLabel(ch.ref)), el('span', null, ch.text)))),
        (c.rejected || []).length ? el('details', null, el('summary', null, `Looked at and left out (${c.rejected.length})`),
          el('ul', { class: 'plain-list' }, c.rejected.map(r => el('li', null, r.url ? el('a', { href: r.url, target: '_blank', rel: 'noopener' }, r.title) : r.title, ` · ${r.reason}`)))) : null);
    const recent = D.cycles.slice(0, 14), older = D.cycles.slice(14);
    return [head('What each sweep did', 'Cycle log', `${every}, and a deeper pass once a week. Each records what it changed, and what it looked at and left out.`),
      el('div', { class: 'cards' }, recent.map(card)),
      older.length ? el('details', null, el('summary', null, `Older cycles (${older.length})`), el('div', { class: 'cards', style: 'margin-top:10px' }, older.map(card))) : null];
  }
  function viewGlossary() {
    return [head('Words this field assumes you know', 'Glossary', 'Anywhere on the site, a dotted underline means the definition shows when you point at it.'),
      el('dl', { class: 'gl' }, D.glossary.map(g => el('div', null, el('dt', null, g.term), el('dd', null, g.def))))];
  }

  // =====================================================================
  // SIGNAL SHEET (the place for depth; everything else links here)
  // =====================================================================
  const sheet = document.getElementById('sheet');
  function closeSheet() { if (sheet.open) sheet.close(); }
  function openSignal(id) {
    const s = sigById[id];
    if (!s) return;
    const nums = s.numbers || [];
    sheet.replaceChildren(el('div', { class: 'sheet' },
      el('div', { class: 'sheet-head' },
        el('div', null, el('p', { class: 'stamp' }, [s.org, fmt(s.published), s.kind, s.status !== 'active' ? s.status : null].filter(Boolean).join(' · ')), el('h2', { id: 'sheet-title', style: 'margin-top:6px' }, s.title), s.authors ? el('p', { class: 'small', style: 'margin-top:4px' }, s.authors) : null),
        el('button', { class: 'ghost', type: 'button', onclick: closeSheet }, 'Close')),
      el('div', { class: 'chips', style: 'align-items:center' }, el('a', { class: 'cta', href: s.url, target: '_blank', rel: 'noopener' }, 'Read the source ↗'),
        (s.also || []).map(a => el('a', { class: 'chip', href: a.url, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, a.label + ' ↗')),
        s.read === 'relayed' ? el('span', { class: 'muted small' }, 'relayed, not yet read first-hand') : null),
      el('div', null, el('h4', null, 'What it changes'), el('p', { 'data-prose': true }, s.changes)),
      el('div', null, el('h4', null, 'What it is'), el('p', { 'data-prose': true }, s.gist)),
      el('div', null, el('h4', null, 'What to doubt'), el('p', { 'data-prose': true }, s.caveats)),
      el('div', null, el('h4', null, 'Where it sits'), el('p', { class: 'metaline', style: 'font-size:13px' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, nameOf(M.venues, s.venue)), el('span', null, s.layers.map(l => nameOf(M.layers, l)).join(', ')))),
      (s.bears_on || []).length ? el('div', null, el('h4', null, 'Bears on'), el('ul', { class: 'ev' }, s.bears_on.map(b => el('li', null, el('span', { class: `dir dir-${b.direction}` }), el('div', null, claimChip(b.claim, b.direction), el('p', { style: 'margin-top:4px' }, b.note)))))) : null,
      nums.length ? el('div', null, el('h4', null, 'Numbers'), el('div', { class: 'scroll-x' }, el('table', null, el('tbody', null, nums.map(n => el('tr', null, el('td', null, n.metric), el('td', { class: 'num' }, el('strong', null, n.value)), el('td', null, n.baseline), el('td', null, pill(VERIF[n.verification])))))))) : null,
      s.superseded_by && sigById[s.superseded_by] ? el('p', null, 'Superseded by ', sigLink(sigById[s.superseded_by])) : null));
    annotate(sheet);
    if (!sheet.open) sheet.showModal();
    sheet.scrollTop = 0;
  }
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  // =====================================================================
  // GLOSSARY ANNOTATION + TOOLTIP
  // =====================================================================
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const TERMS = D.glossary.flatMap(g => [g.term].concat(g.aka || []).map(t => ({ t, def: g.def, key: g.term }))).sort((a, b) => b.t.length - a.t.length)
    .map(x => ({ ...x, re: new RegExp('(^|[^A-Za-z0-9])(' + esc(x.t) + ')(?![A-Za-z0-9])', 'i') }));
  function annotate(root) {
    const used = new Set();
    root.querySelectorAll('[data-prose]').forEach(box => {
      const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        if (!node.parentElement || node.parentElement.closest('.gloss, button, a')) return;
        for (const term of TERMS) {
          if (used.has(term.key)) continue;
          const hit = term.re.exec(node.nodeValue);
          if (!hit) continue;
          const mid = node.splitText(hit.index + hit[1].length);
          mid.splitText(hit[2].length);
          mid.replaceWith(el('span', { class: 'gloss', tabindex: '0', 'data-tip': term.def }, mid.nodeValue));
          used.add(term.key);
          break;
        }
      });
    });
  }
  const tip = document.getElementById('tip');
  function showTip(target) {
    tip.textContent = target.getAttribute('data-tip');
    tip.hidden = false;
    const r = target.getBoundingClientRect(), t = tip.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - t.width - 8, r.left + r.width / 2 - t.width / 2));
    const below = r.bottom + 8 + t.height < window.innerHeight;
    tip.style.left = left + 'px';
    tip.style.top = (below ? r.bottom + 8 : Math.max(8, r.top - t.height - 8)) + 'px';
  }
  const tipTarget = e => e.target.closest && e.target.closest('[data-tip]');
  document.addEventListener('mouseover', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (tipTarget(e)) tip.hidden = true; });
  document.addEventListener('focusin', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  // =====================================================================
  // SHELL
  // =====================================================================
  const VIEWS = { now: viewNow, map: viewMap, build: viewBuild, who: viewWho, thesis: viewThesis, stack: viewStack, ledger: viewLedger, tensions: viewTensions, watch: viewWatch, signals: viewSignals, log: viewLog, glossary: viewGlossary };
  const TABS = [['now', 'Now'], ['map', 'Big picture'], ['build', 'Build'], ['who', 'Who'], ['thesis', 'Thesis'], ['stack', 'Stack map'], ['ledger', 'Evidence'], ['tensions', 'Tensions'], ['watch', 'Watch'], ['signals', 'Signals'], ['log', 'Cycle log'], ['glossary', 'Glossary']];
  const dueSoon = openChecks.filter(c => dayDiff(c.due) <= D.meta.cadence_days).length;
  const tabs = document.getElementById('tabs');
  tabs.append(...TABS.map(([id, label]) => el('a', { href: `#${id}`, 'data-tab': id }, label, id === 'watch' && dueSoon ? el('span', { class: 'count', title: 'Checks due by the next sweep' }, dueSoon) : null)));
  function go(id) { if (location.hash === `#${id}`) render(); else location.hash = id; }
  function render() {
    const id = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'now';
    tabs.querySelectorAll('a').forEach(a => { if (a.dataset.tab === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    app.replaceChildren(...[].concat(VIEWS[id]()).filter(Boolean));
    annotate(app);
    tip.hidden = true;
    const focus = id === 'thesis' && state.focusClaim ? document.getElementById(`claim-${state.focusClaim}`) : null;
    state.focusClaim = null;
    if (focus) focus.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);

  document.title = D.meta.title;
  document.getElementById('brand-name').textContent = D.meta.title;
  const status = document.getElementById('status');
  if (latest.id) status.append(el('span', null, 'Cycle ', el('b', null, latest.n)), el('span', null, 'swept ', el('b', null, fmt(latest.id))),
    el('span', null, 'next sweep ', el('b', null, dayDiff(latest.next_due) < 0 ? `overdue (${rel(latest.next_due)})` : rel(latest.next_due))));
  document.getElementById('foot').append(el('span', null, D.meta.tagline), el('span', null, D.meta.site ? [el('a', { href: D.meta.site }, 'Live page'), ' · '] : null, el('a', { href: D.meta.repo, target: '_blank', rel: 'noopener' }, 'Repository'), ' · generated from data/ · ', el('a', { href: '#glossary' }, 'Glossary')));

  const themeBtn = document.getElementById('theme');
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const paintTheme = () => { themeBtn.textContent = isDark() ? 'Light' : 'Dark'; themeBtn.setAttribute('aria-label', `Switch to ${isDark() ? 'light' : 'dark'} theme`); };
  const savedTheme = store.get('recursive-stack.theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('recursive-stack.theme', next); paintTheme(); });
  paintTheme();
  render();
})();
</script>
