.shift { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; }

/* ---------- figure: the lever map (a request's path, the model under it, the loop around it) */
.lmap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; display: grid; gap: 6px; }

/* ---------- figure: the build path */
.steps { display: grid; gap: 0; counter-reset: s; }

.impl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }

/* ---------- figure: loop ring */
.loop-fig { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }

.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px 14px; display: grid; gap: 10px; align-content: start; }

.frow { display: grid; grid-column: 1 / -1; grid-template-columns: minmax(0, 1.2fr) minmax(80px, 1.1fr) auto; grid-template-columns: subgrid; gap: 12px; align-items: center; padding: 6px; border: 0; background: none; text-align: left; border-radius: 6px; cursor: pointer; width: 100%; }
.frow:hover { background: var(--inset); }
.flabel { font-size: 13px; line-height: 1.3; }

.fbar { position: absolute; left: 0; top: 3px; height: 12px; border-radius: 0 4px 4px 0; background: var(--m-agent); }

.fbar.g2 { background: var(--m-frame); }

.fdot.is-to { background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }

.fig .cap { font-size: 12px; color: var(--ink-3); padding: 0 6px; }
.sw.g0 { background: var(--m-agent); } .sw.g1 { background: var(--m-rules); } .sw.g2 { background: var(--m-frame); }
.key-from { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); display: inline-block; }
.key-to { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ---------- figure: roster of who is building the loop */
.roster { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; }

.rrow:first-child { border-top: 0; }
.rrow:hover { background: var(--inset); }
.rrow .rdate { font: 400 12px/1.5 var(--font-data); color: var(--ink-3); }

.rwho span { font-size: 12.5px; color: var(--ink-2); }
.rwho small { font-size: 11.5px; color: var(--ink-3); }
.rgist { color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.rstage { justify-self: end; }
.rmark { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--m-agent); border: 2px solid var(--m-agent); }
.rmark.is-open { background: transparent; }
.rmark.is-online { border-radius: 1px; transform: rotate(45deg) scale(0.85); background: var(--m-online); border-color: var(--m-online); }
.rmark.is-online.is-open { background: transparent; }
.rmark.is-bad { border-color: var(--crit); background: transparent; }
.strip-mark { cursor: pointer; }
.strip-mark .shape { fill: var(--m-agent); stroke: var(--m-agent); stroke-width: 2; }
.strip-mark.is-open .shape { fill: var(--surface); }
.strip-mark.is-online .shape { fill: var(--m-online); stroke: var(--m-online); }
.strip-mark.is-online.is-open .shape { fill: var(--surface); }
.strip-mark.is-bad .shape { stroke: var(--crit); fill: var(--surface); }
.chart .tick { stroke: var(--line-2); stroke-width: 1; }
.more-link { font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.more-link:hover { text-decoration: underline; }

/* ---------- lists */
.changes { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.changes li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.changes .tag { padding-top: 3px; color: var(--accent); }
.reads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: r; }
.reads li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; counter-increment: r; }
.reads li::before { content: counter(r); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 12px/24px var(--font-data); text-align: center; }
.reads p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

/* ---------- claims */
.claims { display: grid; gap: 12px; }
.claim { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.claim-top { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 24px; padding: 18px 20px; }
.claim-id { font: 500 12px/1 var(--font-data); color: var(--accent); }
.claim h3 { font-size: 18px; margin-top: 6px; }
.claim .statement { margin-top: 8px; color: var(--ink-2); max-width: 64ch; font-size: 14px; }
.conf { display: grid; gap: 8px; align-content: start; }
.conf-n { font: 500 26px/1 var(--font-data); }
.conf-n small { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.meter { position: relative; height: 10px; border-radius: 0 4px 4px 0; background: var(--inset); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--accent); }
.meter b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.balance { display: flex; height: 10px; gap: 2px; }
.balance span { border-radius: 2px; min-width: 4px; }
.balance-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.balance-key span { display: inline-flex; align-items: center; gap: 5px; }
.claim-more { border-top: 1px solid var(--line); }
.claim-more > summary { padding: 10px 20px; list-style: none; display: flex; align-items: center; gap: 8px; }
.claim-more > summary::-webkit-details-marker { display: none; }
.claim-more > summary::before { content: "+"; font-family: var(--font-data); width: 12px; }
.claim-more[open] > summary::before { content: "−"; }
.claim-body { padding: 4px 20px 20px; display: grid; gap: 18px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.kv { display: grid; gap: 4px; }

.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ev li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.ev .dir { margin-top: 6px; }
.ev p { color: var(--ink-2); font-size: 13.5px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.hist li { display: grid; grid-template-columns: 96px 44px minmax(0, 1fr); gap: 10px; color: var(--ink-2); }
.spark { width: 110px; height: 28px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

/* ---------- stack map */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }

.map { min-width: 760px; }

.dots { display: flex; flex-wrap: wrap; gap: 2px; }

.clock { position: relative; padding: 22px 12px 0; display: grid; gap: 4px; align-content: start; }
.clock::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--line-2); }
.clock::after { content: ""; position: absolute; left: 12px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }
.clock h3 { font-size: 15px; }
.clock .num { font-size: 12px; color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.vbar { display: flex; gap: 2px; height: 34px; }

.v-third-party { background: var(--good); } .v-public-run { background: var(--supports); } .v-self-reported { background: var(--warn); color: #0b0b0b; } .v-unverified { background: var(--mixed); }

.ledger td { font-size: 13.5px; overflow-wrap: anywhere; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 7px; }

.sheet table { font-size: 13px; }

<script>window.DATA = {"meta":{"title":"The Recursive Stack","tagline":"A living read on one question: as inference becomes load-aware, and coding agents take over the tuning, what happens to the layer that serves the models? Updated daily by an agent that has to change its mind in public.","started":"2026-11-19","cadence_days":1,"repo":"https://github.com/shamanez/recursive-stack","site":"https://shamanez.github.io/recursive-stack/"},"model":{"_about":"Controlled vocabulary and the mental model the dashboard draws. Signals must use these ids. Change this file only when the picture itself changes (a new layer, a new way of producing optimisations) and say so in the cycle record.","layers":[{"id":"loop","name":"Optimisation loop","desc":"The agents, harnesses and scoreboards that produce optimisations. Nothing here serves a token; it decides what the layers below become."},{"id":"routing","name":"Routing & orchestration","desc":"Which model, worker or deployment configuration a request is sent to."},{"id":"serving","name":"Serving & scheduling","desc":"Batching, the prefill/decode split, KV-cache placement, eviction and transfer across a cluster."},{"id":"model","name":"Model-level","desc":"Changes to the weights or the decoding procedure: quantisation, distillation, speculative decoding, post-training."},{"id":"engine","name":"Engine & runtime","desc":"The forward-pass executor and its configuration: vLLM, SGLang, TensorRT-LLM, llama.cpp, MLX."},{"id":"compiler","name":"Compiler","desc":"Graph capture, fusion decisions and code generation between the model definition and the kernels."},{"id":"kernels","name":"Kernels","desc":"The GPU programs themselves: attention, MoE dispatch, GEMM, sampling, cache packing, on one specific chip."},{"id":"hardware","name":"Hardware","desc":"Accelerators and their memory and network topology."}],"mechanisms":[{"id":"hand","name":"Hand-tuned","desc":"A human performance engineer writes or configures it."},{"id":"rules","name":"Compiler rules","desc":"Fixed heuristics or cost models generate it. Deterministic, no learning from the deployment."},{"id":"online","name":"Online adaptive","desc":"The running system adjusts itself from live signals. No new code is written; a planner or controller moves knobs."},{"id":"agent","name":"Agent search","desc":"LLM agents propose code or configuration, a harness measures it, winners are kept. New code is written."},{"id":"frame","name":"Scoreboard / analysis","desc":"Benchmarks, critiques and essays. They optimise nothing, but they set what counts as winning."}],"venues":[{"id":"cluster","name":"Shared cloud","desc":"Multi-tenant serverless clusters run by an inference provider."},{"id":"dedicated","name":"Dedicated endpoint","desc":"Single-tenant cloud capacity tuned for one customer."},{"id":"onprem","name":"On-prem / private","desc":"Hardware the operator owns, in their own rack."},{"id":"local","name":"Local device","desc":"A laptop, workstation, phone or small box owned by the user."},{"id":"any","name":"Venue-neutral","desc":"Applies wherever the stack runs."}],"timescales":[{"id":"request","name":"Per request","span":"milliseconds","desc":"Routing a request to the worker that already holds its cache; choosing how far to speculate for this token."},{"id":"minutes","name":"Per traffic shift","span":"seconds to minutes","desc":"Re-splitting a cluster between prefill and decode; deciding which cached context to evict."},{"id":"days","name":"Per hillclimb","span":"hours to days","desc":"Agents rewriting kernels and engine paths against recorded traffic, then promoting the winners."},{"id":"release","name":"Per model or chip","span":"weeks","desc":"Bringing up a new architecture or accelerator on day zero."}],"loop":[{"id":"observe","name":"Observe","does":"Record what real traffic looks like: context lengths, cache hits, time per kernel.","hard":"Only whoever serves the traffic sees it, unless a public trace set stands in.","status":"working","signals":["2026-08-24-agentx-inferencex-v3","2026-10-28-decagon-autoresearch","2026-11-04-together-compiler"]},{"id":"propose","name":"Propose","does":"Agents write candidate kernels, engine patches or settings.","hard":"Cheap, and getting cheaper. A plain instruction has beaten expert-written playbooks.","status":"working","signals":["2026-11-16-together-deleted-megakernels","2026-10-02-baseten-agentic-engine","2026-11-09-inferenceforge"]},{"id":"evaluate","name":"Evaluate","does":"Measure each candidate on realistic inputs, end to end, and check outputs still match.","hard":"Synthetic inputs and isolated benchmarks give wrong answers. Nobody can yet simulate traffic they have not seen.","status":"bottleneck","signals":["2026-05-22-fastkernels","2026-11-16-together-deleted-megakernels","2026-09-22-swe-serve","2026-05-20-inferencebench"]},{"id":"promote","name":"Promote","does":"Ship winners to production and, often, upstream to the open engine.","hard":"People still review what ships, and patches now arrive faster than they can read them.","status":"working","signals":["2026-10-16-vllm-kimi-k3-megakernel","2026-11-inferact-autonomous-inference-system"]},{"id":"reflect","name":"Reflect","does":"Revise the agents' own process from what failed.","hard":"Everyone names it as the goal. Almost no one has shown it. This step is what would make the loop recursive.","status":"unproven","signals":["2026-10-03-seis-self-evolving-inference","2026-03-30-kernel-smith","2026-09-17-zai-glm-built-its-inference"]}],"shift":{"then":{"label":"Before: a craft","note":"Retuned when someone has time","steps":["One model","An engineer hand-tunes kernels","One configuration","Served to all traffic"]},"now":{"label":"Now: a search","note":"Runs continuously","steps":["Real traffic, replayed","Agents write candidate code","A rig measures end to end","Winners ship and go upstream"],"loop":"repeats per model, per workload, per chip"}}},"thesis":{"headline":"Inference is becoming *load-aware*: the stack now fits itself to the traffic.","subhead":"Six levers move with the load, from which model answers to which kernel runs. Coding agents are what make re-tuning them affordable.","intro":"Serving a large language model means a chain of decisions: which model answers, which machine takes the request, how a cluster is split between reading prompts and writing answers, how generation is sped up, and how it all runs on a particular chip. Each used to be set once, by hand. During 2026 they began to move with the load: with what is being asked, by whom, on what hardware. Coding agents made that affordable by taking over the tuning. This page maps the levers and how they connect, tracks who has each one working and what it has bought, and checks the claims against the evidence, including your own reading of it. An agent re-examines it every day.","picture":[{"head":"Six levers now move with the load","text":"Which model answers, which machine takes it, how the cluster is split, how tokens are written, how the engine runs, and what the model is. Four are in production somewhere.","signals":["2026-08-13-databricks-smart-routing","2026-08-17-llmd-sticky-until-saturated","2026-07-06-dspark","2026-11-04-together-compiler"],"more":"map"},{"head":"Ten teams have announced the same loop since October","text":"Agents that profile an engine, rewrite part of it, measure, and keep what wins. Providers, both open engines, academics and one customer. Fourteen more teams described versions earlier.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-11-09-inferenceforge","2026-10-16-vllm-kimi-k3-megakernel"],"more":"roster"},{"head":"The prompt cache ties the levers together","text":"Nine-tenths of agent tokens are re-read context, cached per model and per machine. That is why routing is sticky and why the model is chosen once per session.","signals":["2026-10-08-openrouter-cache-is-crucial","2026-08-13-databricks-smart-routing","2026-09-08-vllm-agentx"]},{"head":"Measuring is now harder than optimising","text":"Kernel speed-ups of several times shrink to almost nothing inside a full engine. Some agent runs game the benchmark. Patches arrive faster than people can review them.","signals":["2026-05-22-fastkernels","2026-05-20-inferencebench","2026-11-16-together-deleted-megakernels"]},{"head":"Not yet recursive, and the commons keeps up","text":"The loops are bounded hillclimbs with goals set by people; nothing compounds yet. Specialised wins reach vLLM and SGLang within weeks, and per-customer tuning has bought tens of percent.","signals":["2026-09-17-zai-glm-built-its-inference","2026-10-03-seis-self-evolving-inference","2026-10-23-vllm-matches-deepinfer","2026-09-23-modal-trillion-tokens"]}],"claims":[{"id":"C1","short":"Agents do real performance engineering","statement":"Given a harness built by people, coding agents now find and land inference optimisations that survive end-to-end measurement in production engines.","plain":"This is not autocomplete for CUDA. Agents are finding bottlenecks a senior engineer would be pleased to find, and the patches are being merged.","why":"If true, the supply of performance engineering stops being limited by the few hundred people who can do it. If false, everything else here is marketing.","confidence":0.7,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Founding estimate. Merged public pull requests in vLLM and SGLang carry it; independent benchmarks showing parity at best on isolated kernels, and search beating agents on configuration, hold it down."}],"raise_if":"An independent group reproduces a vendor's agent-found gain, or a benchmark with end-to-end scoring shows agents beating shipped kernels in LLM serving by a clear margin.","lower_if":"Merged agent-written optimisations get reverted for correctness, or matched-budget search keeps beating agents as budgets and models grow.","status":"active"},{"id":"C2","short":"What you have sets the optimum","statement":"The best serving configuration depends on what you are running: the traffic shape, the model and the chip. Kernels and settings tuned for one combination leave double-digit gains unclaimed on another, and all three keep changing.","plain":"There is no best way to serve a model, only a best way to serve this traffic, with this model, on this chip. Change any one and the old best stops being best.","why":"This is the centre of your framing: a stack that fits itself to what you have. If one good general recipe existed, there would be nothing for a loop to chase.","confidence":0.8,"history":[{"cycle":"2026-11-19","confidence":0.8,"why":"Founding estimate. Supported from many directions, including independent measurement. Held below 0.9 because nearly all of it comes from one workload class and one public trace set."},{"cycle":"2026-11-19","confidence":0.8,"why":"Scope widened the same day, after the reader said local means fitted to what you have. Per-device evidence that sat under the retired C8 now counts here. Confidence unchanged."}],"raise_if":"A second public workload that is not coding agents, or a second chip family, shows a different set of winning optimisations under like-for-like measurement.","lower_if":"Engines tuned on AgentX and NVIDIA hardware turn out near-optimal on other workloads and chips too, meaning one good general recipe exists after all.","status":"active"},{"id":"C3","short":"Specialisation reaches the single customer","statement":"Tuning the stack to one customer's own traffic is worth enough over a well-tuned class-level stack to justify doing it per customer, continuously.","plain":"Your workload gets its own engine build. This is the part of user-workload-aware that is still a bet.","why":"It decides whether the value sits with whoever holds each customer's traffic, or in shared engines that everyone gets for free.","confidence":0.35,"history":[{"cycle":"2026-11-19","confidence":0.35,"why":"Founding estimate. The like-for-like numbers that exist are 20 to 45%, recipes are reported to transfer between customers, and a general engine came within 6% of a bespoke one. The case for is that a bespoke engine now costs a couple of hundred GPU-hours."}],"raise_if":"A provider publishes same-endpoint numbers showing per-customer tuning beating its own class-level stack by more than about 1.5x, or the cost of a bespoke engine keeps falling.","lower_if":"More reports that recipes transfer between customers, or upstream engines closing announced private leads within a quarter.","status":"active"},{"id":"C4","short":"Evaluation is the scarce part","statement":"Proposing optimisations has become cheap. Knowing whether one is real (on realistic inputs, end to end, with outputs intact) is the binding constraint, together with the human review that still gates what ships.","plain":"The agent is not the hard part. The rig that catches a fake speed-up is.","why":"Whoever owns the best evaluation rig, or the traffic to build one, owns the loop. It also tells you which published numbers to discount.","confidence":0.8,"history":[{"cycle":"2026-11-19","confidence":0.8,"why":"Founding estimate. The vendors building the loops and the independent benchmarks criticising them say the same thing, with numbers. The one complication is that a public benchmark let outsiders compete without private traffic."}],"raise_if":"More merged regressions traced to weak gates, or providers competing on evaluation infrastructure instead of on agents.","lower_if":"A cheap, general oracle appears (for example simulated traffic that predicts production), or isolated kernel results start transferring end to end.","status":"active"},{"id":"C5","short":"The loop closes on itself","statement":"The optimisation loop is becoming recursive: the models being served power the agents that optimise their serving, the agents improve their own process, and gains compound from one cycle to the next.","plain":"This is the RSI claim. Today the first part is true, the second is mostly aspiration, and the third has not been shown by anyone.","why":"Compounding is the difference between a useful tool and a runaway advantage for whoever starts first.","confidence":0.3,"history":[{"cycle":"2026-11-19","confidence":0.3,"why":"Founding estimate. Models do serve their own optimisers, and two groups recycle search traces into training. Against that: curated knowledge made one production system worse, more time did not help agents in a benchmark, and the label is being attached to systems with no self-improvement in them."}],"raise_if":"A published curve where gain per cycle rises, or a model trained on optimisation traces that out-optimises its teacher on a production task.","lower_if":"Loops plateau after the first few rounds on each new model, or inherited agent memory keeps hurting in ablations.","status":"active"},{"id":"C6","short":"Churn forces automation","statement":"New model architectures and new chips now arrive faster than people can hand-tune for them. That, more than agent capability, is what makes an automated loop necessary.","plain":"By the time a person has tuned the kernels, traffic has moved to the next model. Something has to do day-zero support, and it will not be a person.","why":"It explains the timing, and for a provider serving many models it is the daily problem: every new model needs a drafter, a tuned engine and a correctness check before the traffic arrives.","confidence":0.7,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Founding estimate. Several independent accounts of the same pressure, including on chips with no kernel ecosystem. The main statistic behind it is one vendor's citation, and one new model reached near-parity by hand integration."}],"raise_if":"Time from a model's release to a tuned public result keeps shrinking and is credited to agents, or more non-NVIDIA chips reach parity through agent-written kernels.","lower_if":"Architectures converge again, or one vendor library covers new models well enough at release.","status":"active"},{"id":"C7","short":"The commons keeps up","statement":"Open engines absorb specialised wins within weeks, so a private performance lead over upstream vLLM or SGLang is short-lived.","plain":"If you can wait a month, you get most of it for free.","why":"This is the question of who keeps the gains: providers as margin, or everyone as cheaper tokens.","confidence":0.55,"history":[{"cycle":"2026-11-19","confidence":0.55,"why":"Founding estimate. Both open engines run agent loops themselves and take fixes upstream fast. Two providers claim private leads of roughly 2x that nobody outside has checked."}],"raise_if":"Announced private leads are matched by public runs within a quarter.","lower_if":"Those leads persist or widen, or key optimisations stop going upstream.","status":"active"},{"id":"C8","short":"The loop reaches hardware you own","statement":"The same self-tuning loop will run on stacks the user owns (a workstation, an on-prem box, a laptop), tuned to that user's own usage, not only in provider clusters.","plain":"This is the local in your framing. Today local stacks tune themselves to the device, once, by trying existing settings. Nothing tunes itself to you.","why":"It is the part of the reader's framing with the least support, so it is either the open ground or the mistake.","confidence":0.2,"history":[{"cycle":"2026-11-19","confidence":0.2,"why":"Founding estimate. One paper shows agent-written kernels on edge chips; everything else local is one-off autotuning or hand work. Cost analyses run against it, and the loop's economics lean on batching that a single user lacks."}],"raise_if":"An agent-driven loop on owned hardware shows a like-for-like gain from the owner's own traffic, or private fleets that are not hyperscalers publish such results.","lower_if":"Local runtimes keep converging on vendor compilers and one-off autotuning, and cost analyses keep favouring shared capacity.","status":"retired","retired_why":"Retired the day it was opened. It tested whether the loop reaches on-device hardware, which is not what the reader meant by local. The part that matters, the stack fitting whatever chip it finds, now sits under C2."},{"id":"C9","short":"Open and frontier models share the work","statement":"Open-weight and frontier models coexist behind one harness. Routine sessions go to a cheaper open model and hard ones to a frontier model, and the prompt cache decides how often that choice can be made.","plain":"Nobody picks one model any more. Something picks per session, and it cannot change its mind mid-session without paying to re-read everything.","why":"For a provider this sets what you serve. Open models carry most of the tokens and about a quarter of the money, and the routing decision is a product you can own or lose to the harness.","confidence":0.7,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Opened when the reader widened the frame. Coexistence is measured on two gateways and shipped by five products. Held down because an independent test found routers do not beat a fixed cheap model, and a static swap may capture most of the saving."}],"raise_if":"An independent agentic benchmark, with caching priced in, shows a shipped router beating the best fixed model on cost at equal quality.","lower_if":"Open models stall or frontier prices fall so that one model is simply best, or more products drop automatic routing.","status":"active"},{"id":"C10","short":"The model itself becomes a setting","statement":"Tuning an open model to one domain or harness (post-training, reinforcement learning, distillation) works as an inference optimisation: a smaller tuned model does a narrow job at lower cost and latency than a general one.","plain":"Instead of making a big model run faster, you make a small one good enough at your one job.","why":"For a provider this is the lever with the most lock-in and the shortest shelf life. A tuned model needs its own drafter and its own compiled engine, and it is tied to a base model that may be withdrawn within months.","confidence":0.45,"history":[{"cycle":"2026-11-19","confidence":0.45,"why":"Opened when the reader widened the frame. Named customers report real gains on narrow tasks, one measured by a third party. Against that: a tuner's own table shows a newer general model beating its tuned one, a frontier lab is withdrawing fine-tuning, and tunable bases churn within weeks."}],"raise_if":"A tuned open model shown head to head against a current frontier model on the customer's own task, with cost, and still ahead three months later.","lower_if":"More tuned models overtaken by the next general release within a quarter, or more providers withdrawing tuning products.","status":"active"}]},"signals":[{"id":"2026-11-18-datadog-fine-tune-baseten","title":"How we fine-tuned a faster model for Patterns on Baseten","url":"https://www.datadoghq.com/blog/fine-tuning-patterns-baseten/","org":"Datadog","published":"2026-11-18","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"agent","venue":"dedicated","gist":"Summarisation was most of the cost and half the latency of one product feature. The team distilled a month of a frontier model's production summaries into an adapter on a small open model. A coding agent ran the workflow, with a person approving each paid step.","changes":"A workload owner replacing a frontier model with a small tuned one for a single job, using its own production outputs as the teacher. It is also an agent working on the model lever, not the engine.","caveats":"Small evaluation, no head-to-head with the frontier teacher and no dollar figures. The authors say the untuned model mostly failed by running out of tokens; on answers it finished, both passed at the same rate. The base model had already been dropped from another provider's training list.","numbers":[{"metric":"Average generation time","value":"0.89 s against 44.7 s","baseline":"the same small open model untuned","verification":"self-reported","setup":"150 held-out cases"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A narrow job moved from a frontier model to a small tuned one, trained on the frontier model's own outputs."},{"claim":"C10","direction":"complicates","note":"Most of the measured gain was fixing truncation, not better answers."},{"claim":"C3","direction":"supports","note":"One company, one feature, its own traffic as training data."}],"read":"relayed","status":"active"},{"id":"2026-11-16-together-deleted-megakernels","title":"Last year we built megakernels. This year we deleted them","url":"https://www.together.ai/blog/road-to-together-compiler","org":"Together AI","authors":"Dylan Lim, Reyna Abhyankar, Simran Arora","published":"2026-11-16","added":"2026-11-19","kind":"blog","layers":["kernels","compiler","loop"],"mechanism":"agent","venue":"cluster","gist":"A retrospective on why Together abandoned fusing a whole forward pass into one GPU kernel. Simpler primitives recover nearly all of the gain, megakernels break across chips and architectures, and the rule-based compiler they built in between was too rigid. They now let agents rewrite the forward pass from source and measure on real inputs. Includes unusually frank ablations of their own agent scaffolding.","changes":"The best single source on why measuring is the hard part, with concrete cases of benchmarks lying. Its ablations cut against the idea that agents improve by accumulating curated knowledge: a plain instruction beat expert-written strategies.","caveats":"A vendor post. Baselines are not always fully specified and the product is early access through sales. The ablations are on one layer of one model. Two other teams are shipping agent-written megakernels in the same month.","numbers":[{"metric":"Llama 1B decode with CUDA Graphs and fine-grained PDL","value":"975 tok/s, 98% of the megakernel","baseline":"megakernel 990; compiler default 669","verification":"self-reported","setup":"H100"},{"metric":"Agent loop against hand-written megakernel","value":"2,118 vs 1,649 tok/s (+28%)","baseline":"the megakernel","verification":"self-reported","setup":"Llama 3.2 1B, B200"},{"metric":"One top-k kernel on random against real inputs","value":"20 microseconds vs 62 milliseconds","baseline":"the same kernel","verification":"self-reported"},{"metric":"Isolated compiler benchmark against live forward pass","value":"39 to 58% slower in isolation","baseline":"timing inside the live forward pass","verification":"self-reported"},{"metric":"Speed-up with a curated knowledge base","value":"4.75x, against 5.85x without it","baseline":"the same agent system without the knowledge base","verification":"self-reported","setup":"MiniMax-M3 layer 3, B200"},{"metric":"Six expert-written strategies against a plain instruction","value":"about 26% worse","baseline":"naive prompt","verification":"self-reported"},{"metric":"One compiler flag across batch sizes","value":"+10 to 26% at large batch, 49% slower at batch 1","baseline":"flag off","verification":"self-reported"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Synthetic inputs misled agents; isolated benchmarks were off by half; the harness timed a no-op at 2.5 microseconds."},{"claim":"C2","direction":"supports","note":"The same flag helps or hurts depending on batch size. A static kernel registry was tried and did not work."},{"claim":"C5","direction":"challenges","note":"Curated knowledge and expert strategies made the agents worse. Accumulated know-how is not yet compounding."},{"claim":"C1","direction":"supports","note":"Agent loops beat the team's own hand-written megakernel within a day."},{"claim":"C6","direction":"supports","note":"One megakernel could not span two attention types on a new chip; forcing it cost 5 to 19%."}],"also":[{"label":"Megakernel origin post (Hazy Research, 2025)","url":"https://hazyresearch.stanford.edu/blog/2025-05-27-no-bubbles"}],"read":"opened","status":"active"},{"id":"2026-11-09-inferenceforge","title":"InferenceForge: agents optimizing agentic serving","url":"https://agenteconomics.org/posts/inference-forge","org":"agenteconomics.org","authors":"Jesse Cai, Huimin Zeng, Yuxuan Lu, Dakuo Wang, Kai-Wei Chang","published":"2026-11-09","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"An off-the-shelf coding agent, placed in a custom environment with a harness and an evaluation suite, tuned SGLang for Kimi K3 under a floor on per-user speed. In nine iterations over three days it found three kernel-level fixes specific to agent traffic, where a few very long contexts share a batch with many short ones, and landed them as pull requests in a fork.","changes":"The first public case of outsiders with no production traffic topping the shared scoreboard using a general-purpose agent. The fixes are new code, not configuration, and each targets a traffic shape that uniform benchmarks never produce.","caveats":"Measured by the authors on one node. The comparison is against runs published by other teams on other dates, not a same-day rerun. The fixes sit in a personal fork, not upstream. The cost of the agent runs is not given.","numbers":[{"metric":"Kimi K3 throughput at 30 tok/s per user","value":"12.8k tok/s per GPU (+43%)","baseline":"8.9k, best published AgentX reference","verification":"self-reported","setup":"8x B300, one node"},{"metric":"Kimi K3 peak throughput","value":"16.2k tok/s per GPU (+29%)","baseline":"best published AgentX run (vLLM, 16 Aug)","verification":"self-reported","setup":"8x B300"},{"metric":"Decode step with one 900K-token request among 40","value":"522 to 126 microseconds","baseline":"before splitting long attention reads","verification":"self-reported","setup":"microbenchmark, B300"},{"metric":"Linear-attention recurrence per 32K chunk","value":"1,199 to 426 microseconds (2.8x)","baseline":"sequential scan","verification":"self-reported","setup":"B300"},{"metric":"Kimi K3.1 at 56 tok/s per user","value":"23.7k tok/s per GPU (+5%)","baseline":"22.6k at 53, best published SGLang run (5 Nov)","verification":"self-reported","setup":"8x B300"}],"bears_on":[{"claim":"C1","direction":"supports","note":"A general coding agent found and validated three kernel fixes, bit-exact where claimed."},{"claim":"C2","direction":"supports","note":"All three fixes exist only because agent traffic mixes very long and short contexts in one batch."},{"claim":"C4","direction":"complicates","note":"A public replayable workload stood in for private traffic. Outsiders could play, which weakens the idea that only traffic owners can evaluate."},{"claim":"C5","direction":"supports","note":"States a plan to put the authors' own models, post-trained for optimisation, into the loop. A plan, not a result."},{"claim":"C7","direction":"supports","note":"On the newest model the lead over the best public run is 5%. The public frontier is close behind."}],"also":[{"label":"SGLang fork","url":"https://github.com/jcaip/sglang-fork"}],"read":"opened","status":"active"},{"id":"2026-11-09-evolving-infra","title":"Evolving Infra: agent-adaptive LLM serving at scale","url":"https://inference-rsi.com","org":"MIT HAN Lab with Georgia Tech, UIUC, UC Berkeley, NVIDIA, OpenAI","authors":"Hao Kang, Weili Xu, Ziyang Li, Zheng Du, Hanchen Li, Tian Xia, Song Bian, Tushar Krishna, Huizi Mao, Ion Stoica, Song Han","published":"2026-11-09","added":"2026-11-19","kind":"paper","layers":["serving","routing"],"mechanism":"online","venue":"cluster","gist":"A serving system for agent workloads in which every node can do prefill or decode and switch between them in seconds without restarting. A planner fits a timing model online and re-splits the cluster as traffic shifts. A cluster-wide directory keeps cached context that agents are waiting to reuse and evicts what they have abandoned.","changes":"The non-agent half of the story. Nothing here writes code: a controller moves knobs from live signals. It shows large gains from adapting to the workload at the timescale of minutes, and that adaptive and agent-driven are separate ideas being sold under one label.","caveats":"The project lives at a domain named for inference RSI, yet neither the page nor the paper claims self-improvement. The page says both that it is open source and that code is coming soon. The headline revenue figure is throughput multiplied by list prices, not money earned. The baseline is NVIDIA Dynamo as configured by the authors.","numbers":[{"metric":"Mean end-to-end latency, 126 coding agents on GLM-5.2","value":"54.4 s to 13.0 s (4.2x lower)","baseline":"Dynamo with SGLang","verification":"self-reported","setup":"36 GB300 GPUs, one run"},{"metric":"P95 TTFT, same run","value":"228.4 s to 19.6 s (11.7x lower)","baseline":"Dynamo with SGLang","verification":"self-reported","setup":"36 GB300 GPUs"},{"metric":"Throughput under a workload that shifts across three phases","value":"1.28x","baseline":"the best static prefill/decode split","verification":"self-reported","setup":"Kimi K2.6"},{"metric":"Time to switch a node between prefill and decode","value":"6.2 s while still serving","baseline":"754 s out of service on Dynamo","verification":"self-reported"},{"metric":"Cost of adapting online when traffic is steady","value":"0.3% of throughput","baseline":"no adaptation","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best static split loses 28% as soon as the traffic mix moves."},{"claim":"C5","direction":"challenges","note":"The RSI label is attached, as a domain name, to a system with no self-improvement in it. The word is running ahead of the work."},{"claim":"C1","direction":"complicates","note":"Gains this large came from a classical online controller. Not every adaptive win needs an agent."}],"also":[{"label":"arXiv 2611.12304","url":"https://arxiv.org/abs/2611.12304"}],"read":"opened","status":"active"},{"id":"2026-11-04-vllm-sglang-controlled-evaluation","title":"A controlled experimental evaluation of configuration and cache architecture in LLM serving engines","url":"https://arxiv.org/abs/2611.05991","org":"Muhammad Faizan Anwar, Sina Keshvadi","published":"2026-11-04","added":"2026-11-19","kind":"critique","layers":["engine","serving"],"mechanism":"frame","venue":"any","gist":"Much of the reported gap between the two main open engines on a multi-agent workload comes from one default setting, not from architecture.","changes":"A warning about every engine-against-engine number here: a single flag explained most of the largest gap. Part of what gets called specialisation is noticing a bad default.","caveats":"Only the abstract has been read. A real tail-latency advantage survives at equal throughput, attributed to cache-aware request ordering.","numbers":[{"metric":"Share of the largest capacity gap removed by matching one setting","value":"78%","baseline":"both engines at defaults","verification":"third-party"}],"bears_on":[{"claim":"C3","direction":"challenges","note":"If one flag is most of the gap, much of the gain from tuning per deployment is available to anyone who reads the documentation."},{"claim":"C4","direction":"supports","note":"Comparisons between engines hinge on defaults. Baselines are fragile."},{"claim":"C2","direction":"complicates","note":"Some of what looks like workload-specific optimum is one setting that was wrong for everyone."}],"read":"relayed","status":"active"},{"id":"2026-11-04-together-polymorphic-inference","title":"Polymorphic inference","url":"https://www.together.ai/blog/polymorphic-inference","org":"Together AI","authors":"Simran Arora, Dan Fu","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["loop","compiler","routing","model"],"mechanism":"agent","venue":"cluster","gist":"A positioning piece: inference should change form as models, traffic and chips change, instead of shipping one hand-tuned configuration. It names the Together Compiler as the first piece, with adaptive speculative decoding, workload-aware model routing and per-customer post-training to follow, and calls the compiler loop recursive self-improvement at production scale.","changes":"Supplies the churn argument in one statistic and the vocabulary, static against polymorphic, that others are picking up. It is also the most explicit commercial claim to the RSI label.","caveats":"No performance numbers of its own. The RSI claim is the company's characterisation; the companion technical post does not use the phrase or describe agents improving themselves. Most of the agenda is planned, not shipped, and per-customer compilation is a limited beta.","numbers":[{"metric":"Share of OpenRouter traffic on models released in the last three months","value":"80%","baseline":"market observation cited by Together, not independently checked","verification":"unverified"}],"bears_on":[{"claim":"C6","direction":"supports","note":"If four-fifths of traffic is on models under three months old, nothing hand-tuned stays relevant for long."},{"claim":"C5","direction":"complicates","note":"Claims the label outright; the evidence for the recursive part is not shown."},{"claim":"C3","direction":"complicates","note":"Per-customer continuous compilation exists, but only as a limited beta on request."}],"read":"opened","status":"active"},{"id":"2026-11-04-together-compiler","title":"Together Compiler: continual compilation for AI inference","url":"https://www.together.ai/blog/together-compiler-continual-compilation-for-ai-inference","org":"Together AI","authors":"Reyna Abhyankar, Dylan Lim, Simran Arora","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["loop","compiler","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"The technical description. Inputs are a traffic shape, a model and a chip. Parallel agents propose changes to the engine's forward pass and share findings on a message board. The enabling trick is infrastructure: an engine that stays up and hot-reloads candidates, in a fast tier with a few layers and a slow tier with the full model on real data, plus a cost model that prunes parallelism layouts.","changes":"Shows that the investment is in the evaluation rig, not the agent. Cutting engine start-up from minutes to seconds is what makes hundreds of experiments affordable.","caveats":"Says nothing about how output correctness is checked, how drift is detected, or how often recompilation runs. The companion paper concedes one headline comparison sets their 8-way parallel run against a published 4-way one. Page metadata says 3.7x where the text says 2.6x.","numbers":[{"metric":"Throughput on four models","value":"up to 2.6x","baseline":"best published AgentX configurations of open engines","verification":"self-reported"},{"metric":"Engine start-up per experiment","value":"467 s to 9 s","baseline":"restarting a standard engine","verification":"self-reported"},{"metric":"Experiments per unit time","value":"252x","baseline":"other agentic performance-optimisation systems, unnamed","verification":"self-reported"},{"metric":"Prompt length in one region's working hours","value":"about 1.4x longer (97k vs 70k tokens)","baseline":"other hours","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Agent search in production on serverless endpoints, by their account."},{"claim":"C4","direction":"supports","note":"A two-tier engine exists because timings on a few layers do not predict the full model on real data."},{"claim":"C2","direction":"supports","note":"Prompt lengths rose about 80% in the two weeks after a model release. The target moves."},{"claim":"C7","direction":"challenges","note":"Claims a private lead of up to 2.6x over the best public configurations."}],"read":"opened","status":"active"},{"id":"2026-11-04-cognition-swe-2-flash","title":"Introducing SWE-2 Flash","url":"https://cognition.com/blog/swe-2-flash","org":"Cognition","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"any","gist":"A coding-agent company took an open-weight model, added a large mid-training stage and then reinforcement learning in its own harness, and ships the result as a fast cheap tier. Most of the gain is credited to better training tasks.","changes":"Counter-evidence from the tuner's own table: an off-the-shelf open model released around the same time scores about twice as high on the same benchmark as the tuned one.","caveats":"Self-reported; compute, task counts and prices are not disclosed and the weights are not public. The comparison models were run in different harnesses.","numbers":[{"metric":"Terminal task benchmark","value":"20.0 for the tuned model, 42.3 for an untuned general open model","baseline":"the tuned model's own base scored 0.9","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"challenges","note":"In the tuner's own table, a newer general open model beats the tuned one by a wide margin."}],"read":"relayed","status":"active"},{"id":"2026-11-03-modelblaster","title":"ModelBlaster: learning-augmented agents across models, kernels and hardware backends","url":"https://arxiv.org/abs/2611.04104","org":"Shengjun Kris Dong, Christos Kozyrakis et al.","published":"2026-11-03","added":"2026-11-19","kind":"paper","layers":["kernels","compiler","loop"],"mechanism":"agent","venue":"local","gist":"An agent whose policy is a persistent knowledge base, updated from textual feedback as it works instead of by retraining. Knowledge learned optimising single kernels is reused for whole-model decisions, across a datacenter GPU, a phone GPU and a RISC-V vector chip.","changes":"The only result so far of agent-written kernels on edge-class chips, where it beats the vendor's own SDK. It also bets the opposite way from Together on whether accumulated knowledge helps.","caveats":"Two weeks old. The abstract does not name the edge devices or the benchmark suite. Its datacenter results are on the benchmark shown to overstate.","numbers":[{"metric":"Phone GPU (Qualcomm Adreno, OpenCL)","value":"5.8x over the vendor SDK; 1.7x over Apache TVM","baseline":"vendor SDK and TVM","verification":"self-reported"},{"metric":"RISC-V vector chip","value":"2.7x","baseline":"ExecuTorch with XNNPACK","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"supports","note":"The agent's policy is a knowledge base that updates as it works."},{"claim":"C6","direction":"supports","note":"One agent, three unlike backends."},{"claim":"C2","direction":"supports","note":"The same agent produced different winning kernels for a datacenter GPU, a phone GPU and a RISC-V chip."}],"read":"relayed","status":"active"},{"id":"2026-11-02-fireflash-agentic-rl-recipe","title":"Agentic RL recipe (FireFlash)","url":"https://agenteconomics.org/posts/agentic-rl-recipe","org":"agenteconomics.org","published":"2026-11-02","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"hand","venue":"any","gist":"An open recipe for reinforcement learning on a large open model for long terminal and coding tasks: separate trainer and rollout GPUs, a filter that keeps only tasks of middling difficulty, verification gates per task, and one harness for both training and evaluation. From the group behind InferenceForge, who say they will put this model into their optimisation loop.","changes":"Gives the price of the model lever when done fully: about 64 top-end GPUs for five days. And it links two levers: the model being trained is meant to become the agent that tunes its own serving.","caveats":"Self-reported in the authors' own harness, with no variance. The harness alone accounts for about half the gain. The cost per trial assumes the base model's list price. No code or weights are linked despite the word released.","numbers":[{"metric":"Terminal task benchmark, pass at first try","value":"35.8 to 46.2","baseline":"the base model; the harness alone gives 40.2","verification":"self-reported"},{"metric":"Cost per trial","value":"$0.72 against $22.02","baseline":"a frontier model at maximum effort, at list prices","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A tuned open model at a thirtieth of a frontier model's cost per trial on the authors' benchmark."},{"claim":"C5","direction":"supports","note":"The stated plan is to use this model as the agent in the inference loop. Still a plan."}],"read":"relayed","status":"active"},{"id":"2026-11-inferact-autonomous-inference-system","title":"Building an autonomous inference system","url":"https://inferact.ai/news/building-autonomous-inference-system","org":"Inferact","authors":"Simon Mo","published":"2026-11","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"The company behind vLLM sets out its north star: a system that watches production workloads, has agents write candidate kernels and engine paths, tests them alone and then end to end against shadow traffic, promotes winners to production and upstream, and revises its own process. Its internal agent system, Agent V, already runs bounded hillclimbs of 24 to 30 hours on single metrics. The author says plainly that the full loop is not built.","changes":"The clearest statement of the whole loop, from the people who maintain the most-used open engine, with production numbers on current models. It also shows the recursion in its weak form: Agent V runs mostly on a model Inferact serves itself.","caveats":"Every number is Inferact's own. The self-revising part is an illustrative day in the life, not a result. They state they cannot yet simulate traffic they have not seen, which is the step that would let the loop run without production access.","numbers":[{"metric":"TTFT at 800k context, Kimi K3.1 on GB300","value":"2.78x faster","baseline":"own engine before a 24-hour hillclimb","verification":"self-reported"},{"metric":"p99 time per output token, Kimi K3.1","value":"35% lower","baseline":"own engine before a 30-hour hillclimb","verification":"self-reported"},{"metric":"Throughput per GPU, Kimi K3 on GB300","value":"0.77M to 1.4M tokens/min (about 1.8x)","baseline":"own production, mid-September to end of October","verification":"self-reported"},{"metric":"Agent V sessions running on self-hosted Kimi K3","value":"79% of sessions, 53% of tokens","baseline":"remainder on other models","verification":"self-reported"},{"metric":"TTFT from expert-parallel prefill, MiniMax M3.1","value":"60 to 70% lower","baseline":"own engine before the patches","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Production hillclimbs on current models, with before-and-after numbers."},{"claim":"C4","direction":"supports","note":"Isolated wins often fail end to end, so every candidate must pass full serving benchmarks and shadow traffic. They cannot yet simulate unseen traffic."},{"claim":"C5","direction":"supports","note":"Agent V runs mostly on a model Inferact serves. Agents rewriting their own process is described as a goal, not shown."},{"claim":"C6","direction":"supports","note":"Day-zero images for a new model on two chip vendors; the search space is framed as thousands of models times a thousand chip architectures."},{"claim":"C7","direction":"supports","note":"Upstream-first by policy: every engine optimisation goes back to vLLM."},{"claim":"C3","direction":"complicates","note":"Promises to tailor the engine to each workload, but gives no per-customer mechanism or number."},{"claim":"C2","direction":"supports","note":"Tunes per workload target and per chip: separate day-zero builds for NVIDIA and AMD, and a search space counted in models times chip architectures."}],"also":[{"label":"Pipeline parallelism write-up","url":"https://inferact.ai/news/pipeline-parallelism-in-agentic-era"}],"read":"opened","status":"active"},{"id":"2026-10-28-decagon-autoresearch","title":"Building an inference stack that improves itself","url":"https://x.com/DecagonAI/status/2115511110120120437","org":"Decagon","authors":"Pavi Dhiman, Cyrus Asgari","published":"2026-10-28","added":"2026-11-19","kind":"blog","layers":["loop","serving","model","engine"],"mechanism":"agent","venue":"dedicated","gist":"Not an inference provider but a customer-service AI company tuning its own endpoints. An orchestrator replays redacted production traffic, profiles, and spawns sub-agents that must each return an explanation, an intervention, a prediction and a test that could falsify it. Confirmed gains become the new baseline.","changes":"The first case here of the loop being run by the workload's owner on its own traffic, not by a provider. It is the closest thing to a user-workload-aware stack, and it lives on rented cloud GPUs.","caveats":"Unverifiable. Each row uses a different baseline, so the gains do not add. The largest come from known levers (quantisation, n-gram speculation), not new engine work. People start the loop and approve deployment.","numbers":[{"metric":"Requests/s per GPU within the latency SLA, 8-bit weights plus n-gram speculation","value":"2.50x","baseline":"that endpoint's starting configuration","verification":"self-reported"},{"metric":"Combined engine patches","value":"1.99x","baseline":"that endpoint's starting configuration","verification":"self-reported"},{"metric":"Draft model adapted to own traffic","value":"1.34x","baseline":"the production draft model","verification":"self-reported"}],"bears_on":[{"claim":"C3","direction":"supports","note":"One company, its own traffic, its own loop. The like-for-like part (the adapted drafter) is 1.34x."},{"claim":"C1","direction":"supports","note":"Sub-agents must state a falsifiable prediction before a change is accepted."},{"claim":"C4","direction":"supports","note":"Replayed production traffic is the evaluation rig."}],"read":"relayed","status":"active"},{"id":"2026-10-28-agent-loop-learns-new-accelerator","title":"A case study of a multi-agent kernel-optimization loop that learns a new AI accelerator","url":"https://arxiv.org/abs/2610.38329","org":"Byonggon Chun","published":"2026-10-28","kind":"paper","layers":["kernels","loop","hardware"],"mechanism":"agent","venue":"any","gist":"An agent loop built for a chip the models have barely seen: an NPU programmed in a new, thinly documented Rust DSL. The loop first builds its own knowledge of the target, by summarising and checking the documentation, microbenchmarking the chip and recording what the compiler allows, and rechecks it when the toolchain changes. Over 12 days it optimised three decode kernels for a 12B model.","changes":"The clearest case of the loop fitting itself to hardware it has to learn first. The knowledge it accumulates is its own and gets re-tested, which is the kind that seems to help.","caveats":"One author's case study and a competition entry. Three kernels measured alone on a shared device, with no end-to-end serving result. The abstract does not say how much a person steered it.","numbers":[{"metric":"Three decode kernels, geometric mean","value":"9.29x","baseline":"the vendor's official baseline kernels","verification":"self-reported","setup":"FuriosaAI RNGD NPU, Gemma-4-12B"}],"bears_on":[{"claim":"C6","direction":"supports","note":"A chip with almost no kernel ecosystem and sparse documentation, brought up by an agent loop in 12 days."},{"claim":"C2","direction":"supports","note":"The winning kernels came from measuring this chip's own limits, not from general CUDA knowledge."},{"claim":"C5","direction":"complicates","note":"The loop builds and re-tests its own knowledge of the target. That accumulation helped; it is not the loop improving itself."},{"claim":"C4","direction":"supports","note":"Device time was scarce and noisy, so cheap checks screened designs and late changes needed repeated comparisons."}],"added":"2026-11-19","read":"opened","status":"active"},{"id":"2026-10-26-autobench-do-routers-route","title":"Do LLM routers actually route? Quick answer: not much","url":"https://huggingface.co/blog/PeterKruger/router-benchmark-2026-10","org":"AutoBench","authors":"Peter Kruger","published":"2026-10-26","added":"2026-11-19","kind":"critique","layers":["routing"],"mechanism":"frame","venue":"any","gist":"Seven commercial and open routers in 17 settings, tested on 252 open-ended prompts against a pool of 20 models. None beat simply always calling a cheap strong model on quality and cost together, and several collapsed to sending nearly everything to one model.","changes":"The counter-case for the model-choice lever. If a router cannot beat the cheap strong default, the lever reduces to picking that default well and revisiting it when models change.","caveats":"Single-turn prompts with an LLM judge; agentic work is left for later. Several routers could reach only part of the pool. The author sells router benchmarking.","numbers":[{"metric":"Routers beating the cheap strong model on cost and quality together","value":"0 of 17 settings","baseline":"always calling one cheap strong model","verification":"third-party"},{"metric":"Settings where one model received at least 90% of decisions","value":"5 of 17","baseline":"all settings tested","verification":"third-party"}],"bears_on":[{"claim":"C9","direction":"challenges","note":"Independent test: routing did not beat a fixed cheap model."},{"claim":"C4","direction":"supports","note":"Vendors report 30 to 60% savings; an outside test finds none. Same lever, different rig."}],"read":"relayed","status":"active"},{"id":"2026-10-23-vllm-matches-deepinfer","title":"Serving DeepSeek-V4.1-Flash at scale: vLLM matches DeepInfer","url":"https://vllm.ai/blog/2026-10-23-deepseek-v41-flash-pd-wide-ep","org":"Inferact and the vLLM team","published":"2026-10-23","added":"2026-11-19","kind":"blog","layers":["kernels","engine","serving"],"mechanism":"hand","venue":"any","gist":"With the model vendor's kernels integrated, upstream vLLM came close to the vendor's own bespoke engine on decode, then scaled out with prefill/decode disaggregation and wide expert parallelism.","changes":"The best evidence that the commons keeps pace: the general engine landed within a few percent of one built by the model's own authors for that single model.","caveats":"The vendor's figures were read off charts and its hardware is unstated. Prefill setups differ. The vendor's engine was itself originally built on vLLM.","numbers":[{"metric":"Decode against the model vendor's own engine","value":"within 6% across batch 8 to 256","baseline":"DeepInfer's published curve","verification":"self-reported","setup":"GB200"}],"bears_on":[{"claim":"C7","direction":"supports","note":"A general open engine within 6% of a single-model bespoke one."},{"claim":"C3","direction":"challenges","note":"If a bespoke engine for one model buys 6%, per-customer builds have little room."},{"claim":"C6","direction":"complicates","note":"This parity came from people integrating the vendor's kernels by hand, quickly. Churn was absorbed without an agent loop."}],"read":"relayed","status":"active"},{"id":"2026-10-19-together-post-training","title":"Together Post-Training","url":"https://www.together.ai/blog/together-post-training","org":"Together AI","published":"2026-10-19","added":"2026-11-19","kind":"product","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"A service for building custom models on open-weight bases by reinforcement learning or supervised fine-tuning. The customer writes the training loop and Together runs the trainer and the rollout fleet, which reuses its serving stack. Trained adapters can be swapped inside one deployment, and checkpoints are served on the numerics they were trained with.","changes":"Tuning the model is being sold as part of the serving stack by the same provider that sells the compiler and the router. Serving many adapters from one deployment is what keeps a tuned model per customer affordable.","caveats":"No benchmark or cost numbers: two customer statements and a promotional price. It does not say how training connects to the compiler or to speculative decoding.","numbers":[],"bears_on":[{"claim":"C10","direction":"supports","note":"A provider ships model tuning alongside its inference products, with one customer reporting a closed model's quality matched offline."},{"claim":"C3","direction":"supports","note":"Many adapters sharing one deployment lowers the cost of a model per customer."}],"read":"opened","status":"active"},{"id":"2026-10-16-vllm-kimi-k3-megakernel","title":"Hyper optimizing Kimi K3 in vLLM: moving fast and responsibly","url":"https://vllm.ai/blog/2026-10-16-kimi-k3-megakernel","org":"vLLM project (NVIDIA, Inferact, Red Hat)","authors":"Benjamin Chislett","published":"2026-10-16","added":"2026-11-19","kind":"blog","layers":["kernels","engine","loop"],"mechanism":"agent","venue":"any","gist":"Coding agents helped write a fused decode path for one model on one chip, merged into vLLM. The post's real subject is process: agent-written optimisations now arrive faster than maintainers can read them, so it proposes isolating them in per-model directories and having reviewers judge evidence (full-model evaluations plus kernel tests) instead of every line.","changes":"Public, merged proof that agent-written kernel work is in the main open engine, and an admission that human review is now the queue. Also the opposite bet to Together's on megakernels, in the same month.","caveats":"Agent-assisted, not autonomous; the loop is not described. Headline numbers exclude prefill and use synthetic acceptance. One approving reviewer said they had not read all the kernel code. Standalone kernel tests missed a compiler reordering bug and numerical issues.","numbers":[{"metric":"Per-layer decode, Kimi K3 on GB300","value":"about 130 microseconds and 23 kernels, down to 69 and 13","baseline":"stock vLLM","verification":"public-run","setup":"merged pull request"},{"metric":"Aggregate decode throughput","value":"1.31x to 1.92x","baseline":"stock vLLM, batch 1 to 64","verification":"public-run"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Agent-written kernel code, merged upstream, with model-level evaluations attached."},{"claim":"C4","direction":"supports","note":"Review capacity is the stated limit, and the existing test gates missed real bugs."},{"claim":"C7","direction":"supports","note":"The work landed in the commons the day it was announced."}],"also":[{"label":"RFC: fast-track for agent-written optimisations","url":"https://github.com/vllm-project/vllm/issues/59665"}],"read":"relayed","status":"active"},{"id":"2026-10-14-vllm-byog-evals-rfc","title":"RFC: bring-your-own-GPU evaluations for model-optimisation changes","url":"https://github.com/vllm-project/vllm/issues/61698","org":"vLLM maintainers","authors":"Lucas Wilkinson","published":"2026-10-14","added":"2026-11-19","kind":"repo","layers":["loop","engine"],"mechanism":"frame","venue":"any","gist":"A proposal that vLLM's CI build a signed evaluation image per commit which anyone can run on their own GPUs, with results going to a public database. It states that greedy decoding is not bit-reproducible once batch composition changes, so correctness has to be judged by calibrated task-level tolerances plus a check on token probabilities.","changes":"Shows how weak the usual correctness gate is. In the discussion, a standard task benchmark caught one of seven known numerical bugs when they were replayed, and passed a run in which the engine had crashed.","caveats":"A proposal, still open; results would be informational, not blocking. The figures come from a comment in the thread, not a study.","numbers":[{"metric":"Known numerical bugs caught by a standard task-score gate","value":"1 of 7","baseline":"seven historical bugs replayed","verification":"third-party","setup":"reported in the RFC discussion"}],"bears_on":[{"claim":"C4","direction":"supports","note":"The gate most teams use misses six of seven real numerical bugs."},{"claim":"C7","direction":"supports","note":"The open engine is building shared evaluation infrastructure in public."}],"also":[{"label":"Fast-track RFC: the evidence bar","url":"https://github.com/vllm-project/vllm/issues/59665"}],"read":"relayed","status":"active"},{"id":"2026-10-08-openrouter-cache-is-crucial","title":"Cache is crucial","url":"https://openrouter.ai/data/newsletter/cache-is-crucial","org":"OpenRouter","authors":"Peter Walker","published":"2026-10-08","added":"2026-11-19","kind":"blog","layers":["routing","serving"],"mechanism":"frame","venue":"cluster","gist":"Gateway data on what agent traffic is made of. Almost all of it is context being re-read from cache, billed at a fraction of the input price, and generated output is about one percent of tokens. Cache hit rate therefore matters more to the bill than list price.","changes":"The single fact that ties the levers together. A cache belongs to one model on one machine, so it constrains which model answers, which machine takes the request and what gets evicted. Every router here is designed around it.","caveats":"One gateway, skewed to developers and price-sensitive traffic. It does not measure the cost of switching models directly.","numbers":[{"metric":"Cached prompt tokens as a share of agentic tokens","value":"just under 90%, up from about 60% in January","baseline":"the same gateway eight months earlier","verification":"self-reported"},{"metric":"Price of a cache read","value":"a tenth to a twentieth of fresh input","baseline":"list input price on current frontier models","verification":"self-reported"},{"metric":"Median provider cache hit rate","value":"44% to 85%","baseline":"the same gateway earlier in the year","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The shape of agent traffic, nine-tenths re-read context, is what every serving decision now turns on."},{"claim":"C9","direction":"complicates","note":"Switching model mid-session re-reads everything at full price, which caps how often a router can act."}],"read":"relayed","status":"active"},{"id":"2026-10-05-together-link","title":"Together Link: frontier-quality open models in the harness you already use","url":"https://www.together.ai/blog/together-link-frontier-quality-open-models-in-the-harness-you-already-use","org":"Together AI","authors":"Will Van Eaton, Hassan El Mghari","published":"2026-10-05","added":"2026-11-19","kind":"product","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"A one-command setup that points an existing coding agent (Claude Code, Codex and others) at open models hosted by Together. In auto mode a router reads the first task of each session and picks a model once. With the user's own Anthropic key it chooses between a closed frontier model and an open one; without it, between a strong open model and a fast one.","changes":"Open and frontier models sharing one harness, with the choice made by the serving side. Routing once per session is a design forced by the layer below: switching mid-session would throw away the prompt cache.","caveats":"No quality, latency or price benchmarks. The over-50% saving is against an all-frontier counterfactual with no method given. A session that gets harder stays on the model it started with.","numbers":[],"bears_on":[{"claim":"C9","direction":"supports","note":"A shipped product that splits sessions between an open model and a frontier one inside the same harness."},{"claim":"C2","direction":"supports","note":"How often the model can be chosen is set by the prompt cache, a property of the traffic, not of the router."}],"read":"opened","status":"active"},{"id":"2026-10-03-seis-self-evolving-inference","title":"SEIS: self-evolving inference systems","url":"https://arxiv.org/abs/2610.04646","org":"University of Chicago","published":"2026-10-03","added":"2026-11-19","kind":"paper","layers":["loop","engine","model"],"mechanism":"agent","venue":"any","gist":"Agents rewrite a whole small serving engine across chained two-hour sessions, each inheriting the previous session's code and written report, with no hints about techniques. 480 sessions compare independent runs, chains, and chains that periodically sync.","changes":"The only controlled look at whether an agent loop compounds when it inherits its own notes. It does climb, but the inherited reports also carried wrong conclusions forward, and the authors' own audit found engines that passed accuracy gates while computing only part of the output vocabulary.","caveats":"A 0.6B model, one request at a time, greedy decoding, no concurrency: far from production serving. People had to repair the evaluation repeatedly. No code link found and no cost figures.","numbers":[{"metric":"Single-request throughput","value":"594 to 1,942 tok/s (3.27x)","baseline":"the starting mini engine","verification":"self-reported","setup":"Qwen3-0.6B, one H100"},{"metric":"Against tuned production engines on the same workload","value":"2.81 to 3.10x","baseline":"vLLM, SGLang, TensorRT-LLM","verification":"self-reported"},{"metric":"Endpoints with audit or accuracy problems","value":"13","baseline":"the authors' own audit","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"complicates","note":"Chains that inherit notes do improve, and they also inherit mistakes."},{"claim":"C4","direction":"supports","note":"Engines passed the accuracy gate while skipping part of the vocabulary."},{"claim":"C3","direction":"complicates","note":"An engine written for one narrow workload beat general engines about threefold, on a toy setting."}],"read":"relayed","status":"active"},{"id":"2026-10-02-baseten-agentic-engine","title":"Agentic inference optimization: 50-90% faster engines","url":"https://www.baseten.co/blog/agentic-inference-optimization-faster-than-sota/","org":"Baseten","authors":"Shawn Rushefsky","published":"2026-10-02","added":"2026-11-19","kind":"blog","layers":["loop","engine","kernels","model"],"mechanism":"agent","venue":"dedicated","gist":"A coding agent was given a standing goal: beat a tuned vLLM by 20% on every metric with no accuracy loss. Running mostly on its own for about a week, it generated a custom engine for one model, reusing existing kernels where it could and using full-precision weights as the accuracy reference.","changes":"Gives the price of a bespoke engine: about a week, 200 GPU-hours and 1.7 billion tokens. That is cheap enough to do per model, and the author's own notes show why it is not yet safe to leave unattended.","caveats":"The engine code is not released and serves no production traffic. Best-case decode numbers are on repetitive text that favours speculation. The author had to steer the agent off overfitting one traffic shape, and warns that agents game the metric without accuracy constraints.","numbers":[{"metric":"Single-stream decode","value":"1,792 vs 943 tok/s","baseline":"tuned vLLM 0.25.1","verification":"self-reported","setup":"Qwen-3.6-35B, one B200"},{"metric":"Output throughput at 32 concurrent requests","value":"10,307 vs 6,030 tok/s","baseline":"tuned vLLM 0.25.1","verification":"self-reported"},{"metric":"Cost of the run","value":"about 200 B200-hours and 1.7B tokens","baseline":"not applicable","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"A week of mostly unattended agent work produced an engine ahead of a tuned general one."},{"claim":"C3","direction":"supports","note":"At a couple of hundred GPU-hours, an engine per model or per large customer is affordable."},{"claim":"C7","direction":"challenges","note":"A private engine roughly 1.7 to 1.9x ahead of the tuned open one."},{"claim":"C4","direction":"supports","note":"The agent overfit one traffic shape until a person intervened."}],"read":"relayed","status":"active"},{"id":"2026-09-30-magnitude-local-engine","title":"Magnitude (open-source local inference engine)","url":"https://github.com/magnitudedev/magnitude","org":"Magnitude","published":"2026-09-30","added":"2026-11-19","kind":"repo","layers":["kernels","engine","model"],"mechanism":"rules","venue":"local","gist":"An open-source local engine that spends up to a minute at model download trying thread-group sizes, chunk sizes and prefetch distances on the actual chip, keeping the fastest combination that leaves outputs unchanged. Ships hand-written kernels for popular model families and a bundled draft model.","changes":"Shows the optimum is specific to the chip in hand: it searches existing settings once, on the actual device. It writes no code and does not look at what the user runs.","caveats":"Measured by the authors against a competitor at default settings, median of two requests. The gain cannot be split between autotuning, speculation and the hand-written kernels. Some wins are against a draft model that was barely drafting, and a few cases regress. The date is the launch post's; the repository is undated.","numbers":[{"metric":"Decode, average of 11 models on a Mac mini M4 Pro","value":"2.19x","baseline":"Ollama v0.35.1 at defaults","verification":"self-reported"},{"metric":"Decode, same models on a DGX Spark","value":"2.17x","baseline":"Ollama v0.35.1 at defaults","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The fastest settings differ enough per chip that it measures them on the actual device at install."}],"also":[{"label":"Benchmarks","url":"https://magnitude.dev/benchmarks"}],"read":"relayed","status":"active"},{"id":"2026-09-23-modal-trillion-tokens","title":"Trillion tokens, trillion parameters","url":"https://modal.com/blog/trillion-tokens-trillion-parameters","org":"Modal","published":"2026-09-23","added":"2026-11-19","kind":"blog","layers":["model","engine","routing"],"mechanism":"hand","venue":"dedicated","gist":"A stack tuned for one customer's coding-agent traffic: a draft model fine-tuned on the target model's own coding traces, an 8-bit KV cache, a CPU-memory cache tier, and session-affinity routing.","changes":"Contains a clean tuned-against-generic number: a draft model fine-tuned on coding traces from the target model was worth about 20%. The post also says the same principles carried over to other customers and models.","caveats":"Relayed, and one detail is unsettled: a later check found Modal's other drafter post used synthetic data, so whether this drafter saw the customer's own traffic is unconfirmed. The 2.8x and 5.6x headline figures are against an unspecified unoptimised replica.","numbers":[{"metric":"Speculative accept length after fine-tuning the draft on coding traces for the target model","value":"5.00 to 5.84 tokens per step, about 20% faster","baseline":"a generic draft model","verification":"self-reported"},{"metric":"Per-replica throughput","value":"5.6x","baseline":"an unoptimised replica, unspecified","verification":"self-reported","setup":"Kimi K2.6, B200"}],"bears_on":[{"claim":"C3","direction":"challenges","note":"Like for like, a drafter tuned for this workload was worth about 20%, and the recipe transferred to other customers. Whether it saw the customer's own traffic is unconfirmed."},{"claim":"C2","direction":"supports","note":"The stack was designed around the shape of coding-agent traffic: 100k tokens in, 500 out."}],"read":"relayed","status":"active"},{"id":"2026-09-22-swe-serve","title":"SWE-Serve: benchmarking agentic engineering for production inference serving","url":"https://arxiv.org/abs/2609.26777","org":"NVIDIA, UC Berkeley","published":"2026-09-22","added":"2026-11-19","kind":"benchmark","layers":["loop","engine","serving"],"mechanism":"frame","venue":"any","gist":"53 tasks rebuilt from real merged SGLang pull requests, graded with hidden tests, end-to-end serving tests and performance gates.","changes":"Q
