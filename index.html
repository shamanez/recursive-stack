t skill for local servers, a conference talk on agent-written kernels) could not be dated from their pages, and the roster needs a date. Two more papers were left out because it was unclear they describe a loop"},{"title":"Teams searched for and not found","url":"https://x.com","reason":"no loop announcement found from Fireworks, Anyscale, Groq, SambaNova, Nebius, DeepInfra, Lambda, CoreWeave, Replicate, the three hyperscalers' model services, llama.cpp, MLX, Ollama, Moonshot, MiniMax, DeepSeek, Mistral, Qualcomm or Apple. Try again next deep pass"}],"next_due":"2026-11-27"},{"id":"2026-11-23","n":4,"agent":"Claude Code (Opus 5.5)","deep":false,"summary":"No confidence moved. The red-team of C9 found nothing against it: on OpenRouter's October data the price gap between closed and open models widened to 6.2x, and open models were back above 70% of paid tokens two weeks after three frontier launches. A search found Alibaba's Herschel, a production loop across 120 model variants and ten chip types that the founding sweep had missed. It settles W14, joins the roster, and puts an honest fleet number, 3 to 6% per fix, on build step 6. llm-d measured a host-memory cache tier worth 3.9x once agent sessions outgrow GPU memory, now carried by lever 3 and build step 3. One relayed on-device signal was retired to keep active signals at eighty; fuller pruning is due on the deep pass.","changes":[{"type":"added","ref":"2026-09-30-alibaba-herschel","text":"Alibaba's production loop: 30-second live profiles matched against 35 known kinds of waste, agents implement and test the fix, experts approve canaries. Most fixes bought 3 to 6% across 50 to 100 deployments. Build step 6's do and bought rewritten; the drift item in open ground now says how it sidesteps the question."},{"type":"added","ref":"2026-11-23-llmd-sglang-tiered-kv-cache","text":"SGLang joins llm-d. On GLM-5.2 with replayed agent traces, a host-memory cache tier kept 85 to 95% reuse against 6% and gave 3.94x output at 128 sessions; a shared-storage tier added 14 to 66% to first-token time and paid only on failover. Lever 3's bought and build step 3's bought and watch rewritten."},{"type":"added","text":"Roster: Alibaba Group, Herschel, in production by September. Point 1 recounted: eleven since October, twenty before."},{"type":"watch","ref":"W14","text":"Hit, late: a hyperscaler describing its loop, in a paper of 30 Sep. Fireworks, Modal, Groq and Cerebras are still silent."},{"type":"tension","ref":"T5","text":"Alibaba joins the class-level side: each agent-tested fix is rolled out to 50 to 100 deployments. Still open."},{"type":"model","text":"Lever 3's connections now include a measured collision with lever 4: with prefill split from decode, one provider was drafting tokens decode never used."},{"type":"course","text":"Re-judged as of 23 Nov; all four verdicts hold. 'The parts are one move' gains the prefill-draft collision as an example. The red-team of C9 leaves the open-models implication standing."},{"type":"retired","ref":"2026-06-apple-core-ai","text":"Relayed and referenced nowhere: a vendor compiler fitting a model to one device, which says nothing about the load. Retired to keep active signals at eighty."}],"swept":["Inbox empty. No watchlist check was due; W14 was settled early because its answer turned up.","Feeds since 21 Nov, scanned by a sub-agent: vLLM blog and RFCs, Inferact, LMSYS (through its sitemap), Together, AgentX optimisations, SemiAnalysis, InferenceBench, llm-d, Baseten, PyTorch, Modular, OpenRouter, Fireworks, Databricks, Doubleword, vLLM looped-model issues and Vals. Three new items; the llm-d post was opened first-hand. Vals unchanged since 19 Nov.","Red-team of C9: searched for open models stalling, frontier prices falling until one model is simply best, and products dropping automatic routing. Opened OpenRouter's October recap. Closed and open blended prices fell 57% and 70% since January, widening the gap from 4.3x to 6.2x; open models' share of paid tokens dipped to 52% the week three frontier models launched and was back above 70% two weeks later. Products are moving toward routing by default, not away. C9 holds at 0.65; neither lower condition has occurred. One complication for a provider: a cheap closed model, at about $0.07 per million tokens, became the most used paid closed model within days, so the cheap tier is not only open models.","Fresh searches: routers against the best single model, and agent loops on serving engines. X, through web search limited to x.com: speculative-decoding launches and agent-tuned engines. The X searches returned local single-GPU speed posts and, alongside them, arXiv papers; Herschel and AutoTuneBench were opened first-hand from there.","A GitHub bot comment on vLLM PR #69165 carried guidance addressed to coding agents. Ignored."],"rejected":[{"title":"Tokens rose 37% in October (OpenRouter October 2026 data recap)","url":"https://openrouter.ai/data/october-2026","reason":"Opened. The red-team source for C9; it agrees with the existing gateway signals and moves nothing. Its cache numbers (median agentic hit rate over 90%) and retention numbers (closed labs keep 74 to 78% of accounts month to month, open labs fewer) are candidates to refresh the September gateway signal on the deep pass."},{"title":"LLMRouterBench: A Massive Benchmark and Unified Framework for LLM Routing","url":"https://arxiv.org/abs/2601.07206","reason":"Search result only. A January study in which routers, OpenRouter's among them, fail to beat the best single model. Same direction as T8's lean, without caching priced or agent sessions, so W22 is untouched."},{"title":"AutoTuneBench: Trustworthy Measurement for Agent Auto-Tuning of LLM Serving Engines","url":"https://arxiv.org/abs/2609.18123","reason":"Abstract opened. A single author's protocol for agent tuning of vLLM and SGLang: a kernel at 10.6x against a naive baseline is 2.03x against an honest one, and one configuration gave 1.17x on one machine and 1.005x on another. Supports C4, which already has 23 supporting signals and none against. The machine-to-machine point is a candidate for build step 2 on the deep pass."},{"title":"vLLM RFC #69283: fused NVFP4 MoE kernels for Muse Spark on Hopper","url":"https://github.com/vllm-project/vllm/issues/69283","reason":"Relayed. Kernels written with coding agents: 2.2 to 3x against the Marlin fallback per kernel, 1.25 to 1.36x end to end on 8x H200, GSM8K 0.3 points lower. A proposal, not merged, and within lever 5's range. Revisit if it merges."},{"title":"vLLM PR #69165: Inkling 2 on Ampere and Ada GPUs","url":"https://github.com/vllm-project/vllm/pull/69165","reason":"Relayed. Written with Claude Code; its DSpark speculation on 2x RTX 3090 fell from 1.72x at one request to 0.68x at 64. The same fade as the chart's mixture-of-experts row and short of 128 concurrent, so T10 and W20 are unmoved."},{"title":"Replit makes model routing the default (The New Stack)","url":"https://thenewstack.io/replit-model-routing-default/","reason":"Not opened: the page refused the fetch, and the search result carried no date. Another product making a router the default; a lead for T8 on the deep pass."},{"title":"Local single-GPU speed posts on X (Strata, a Qwen3.8-27B tuning thread)","url":"https://x.com/Oluwaphilemon1/status/2111650354634858616","reason":"Single-stream records on consumer GPUs, which the course file says to ignore."}],"next_due":"2026-11-24"},{"id":"2026-11-22","n":3,"agent":"Claude Code (Opus 5.5)","deep":false,"summary":"No confidence moved. The public AgentX board, now confirmed as canonical, served Kimi K3.1 Pro 1.2 to 2.9x faster per GPU two weeks after its weights appeared than on day one, which gives build step 5 its first bring-up number and a new chart. Together disclosed that a coding agent's commit leaked stored prompt samples, a caution for the traffic store in step 1, and Fireworks now routes once per task, so T7 leans further toward cache boundaries. Later the same day, at the reader's request, depth became lever 7: looping part of a model buys quality per byte of weights, a check that priced the compute found a plain 14B beating a looped 8B on maths, and Thinking Machines shipped a looped model sized for a laptop. C11 opened at 0.65. Active signals now number 79, under the soft cap of eighty.","changes":[{"type":"added","ref":"2026-11-20-agentx-kimi-k31-first-fortnight","text":"Kimi K3.1 Pro on the public AgentX board, 6 Nov against 20 Nov, computed from the board's API: best throughput per GPU at 50 tok/s per user rose 1.17x on GB300 and 1.8 to 2.9x on four other chips. New chart, day-zero-gap; build step 5's bought and watch rewritten."},{"type":"added","ref":"2026-11-21-together-prompt-leak","text":"Together's prompt samples, kept for testing, leaked after an AI coding agent committed a credential; zero retention is now the default for new accounts. Build step 1's watch rewritten to carry it."},{"type":"added","ref":"2026-09-21-fireworks-frontier-is-a-router","text":"Fireworks' hindsight router on Deep SWE: 97.6% at $1.88 a task against 74.1% at $6.52 for the best single model; three models get most of it. New ceiling row in the routing chart."},{"type":"tension","ref":"T7","text":"Fireworks moves to the once-per-task side: its router now chooses per task, where its earlier product scored every turn. The lean toward cache boundaries now says so."},{"type":"tension","ref":"T8","text":"The vendor side now includes the hindsight ceiling, 23 points over the best single model. Lean unchanged: no shipped router has been shown to capture it."},{"type":"watch","ref":"W1","text":"Hit: the canonical board is inferencex.semianalysis.com, run from SemiAnalysis's own repository, and the notice calling it unofficial is hidden markup shown only on copies. Baselines recorded for Kimi K3, Kimi K3.1 Pro and GLM-5.3."},{"type":"watch","ref":"W19","text":"Not due. Noted that the board now shows how long the open engines take to tune a new model; a provider's own time and cost are still missing."},{"type":"added","text":"Roster: LLM4LLM, an academic closed loop from inference script to accepted kernel patch, measured against eager PyTorch. Point 1 recounted: eleven since October, nineteen before."},{"type":"course","text":"Re-judged as of 22 Nov; all four verdicts hold. The many-models implication now says the open engines tune a new model in about two weeks, so in-house work pays in that window."},{"type":"model","text":"Lever 7, how deep each token goes, added to the big picture at the early stage: looped models and early exit, listening to the model's confidence, how full batches are, the latency budget and each pass's cache cost. The page and the brief now count levers from the data instead of saying six."},{"type":"added","ref":"2026-05-22-training-free-looped-transformers","text":"The paper the reader asked about. Four middle layers of a released model re-run with damped sub-steps and no training: a point or two on knowledge-heavy multiple choice, found by a per-cell search over about 720 settings, at the same cache size."},{"type":"added","ref":"2026-10-30-no-free-loop","text":"Microsoft's check prices the loop's compute. On Qwen3-8B a training-free loop gained 0.6 to 2 points, not significantly, and a plain 14B beat it on MATH-500 at about 1.3 times the time. Basis of the new looping chart."},{"type":"added","ref":"2025-10-29-ouro-looped-language-models","text":"Ouro, pretrained with a four-pass loop: a 1.4B roughly matches a 4B on reasoning by its authors' account. Its own tests keep a cache per pass for the prompt; decoding can keep only the last."},{"type":"added","ref":"2026-10-06-hybrid-latent-attention-looped","text":"Ouro 1.4B holds 768 KiB of cache per token across four passes. Compressing it 10.7 times raised decoding throughput 2.5 to 7.4 times in vLLM."},{"type":"added","ref":"2026-11-20-inkling-2-mini","text":"Thinking Machines ships Inkling 2 Mini, a looped and expert-pruned 26B model of about 20 GB that runs on a laptop and leads open models under 100B on agentic coding by its account. Served at a fixed three passes."},{"type":"added","ref":"2026-11-03-looped-model-serving-speed","text":"Looped models carry their own engine debts: in a research engine built for them, exact fixes alone made Ouro 1.65 to 2.15x faster, because every pass repeats per-layer overheads. Bears on C6 as well as lever 7."},{"type":"added","ref":"2025-11-11-think-at-hard","text":"Think-at-Hard re-runs only the tokens a small decider flags as hard, about 7% of them, and beats both a single pass and looping every token by 3 to 4 points at 4 to 5% more traffic. The per-token case for lever 7; its bought line now includes it."},{"type":"added","ref":"C11","text":"Opened at 0.65: looping pays where weight memory binds, and where compute or latency binds a larger plain model beats a loop added after training."},{"type":"tension","ref":"T11","text":"Opened: do looped models save memory, or move it into the cache? Leans by regime, saved at batch one on short prompts and moved on long prompts at serving batch sizes."},{"type":"watch","ref":"W23","text":"Opened, due 28 Feb: upstream support for a looped model with depth chosen per token or request."},{"type":"watch","ref":"W24","text":"Opened, due 31 Mar: a looped and a dense model of equal quality served side by side, with memory and throughput per GPU."},{"type":"course","text":"The reader asked whether looped models were covered, noting their appeal for local use, and left the call to the agent. They were not covered; depth is now lever 7. Verdicts re-judged and all hold; 'Load-aware' now counts seven levers, four in production."}],"swept":["Inbox empty. Cycle 2 had been written and built on 21 Nov but never committed; it was committed unchanged before this cycle began.","Due check W1: InferenceX repository README, the dashboard's HTML and its public read API. Rows for Kimi K3, Kimi K3.1 Pro and GLM-5.3 pulled directly; the agent skill the API page offers was not installed.","Kimi K3.1 Pro board snapshots as of 6, 9 and 13 Nov and latest, compared per chip at 30, 50 and 100 tok/s per user. The pattern held at every floor.","Feeds since 21 Nov, scanned by a sub-agent: vLLM blog and RFCs, Inferact, LMSYS (through its sitemap), Together, InferenceBench, SemiAnalysis, llm-d, Baseten, arXiv, PyTorch, Modular, OpenRouter, Fireworks, Databricks, llama.cpp, Vals, Doubleword. Candidates kept were opened first-hand. arXiv announces nothing at weekends.","Queued from cycle 2: LLM4LLM and the Fireworks routing posts, both opened. The Fireworks post dates from 21 Sep, not mid-November.","X, through web search limited to x.com: agents tuning vLLM and SGLang, and routers between open and frontier models. Neither search returned X posts; the other pages they surfaced are listed below.","Red-team of C7: searched for private leads over upstream that persisted, and for optimisations kept out of the open engines. Found none this month. The board's K3.1 data shows the open engines closing a 1.2 to 2.9x bring-up gap in about two weeks; the top VR200 rows are NVIDIA's own preview runs on an open engine. C7 holds at 0.55, since its raise condition needs announced private leads matched in public, and W5 is still open.","Fireworks' docs carry a standard pointer for automated readers to an index file. Ignored.","At the reader's request, looped and adaptive-depth models. The training-free looping paper was read in full. A research sub-agent surveyed later work on training-free loops and then on loops with light post-training and pruning; what it reported is relayed unless listed here as opened. arXiv was searched for serving looped models and for load-aware early exit. Ouro's paper and model card, No Free Loop, Hybrid Latent Attention, the looped-engine study and Thinking Machines' Inkling 2 Mini post were opened first-hand."],"rejected":[{"title":"DeepSeek-V4.1-Flash on vLLM: 5x Agentic Throughput Since Day 0 (Inferact and the vLLM team)","url":"https://vllm.ai/blog/2026-10-07-deepseek-v41-flash","reason":"Opened. The same finding as today's board signal, from the engine team: 5.3x under a 150 tok/s per user floor and 1.9x at low concurrency within three weeks, against its own day-zero result. Held to keep today at three signals; a candidate for the day-zero chart on the deep pass."},{"title":"Agent V: Connecting People and Agents for Autonomous Inference (Inferact)","url":"https://inferact.ai/news/agent-v-connecting-people-and-agents-for-autonomous-inference","reason":"Opened. Newer internal numbers that agree with the existing Inferact signal: people keep the self-hosted open default in about 88% of sessions (79% before), and open models take 55% of tokens. Supports C9 and T8's lean toward defaults; moves neither. A candidate for T8 on the deep pass."},{"title":"vLLM PR #69157 and RFC #62532: the queueing stall after an async KV pull","url":"https://github.com/vllm-project/vllm/issues/62532","reason":"Relayed. On a busy H200 pod over 80% of a KV pull is queueing, by the RFC author's numbers; the PR has no GPU benchmark. A lead for lever 3; moves nothing yet."},{"title":"Meet bison-1 and groundhog-1 (Base Labs, on Baseten)","url":"https://www.baseten.co/blog/meet-bison-1-and-groundhog-1/","reason":"Relayed. Narrow models post-trained on Gemma 4 that top a decision index, with no cost or latency comparison against a general frontier model, so it cannot test C10."},{"title":"vLLM RFC #69082: prefix-cache hits that end inside a block","url":"https://github.com/vllm-project/vllm/issues/69082","reason":"Relayed. Nothing measured yet."},{"title":"Qwen4 Max on Together AI","url":"https://www.together.ai/blog/qwen4-max","reason":"Relayed. A model listing. Cached input is priced at a twentieth of uncached, which fits the cache point and changes nothing."},{"title":"TideCache, FrontierReplay, G-MTP and BlockJack (arXiv, submitted 19 Nov)","url":null,"reason":"Abstracts relayed. No load baseline for the drafter; FrontierReplay's point that fine-grained caches cost scheduler time under load is a lead for lever 2, and BlockJack, a cross-tenant cache read in vLLM, is a lead on shared caches. To open on the deep pass."},{"title":"Baseten router, LangChain routing numbers and the Tokenless launch, seen in search","url":"https://fourweekmba.com/ai-baseten-router-nears-claude-opus-5-5-at-72-lower-cost/","reason":"Not opened. Vendor savings of 64 to 72% against the dearest model, inside the routing chart's vendor range, with no best-single-model baseline."},{"title":"LoopKV: Loop-Aware KV Cache Compression for Serving Looped Transformers","url":"https://arxiv.org/abs/2611.04137","reason":"Abstract only. Hybrid Latent Attention's point from the quantisation side: 1.7 to 2.2x goodput over 4-bit cache quantisation on Ouro 1.4B."},{"title":"LASER: Load-Aware Serving with Early-Exit for Reasoning LLMs at the Edge","url":"https://arxiv.org/abs/2606.31580","reason":"Abstract only. A load-aware threshold for stopping a chain of thought early. That is reasoning length, not depth per token, so it moves nothing on lever 7 as defined."},{"title":"Programs-of-Layers in LLMs through the Lens of Cortical Areas (RE-PoLar)","url":"https://arxiv.org/abs/2609.31360","reason":"Abstract only. Choosing which layers to skip or repeat per input on frozen models: the router's reported gain came from fixing answer format, so nothing deployable for serving yet."},{"title":"Recirculation","url":"https://arxiv.org/abs/2608.17981","reason":"Abstract only. A training-free recurrence added in prefill with little generation cost, tested on Gemma 3. A different mechanism from looping; revisit if it reaches an engine."}],"next_due":"2026-11-23"},{"id":"2026-11-21","n":2,"agent":"Claude Code (Opus 5.5)","deep":false,"summary":"C9 fell from 0.70 to 0.65 and T8 now leans toward a good default model: OpenRouter's public board puts its own routers beside single models from the same pool, and on public coding tasks the best single models beat its coding router on quality and cost. C3 rose from 0.35 to 0.40 as a correction: read first-hand, Modal's 20% drafter gain was class-level and its recipe carried over to other models, not customers. Three teams joined the roster, and X is now searched every sweep at the reader's request.","changes":[{"type":"added","ref":"2026-11-06-openrouter-auto-code-routers","text":"OpenRouter's router benchmarks and its new coding router. 74% cheaper than Claude Opus 5.5 at similar quality, yet on Deep SWE single models from its own pool beat it on both quality and cost; it switched model about one turn in ten to keep the cache. New row in the routing figure; lever 1 and build step 7 updated."},{"type":"confidence","ref":"C9","text":"0.70 to 0.65: a router vendor's own board, on tasks others wrote, shows shipped routing not beating the best single model, the second such result after AutoBench."},{"type":"confidence","ref":"C3","text":"0.35 to 0.40, a correction: the reported transfer of a recipe between customers was a misreading of Modal, whose recipe carried over between models. Still no same-endpoint comparison."},{"type":"revised","ref":"2026-09-23-modal-trillion-tokens","text":"Opened first-hand. The drafter was fine-tuned on the target model's own coding traces for a shared service, so its 20% is class-level tuning. Gist, caveats and the C3 note rewritten; T5 and the course note corrected to match."},{"type":"tension","ref":"T8","text":"Now leaning toward a good default model. Its settling condition, a vendor publishing its router against the best fixed model in its pool on tasks someone else chose, has been met once, and the router lost. Held at leaning until live sessions are tested."},{"type":"tension","ref":"T7","text":"OpenRouter joins the per-turn side, but in practice it kept the same model nine turns in ten. The lean toward cache boundaries is now stated as what happens in practice."},{"type":"watch","ref":"W16","text":"Hit: OpenRouter's board compares routers with single models from the same pool on five public benchmarks. W22 opened, due 2026-12-31, for the same comparison on live sessions with cached-token pricing stated."},{"type":"watch","ref":"W15","text":"Miss for the per-customer reading: Modal's drafter was tuned on the target model's coding traces, not on one customer's traffic."},{"type":"watch","ref":"W18","text":"Hit: both leads describe loops and are on the roster."},{"type":"revised","text":"Open ground: removed the item on comparing a router fairly with the best fixed model, since OpenRouter has now done that on public agentic tasks. Five items remain."},{"type":"added","text":"Roster: Infer-forge (an internal agent harness around SGLang), Cerebras (autoresearch on fitting a large model onto consumer GPUs) and an individual's agent-built FPGA engine. AMD's entry now covers Hyperloom, a median 1.73x over stock settings. Point 1 recounted: eleven since October, eighteen before."},{"type":"course","text":"Re-judged as of 21 Nov. All four verdicts hold; 'Fits each user' now says 34 to 45% and drops the claim that a recipe moved between customers. The routing implication now says the default model is the contest, resting on C9 at 65%."},{"type":"model","text":"At the reader's request, X is a feed, searched through a web search limited to x.com. Recorded in the sweep and steer playbooks, AGENTS.md and the watchlist feeds."}],"swept":["Inbox empty; the reader sent an X post in conversation and asked that X be searched. X's own search needs a sign-in, which sweeps never do, so X was searched through web search limited to x.com and single posts were opened directly.","X searches: agents optimising inference engines; inference companies built on open engines; model routers and caching; speculative decoding under load and upstream kernels.","Due checks W15 and W18: Modal's post, the LMSYS Infer-forge post and the Cerebras autoresearch post, all opened first-hand.","Feeds since 20 Nov, scanned by a sub-agent: vLLM blog and RFCs, Inferact, LMSYS, Together, AgentX, SemiAnalysis, InferenceBench, llm-d, Baseten, arXiv, PyTorch, Modular, OpenRouter, Fireworks, Databricks, llama.cpp, Vals, Doubleword. LMSYS, InferenceBench rows, AgentX dates and Baseten dates could not be fully read. Candidates kept were opened first-hand.","Roster leads from the X post and the feed scan: RadixArk, FriendliAI, Novita AI, Hyperloom, ServerBench, an FPGA engine post.","Red-team of C6: looked for architectures converging or engines covering new models at release without automation. Day-zero support is now routine through early access, and most flagships share mixture-of-experts and inherited attention designs, but attention still diverges and day-zero is not tuned. C6 holds at 0.70.","The Fireworks changelog still carries a line asking automated readers to fetch its docs index, and the FPGA post quotes prompts its author gave his agent. Both ignored."],"rejected":[{"title":"Sonnet Xu on X: companies built on open-source inference projects","url":"https://x.com/sonnet_xu/status/2123773103436341663","reason":"Sent by the reader. A map of business models with no numbers. An Inferact maintainer replied that the engine ships upstream and the company's edge is control and continuous optimisation, which fits C7 but is one line. Led to today's X searches."},{"title":"RadixArk launch (the SGLang company)","url":"https://x.com/radixark/status/2051648113014882586","reason":"Funding news. The SGLang team's loop is already on the roster."},{"title":"FriendliAI engine pages","url":"https://friendli.ai/periflow","reason":"Seen in search, not opened. Hand-built kernels; no agent loop described."},{"title":"Scaling Kimi inference with DSpark speculative decoding in vLLM (Novita AI)","url":"https://novita.ai/blog/kimi-k2-dspark-speculative-decoding-throughput/","reason":"Opened. 2.55x at batch size 1 only, so it cannot answer W20. Novita calls DSpark its own ure-of-experts; neither shows tuned serving at release without automation."}],"next_due":"2026-11-22"},{"id":"2026-11-20","n":1,"agent":"Claude Code (Opus 5.5)","deep":false,"summary":"No confidence moved, but three tensions leaned: the first measured mixture-of-experts table shows speculation fading with load like the dense ones (T10), vLLM's fused decode paths on AMD win for one user and fade as concurrency rises (T1, W7 hit), and public agent traces overstated four models' capacity by about 1.7x (T4). Red-teaming C4 found a simulator within 3% on throughput but 6 to 15% on latency, so C4 holds; an open-ground sentence it made false was corrected. AMD's GEAK, a kernel-agent loop described since July 2025, was missing from the roster and is now listed.","changes":[{"type":"added","ref":"2026-07-openzeka-kimi-k3-speculation-under-load","text":"An outside benchmark of Kimi K3 in vLLM and SGLang. Speculation gave 1.86x for one user, broke even at 16 concurrent in vLLM and 4 in SGLang, and gave 0.41x at 64. New row in the speculation-under-load figure; lever 4 and the decoding build step updated."},{"type":"added","ref":"2026-11-18-vllm-flydsl-monokernels","text":"AMD's hand-written fused decode paths, merged into vLLM for five models: 1.2 to 2.3x per token for one user, shrinking with load. Lever 5 now says fusion is chosen per step. A follow-up RFC counts 165k lines of per-model decode code with weak numerical tests."},{"type":"added","ref":"2026-11-19-validation-driven-deployment","text":"A validation pipeline for agentic serving. Four models sized on public traces reached about 60% of that throughput on traffic from the target model, and a routing bug showed only under real-shaped sessions. The first build step and the rig implication updated."},{"type":"tension","ref":"T10","text":"Now leaning: speculation pays less as batches fill, on a mixture-of-experts model too. Beyond 64 concurrent is still unmeasured."},{"type":"tension","ref":"T1","text":"Now leaning: both  3% median error on throughput and 6 to 15% on latency, on configurations it was given. C4 holds.","The Fireworks changelog carries a line asking automated readers to fetch its docs index. Ignored."],"rejected":[{"title":"KernelSight-LM: a kernel-level LLM inference simulator (arXiv 2606.28565)","url":"https://arxiv.org/abs/2606.28565","reason":"Red-team of C4. Too coarse on latency to judge a change worth a few percent, and silent on unseen traffic. It did make one open-ground sentence false, now corrected."},{"title":"GEAK v4: from faster kernels to faster workloads (AMD)","url":"https://www.amd.com/en/developer/resources/technical-articles/2026/geak-v4.html","reason":"Added to the roster. As a signal it is a chip vendor's own end-to-end numbers (25 to 108%) over its own stock baselines, with nothing named as merged upstream. Its rule of ranking kernels by share of GPU time is worth weighing on a later sweep."},{"title":"Why large MoE models break latency budgets (Nebius)","url":"https://nebius.com/blog/posts/moe-spec-decoding","reason":"Product marketing with no numbers."},{"title":"InferenceBench leaderboard, rechecked","url":"https://inferencebench.ai/","reason":"The top agent is still 12.08x against 14.30x for search, as recorded; new entries sit below it. W6 unchanged."},{"title":"Optimizing DeepSeek-V4.1-Flash PD and colocate serving on H20-3e (LMSYS)","url":"https://www.lmsys.org/blog/2026-11-19-deepseek-v41-h20","reason":"Seen in a feed report, not opened. A hand-tuned fixed prefill and decode split against a plain four-GPU baseline; moves no lever's status."},{"title":"Deferred tool loading (Baseten)","url":"https://www.baseten.co/blog/deferred-tool-loading-without-changing-model-harness/","reason":"Seen in a feed report, not opened. Cuts tokens in the harness, outside the six serving levers."},{"title":"Security is a token budget problem (Doubleword)","url":"https://blog.doubleword.ai/security-is-a-token-budget-problem","reason":"Seen in a feed report, not opened. A cost-per-finding argument from a provider that sells the cheaper model; no new routing evidence."},{"title":"Vals legal-agent board, version 1.1","url":"https://www.vals.ai/benchmarks/hlab","reason":"Seen in a feed report, not opened. Rerun on 18 Nov with no tuned legal model listed, so it cannot show a tune holding or falling behind (W17)."},{"title":"SGLang Summit 2026 recap","url":"https://www.lmsys.org/blog/2026-11-17-sglang-summit-recap","reason":"Seen in a feed report, not opened. A recap of earlier work with no new like-for-like numbers."},{"title":"vLLM RFC #68079: keep a waiting agent session's KV cache in the CPU tier","url":"https://github.com/vllm-project/vllm/issues/68079","reason":"Seen in a feed report, not opened. One GPU and a small pool; a cache-retention detail that moves no lever yet."},{"title":"Together Storage Accelerator, Tencent Hy4 on Together, MAX module redesign, Humming low-bit MoE kernels in SGLang","url":null,"reason":"Seen in feed reports, not opened. Storage, a model listing, an API redesign and a hand kernel; none bears on a claim."}],"next_due":"2026-11-21"},{"id":"2026-11-19","n":0,"agent":"Claude Code (Fable 5.2)","summary":"Founding sweep, steered seven times the same day. The reader clarified that local means fitted to what you have, said they read this as a provider, asked for every team building the loop, and then widened the frame: inference becoming load-aware, how the levers connect, and how to build one. The thesis is now a map of six levers with the agent loop around them. A link on adaptive speculative decoding added three signals, a figure and a tension late in the day; no confidence moved. 65 signals are active.","changes":[{"type":"added","ref":"2026-06-22-doubleword-adaptive-speculation","text":"The reader sent a provider's simulation of a policy that re-chooses the draft length at every step. It ties the best fixed length at a steady load; the gain is in not being wrong when load moves. Its open simulator is a candidate for the cheap oracle C4 names."},{"type":"added","ref":"2026-06-08-economics-of-speculative-decoding","text":"The companion analysis: on mixture-of-experts models a guessed token costs most at small batches, so the best draft length can be zero there. Lever 4 now says it depends on the model's architecture."},{"type":"added","ref":"2025-12-27-nightjar","text":"A measured figure for adaptive over fixed speculation: 8% on average and up to 15% in vLLM, with fixed speculation up to 30% slower than none at high load."},{"type":"added","text":"New figure on the Evidence tab: what making speculation adaptive adds, from 1.0x in a steady-load simulation to 1.5x live and a 2.2x oracle bound."},{"type":"tension","ref":"T10","text":"Opened. Measured tables show speculation fading as batches fill; a cost model of mixture-of-experts models predicts the opposite. Nobody has measured it."},{"type":"watch","ref":"W20","text":"Opened, due 2026-12-19: a mixture-of-experts model measured with and without speculation across load, or the simulator checked against a real engine."},{"type":"revised","text":"Lever 4, the decoding build step and two open-ground items updated. A simulator joined the reusable parts, the Doubleword blog joined the feeds, and draft length joined the glossary."},{"type":"revised","text":"Page: charts not marked featured now appear under More charts on the Evidence tab, and the bars in every chart share one scale. Rows had been sized separately, so bars in one chart could start and end at slightly different points."},{"type":"course","text":"The reader answered the two open questions: build the measuring rig first, and the tracker is for building, positioning research and placing a bet. Open ground (six things nobody has shown) added to the big picture. The repository and page were made public."},{"type":"course","text":"The reader serves many model families. Churn (C6) joins the claims their position rests on, the provider view now leads with the work that repeats per model, and bringing up a new model is its own step in the build order. W19 opened."},{"type":"course","text":"The reader widened the frame to inference becoming load-aware and adaptive, and asked how the parts connect and how to build one. Framing restated; all four parts re-judged."},{"type":"added","text":"The big picture: six levers (which model, which machine, the cluster split, decoding, the engine, the model itself), what each listens to and has bought, how they connect through the prompt cache, and a seven-step build order with reusable parts."},{"type":"added","ref":"C9","text":"Open and frontier models share the work, opened at 0.7. Coexistence is measured on two gateways; whether a router beats a cheap default is disputed."},{"type":"added","ref":"C10","text":"The model itself becomes a setting, opened at 0.45. Real gains on narrow jobs; tunes go stale and a newer general model beat one."},{"type":"added","text":"25 signals for the new levers and the rig, 3 read first-hand. Tensions T7 to T9 and checks W15 to W18 opened."},{"type":"revised","ref":"2026-09-23-modal-trillion-tokens","text":"No longer described as trained on customer traffic. A second check found Modal's other drafter used synthetic data; W15 is to read the post first-hand."},{"type":"model","text":"Cadence changed to daily with a weekly deep pass. The repeated procedures (add a signal, act on a steer, roster check, page check) are now playbooks and skills for both agents."},{"type":"course","text":"The reader is tracking this as a provider. Added what the evidence implies for a provider, flagged the three claims that position rests on (C4, C7, C3), and opened three provider-side checks (W12 to W14)."},{"type":"course","text":"The reader clarified that local means fitted to what you have (different devices), not on-device hardware. The framing is restated in those terms and that part now holds."},{"type":"added","text":"A roster of every team found that has described the loop: 25 entries with a one-line gist each. A second check found five not seen before (RoofLang, an NPU kernel loop, KDA, FlashVector, Astra); five the first sweep saw and left out are now listed too. Two became signals."},{"type":"revised","ref":"C2","text":"Widened from the workload to what you have: traffic, model and chip together. Confidence unchanged at 0.8."},{"type":"retired","ref":"C8","text":"The on-device claim is retired as out of scope, with five signals that only argued for or against local hardware. Four that show per-device specialisation now count under C2."},{"type":"tension","ref":"T6","text":"Dropped. It was premised on the on-device reading."},{"type":"watch","text":"W4 and W9 dropped as out of scope. W11 opened: one system showing different winners on two chip families."},{"type":"added","text":"Eight claims opened, C1 to C8, each with a starting confidence and named conditions for moving it."},{"type":"course","text":"The reader's framing judged for the first time. Workload-aware holds. Local and RSI do not, in the senses those words usually carry."},{"type":"added","text":"40 signals: 7 read first-hand, 33 relayed by research sub-agents and marked as such. Relayed ones should be opened and confirmed over the next few sweeps, most load-bearing first."},{"type":"tension","text":"Six tensions opened. The megakernel split (T1) is the most concrete: two camps shipped opposite bets in the same month."},{"type":"watch","text":"Ten dated checks opened. The first due is confirming the canonical AgentX scoreboard and recording today's top results as a baseline."},{"type":"model","text":"Vocabulary fixed: eight stack layers, five ways an optimisation gets produced, five venues, four timescales, five loop stages."},{"type":"revised","ref":"2026-11-09-evolving-infra","text":"inference-rsi.com resolved: it is the project page for Evolving Infra (MIT HAN Lab and others, arXiv 2611.12304). Despite the domain, neither page nor paper claims self-improvement."}],"swept":["The five reader-supplied sources and the pages they cite","Agent-driven and self-improving inference optimisation, February to November 2026, including critiques and failed replications","Workload-aware and per-customer serving across providers, open engines and papers","Local runtimes, ML compilers and kernel generation, plus essays for and against local inference","A second check for loop announcements missed: other providers, chip vendors, model labs and the public scoreboard","Model choice: routers, open models inside frontier harnesses, gateway market data, counter-evidence","Domain tuning and speculative decoding that adapts to the workload","Open-source building blocks for the evaluation rig and the adaptive serving pieces","Adaptive speculative decoding: a reader-supplied post, its companion, and a search for other work that sets draft length at run time"],"rejected":[{"title":"AVO: agentic variation operators (arXiv 2603.24517)","url":"https://arxiv.org/abs/2603.24517","reason":"single-digit gains on one kernel family after a week of compute; no end-to-end measurement"},{"title":"MLSys 2026 FlashInfer kernel generation contest","url":"https://mlsys26.flashinfer.ai/","reason":"placements only, no published speed-ups; FastKernels covers the same ground with numbers"},{"title":"Ave: agentic GPU optimisation with data-flow invariants (arXiv 2604.18616)","url":"https://arxiv.org/abs/2604.18616","reason":"matches hand-tuned code without beating it; the point is already carried by FastKernels and Kernel-Smith"},{"title":"Sakana walks back its AI CUDA engineer claims (2025)","url":"https://techcrunch.com/2025/02/21/sakana-walks-back-claims-that-its-ai-can-dramatically-speed-up-model-training/","reason":"the origin of the benchmark-gaming line; cited inside KernelBench-Verified instead of standing alone"},{"title":"MorphServe: runtime quantised layer swapping (arXiv 2506.02006)","url":"https://arxiv.org/abs/2506.02006","reason":"no provider ships it, and the baseline is not a tuned quantised deployment"},{"title":"llama.cpp multi-token-prediction speculative decoding (PR 22673)","url":"https://github.com/ggml-org/llama.cpp/pull/22673","reason":"good third-party numbers, but a hand-built feature that moves no claim"},{"title":"LlamaWeb: WebGPU backend for llama.cpp","url":"https://www.alphaxiv.org/abs/2605.20706.md","reason":"portability engineering; moves no claim"},{"title":"exo: DGX Spark plus Mac Studio clustering","url":"https://blog.exolabs.net/nvidia-dgx-spark","reason":"2025, one model and one prompt length; moves no claim"},{"title":"Luminal raises funding for a search-based compiler","url":"https://github.com/luminal-ai/luminal","reason":"funding news with no performance baselines"},{"title":"Baseten: inference engineering for DeepSeek V4 Pro","url":"https://www.baseten.co/blog/inference-engineering-for-deepseek-v4-pro-0813","reason":"states an intent to train per-deployment speculators; no numbers"},{"title":"AlphaEvolve (arXiv 2506.13131)","url":"https://arxiv.org/abs/2506.13131","reason":"foundational, but not about inference and no 2026 inference-specific update found"},{"title":"Asari AI, MetaInfer, Herschel, Applied Compute's agentic benchmark, SkyPilot's research-driven agents","reason":"all verified by a sub-agent and below the cut: small or unverifiable gains, or abstracts only"},{"title":"Agent-written kernels on a DGX Spark (arXiv 2607.24762) and from a local 7B model (arXiv 2611.12079)","reason":"reported as counter-evidence for the local claim but relayed with too little detail; queued as watch item W4 to read first-hand"},{"title":"HeyGen Auto-Optim","url":"https://www.heygen.com/research/auto-optim-ai-model-inference-speedup","reason":"an agent made a video decoder 3x faster; not LLM serving"},{"title":"Fireworks product launches at Forge (3 Nov)","url":"https://fireworks.ai/blog/fireworks-unveils-new-products-at-forge-to-help-companies-build-specialized-intelligence","reason":"a faster tier, caching and on-customer-GPU deployment; nothing about an optimisation loop"},{"title":"TileRT tops AgentX on AMD (AMD technical article)","url":"https://www.amd.com/en/developer/resources/technical-articles/2026/tilert-agentx-on-amd-instinct-gpus.html","reason":"the page timed out, so how its kernels are produced is unknown; try again next sweep"},{"title":"ISO-Bench (arXiv 2602.19594) and TokenSpeed","reason":"a benchmark of coding agents on inference workloads, and a community engine not described as agent-optimised; seen in search results only"},{"title":"OpenAI ends automatic switching between its fast and thinking models (secondary report)","url":"https://mixed-news.com/en/chatgpt-plus-pro-stop-switching-to-thinking-gpt-5-5-retires-october-14/","reason":"relevant counter-evidence for routing, but the primary source could not be opened"},{"title":"AdaSpark and AdaFlash (arXiv 2610.05774, 2607.19223)","url":"https://arxiv.org/abs/2610.05774","reason":"abstracts only; results in a hobby engine say little about serving many users"},{"title":"NVIDIA on DFlash (blog) and the DFlash paper","url":"https://developer.nvidia.com/blog/boost-inference-performance-up-to-15x-on-nvidia-blackwell-using-dflash-speculative-decoding/","reason":"covered by DFlash 2 and SPEED-Bench; its headline applies only at an extreme speed target"},{"title":"Not Diamond, Ramp Router, Baseten Switch","reason":"more routers with unbaselined savings; the lever already has five"},{"title":"RoofLang, DynoSim, Vidur as cheap evaluators","reason":"listed as parts in the build order; none reports accuracy against a measured system"},{"title":"TurboSpec and SmartSpec: goodput-driven speculation control (arXiv 2406.14066)","url":"https://arxiv.org/abs/2406.14066","reason":"seen in search, not opened; 2024 work on the same idea, and Nightjar gives a newer measured figure"},{"title":"XShare: in-batch expert sharing for mixture-of-experts inference (arXiv 2602.07265)","url":"https://arxiv.org/abs/2602.07265","reason":"abstract only, no engine or baseline named; kept as a link under the economics signal because it reports the same expert effect"},{"title":"Speculative Decoding in Production: Free Tokens and Hidden Traps","url":"https://tianpan.co/blog/2026-04-17-speculative-decoding-production-hidden-traps","reason":"seen in search, not opened; a practitioner post with no controlled numbers"}],"next_due":"2026-11-20","deep":true}],"glossary":[{"term":"AgentX","def":"The long-context, multi-turn workload inside SemiAnalysis's InferenceX benchmark. It imitates coding-agent traffic: a few very long contexts mixed with many short ones. It has become the shared scoreboard for the work tracked here."},{"term":"autotuning","aka":["autotunes","autotune"],"def":"Trying many settings of existing knobs (tile sizes, thread counts) on the target machine and keeping the fastest. No new code is written; contrast with agent search."},{"term":"cache translation","aka":["cache transfer","translated cache","cross-model cache transfer"],"def":"Converting the context one model has already read into the form a different model stores, so the second can carry on without reading it again. Lossy so far, and it needs both models' internals, which rules out closed models."},{"term":"canary","aka":["canary deployment","canary validation","canaries"],"def":"Releasing a change to a small slice of live traffic first and watching errors and latency before rolling it out wider. A regression stops the rollout."},{"term":"compaction","def":"When an agent's history gets too long and the harness summarises it and starts a fresh context. The prompt cache is lost at that moment anyway, so it is a free point to switch model."},{"term":"concurrency","def":"How many requests a server is handling at once. Most speed tricks look best at a concurrency of one and fade as it rises."},{"term":"continuous compilation","aka":["continual compilation","Continuous Compilation"],"def":"Together AI's term for re-running its agent-driven optimiser as a deployment's traffic drifts, rather than compiling once at release."},{"term":"CUDA Graphs","def":"A way to record a fixed sequence of kernel launches once and replay it with far less per-launch overhead."},{"term":"decode","def":"The second phase: generating output tokens one at a time. Bound by memory bandwidth, and steady rather than bursty."},{"term":"draft length","aka":["draft lengths","speculation length","speculative length"],"def":"How many tokens the draft model guesses ahead before the large model checks them. Longer drafts gain more when the guesses are good and waste more when they are not, so the best length moves with the load."},{"term":"draft model","aka":["drafter","drafters","draft models","speculator","speculators"],"def":"The small fast model in speculative decoding that guesses the next few tokens for the large model to check. It is built for one exact target model."},{"term":"Dynamo","def":"NVIDIA's production framework for distributed LLM serving. The baseline several of these papers compare against."},{"term":"FlashInfer","def":"An open library of GPU kernels for LLM serving, used underneath SGLang and vLLM."},{"term":"harness","aka":["harnesses"],"def":"The program around the model that makes it an agent: the loop that sends prompts, runs tools and feeds results back. Claude Code and Codex are harnesses. Whoever owns it decides which model is called."},{"term":"hillclimb","aka":["hillclimbing","hillclimbs"],"def":"Inferact's word for a bounded optimisation run: agents repeatedly propose a change, measure it against a target, and keep it only if the number improves. Typically 24 to 30 hours on one metric."},{"term":"InferenceX","def":"SemiAnalysis's open benchmark of accelerators and serving engines. Every data point is a public GitHub Actions run, so results can be inspected rather than taken on trust."},{"term":"kernel","aka":["kernels"],"def":"A single program that runs on the GPU, such as one attention step or one matrix multiply. A forward pass is a sequence of kernel launches."},{"term":"KernelBench","def":"An academic benchmark that asks a model to rewrite PyTorch operators as faster GPU kernels and scores correctness and speed-up. Measures kernels in isolation, which is its main weakness."},{"term":"KV cache","aka":["KV caches"],"def":"The stored attention keys and values for tokens already processed. Reusing it means a long conversation does not have to be re-read from the start on every turn. For agents, which re-send huge contexts constantly, it is most of the cost."},{"term":"LoRA","aka":["adapter","adapters"],"def":"A small set of extra weights trained on top of a frozen model to specialise it. Many can be served from one copy of the base model, which is what makes a tuned model per customer affordable."},{"term":"megakernel","aka":["megakernels"],"def":"One long-running GPU program that executes a model's whole forward pass, instead of hundreds of small kernels launched one after another. Removes launch overhead, but is rigid: it bakes in one model shape and one chip."},{"term":"MoE","def":"Mixture of experts: a model architecture in which each token is routed to a few of many sub-networks. Which experts fire depends on the input, so benchmarks on random tokens mislead, and a small batch shares few of them.","aka":["mixture of experts","mixture-of-experts"]},{"term":"monokernel","aka":["mono decode","specialised decode"],"def":"A fused GPU kernel that runs several steps of one decoder layer in a single launch, as vLLM's AMD paths do. Smaller than a megakernel, which fuses a whole forward pass."},{"term":"MTP","def":"Multi-token prediction: extra output heads trained into a model so it can draft its own next few tokens, removing the need for a separate draft model in speculative decoding."},{"term":"NVFP4","def":"NVIDIA's 4-bit floating-point weight format for Blackwell-generation chips. Cuts memory roughly fourfold against 16-bit weights."},{"term":"PD disaggregation","aka":["prefill-decode","PD split","prefill/decode split"],"def":"Running prefill and decode on separate groups of machines, because the two phases stress hardware differently. The split ratio is a tuning knob that goes stale when traffic changes."},{"term":"PDL","aka":["Programmatic Dependent Launch"],"def":"Programmatic Dependent Launch: a CUDA feature that lets the next kernel begin setting up before the previous one finishes. Recovers much of what a megakernel gains, without the fusion."},{"term":"post-training","aka":["post-train","post-trained"],"def":"Further training of an already-trained model on a specific domain or task, by fine-tuning on examples or by reinforcement learning against a grader."},{"term":"prefill","def":"The first phase of serving a request: running the whole prompt through the model to build its KV cache. Compute-bound and bursty."},{"term":"prompt cache","aka":["prompt caching","prefix cache"],"def":"Keeping the computed state of a prompt's opening so that a later request with the same opening does not pay to process it again. For agents, which re-send their whole history every turn, it is most of the bill. A cache belongs to one model on one machine."},{"term":"router","aka":["routers"],"def":"Software that chooses where something goes. Two different kinds appear here: one picks which model answers a session, the other picks which machine serves a request."},{"term":"RSI","aka":["recursive self-improvement"],"def":"Recursive self-improvement: a system that improves the thing that does the improving, so gains compound. In this field the term is used loosely for any agent loop that optimises inference. The strict version needs the loop to get better at optimising, not just to keep optimising."},{"term":"SGLang","def":"An open-source LLM serving engine, vLLM's main open rival. The base for both InferenceForge and Evolving Infra."},{"term":"shadow traffic","def":"Copying live production requests to a candidate system whose answers are discarded. Lets a change be judged on real workload before any user depends on it."},{"term":"simulator","aka":["simulators","simulation"],"def":"A program that predicts how a serving stack would behave without running it on GPUs. One has been shown to pick scheduling policies that hold on real hardware; none yet judges changes to engine or kernel code."},{"term":"SLA","def":"Service-level agreement. Here, a floor on per-user speed (for example 30 tokens per second per user) that a configuration must hold while throughput is pushed up. Throughput without an SLA is a much easier number to inflate."},{"term":"speculative decoding","def":"A small, fast draft model guesses several tokens ahead and the large model checks them in one pass. Speeds up decode when the guesses are usually right, which depends heavily on the workload."},{"term":"sub-agent","aka":["sub-agents","subagents"],"def":"A helper agent a main agent starts for a side task, with its own fresh context. Because it has no cache yet, it can be sent to a different model at no extra cost."},{"term":"TPOT","aka":["time per output token"],"def":"Time per output token during decode. The p99 version (the slowest 1% of tokens) is what users feel as stutter."},{"term":"trace replay","aka":["replay","replays","replayed"],"def":"Recording real sessions (their timing, lengths and shared openings, without the content) and playing them back against a candidate system, so it is judged on realistic load."},{"term":"TTFT","aka":["time to first token"],"def":"Time to first token: how long a user waits before any output appears. Dominated by prefill, so it grows with prompt length."},{"term":"vLLM","def":"The most widely used open-source LLM serving engine. Maintained largely by Inferact, the company founded by its creators."}]};</script>
<script>
(function () {
  'use strict';
  const D = window.DATA;
  const app = document.getElementById('app');
  if (!D) { app.textContent = 'No data in this file. Run: python3 scripts/build.py'; return; }

  // ---------- tiny DOM helpers (data is only ever inserted as text)
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  }
  function svg(tag, attrs, ...kids) {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
    for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: carry on */ } }
  };

  // ---------- dates
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmt = iso => { if (!iso || iso === 'undated') return 'undated'; const [y, m, d] = iso.split('-').map(Number); return d ? `${d} ${MON[m - 1]} ${y}` : `${MON[m - 1]} ${y}`; };
  const utc = iso => { const [y, m, d = 1] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const todayUtc = () => { const t = new Date(); return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayDiff = iso => Math.round((utc(iso) - todayUtc()) / 864e5);
  const rel = iso => { const n = dayDiff(iso); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; return n > 0 ? `in ${n} days` : `${-n} days ago`; };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const pct = v => Math.round(v * 100) + '%';

  // ---------- indexes
  const M = D.model;
  const allClaims = D.thesis.claims;
  const claims = allClaims.filter(c => c.status === 'active');
  const claimById = Object.fromEntries(allClaims.map(c => [c.id, c]));
  const sigById = Object.fromEntries(D.signals.map(s => [s.id, s]));
  const active = D.signals.filter(s => s.status === 'active');
  const latest = D.cycles[0] || {};
  const nameOf = (list, id) => (list.find(x => x.id === id) || { name: id }).name;
  const evidence = id => active.flatMap(s => (s.bears_on || []).filter(b => b.claim === id).map(b => ({ s, direction: b.direction, note: b.note })));
  const DIRS = [['supports', 'for'], ['complicates', 'mixed'], ['challenges', 'against']];
  const checks = (D.watch.checks || []);
  const openChecks = checks.filter(c => c.status === 'open').sort((a, b) => a.due.localeCompare(b.due));
  const seenKey = 'recursive-stack.seen';
  const seen = store.get(seenKey);
  const isNew = s => seen && s.added > seen;
  const orgShort = s => s.org.split(/[,(]/)[0].trim();

  const VERDICT = { holding: ['good', '✓', 'Holding'], sharpen: ['warn', '◐', 'Sharpen it'], unsupported: ['serious', '?', 'Unsupported so far'], wrong: ['crit', '✕', 'Contradicted'] };
  const VERIF = { 'third-party': ['good', '✓', 'Third-party'], 'public-run': ['good', '✓', 'Public run'], 'self-reported': ['warn', '!', 'Self-reported'], 'unverified': ['serious', '?', 'Unverified'] };
  const TSTAT = { open: ['serious', '?', 'Open'], leaning: ['warn', '◐', 'Leaning'], settled: ['good', '✓', 'Settled'] };
  const WSTAT = { open: ['warn', '◐', 'Open'], hit: ['good', '✓', 'Happened'], miss: ['crit', '✕', 'Did not happen'], dropped: ['serious', '–', 'Dropped'] };
  const LSTAT = { working: ['good', '✓', 'Works today'], bottleneck: ['warn', '!', 'Binding constraint'], unproven: ['serious', '?', 'Not yet shown'] };
  const pill = ([tone, icon, label]) => el('span', { class: `pill t-${tone}` }, el('span', { class: 'pill-i', 'aria-hidden': 'true' }, icon), label);
  const mech = id => el('i', { class: `mg m-${id}`, 'aria-hidden': 'true' });
  const sigLink = (s, label) => el('button', { class: 'link', type: 'button', onclick: () => openSignal(s.id) }, label || s.title);
  // One chip per source, labelled by publisher; when a publisher appears twice, add the start of the title to tell them apart.
  const srcChips = ids => { const list = [...new Set(ids)].filter(id => sigById[id]); const seen = {}; list.forEach(id => { const o = orgShort(sigById[id]); seen[o] = (seen[o] || 0) + 1; });
    return el('div', { class: 'chips' }, list.map(id => { const s = sigById[id], o = orgShort(s); return el('button', { class: 'chip', type: 'button', 'data-tip': s.title, onclick: () => openSignal(id) }, seen[o] > 1 ? `${o} · ${s.title.split(/[\s:,]+/).slice(0, 2).join(' ')}` : o); })); };
  const claimChip = (id, direction) => el('button', { class: 'chip', type: 'button', 'data-tip': claimById[id] ? claimById[id].statement : id, onclick: () => { closeSheet(); state.focusClaim = id; go('thesis'); } },
    direction ? el('span', { class: `dir dir-${direction}` }) : null, id, direction ? ` ${direction}` : null);
  const refLabel = ref => !ref ? '' : ` · ${sigById[ref] ? orgShort(sigById[ref]) : ref}`;
  const head = (eyebrow, title, sub) => el('div', { class: 'view-head' }, el('p', { class: 'eyebrow' }, eyebrow), el('h1', null, title), sub ? el('p', { 'data-prose': true }, sub) : null);
  const section = (title, note, ...body) => el('section', { class: 'sec' }, el('h2', null, title), note ? el('p', { class: 'sec-note', 'data-prose': true }, note) : null, body);
  const mechLegend = () => el('div', { class: 'legend' }, M.mechanisms.map(m => el('span', { 'data-tip': m.desc, tabindex: '0' }, mech(m.id), m.name)));

  const state = { mapMode: 'mechanism', loopSel: null, roster: 'recent', lever: null, sig: { q: '', layer: '', mechanism: '', venue: '', claim: '', kind: '', off: false }, led: { q: '', ver: '' }, focusClaim: null };

  // =====================================================================
  // FIGURES
  // =====================================================================
  function figShift() {
    const sh = M.shift;
    const lane = (k, cls) => el('div', { class: `lane ${cls}` },
      el('div', { class: 'lane-tag' }, el('strong', null, sh[k].label), sh[k].note ? el('span', null, sh[k].note) : null),
      el('ol', { class: 'flow' }, sh[k].steps.map(s => el('li', null, s))));
    return el('figure', { class: 'shift', 'aria-label': 'How inference optimisation worked before, and how it works now' },
      lane('then', 'lane-then'), lane('now', 'lane-now'), sh.now.loop ? el('div', { class: 'loopback' }, sh.now.loop) : null);
  }

  function figClaims() {
    const cols = 'supports complicates challenges'.split(' ');
    const focus = D.course.focus_claims || [];
    return el('div', { class: 'cfig' },
      claims.map(c => {
        const ev = evidence(c.id), n = d => ev.filter(e => e.direction === d).length;

        el('div', { class: 'chips' }, (D.watch.feeds || []).map(f => el('a', { class: 'chip', href: f.url, target: '_blank', rel: 'noopener', 'data-tip': f.why, style: 'text-decoration:none' }, f.name))))];
  }

  // =====================================================================
  // SIGNALS
  // =====================================================================
  function signalCard(s) {
    return el('article', { class: 'card' + (s.status === 'active' ? '' : ' is-off') },
      el('p', { class: 'metaline' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, orgShort(s)), el('span', null, fmt(s.published)), el('span', null, nameOf(M.venues, s.venue)),
        s.status === 'active' ? null : el('span', null, s.status), s.read === 'relayed' ? el('span', { 'data-tip': 'Reported by a research sub-agent. The sweep agent has not yet read the page itself.', tabindex: '0' }, 'relayed') : null),
      el('h3', null, sigLink(s), isNew(s) ? el('span', { class: 'badge-new' }, 'new') : null),
      el('p', { 'data-prose': true }, s.changes),
      (s.bears_on || []).length ? el('div', { class: 'chips' }, s.bears_on.map(b => claimChip(b.claim, b.direction))) : null);
  }
  function viewSignals() {
    const st = state.sig;
    const listEl = el('div', { class: 'cards' });
    const count = el('span', { class: 'result-n' });
    const draw = () => {
      const q = st.q.toLowerCase();
      const hits = D.signals.filter(s => (st.off || s.status === 'active') && (!st.layer || s.layers.includes(st.layer)) && (!st.mechanism || s.mechanism === st.mechanism) && (!st.venue || s.venue === st.venue) && (!st.kind || s.kind === st.kind) && (!st.claim || (s.bears_on || []).some(b => b.claim === st.claim)) && (!q || [s.title, s.org, s.gist, s.changes, s.caveats, s.authors].join(' ').toLowerCase().includes(q)));
      count.textContent = `${hits.length} of ${D.signals.length}`;
      listEl.replaceChildren(...(hits.length ? hits.map(signalCard) : [el('p', { class: 'muted' }, 'Nothing matches. Clear a filter.')]));
      annotate(listEl);
    };
    const sel = (key, label, opts) => el('select', { id: `sig-${key}`, 'aria-label': label, onchange: e => { st[key] = e.target.value; draw(); } }, el('option', { value: '' }, label), opts.map(([v, t]) => el('option', { value: v, selected: st[key] === v }, t)));
    const kinds = [...new Set(D.signals.map(s => s.kind))].sort();
    const controls = el('div', { class: 'controls' },
      el('input', { type: 'search', id: 'sig-q', placeholder: 'Search signals', 'aria-label': 'Search signals', value: st.q, oninput: e => { st.q = e.target.value; draw(); } }),
      sel('claim', 'Any claim', claims.map(c => [c.id, `${c.id} · ${c.short}`])), sel('mechanism', 'Any means', M.mechanisms.map(l => [l.id, l.name])),
      sel('venue', 'Any place', M.venues.map(l => [l.id, l.name])), sel('layer', 'Any layer', M.layers.map(l => [l.id, l.name])), sel('kind', 'Any kind', kinds.map(k => [k, k])),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', id: 'sig-off', checked: st.off, onchange: e => { st.off = e.target.checked; draw(); } }), 'Show retired'), count);
    draw();
    return [head('The raw material', 'Signals', 'Each card says what the source changes. Select a title for the detail and the link.'),
      histogram(active), el('div', { class: 'sec' }, controls, listEl)];
  }

  // =====================================================================
  // LOG, GLOSSARY
  // =====================================================================
  function viewLog() {
    const every = D.meta.cadence_days === 1 ? 'One sweep a day' : `One sweep every ${D.meta.cadence_days} days`;
    const card = c => el('article', { class: 'card' },
        el('p', { class: 'metaline' }, el('span', null, `Cycle ${c.n}`), el('span', null, fmt(c.id)), el('span', null, c.agent), c.deep ? el('span', null, 'deep pass') : null, el('span', null, `next due ${fmt(c.next_due)}`)),
        (c.changes || []).length ? null : el('span', { class: 'tag' }, 'quiet day'),
        el('p', { style: 'color:var(--ink);font-size:15px', 'data-prose': true }, c.summary),
        el('ul', { class: 'changes' }, c.changes.map(ch => el('li', null, el('span', { class: 'tag' }, ch.type, refLabel(ch.ref)), el('span', null, ch.text)))),
        (c.rejected || []).length ? el('details', null, el('summary', null, `Looked at and left out (${c.rejected.length})`),
          el('ul', { class: 'plain-list' }, c.rejected.map(r => el('li', null, r.url ? el('a', { href: r.url, target: '_blank', rel: 'noopener' }, r.title) : r.title, ` · ${r.reason}`)))) : null);
    const recent = D.cycles.slice(0, 14), older = D.cycles.slice(14);
    return [head('What each sweep did', 'Cycle log', `${every}, and a deeper pass once a week. Each records what it changed, and what it looked at and left out.`),
      el('div', { class: 'cards' }, recent.map(card)),
      older.length ? el('details', null, el('summary', null, `Older cycles (${older.length})`), el('div', { class: 'cards', style: 'margin-top:10px' }, older.map(card))) : null];
  }
  function viewGlossary() {
    return [head('Words this field assumes you know', 'Glossary', 'Anywhere on the site, a dotted underline means the definition shows when you point at it.'),
      el('dl', { class: 'gl' }, D.glossary.map(g => el('div', null, el('dt', null, g.term), el('dd', null, g.def))))];
  }

  // =====================================================================
  // SIGNAL SHEET (the place for depth; everything else links here)
  // =====================================================================
  const sheet = document.getElementById('sheet');
  function closeSheet() { if (sheet.open) sheet.close(); }
  function openSignal(id) {
    const s = sigById[id];
    if (!s) return;
    const nums = s.numbers || [];
    sheet.replaceChildren(el('div', { class: 'sheet' },
      el('div', { class: 'sheet-head' },
        el('div', null, el('p', { class: 'stamp' }, [s.org, fmt(s.published), s.kind, s.status !== 'active' ? s.status : null].filter(Boolean).join(' · ')), el('h2', { id: 'sheet-title', style: 'margin-top:6px' }, s.title), s.authors ? el('p', { class: 'small', style: 'margin-top:4px' }, s.authors) : null),
        el('button', { class: 'ghost', type: 'button', onclick: closeSheet }, 'Close')),
      el('div', { class: 'chips', style: 'align-items:center' }, el('a', { class: 'cta', href: s.url, target: '_blank', rel: 'noopener' }, 'Read the source ↗'),
        (s.also || []).map(a => el('a', { class: 'chip', href: a.url, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, a.label + ' ↗')),
        s.read === 'relayed' ? el('span', { class: 'muted small' }, 'relayed, not yet read first-hand') : null),
      el('div', null, el('h4', null, 'What it changes'), el('p', { 'data-prose': true }, s.changes)),
      el('div', null, el('h4', null, 'What it is'), el('p', { 'data-prose': true }, s.gist)),
      el('div', null, el('h4', null, 'What to doubt'), el('p', { 'data-prose': true }, s.caveats)),
      el('div', null, el('h4', null, 'Where it sits'), el('p', { class: 'metaline', style: 'font-size:13px' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, nameOf(M.venues, s.venue)), el('span', null, s.layers.map(l => nameOf(M.layers, l)).join(', ')))),
      (s.bears_on || []).length ? el('div', null, el('h4', null, 'Bears on'), el('ul', { class: 'ev' }, s.bears_on.map(b => el('li', null, el('span', { class: `dir dir-${b.direction}` }), el('div', null, claimChip(b.claim, b.direction), el('p', { style: 'margin-top:4px' }, b.note)))))) : null,
      nums.length ? el('div', null, el('h4', null, 'Numbers'), el('div', { class: 'scroll-x' }, el('table', null, el('tbody', null, nums.map(n => el('tr', null, el('td', null, n.metric), el('td', { class: 'num' }, el('strong', null, n.value)), el('td', null, n.baseline), el('td', null, pill(VERIF[n.verification])))))))) : null,
      s.superseded_by && sigById[s.superseded_by] ? el('p', null, 'Superseded by ', sigLink(sigById[s.superseded_by])) : null));
    annotate(sheet);
    if (!sheet.open) sheet.showModal();
    sheet.scrollTop = 0;
  }
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  // =====================================================================
  // GLOSSARY ANNOTATION + TOOLTIP
  // =====================================================================
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const TERMS = D.glossary.flatMap(g => [g.term].concat(g.aka || []).map(t => ({ t, def: g.def, key: g.term }))).sort((a, b) => b.t.length - a.t.length)
    .map(x => ({ ...x, re: new RegExp('(^|[^A-Za-z0-9])(' + esc(x.t) + ')(?![A-Za-z0-9])', 'i') }));
  function annotate(root) {
    const used = new Set();
    root.querySelectorAll('[data-prose]').forEach(box => {
      const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        if (!node.parentElement || node.parentElement.closest('.gloss, button, a')) return;
        for (const term of TERMS) {
          if (used.has(term.key)) continue;
          const hit = term.re.exec(node.nodeValue);
          if (!hit) continue;
          const mid = node.splitText(hit.index + hit[1].length);
          mid.splitText(hit[2].length);
          mid.replaceWith(el('span', { class: 'gloss', tabindex: '0', 'data-tip': term.def }, mid.nodeValue));
          used.add(term.key);
          break;
        }
      });
    });
  }
  const tip = document.getElementById('tip');
  function showTip(target) {
    tip.textContent = target.getAttribute('data-tip');
    tip.hidden = false;
    const r = target.getBoundingClientRect(), t = tip.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - t.width - 8, r.left + r.width / 2 - t.width / 2));
    const below = r.bottom + 8 + t.height < window.innerHeight;
    tip.style.left = left + 'px';
    tip.style.top = (below ? r.bottom + 8 : Math.max(8, r.top - t.height - 8)) + 'px';
  }
  const tipTarget = e => e.target.closest && e.target.closest('[data-tip]');
  document.addEventListener('mouseover', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (tipTarget(e)) tip.hidden = true; });
  document.addEventListener('focusin', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  // =====================================================================
  // SHELL
  // =====================================================================
  const VIEWS = { now: viewNow, map: viewMap, build: viewBuild, who: viewWho, thesis: viewThesis, stack: viewStack, ledger: viewLedger, tensions: viewTensions, watch: viewWatch, signals: viewSignals, log: viewLog, glossary: viewGlossary };
  const TABS = [['now', 'Now'], ['map', 'Big picture'], ['build', 'Build'], ['who', 'Who'], ['thesis', 'Thesis'], ['stack', 'Stack map'], ['ledger', 'Evidence'], ['tensions', 'Tensions'], ['watch', 'Watch'], ['signals', 'Signals'], ['log', 'Cycle log'], ['glossary', 'Glossary']];
  const dueSoon = openChecks.filter(c => dayDiff(c.due) <= D.meta.cadence_days).length;
  const tabs = document.getElementById('tabs');
  tabs.append(...TABS.map(([id, label]) => el('a', { href: `#${id}`, 'data-tab': id }, label, id === 'watch' && dueSoon ? el('span', { class: 'count', title: 'Checks due by the next sweep' }, dueSoon) : null)));
  function go(id) { if (location.hash === `#${id}`) render(); else location.hash = id; }
  function render() {
    const id = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'now';
    tabs.querySelectorAll('a').forEach(a => { if (a.dataset.tab === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    app.replaceChildren(...[].concat(VIEWS[id]()).filter(Boolean));
    annotate(app);
    tip.hidden = true;
    const focus = id === 'thesis' && state.focusClaim ? document.getElementById(`claim-${state.focusClaim}`) : null;
    state.focusClaim = null;
    if (focus) focus.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);

  document.title = D.meta.title;
  document.getElementById('brand-name').textContent = D.meta.title;
  const status = document.getElementById('status');
  if (latest.id) status.append(el('span', null, 'Cycle ', el('b', null, latest.n)), el('span', null, 'swept ', el('b', null, fmt(latest.id))),
    el('span', null, 'next sweep ', el('b', null, dayDiff(latest.next_due) < 0 ? `overdue (${rel(latest.next_due)})` : rel(latest.next_due))));
  document.getElementById('foot').append(el('span', null, D.meta.tagline), el('span', null, D.meta.site ? [el('a', { href: D.meta.site }, 'Live page'), ' · '] : null, el('a', { href: D.meta.repo, target: '_blank', rel: 'noopener' }, 'Repository'), ' · generated from data/ · ', el('a', { href: '#glossary' }, 'Glossary')));

  const themeBtn = document.getElementById('theme');
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const paintTheme = () => { themeBtn.textContent = isDark() ? 'Light' : 'Dark'; themeBtn.setAttribute('aria-label', `Switch to ${isDark() ? 'light' : 'dark'} theme`); };
  const savedTheme = store.get('recursive-stack.theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('recursive-stack.theme', next); paintTheme(); });
  paintTheme();
  render();
})();
</script>
</body>
