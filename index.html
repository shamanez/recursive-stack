.shift { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; }

/* ---------- figure: the lever map (a request's path, the model under it, the loop around it) */
.lmap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; display: grid; gap: 6px; }

/* ---------- figure: the build path */
.steps { display: grid; gap: 0; counter-reset: s; }

.impl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }

/* ---------- figure: loop ring */
.loop-fig { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }

.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px 14px; display: grid; gap: 10px; align-content: start; }

.frow { display: grid; grid-column: 1 / -1; grid-template-columns: minmax(0, 1.2fr) minmax(80px, 1.1fr) auto; grid-template-columns: subgrid; gap: 12px; align-items: center; padding: 6px; border: 0; background: none; text-align: left; border-radius: 6px; cursor: pointer; width: 100%; }
.frow:hover { background: var(--inset); }
.flabel { font-size: 13px; line-height: 1.3; }

.fbar { position: absolute; left: 0; top: 3px; height: 12px; border-radius: 0 4px 4px 0; background: var(--m-agent); }

.fbar.g2 { background: var(--m-frame); }

.fdot.is-to { background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }

.fig .cap { font-size: 12px; color: var(--ink-3); padding: 0 6px; }
.sw.g0 { background: var(--m-agent); } .sw.g1 { background: var(--m-rules); } .sw.g2 { background: var(--m-frame); }
.key-from { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); display: inline-block; }
.key-to { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ---------- figure: roster of who is building the loop */
.roster { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; }

.rrow:first-child { border-top: 0; }
.rrow:hover { background: var(--inset); }
.rrow .rdate { font: 400 12px/1.5 var(--font-data); color: var(--ink-3); }

.rwho span { font-size: 12.5px; color: var(--ink-2); }
.rwho small { font-size: 11.5px; color: var(--ink-3); }
.rgist { color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.rstage { justify-self: end; }
.rmark { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--m-agent); border: 2px solid var(--m-agent); }
.rmark.is-open { background: transparent; }
.rmark.is-online { border-radius: 1px; transform: rotate(45deg) scale(0.85); background: var(--m-online); border-color: var(--m-online); }
.rmark.is-online.is-open { background: transparent; }
.rmark.is-bad { border-color: var(--crit); background: transparent; }
.strip-mark { cursor: pointer; }
.strip-mark .shape { fill: var(--m-agent); stroke: var(--m-agent); stroke-width: 2; }
.strip-mark.is-open .shape { fill: var(--surface); }
.strip-mark.is-online .shape { fill: var(--m-online); stroke: var(--m-online); }
.strip-mark.is-online.is-open .shape { fill: var(--surface); }
.strip-mark.is-bad .shape { stroke: var(--crit); fill: var(--surface); }
.chart .tick { stroke: var(--line-2); stroke-width: 1; }
.more-link { font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.more-link:hover { text-decoration: underline; }

/* ---------- lists */
.changes { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.changes li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.changes .tag { padding-top: 3px; color: var(--accent); }
.reads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: r; }
.reads li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; counter-increment: r; }
.reads li::before { content: counter(r); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 12px/24px var(--font-data); text-align: center; }
.reads p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

/* ---------- claims */
.claims { display: grid; gap: 12px; }
.claim { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.claim-top { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 24px; padding: 18px 20px; }
.claim-id { font: 500 12px/1 var(--font-data); color: var(--accent); }
.claim h3 { font-size: 18px; margin-top: 6px; }
.claim .statement { margin-top: 8px; color: var(--ink-2); max-width: 64ch; font-size: 14px; }
.conf { display: grid; gap: 8px; align-content: start; }
.conf-n { font: 500 26px/1 var(--font-data); }
.conf-n small { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 6px; }
.meter { position: relative; height: 10px; border-radius: 0 4px 4px 0; background: var(--inset); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--accent); }
.meter b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.balance { display: flex; height: 10px; gap: 2px; }
.balance span { border-radius: 2px; min-width: 4px; }
.balance-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.balance-key span { display: inline-flex; align-items: center; gap: 5px; }
.claim-more { border-top: 1px solid var(--line); }
.claim-more > summary { padding: 10px 20px; list-style: none; display: flex; align-items: center; gap: 8px; }
.claim-more > summary::-webkit-details-marker { display: none; }
.claim-more > summary::before { content: "+"; font-family: var(--font-data); width: 12px; }
.claim-more[open] > summary::before { content: "−"; }
.claim-body { padding: 4px 20px 20px; display: grid; gap: 18px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.kv { display: grid; gap: 4px; }

.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ev li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.ev .dir { margin-top: 6px; }
.ev p { color: var(--ink-2); font-size: 13.5px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.hist li { display: grid; grid-template-columns: 96px 44px minmax(0, 1fr); gap: 10px; color: var(--ink-2); }
.spark { width: 110px; height: 28px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

/* ---------- stack map */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }

.map { min-width: 760px; }

.dots { display: flex; flex-wrap: wrap; gap: 2px; }

.clock { position: relative; padding: 22px 12px 0; display: grid; gap: 4px; align-content: start; }
.clock::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--line-2); }
.clock::after { content: ""; position: absolute; left: 12px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }
.clock h3 { font-size: 15px; }
.clock .num { font-size: 12px; color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.vbar { display: flex; gap: 2px; height: 34px; }

.v-third-party { background: var(--good); } .v-public-run { background: var(--supports); } .v-self-reported { background: var(--warn); color: #0b0b0b; } .v-unverified { background: var(--mixed); }

.ledger td { font-size: 13.5px; overflow-wrap: anywhere; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 7px; }

.sheet table { font-size: 13px; }

<script>window.DATA = {"meta":{"title":"The Recursive Stack","tagline":"A living read on one question: as inference becomes load-aware, and coding agents take over the tuning, what happens to the layer that serves the models? Updated daily by an agent that has to change its mind in public.","started":"2026-11-19","cadence_days":1,"repo":"https://github.com/shamanez/recursive-stack","site":"https://shamanez.github.io/recursive-stack/"},"model":{"_about":"Controlled vocabulary and the mental model the dashboard draws. Signals must use these ids. Change this file only when the picture itself changes (a new layer, a new way of producing optimisations) and say so in the cycle record.","layers":[{"id":"loop","name":"Optimisation loop","desc":"The agents, harnesses and scoreboards that produce optimisations. Nothing here serves a token; it decides what the layers below become."},{"id":"routing","name":"Routing & orchestration","desc":"Which model, worker or deployment configuration a request is sent to."},{"id":"serving","name":"Serving & scheduling","desc":"Batching, the prefill/decode split, KV-cache placement, eviction and transfer across a cluster."},{"id":"model","name":"Model-level","desc":"Changes to the weights or the decoding procedure: quantisation, distillation, speculative decoding, post-training."},{"id":"engine","name":"Engine & runtime","desc":"The forward-pass executor and its configuration: vLLM, SGLang, TensorRT-LLM, llama.cpp, MLX."},{"id":"compiler","name":"Compiler","desc":"Graph capture, fusion decisions and code generation between the model definition and the kernels."},{"id":"kernels","name":"Kernels","desc":"The GPU programs themselves: attention, MoE dispatch, GEMM, sampling, cache packing, on one specific chip."},{"id":"hardware","name":"Hardware","desc":"Accelerators and their memory and network topology."}],"mechanisms":[{"id":"hand","name":"Hand-tuned","desc":"A human performance engineer writes or configures it."},{"id":"rules","name":"Compiler rules","desc":"Fixed heuristics or cost models generate it. Deterministic, no learning from the deployment."},{"id":"online","name":"Online adaptive","desc":"The running system adjusts itself from live signals. No new code is written; a planner or controller moves knobs."},{"id":"agent","name":"Agent search","desc":"LLM agents propose code or configuration, a harness measures it, winners are kept. New code is written."},{"id":"frame","name":"Scoreboard / analysis","desc":"Benchmarks, critiques and essays. They optimise nothing, but they set what counts as winning."}],"venues":[{"id":"cluster","name":"Shared cloud","desc":"Multi-tenant serverless clusters run by an inference provider."},{"id":"dedicated","name":"Dedicated endpoint","desc":"Single-tenant cloud capacity tuned for one customer."},{"id":"onprem","name":"On-prem / private","desc":"Hardware the operator owns, in their own rack."},{"id":"local","name":"Local device","desc":"A laptop, workstation, phone or small box owned by the user."},{"id":"any","name":"Venue-neutral","desc":"Applies wherever the stack runs."}],"timescales":[{"id":"request","name":"Per request","span":"milliseconds","desc":"Routing a request to the worker that already holds its cache; choosing how far to speculate for this token."},{"id":"minutes","name":"Per traffic shift","span":"seconds to minutes","desc":"Re-splitting a cluster between prefill and decode; deciding which cached context to evict."},{"id":"days","name":"Per hillclimb","span":"hours to days","desc":"Agents rewriting kernels and engine paths against recorded traffic, then promoting the winners."},{"id":"release","name":"Per model or chip","span":"weeks","desc":"Bringing up a new architecture or accelerator on day zero."}],"loop":[{"id":"observe","name":"Observe","does":"Record what real traffic looks like: context lengths, cache hits, time per kernel.","hard":"Only whoever serves the traffic sees it, unless a public trace set stands in.","status":"working","signals":["2026-08-24-agentx-inferencex-v3","2026-10-28-decagon-autoresearch","2026-11-04-together-compiler"]},{"id":"propose","name":"Propose","does":"Agents write candidate kernels, engine patches or settings.","hard":"Cheap, and getting cheaper. A plain instruction has beaten expert-written playbooks.","status":"working","signals":["2026-11-16-together-deleted-megakernels","2026-10-02-baseten-agentic-engine","2026-11-09-inferenceforge"]},{"id":"evaluate","name":"Evaluate","does":"Measure each candidate on realistic inputs, end to end, and check outputs still match.","hard":"Synthetic inputs and isolated benchmarks give wrong answers. Nobody can yet simulate traffic they have not seen.","status":"bottleneck","signals":["2026-05-22-fastkernels","2026-11-16-together-deleted-megakernels","2026-09-22-swe-serve","2026-05-20-inferencebench","2026-10-09-blis-simulate-before-you-scale"]},{"id":"promote","name":"Promote","does":"Ship winners to production and, often, upstream to the open engine.","hard":"People still review what ships, and patches now arrive faster than they can read them.","status":"working","signals":["2026-10-16-vllm-kimi-k3-megakernel","2026-11-inferact-autonomous-inference-system"]},{"id":"reflect","name":"Reflect","does":"Revise the agents' own process from what failed.","hard":"Everyone names it as the goal. Almost no one has shown it. This step is what would make the loop recursive.","status":"unproven","signals":["2026-10-03-seis-self-evolving-inference","2026-03-30-kernel-smith","2026-09-17-zai-glm-built-its-inference"]}],"shift":{"then":{"label":"Before: a craft","note":"Retuned when someone has time","steps":["One model","An engineer hand-tunes kernels","One configuration","Served to all traffic"]},"now":{"label":"Now: a search","note":"Runs continuously","steps":["Real traffic, replayed","Agents write candidate code","A rig measures end to end","Winners ship and go upstream"],"loop":"repeats per model, per workload, per chip"}}},"thesis":{"headline":"Inference is becoming *load-aware*: the stack now fits itself to the traffic.","subhead":"Seven levers can move with the load, from which model answers to how deep each token goes. Coding agents are what make re-tuning them affordable.","intro":"Serving a large language model means a chain of decisions: which model answers, which machine takes the request, how a cluster splits reading prompts from writing answers, how generation is sped up, how much computation each token gets, and how it runs on a particular chip. Each was set once, by hand. During 2026 they began to move with the load: with what is being asked, by whom, on what hardware. Coding agents made that affordable by taking over the tuning. This page maps the levers and how they connect, tracks who has each one working and what it has bought, and checks the claims against the evidence, including your own reading of it. An agent re-examines it every day.","picture":[{"head":"Seven levers can move with the load","text":"Which model answers, which machine takes it, how the cluster is split, how tokens are written, how the engine runs, what the model is, and how deep each token goes. Four run in production.","signals":["2026-08-13-databricks-smart-routing","2026-08-17-llmd-sticky-until-saturated","2026-07-06-dspark","2026-11-04-together-compiler","2026-11-20-inkling-2-mini"],"more":"map"},{"head":"Twenty-five teams described or updated a loop since mid-October","text":"Agents that profile an engine, rewrite part of it, measure, and keep what wins. Providers, open engines, chip vendors, academics and individuals. Thirty-five more described versions earlier.","signals":["2026-11-inferact-autonomous-inference-system","2026-11-04-together-compiler","2026-11-16-sarvam-token-factory","2026-11-09-inferenceforge","2026-10-16-vllm-kimi-k3-megakernel"],"more":"roster"},{"head":"The prompt cache ties the levers together","text":"Nine-tenths of agent tokens are re-read context, cached per model and per machine. That is why routing is sticky and why the model is chosen once per session.","signals":["2026-10-08-openrouter-cache-is-crucial","2026-08-13-databricks-smart-routing","2026-09-08-vllm-agentx"]},{"head":"Measuring is now harder than optimising","text":"Kernel speed-ups of several times shrink to almost nothing inside a full engine. Some agent runs game the benchmark. Patches arrive faster than people can review them.","signals":["2026-05-22-fastkernels","2026-05-20-inferencebench","2026-11-16-together-deleted-megakernels"]},{"head":"Not yet recursive, and the commons keeps up","text":"The loops are bounded hillclimbs with goals set by people; nothing compounds yet. Specialised wins reach vLLM and SGLang within weeks, and per-customer tuning has bought tens of percent.","signals":["2026-09-17-zai-glm-built-its-inference","2026-10-03-seis-self-evolving-inference","2026-10-23-vllm-matches-deepinfer","2026-09-23-modal-trillion-tokens"]}],"claims":[{"id":"C1","short":"Agents do real performance engineering","statement":"Given a harness built by people, coding agents now find and land inference optimisations that survive end-to-end measurement in production engines.","plain":"This is not autocomplete for CUDA. Agents are finding bottlenecks a senior engineer would be pleased to find, and the patches are being merged.","why":"If true, the supply of performance engineering stops being limited by the few hundred people who can do it. If false, everything else here is marketing.","confidence":0.7,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Founding estimate. Merged public pull requests in vLLM and SGLang carry it; independent benchmarks showing parity at best on isolated kernels, and search beating agents on configuration, hold it down."}],"raise_if":"An independent group reproduces a vendor's agent-found gain, or a benchmark with end-to-end scoring shows agents beating shipped kernels in LLM serving by a clear margin.","lower_if":"Merged agent-written optimisations get reverted for correctness, or matched-budget search keeps beating agents as budgets and models grow.","status":"active"},{"id":"C2","short":"What you have sets the optimum","statement":"The best serving configuration depends on what you are running: the traffic shape, the model and the chip. Kernels and settings tuned for one combination leave double-digit gains unclaimed on another, and all three keep changing.","plain":"There is no best way to serve a model, only a best way to serve this traffic, with this model, on this chip. Change any one and the old best stops being best.","why":"This is the centre of your framing: a stack that fits itself to what you have. If one good general recipe existed, there would be nothing for a loop to chase.","confidence":0.8,"history":[{"cycle":"2026-11-19","confidence":0.8,"why":"Founding estimate. Supported from many directions, including independent measurement. Held below 0.9 because nearly all of it comes from one workload class and one public trace set."},{"cycle":"2026-11-19","confidence":0.8,"why":"Scope widened the same day, after the reader said local means fitted to what you have. Per-device evidence that sat under the retired C8 now counts here. Confidence unchanged."}],"raise_if":"A second public workload that is not coding agents, or a second chip family, shows a different set of winning optimisations under like-for-like measurement.","lower_if":"Engines tuned on AgentX and NVIDIA hardware turn out near-optimal on other workloads and chips too, meaning one good general recipe exists after all.","status":"active"},{"id":"C3","short":"Specialisation reaches the single customer","statement":"Tuning the stack to one customer's own traffic is worth enough over a well-tuned class-level stack to justify doing it per customer, continuously.","plain":"Your workload gets its own engine build. This is the part of user-workload-aware that is still a bet.","why":"It decides whether the value sits with whoever holds each customer's traffic, or in shared engines that everyone gets for free.","confidence":0.4,"history":[{"cycle":"2026-11-19","confidence":0.35,"why":"Founding estimate. The like-for-like numbers that exist are 20 to 45%, recipes are reported to transfer between customers, and a general engine came within 6% of a bespoke one. The case for is that a bespoke engine now costs a couple of hundred GPU-hours."},{"cycle":"2026-11-21","confidence":0.4,"why":"Correction after reading Modal first-hand. Its 20% came from tuning a drafter to the coding-agent class, and its recipe carried over to other models, not customers. One founding reason against was a misreading. Per-customer drafter gains are 34 to 45% on different baselines; there is still no same-endpoint comparison."}],"raise_if":"A provider publishes same-endpoint numbers showing per-customer tuning beating its own class-level stack by more than about 1.5x, or the cost of a bespoke engine keeps falling.","lower_if":"More reports that recipes transfer between customers, or upstream engines closing announced private leads within a quarter.","status":"active"},{"id":"C4","short":"Evaluation is the scarce part","statement":"Proposing optimisations has become cheap. Knowing whether one is real (on realistic inputs, end to end, with outputs intact) is the binding constraint, together with the human review that still gates what ships.","plain":"The agent is not the hard part. The rig that catches a fake speed-up is.","why":"Whoever owns the best evaluation rig, or the traffic to build one, owns the loop. It also tells you which published numbers to discount.","confidence":0.8,"history":[{"cycle":"2026-11-19","confidence":0.8,"why":"Founding estimate. The vendors building the loops and the independent benchmarks criticising them say the same thing, with numbers. The one complication is that a public benchmark let outsiders compete without private traffic."}],"raise_if":"More merged regressions traced to weak gates, or providers competing on evaluation infrastructure instead of on agents.","lower_if":"A cheap, general oracle appears (for example simulated traffic that predicts production), or isolated kernel results start transferring end to end.","status":"active"},{"id":"C5","short":"The loop closes on itself","statement":"The optimisation loop is becoming recursive: the models being served power the agents that optimise their serving, the agents improve their own process, and gains compound from one cycle to the next.","plain":"This is the RSI claim. Today the first part is true, the second is mostly aspiration, and the third has not been shown by anyone.","why":"Compounding is the difference between a useful tool and a runaway advantage for whoever starts first.","confidence":0.3,"history":[{"cycle":"2026-11-19","confidence":0.3,"why":"Founding estimate. Models do serve their own optimisers, and two groups recycle search traces into training. Against that: curated knowledge made one production system worse, more time did not help agents in a benchmark, and the label is being attached to systems with no self-improvement in them."}],"raise_if":"A published curve where gain per cycle rises, or a model trained on optimisation traces that out-optimises its teacher on a production task.","lower_if":"Loops plateau after the first few rounds on each new model, or inherited agent memory keeps hurting in ablations.","status":"active"},{"id":"C6","short":"Churn forces automation","statement":"New model architectures and new chips now arrive faster than people can hand-tune for them. That, more than agent capability, is what makes an automated loop necessary.","plain":"By the time a person has tuned the kernels, traffic has moved to the next model. Something has to do day-zero support, and it will not be a person.","why":"It explains the timing, and for a provider serving many models it is the daily problem: every new model needs a drafter, a tuned engine and a correctness check before the traffic arrives.","confidence":0.7,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Founding estimate. Several independent accounts of the same pressure, including on chips with no kernel ecosystem. The main statistic behind it is one vendor's citation, and one new model reached near-parity by hand integration."}],"raise_if":"Time from a model's release to a tuned public result keeps shrinking and is credited to agents, or more non-NVIDIA chips reach parity through agent-written kernels.","lower_if":"Architectures converge again, or one vendor library covers new models well enough at release.","status":"active"},{"id":"C7","short":"The commons keeps up","statement":"Open engines absorb specialised wins within weeks, so a private performance lead over upstream vLLM or SGLang is short-lived.","plain":"If you can wait a month, you get most of it for free.","why":"This is the question of who keeps the gains: providers as margin, or everyone as cheaper tokens.","confidence":0.55,"history":[{"cycle":"2026-11-19","confidence":0.55,"why":"Founding estimate. Both open engines run agent loops themselves and take fixes upstream fast. Two providers claim private leads of roughly 2x that nobody outside has checked."}],"raise_if":"Announced private leads are matched by public runs within a quarter.","lower_if":"Those leads persist or widen, or key optimisations stop going upstream.","status":"active"},{"id":"C8","short":"The loop reaches hardware you own","statement":"The same self-tuning loop will run on stacks the user owns (a workstation, an on-prem box, a laptop), tuned to that user's own usage, not only in provider clusters.","plain":"This is the local in your framing. Today local stacks tune themselves to the device, once, by trying existing settings. Nothing tunes itself to you.","why":"It is the part of the reader's framing with the least support, so it is either the open ground or the mistake.","confidence":0.2,"history":[{"cycle":"2026-11-19","confidence":0.2,"why":"Founding estimate. One paper shows agent-written kernels on edge chips; everything else local is one-off autotuning or hand work. Cost analyses run against it, and the loop's economics lean on batching that a single user lacks."}],"raise_if":"An agent-driven loop on owned hardware shows a like-for-like gain from the owner's own traffic, or private fleets that are not hyperscalers publish such results.","lower_if":"Local runtimes keep converging on vendor compilers and one-off autotuning, and cost analyses keep favouring shared capacity.","status":"retired","retired_why":"Retired the day it was opened. It tested whether the loop reaches on-device hardware, which is not what the reader meant by local. The part that matters, the stack fitting whatever chip it finds, now sits under C2."},{"id":"C9","short":"Open and frontier models share the work","statement":"Open-weight and frontier models coexist behind one harness. Routine sessions go to a cheaper open model and hard ones to a frontier model, and the prompt cache decides how often that choice can be made.","plain":"Nobody picks one model any more. Something picks per session, and it cannot change its mind mid-session without paying to re-read everything.","why":"For a provider this sets what you serve. Open models carry most of the tokens and about a quarter of the money, and the routing decision is a product you can own or lose to the harness.","confidence":0.65,"history":[{"cycle":"2026-11-19","confidence":0.7,"why":"Opened when the reader widened the frame. Coexistence is measured on two gateways and shipped by five products. Held down because an independent test found routers do not beat a fixed cheap model, and a static swap may capture most of the saving."},{"cycle":"2026-11-21","confidence":0.65,"why":"A router vendor's own public board shows single models from its pool beating its coding router on quality and cost on public coding tasks, a second result after AutoBench. The cache part holds: that router stayed on one model nine turns in ten."}],"raise_if":"An independent agentic benchmark, with caching priced in, shows a shipped router beating the best fixed model on cost at equal quality.","lower_if":"Open models stall or frontier prices fall so that one model is simply best, or more products drop automatic routing.","status":"active"},{"id":"C10","short":"The model itself becomes a setting","statement":"Tuning an open model to one domain or harness (post-training, reinforcement learning, distillation) works as an inference optimisation: a smaller tuned model does a narrow job at lower cost and latency than a general one.","plain":"Instead of making a big model run faster, you make a small one good enough at your one job.","why":"For a provider this is the lever with the most lock-in and the shortest shelf life. A tuned model needs its own drafter and its own compiled engine, and it is tied to a base model that may be withdrawn within months.","confidence":0.45,"history":[{"cycle":"2026-11-19","confidence":0.45,"why":"Opened when the reader widened the frame. Named customers report real gains on narrow tasks, one measured by a third party. Against that: a tuner's own table shows a newer general model beating its tuned one, a frontier lab is withdrawing fine-tuning, and tunable bases churn within weeks."}],"raise_if":"A tuned open model shown head to head against a current frontier model on the customer's own task, with cost, and still ahead three months later.","lower_if":"More tuned models overtaken by the next general release within a quarter, or more providers withdrawing tuning products.","status":"active"},{"id":"C11","short":"Looping trades time for memory","statement":"Looping pays where weight memory binds. Running part of a model more than once per token buys quality per byte of weights at extra compute per token, so it suits a laptop or many models on one GPU; where compute or latency binds, a larger plain model beats a loop added after training.","plain":"A looped model is a smaller model that works harder on each word. That helps when memory is short and hurts when time is.","why":"For a provider serving many models, this decides whether looped models fit more models per GPU or are a slower road to quality that a bigger model gives more cheaply. Trained loops keep a cache for every pass over the prompt, which can cancel the saving on weights.","confidence":0.65,"history":[{"cycle":"2026-11-22","confidence":0.65,"why":"Opened when the reader asked whether looped models were covered. A check that priced the compute found loops added after training paying only at 0.8B, and a plain 14B beating a looped 8B on maths at modest extra time. Learned loops do match larger models per byte, and one lab built a looped model to fit a laptop. Against: that lab also claims a per-compute win for loops learned in training, and nobody has served a looped and a dense model of equal quality side by side."}],"raise_if":"A looped and a dense model of equal quality served in one engine, with the looped one ahead where weights limit what fits and behind where cache or compute does.","lower_if":"A loop added after training beating a larger model at equal decoding time, or a looped model ahead of a dense one of equal compute on throughput per GPU at equal quality.","status":"active"}]},"signals":[{"id":"2026-11-24-baseten-harvey-post-training","title":"Open-weight models beat the closed frontier on legal tasks with Harvey","url":"https://www.baseten.co/blog/open-weight-models-beat-the-closed-frontier-on-legal-tasks-with-harvey/","org":"Baseten and Harvey","authors":"Jonathon Liu, Xavier Morris, Will Rankin, Aaron Ellis-Bloor, Matthew Blau, Albert Lee","published":"2026-11-24","added":"2026-11-26","kind":"blog","layers":["model"],"mechanism":"hand","venue":"dedicated","gist":"Harvey and a provider post-trained four recent open models on agentic legal work and scored them on Harvey's benchmark, where a task passes only if every criterion is met. All four rose by 11 to 21 points. One, at 30.3%, passed the best closed model at 27.1%; the other three stayed below it but above two other closed models. Coding scores held.","changes":"Tuning turns out to be a treadmill that still pays. Harvey's August tune of an older model, at 19.7%, was passed by an untuned general model within three months. Re-tuning newer bases took the lead back. For a provider, post-training is work that repeats with every base model, like a drafter or an engine.","caveats":"Run by the provider and the customer on the customer's own benchmark. Closed-model scores came from a slightly different harness, reproduced within a point for one model. No cost per task, no training compute and no held-out split for the main benchmark are given. The headline says open models beat the closed frontier; one of four tuned models did.","numbers":[{"metric":"All-pass rate on the legal agent benchmark, best tuned open model","value":"30.3%, from 19.2% before tuning","baseline":"27.1% for the best closed model, untuned","verification":"self-reported","setup":"Muse Spark Open, medium reasoning"},{"metric":"The other three tuned open models","value":"20.8 to 23.3%, from 0 to 11.7% before tuning","baseline":"16.3% and 5.0% for two other closed models","verification":"self-reported"},{"metric":"Contract tasks absent from training","value":"4.0 to 13.0% and 10.0 to 16.0%","baseline":"the same two models before tuning","verification":"self-reported"},{"metric":"Hard coding tasks after legal tuning","value":"68.6% against 70.6%, with about 35% fewer output tokens","baseline":"the same model untuned at its highest reasoning setting","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A tuned open model passed the best closed model on the customer's own task. No cost is given, so the claim's cost half still rests on the August result."},{"claim":"C6","direction":"supports","note":"The customer tuned four new base models three months after tuning one. The work repeats with each base."}],"also":[{"label":"The August tune it follows","url":"https://fireworks.ai/customers/harvey-tenet-kimi-k3-post-training"}],"read":"opened","status":"active"},{"id":"2026-11-23-llmd-sglang-tiered-kv-cache","title":"Bringing First-Class SGLang Serving to llm-d","url":"https://llm-d.ai/blog/serving-glm-5-2-sglang-tiered-kv-cache-on-llm-d","org":"llm-d and SGLang (Google, IBM Research and SGLang maintainers)","published":"2026-11-23","added":"2026-11-23","kind":"blog","layers":["serving","routing"],"mechanism":"rules","venue":"cluster","gist":"SGLang now runs inside llm-d's Kubernetes router next to vLLM, with each data-parallel rank exposed so routing can follow its cache. On GLM-5.2 with replayed coding-agent traces on 16 H200s, sessions outgrew GPU memory past 32 concurrent, and by 128 the cache hit rate was 6%. Spilling the cache to host memory kept reuse at 85 to 95%. A third tier on shared storage cost time in steady state and paid off when a pod failed.","changes":"Cache capacity is a load-aware setting in its own right. A host-memory tier matters once sessions outgrow GPU memory, here past 32 concurrent, and was then worth almost 4x. The shared-storage tier is insurance that costs first-token time every day and pays only when a pod fails.","caveats":"The project's own measurements on one model, one chip and one public trace set. The baseline at 128 sessions, GPU memory only with a 174-second median first token, is a setting nobody would run in production. The storage tier's cost comes from synchronous write-through and prefetch settings; no asynchronous setting is reported.","numbers":[{"metric":"Output throughput at 128 concurrent sessions with a host-memory cache tier","value":"3.94x","baseline":"GPU memory only, same 16-GPU layout","verification":"self-reported","setup":"GLM-5.2, 16x H200, one prefill and one decode pod, AgentX replay of coding-agent traces"},{"metric":"Cache hit rate with the host-memory tier","value":"85 to 95% from 16 to 128 concurrent","baseline":"6% at 128 concurrent with GPU memory only","verification":"self-reported"},{"metric":"Median time to first token at 128 concurrent","value":"8.7x lower than 174.2 s","baseline":"GPU memory only","verification":"self-reported"},{"metric":"Median time to first token with a shared-storage tier added, steady state","value":"14 to 33% higher on one replica; 26% at 64 and 66% at 128 concurrent on 32 GPUs","baseline":"the same layout without the storage tier","verification":"self-reported"},{"metric":"Median time to first token after a prefill pod failed","value":"28.8 s, with 99.94% of prefix tokens restored from storage","baseline":"38.4 s without the storage tier","verification":"self-reported","setup":"32x H200, 24 sessions of about 98K tokens"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Which cache tiers pay depends on the load: host memory once sessions outgrow the GPU, shared storage only where pods fail."}],"read":"opened","status":"active"},{"id":"2026-11-21-together-prompt-leak","title":"Security event: Prompt leakage for requests in June and July of 2026","url":"https://www.together.ai/blog/security-event-prompt-leakage-for-requests-in-june-and-july-of-2026","org":"Together AI","authors":"Vipul Ved Prakash","published":"2026-11-21","added":"2026-11-22","kind":"blog","layers":["loop","serving"],"mechanism":"frame","venue":"cluster","gist":"Together kept samples of customer prompts, authorised for software testing, in a private repository. While working on a public code repository, an AI coding agent committed a credential to that store; scanning caught and reverted it, but an outside party had already downloaded the samples and tried credentials found in them. Together now checks every pull request for credentials, uses short-lived ones, has changed how it uses coding agents, and makes zero data retention the default for new accounts.","changes":"Stored traffic is the rig's raw material and a liability. Prompt samples kept for testing are what build step 1 records, and agent-written code exposed them. Zero retention by default also shrinks the traffic a provider may keep per customer, which weighs on C3.","caveats":"The company's own account of its own incident, with the scope still under review. It does not say what the samples tested, so the link to replay or performance work is an inference. Zero retention is the default only for new accounts; existing customers must turn it on. Nothing says whether a person reviewed the agent's commit.","numbers":[],"bears_on":[{"claim":"C4","direction":"supports","note":"An agent's commit exposed a credential and only a scan after the fact caught it. What agents ship needs gates beyond speed and correctness."},{"claim":"C3","direction":"complicates","note":"After the leak a provider made zero retention the default, so keeping a new customer's traffic to tune on becomes something the customer must allow."}],"read":"opened","status":"active"},{"id":"2026-11-20-inkling-2-mini","title":"Introducing Inkling 2 Mini","url":"https://thinkingmachines.ai/news/inkling-2-mini/","org":"Thinking Machines Lab","published":"2026-11-20","added":"2026-11-22","kind":"product","layers":["model"],"mechanism":"hand","venue":"any","gist":"An open-weights looped mixture-of-experts model, 26.4B parameters in total, small enough for a laptop at about 20 GB. Its middle 12 of 24 layers run three times per token. Two-thirds of its experts were pruned during training and the rest healed on a trillion distilled tokens. Weights were trained and are served in 4-bit, on the lab's own platform.","changes":"A lab now ships a looped model and serves it, at a fixed three passes. Pruning plus looping gives a laptop-sized model that the lab says leads open models under 100B on agentic coding. It also claims loops learned in training pay per unit of compute, which no retrofit has shown.","caveats":"Scores are the lab's own, with evaluation setups that vary by model. The compute comparison is on training loss, not tasks, and against an unpruned twin. Depth is fixed at three passes; only a research variant runs one to ten. Looping adds no knowledge, and factual recall matches models of its size. The healing used a trillion tokens, far from light post-training.","numbers":[{"metric":"DeepSWE v1.1, tasks resolved","value":"48.2%","baseline":"42.2%, Qwen3.8-27B, the next open model under 100B","verification":"self-reported","setup":"mini-swe-agent; setups vary by model"},{"metric":"Inference compute a non-looped twin needs to match its loss","value":"+140%","baseline":"the unpruned looped model, same ladder","verification":"self-reported","setup":"512k-token agentic traces; the twin cost 7.5% less to train"},{"metric":"Intelligence per joule on DGX Spark","value":"0.703","baseline":"0.430, Qwen3.6-35B-A3B","verification":"third-party","setup":"Stanford researchers with early access, as reported by the lab; MXFP8 against NVFP4"},{"metric":"Memory footprint","value":"about 20 GB","baseline":"26.4B parameters, mostly 4-bit","verification":"self-reported","setup":"ran offline on a 48 GB MacBook Pro"}],"bears_on":[{"claim":"C11","direction":"complicates","note":"Built to fit a laptop, the memory case, yet its makers also claim loops learned in training win on inference compute."}],"also":[{"label":"Weights","url":"https://huggingface.co/thinkingmachines/Inkling-2-Mini"},{"label":"Variable-loop research model","url":"https://huggingface.co/thinkingmachines/TML-d24-varloop-research"}],"read":"opened","status":"active"},{"id":"2026-11-20-agentx-kimi-k31-first-fortnight","title":"Kimi K3.1 Pro on AgentX: the first fifteen days of public runs","url":"https://inferencex.semianalysis.com/infx/inference/agentic","org":"SemiAnalysis (InferenceX)","published":"2026-11-20","added":"2026-11-22","kind":"benchmark","layers":["engine","serving"],"mechanism":"frame","venue":"cluster","gist":"The public AgentX board has run Kimi K3.1 Pro on five chips since its open weights appeared on 5 November. This tracker compared the board's best result per chip at 50 tokens per second per user or faster on 6 November with the same on 20 November. Throughput per GPU rose 1.2x on GB300 and 1.8 to 2.9x on B200, B300, GB200 and MI355X, mostly from switching engine and moving to disaggregated setups.","changes":"A first public answer to how long tuned serving takes after a model's release. Day-zero serving left 1.2 to 2.9x on the table and the open engines collected it within about two weeks, least on the flagship chip. A provider serving a new model on day zero runs well below its later speed.","caveats":"Computed by this tracker from the board's public API; SemiAnalysis has not published this comparison. Best per chip at a speed floor mixes engines, precisions and topologies, so it tracks the best setup available, not one engine improving. Total tokens per GPU is mostly cached input. Day zero here is the open weights, twelve days after the API launch, and engine teams may have had early access.","numbers":[{"metric":"Best total tokens per GPU at 50 tok/s per user or faster, GB300","value":"36.7k (1.17x)","baseline":"31.3k on 6 Nov, the first day of public runs","verification":"public-run","setup":"GB300 NVL72, disaggregated; Dynamo with SGLang, then with vLLM"},{"metric":"The same, GB200","value":"23.0k (2.9x)","baseline":"7.9k on 6 Nov","verification":"public-run","setup":"GB200 NVL72, Dynamo with SGLang, disaggregated both times"},{"metric":"The same, B300","value":"36.6k (2.4x)","baseline":"15.3k on 6 Nov, SGLang on one node","verification":"public-run","setup":"Dynamo with vLLM, disaggregated across nodes"},{"metric":"The same, MI355X","value":"17.3k (1.9x)","baseline":"9.2k on 6 Nov, SGLang","verification":"public-run","setup":"TokenSpeed, an open engine, by 20 Nov"},{"metric":"The same, B200","value":"6.1k (1.8x)","baseline":"3.5k on 6 Nov, vLLM","verification":"public-run","setup":"SGLang by 11 Nov"},{"metric":"Best per chip at 100 tok/s per user or faster","value":"1.3 to 3.6x","baseline":"the same chips on 6 Nov","verification":"public-run","setup":"GB300, GB200, B300, MI355X"}],"bears_on":[{"claim":"C6","direction":"complicates","note":"The churn is costly: a new model ran at a third to five-sixths of its later throughput in its first fortnight. But engine teams and chip partners closed the gap in about two weeks without a fully automated loop."},{"claim":"C7","direction":"supports","note":"The open engines tuned a new model to most of its gain, in public, within two weeks, so a private lead on a new model has about that long."},{"claim":"C2","direction":"supports","note":"The flagship chip started within 17% of its later result while the others started 1.8 to 2.9x short. Early tuning for one chip did not carry to the rest."}],"also":[{"label":"Board data as of 6 Nov (API)","url":"https://inferencex.semianalysis.com/api/v1/benchmarks?model=Kimi-K3.1-Pro&date=2026-11-06"},{"label":"Board data, latest (API)","url":"https://inferencex.semianalysis.com/api/v1/benchmarks?model=Kimi-K3.1-Pro"}],"read":"opened","status":"active"},{"id":"2026-11-19-validation-driven-deployment","title":"Validation-driven Deployment of LLM Inference Platforms for Agentic Workloads","url":"https://arxiv.org/abs/2611.25905","org":"Shai Gretz and co-authors, with the llm-d team","authors":"Shai Gretz, Alon Halfon, Yoav Katz and 10 others","published":"2026-11-19","added":"2026-11-20","kind":"paper","layers":["serving","routing","loop"],"mechanism":"frame","venue":"cluster","gist":"A pipeline for validating an agentic serving stack from first test to production, using recorded sessions replayed with their content, live agent runs and synthetic load. Replay holds each session's token load within 1.18x of the recording; re-running the agents drifts up to 4.98x. Rolling out four large mixture-of-experts models on llm-d, traffic recorded on the target model reached about 60% of the throughput public traces had suggested, and exposed a routing bug they hid.","changes":"The first report of a stack sized on public agent traces and then checked on traffic from its own model. The public traces overstated capacity by about 1.7x and hid a routing bug. That leans T4 toward the traffic, and makes capture the first part of the rig to build.","caveats":"The recorded traffic is benchmark tasks run by real agents on the target model, not customers' sessions; production was checked only against token-length histograms. The authors put the gap down mainly to answer lengths and session shapes that follow the model. One team, H100 and H200, and the 60% is a rough figure across four models. The coverage analysis sees only vLLM's Python code.","numbers":[{"metric":"Per-session input tokens at the 95th percentile, against the recording","value":"within 1.18x","baseline":"live re-runs of the same agents, up to 4.98x","verification":"self-reported"},{"metric":"Per-GPU throughput on traffic recorded from the target model","value":"about 60%","baseline":"the same stack on public agent traces from SemiAnalysis and NVIDIA","verification":"self-reported","setup":"GLM-5.3, Nemotron 3 Ultra, DeepSeek-V4.1-Flash and Kimi K3 on llm-d, H100 and H200"},{"metric":"Highest load before performance degraded","value":"about half","baseline":"the same public traces","verification":"self-reported"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Public traces misjudged capacity by about 1.7x and hid a routing bug; live, replayed and synthetic tests each reached code the others missed."},{"claim":"C2","direction":"supports","note":"Traffic generated by the target model halved the operating point found on someone else's traces."},{"claim":"C3","direction":"complicates","note":"Your own traffic matters for sizing and for catching bugs. The paper does not show per-customer tuning beating a class-level stack."}],"read":"opened","status":"active"},{"id":"2026-11-18-vllm-flydsl-monokernels","title":"Keeping Agents Fast: High-Interactivity Decode with FlyDSL MonoKernels in vLLM","url":"https://vllm.ai/blog/2026-11-18-flydsl-monokernels","org":"AMD, on the vLLM blog","authors":"Felix Li and 20 co-authors","published":"2026-11-18","added":"2026-11-20","kind":"blog","layers":["engine","kernels"],"mechanism":"hand","venue":"any","gist":"AMD engineers merged hand-written fused decode paths into vLLM for five models on MI355X, one also on MI325X. Each decoder layer runs as two or three persistent launches instead of dozens of kernels. The path is opt-in and chosen per layer and per step; steps too wide for the kernels fall back to the stock path. A shared standard governs where the code lives and what evidence each change carries.","changes":"Whether to fuse turns out to depend on the load. With graph replay on both sides, fused decode was 1.2 to 2.3x faster per token for one user and the gain shrank as concurrency rose. The fused camp is scaling up, with 12 per-model packages and 165k lines across both chip vendors.","caveats":"Measured by the kernel authors on their own chips, though the one-user figures come from merged pull requests. One model's gain is against a historical public run on an older stack. Fusion trades throughput for latency: a fused eight-GPU server delivered 26% less than two four-GPU replicas at 4 concurrent. A follow-up RFC finds 48 hand-set test tolerances and one 11.5k-line package with no numerics test.","numbers":[{"metric":"Per-token speed for one user, fused against stock decode","value":"1.20 to 2.26x","baseline":"stock vLLM with HIP graphs, same node","verification":"public-run","setup":"Six merged pull requests, MI355X and MI325X"},{"metric":"The same gain as concurrency rises","value":"1.35x to 1.14x at 8 (DeepSeek-V4.1-Flash); 1.20x to parity at 16 (MiniMax-M3); 1.35 to 1.57x across the sweep (Muse Spark)","baseline":"stock vLLM, same node","verification":"public-run"},{"metric":"Throughput at 4 concurrent, one fused eight-GPU server","value":"26% lower","baseline":"two four-GPU replicas","verification":"public-run"},{"metric":"Model-specific decode code in vLLM","value":"12 packages, about 165k lines","baseline":"none shares a numerical reference; one has no numerics test","verification":"public-run","setup":"Audit in vLLM RFC #68016, November 2026"}],"bears_on":[{"claim":"C2","direction":"supports","note":"Whether to fuse depends on concurrency and model: boundaries are drawn per model, and the gain shrinks as batches fill."},{"claim":"C4","direction":"supports","note":"The follow-up audit finds 165k lines of per-model decode code with hand-set tolerances and one package untested. The gates lag the code."},{"claim":"C6","direction":"complicates","note":"People kept pace by hand for five models in about six weeks, but each model needs its own copy per chip and size, the repeated work C6 predicts."}],"also":[{"label":"RFC #60904, the standard for specialised decode","url":"https://github.com/vllm-project/vllm/issues/60904"},{"label":"RFC #68016, numerical testing for specialised decode","url":"https://github.com/vllm-project/vllm/issues/68016"}],"read":"opened","status":"active"},{"id":"2026-11-18-datadog-fine-tune-baseten","title":"How we fine-tuned a faster model for Patterns on Baseten","url":"https://www.datadoghq.com/blog/fine-tuning-patterns-baseten/","org":"Datadog","published":"2026-11-18","added":"2026-11-19","kind":"blog","layers":["model","loop"],"mechanism":"agent","venue":"dedicated","gist":"Summarisation was most of the cost and half the latency of one product feature. The team distilled a month of a frontier model's production summaries into an adapter on a small open model. A coding agent ran the workflow, with a person approving each paid step.","changes":"A workload owner replacing a frontier model with a small tuned one for a single job, using its own production outputs as the teacher. It is also an agent working on the model lever, not the engine.","caveats":"Small evaluation, no head-to-head with the frontier teacher and no dollar figures. The authors say the untuned model mostly failed by running out of tokens; on answers it finished, both passed at the same rate. The base model had already been dropped from another provider's training list.","numbers":[{"metric":"Average generation time","value":"0.89 s against 44.7 s","baseline":"the same small open model untuned","verification":"self-reported","setup":"150 held-out cases"}],"bears_on":[{"claim":"C10","direction":"supports","note":"A narrow job moved from a frontier model to a small tuned one, trained on the frontier model's own outputs."},{"claim":"C10","direction":"complicates","note":"Most of the measured gain was fixing truncation, not better answers."},{"claim":"C3","direction":"supports","note":"One company, one feature, its own traffic as training data."}],"read":"relayed","status":"active"},{"id":"2026-11-16-together-deleted-megakernels","title":"Last year we built megakernels. This year we deleted them","url":"https://www.together.ai/blog/road-to-together-compiler","org":"Together AI","authors":"Dylan Lim, Reyna Abhyankar, Simran Arora","published":"2026-11-16","added":"2026-11-19","kind":"blog","layers":["kernels","compiler","loop"],"mechanism":"agent","venue":"cluster","gist":"A retrospective on why Together abandoned fusing a whole forward pass into one GPU kernel. Simpler primitives recover nearly all of the gain, megakernels break across chips and architectures, and the rule-based compiler they built in between was too rigid. They now let agents rewrite the forward pass from source and measure on real inputs. Includes unusually frank ablations of their own agent scaffolding.","changes":"The best single source on why measuring is the hard part, with concrete cases of benchmarks lying. Its ablations cut against the idea that agents improve by accumulating curated knowledge: a plain instruction beat expert-written strategies.","caveats":"A vendor post. Baselines are not always fully specified and the product is early access through sales. The ablations are on one layer of one model. Two other teams are shipping agent-written megakernels in the same month.","numbers":[{"metric":"Llama 1B decode with CUDA Graphs and fine-grained PDL","value":"975 tok/s, 98% of the megakernel","baseline":"megakernel 990; compiler default 669","verification":"self-reported","setup":"H100"},{"metric":"Agent loop against hand-written megakernel","value":"2,118 vs 1,649 tok/s (+28%)","baseline":"the megakernel","verification":"self-reported","setup":"Llama 3.2 1B, B200"},{"metric":"One top-k kernel on random against real inputs","value":"20 microseconds vs 62 milliseconds","baseline":"the same kernel","verification":"self-reported"},{"metric":"Isolated compiler benchmark against live forward pass","value":"39 to 58% slower in isolation","baseline":"timing inside the live forward pass","verification":"self-reported"},{"metric":"Speed-up with a curated knowledge base","value":"4.75x, against 5.85x without it","baseline":"the same agent system without the knowledge base","verification":"self-reported","setup":"MiniMax-M3 layer 3, B200"},{"metric":"Six expert-written strategies against a plain instruction","value":"about 26% worse","baseline":"naive prompt","verification":"self-reported"},{"metric":"One compiler flag across batch sizes","value":"+10 to 26% at large batch, 49% slower at batch 1","baseline":"flag off","verification":"self-reported"}],"bears_on":[{"claim":"C4","direction":"supports","note":"Synthetic inputs misled agents; isolated benchmarks were off by half; the harness timed a no-op at 2.5 microseconds."},{"claim":"C2","direction":"supports","note":"The same flag helps or hurts depending on batch size. A static kernel registry was tried and did not work."},{"claim":"C5","direction":"challenges","note":"Curated knowledge and expert strategies made the agents worse. Accumulated know-how is not yet compounding."},{"claim":"C1","direction":"supports","note":"Agent loops beat the team's own hand-written megakernel within a day."},{"claim":"C6","direction":"supports","note":"One megakernel could not span two attention types on a new chip; forcing it cost 5 to 19%."}],"also":[{"label":"Megakernel origin post (Hazy Research, 2025)","url":"https://hazyresearch.stanford.edu/blog/2025-05-27-no-bubbles"}],"read":"opened","status":"active"},{"id":"2026-11-16-sarvam-token-factory","title":"Introducing Sarvam Token Factory","url":"https://www.sarvam.ai/blogs/sarvam-token-factory","org":"Sarvam AI","published":"2026-11-16","added":"2026-11-26","kind":"blog","layers":["loop","serving","engine","routing"],"mechanism":"agent","venue":"cluster","gist":"A provider in India launched its serving stack for its own and open models. An orchestrator agent reads fleet telemetry and hands experiments to sub-agents per layer; a simulator calibrated on its servers filters candidates before live A/B tests, and an engineer approves each change. The post lists eight changes tested on one model, six kept, and bugs it found in an upstream fused kernel.","changes":"Another provider runs the loop in production, and the first to say a simulator screens changes before live tests. Its gains sit where the build order says: cache tier, prefill and routing, with first-token time 2.1x better than the stock stack on the same nodes. An upstream fused kernel had shipped a correctness bug.","caveats":"All numbers are its own. The 1.9x throughput figure compares with a public board's published run, not a rerun on its hardware, and that run had speculation off at the top load. The agent loop gets one paragraph: no count of agent-found changes, no cost, and nothing on how well the simulator predicts. Whether its kernel fixes went upstream is not stated.","numbers":[{"metric":"Median time to first token at 64 agent sessions","value":"667 ms against 1,428 ms; slowest 1%: 3.2 s against 14.1 s","baseline":"stock vLLM 0.31 and Dynamo on the same two B200 nodes, at the same throughput per GPU","verification":"self-reported","setup":"GLM 5.3 Flash, public agent traces"},{"metric":"Tokens per GPU at about 70 tokens a second per user","value":"6,177 against 3,213 (1.9x)","baseline":"a public board's published vLLM run on B200, not rerun","verification":"self-reported","setup":"Kimi K3.1 Pro, 16 B200s"},{"metric":"Prompt tokens served from cache in production","value":"95.7%, up from 91.4%, which halves prefill work","baseline":"GPU memory alone, before a shared cache store","verification":"self-reported","setup":"DeepSeek V4.1 Flash, seven days to 6 November"},{"metric":"Prefill nodes needed at peak","value":"34 against 58","baseline":"the same traffic without the shared cache store","verification":"self-reported","setup":"GLM 5.3"},{"metric":"Long code replies garbled by an upstream fused kernel","value":"32 of 299, none after its fix","baseline":"vLLM's fused decode kernel for GLM 5.3 Flash, which skipped a clamp","verification":"self-reported","setup":"Public agent traces"},{"metric":"Draft tokens per step at 320 sessions","value":"3 instead of 4 gave 6.2% more throughput","baseline":"the same drafter proposing 4","verification":"self-reported","setup":"Kimi K3.1 Pro decode"}],"bears_on":[{"claim":"C4","direction":"supports","note":"An upstream fused kernel shipped without a clamp and garbled about one long code reply in nine. Its own changes pass a simulator, a live test and an engineer."},{"claim":"C7","direction":"challenges","note":"A private stack returns the first token 2.1x sooner than the stock open one on the same nodes, and reports 1.9x a public board's throughput."},{"claim":"C1","direction":"supports","note":"Agents run dozens of experiments per model in days, with a person approving each change."},{"claim":"C6","direction":"supports","note":"It says each new model breaks kernel, cache and scheduling assumptions that must be fixed within hours of release."}],"read":"opened","status":"active"},{"id":"2026-11-09-inferenceforge","title":"InferenceForge: agents optimizing agentic serving","url":"https://agenteconomics.org/posts/inference-forge","org":"agenteconomics.org","authors":"Jesse Cai, Huimin Zeng, Yuxuan Lu, Dakuo Wang, Kai-Wei Chang","published":"2026-11-09","added":"2026-11-19","kind":"blog","layers":["loop","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"An off-the-shelf coding agent, placed in a custom environment with a harness and an evaluation suite, tuned SGLang for Kimi K3 under a floor on per-user speed. In nine iterations over three days it found three kernel-level fixes specific to agent traffic, where a few very long contexts share a batch with many short ones, and landed them as pull requests in a fork.","changes":"The first public case of outsiders with no production traffic topping the shared scoreboard using a general-purpose agent. The fixes are new code, not configuration, and each targets a traffic shape that uniform benchmarks never produce.","caveats":"Measured by the authors on one node. The comparison is against runs published by other teams on other dates, not a same-day rerun. The fixes sit in a personal fork, not upstream. The cost of the agent runs is not given.","numbers":[{"metric":"Kimi K3 throughput at 30 tok/s per user","value":"12.8k tok/s per GPU (+43%)","baseline":"8.9k, best published AgentX reference","verification":"self-reported","setup":"8x B300, one node"},{"metric":"Kimi K3 peak throughput","value":"16.2k tok/s per GPU (+29%)","baseline":"best published AgentX run (vLLM, 16 Aug)","verification":"self-reported","setup":"8x B300"},{"metric":"Decode step with one 900K-token request among 40","value":"522 to 126 microseconds","baseline":"before splitting long attention reads","verification":"self-reported","setup":"microbenchmark, B300"},{"metric":"Linear-attention recurrence per 32K chunk","value":"1,199 to 426 microseconds (2.8x)","baseline":"sequential scan","verification":"self-reported","setup":"B300"},{"metric":"Kimi K3.1 at 56 tok/s per user","value":"23.7k tok/s per GPU (+5%)","baseline":"22.6k at 53, best published SGLang run (5 Nov)","verification":"self-reported","setup":"8x B300"}],"bears_on":[{"claim":"C1","direction":"supports","note":"A general coding agent found and validated three kernel fixes, bit-exact where claimed."},{"claim":"C2","direction":"supports","note":"All three fixes exist only because agent traffic mixes very long and short contexts in one batch."},{"claim":"C4","direction":"complicates","note":"A public replayable workload stood in for private traffic. Outsiders could play, which weakens the idea that only traffic owners can evaluate."},{"claim":"C5","direction":"supports","note":"States a plan to put the authors' own models, post-trained for optimisation, into the loop. A plan, not a result."},{"claim":"C7","direction":"supports","note":"On the newest model the lead over the best public run is 5%. The public frontier is close behind."}],"also":[{"label":"SGLang fork","url":"https://github.com/jcaip/sglang-fork"}],"read":"opened","status":"active"},{"id":"2026-11-09-evolving-infra","title":"Evolving Infra: agent-adaptive LLM serving at scale","url":"https://inference-rsi.com","org":"MIT HAN Lab with Georgia Tech, UIUC, UC Berkeley, NVIDIA, OpenAI","authors":"Hao Kang, Weili Xu, Ziyang Li, Zheng Du, Hanchen Li, Tian Xia, Song Bian, Tushar Krishna, Huizi Mao, Ion Stoica, Song Han","published":"2026-11-09","added":"2026-11-19","kind":"paper","layers":["serving","routing"],"mechanism":"online","venue":"cluster","gist":"A serving system for agent workloads in which every node can do prefill or decode and switch between them in seconds without restarting. A planner fits a timing model online and re-splits the cluster as traffic shifts. A cluster-wide directory keeps cached context that agents are waiting to reuse and evicts what they have abandoned.","changes":"The non-agent half of the story. Nothing here writes code: a controller moves knobs from live signals. It shows large gains from adapting to the workload at the timescale of minutes, and that adaptive and agent-driven are separate ideas being sold under one label.","caveats":"The project lives at a domain named for inference RSI, yet neither the page nor the paper claims self-improvement. The page says both that it is open source and that code is coming soon. The headline revenue figure is throughput multiplied by list prices, not money earned. The baseline is NVIDIA Dynamo as configured by the authors.","numbers":[{"metric":"Mean end-to-end latency, 126 coding agents on GLM-5.2","value":"54.4 s to 13.0 s (4.2x lower)","baseline":"Dynamo with SGLang","verification":"self-reported","setup":"36 GB300 GPUs, one run"},{"metric":"P95 TTFT, same run","value":"228.4 s to 19.6 s (11.7x lower)","baseline":"Dynamo with SGLang","verification":"self-reported","setup":"36 GB300 GPUs"},{"metric":"Throughput under a workload that shifts across three phases","value":"1.28x","baseline":"the best static prefill/decode split","verification":"self-reported","setup":"Kimi K2.6"},{"metric":"Time to switch a node between prefill and decode","value":"6.2 s while still serving","baseline":"754 s out of service on Dynamo","verification":"self-reported"},{"metric":"Cost of adapting online when traffic is steady","value":"0.3% of throughput","baseline":"no adaptation","verification":"self-reported"}],"bears_on":[{"claim":"C2","direction":"supports","note":"The best static split loses 28% as soon as the traffic mix moves."},{"claim":"C5","direction":"challenges","note":"The RSI label is attached, as a domain name, to a system with no self-improvement in it. The word is running ahead of the work."},{"claim":"C1","direction":"complicates","note":"Gains this large came from a classical online controller. Not every adaptive win needs an agent."}],"also":[{"label":"arXiv 2611.12304","url":"https://arxiv.org/abs/2611.12304"}],"read":"opened","status":"active"},{"id":"2026-11-06-openrouter-auto-code-routers","title":"Model routing benchmarks, and the new Auto and Auto Code routers","url":"https://openrouter.ai/benchmarks/routers","org":"OpenRouter","published":"2026-11-06","added":"2026-11-21","kind":"benchmark","layers":["routing"],"mechanism":"online","venue":"cluster","gist":"OpenRouter rebuilt its router and added one for coding agents. It decides every turn from eleven signals plus live price and cache state, but switches only when the gain beats the cache it gives up: in beta it kept the same model for nearly nine turns in ten. A public board runs its routers beside single models from the same pool on five public benchmarks.","changes":"The comparison T8 asked for, from a router vendor. Its coding router costs 74% less than Claude Opus 5.5 at similar quality, but on Deep SWE several single models from its pool beat it on both quality and cost, and OpenRouter itself says no router beats the best single model everywhere.","caveats":"Run by the vendor, on tasks others wrote. Quality on the overview chart is averaged over whichever benchmarks each entry completed, and many single-model baselines skip some, so compare per benchmark. Costs are recorded per task and the board tracks cache hits, but how cached tokens are priced is not stated. Benchmark tasks are not live sessions. Found through a post on X.","numbers":[{"metric":"Cost per task of the coding router at similar quality","value":"74% lower","baseline":"Claude Opus 5.5, the dearest model in its pool, across five benchmarks","verification":"self-reported"},{"metric":"Deep SWE score and cost per task, coding router","value":"74.3% at $1.98","baseline":"single models from the same pool: Claude Sonnet 5.5 at 77.8% for $0.40, Kimi K3.1 Pro at 77.9% for $0.85","verification":"public-run"},{"metric":"Agent turns that stayed on the same model","value":"nearly 9 in 10","baseline":"all agent turns in the beta","verification":"self-reported"}],"bears_on":[{"claim":"C9","direction":"challenges","note":"A router vendor's own board shows single models from its pool beating its coding router on public coding tasks. The cache part holds: even a router that decides every turn switched about one turn in ten."}],"read":"opened","status":"active"},{"id":"2026-11-04-vllm-sglang-controlled-evaluation","title":"A controlled experimental evaluation of configuration and cache architecture in LLM serving engines","url":"https://arxiv.org/abs/2611.05991","org":"Muhammad Faizan Anwar, Sina Keshvadi","published":"2026-11-04","added":"2026-11-19","kind":"critique","layers":["engine","serving"],"mechanism":"frame","venue":"any","gist":"Much of the reported gap between the two main open engines on a multi-agent workload comes from one default setting, not from architecture.","changes":"A warning about every engine-against-engine number here: a single flag explained most of the largest gap. Part of what gets called specialisation is noticing a bad default.","caveats":"Only the abstract has been read. A real tail-latency advantage survives at equal throughput, attributed to cache-aware request ordering.","numbers":[{"metric":"Share of the largest capacity gap removed by matching one setting","value":"78%","baseline":"both engines at defaults","verification":"third-party"}],"bears_on":[{"claim":"C3","direction":"challenges","note":"If one flag is most of the gap, much of the gain from tuning per deployment is available to anyone who reads the documentation."},{"claim":"C4","direction":"supports","note":"Comparisons between engines hinge on defaults. Baselines are fragile."},{"claim":"C2","direction":"complicates","note":"Some of what looks like workload-specific optimum is one setting that was wrong for everyone."}],"read":"relayed","status":"active"},{"id":"2026-11-04-together-polymorphic-inference","title":"Polymorphic inference","url":"https://www.together.ai/blog/polymorphic-inference","org":"Together AI","authors":"Simran Arora, Dan Fu","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["loop","compiler","routing","model"],"mechanism":"agent","venue":"cluster","gist":"A positioning piece: inference should change form as models, traffic and chips change, instead of shipping one hand-tuned configuration. It names the Together Compiler as the first piece, with adaptive speculative decoding, workload-aware model routing and per-customer post-training to follow, and calls the compiler loop recursive self-improvement at production scale.","changes":"Supplies the churn argument in one statistic and the vocabulary, static against polymorphic, that others are picking up. It is also the most explicit commercial claim to the RSI label.","caveats":"No performance numbers of its own. The RSI claim is the company's characterisation; the companion technical post does not use the phrase or describe agents improving themselves. Most of the agenda is planned, not shipped, and per-customer compilation is a limited beta.","numbers":[{"metric":"Share of OpenRouter traffic on models released in the last three months","value":"80%","baseline":"market observation cited by Together, not independently checked","verification":"unverified"}],"bears_on":[{"claim":"C6","direction":"supports","note":"If four-fifths of traffic is on models under three months old, nothing hand-tuned stays relevant for long."},{"claim":"C5","direction":"complicates","note":"Claims the label outright; the evidence for the recursive part is not shown."},{"claim":"C3","direction":"complicates","note":"Per-customer continuous compilation exists, but only as a limited beta on request."}],"read":"opened","status":"active"},{"id":"2026-11-04-together-compiler","title":"Together Compiler: continual compilation for AI inference","url":"https://www.together.ai/blog/together-compiler-continual-compilation-for-ai-inference","org":"Together AI","authors":"Reyna Abhyankar, Dylan Lim, Simran Arora","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["loop","compiler","kernels","engine"],"mechanism":"agent","venue":"cluster","gist":"The technical description. Inputs are a traffic shape, a model and a chip. Parallel agents propose changes to the engine's forward pass and share findings on a message board. The enabling trick is infrastructure: an engine that stays up and hot-reloads candidates, in a fast tier with a few layers and a slow tier with the full model on real data, plus a cost model that prunes parallelism layouts.","changes":"Shows that the investment is in the evaluation rig, not the agent. Cutting engine start-up from minutes to seconds is what makes hundreds of experiments affordable.","caveats":"Says nothing about how output correctness is checked, how drift is detected, or how often recompilation runs. The companion paper concedes one headline comparison sets their 8-way parallel run against a published 4-way one. Page metadata says 3.7x where the text says 2.6x.","numbers":[{"metric":"Throughput on four models","value":"up to 2.6x","baseline":"best published AgentX configurations of open engines","verification":"self-reported"},{"metric":"Engine start-up per experiment","value":"467 s to 9 s","baseline":"restarting a standard engine","verification":"self-reported"},{"metric":"Experiments per unit time","value":"252x","baseline":"other agentic performance-optimisation systems, unnamed","verification":"self-reported"},{"metric":"Prompt length in one region's working hours","value":"about 1.4x longer (97k vs 70k tokens)","baseline":"other hours","verification":"self-reported"}],"bears_on":[{"claim":"C1","direction":"supports","note":"Agent search in production on serverless endpoints, by their account."},{"claim":"C4","direction":"supports","note":"A two-tier engine exists because timings on a few layers do not predict the full model on real data."},{"claim":"C2","direction":"supports","note":"Prompt lengths rose about 80% in the two weeks after a model release. The target moves."},{"claim":"C7","direction":"challenges","note":"Claims a private lead of up to 2.6x over the best public configurations."}],"read":"opened","status":"active"},{"id":"2026-11-04-cognition-swe-2-flash","title":"Introducing SWE-2 Flash","url":"https://cognition.com/blog/swe-2-flash","org":"Cognition","published":"2026-11-04","added":"2026-11-19","kind":"blog","layers":["model"],"mechanism":"hand","venue":"any","gist":"A coding-agent company took an open-weight model, added a large mid-training stage and then reinforcement learning in its own harness, and ships the result as a fast cheap tier. Most of the gain is credited to better training tasks.","changes":"Counter-evidence from the tuner's own table: an off-the-shelf open model released around the same time scores about twice as high on the same benchmark as the tuned one.","caveats":"Self-reported; compute, task counts and prices are not disclosed and the weights are not public. The comparison models were run in different harnesses.","numbers":[{"metric":"Terminal task benchmark","value":"20.0 for the tuned model, 42.3 for an untuned general open model","baseline":"the tuned model's own base scored 0.9","verification":"self-reported"}],"bears_on":[{"claim":"C10","direction":"challenges","note":"In the tuner's own table, a newer general open model beats the tuned one by a wide margin."}],"read":"relayed","status":"active"},{"id":"2026-11-03-modelblaster","title":"ModelBlaster: learning-augmented agents across models, kernels and hardware backends","url":"https://arxiv.org/abs/2611.04104","org":"Shengjun Kris Dong, Christos Kozyrakis et al.","published":"2026-11-03","added":"2026-11-19","kind":"paper","layers":["kernels","compiler","loop"],"mechanism":"agent","venue":"local","gist":"An agent whose policy is a persistent knowledge base, updated from textual feedback as it works instead of by retraining. Knowledge learned optimising single kernels is reused for whole-model decisions, across a datacenter GPU, a phone GPU and a RISC-V vector chip.","changes":"The only result so far of agent-written kernels on edge-class chips, where it beats the vendor's own SDK. It also bets the opposite way from Together on whether accumulated knowledge helps.","caveats":"Two weeks old. The abstract does not name the edge devices or the benchmark suite. Its datacenter results are on the benchmark shown to overstate.","numbers":[{"metric":"Phone GPU (Qualcomm Adreno, OpenCL)","value":"5.8x over the vendor SDK; 1.7x over Apache TVM","baseline":"vendor SDK and TVM","verification":"self-reported"},{"metric":"RISC-V vector chip","value":"2.7x","baseline":"ExecuTorch with XNNPACK","verification":"self-reported"}],"bears_on":[{"claim":"C5","direction":"supports","note":"The agent's policy is a knowledge base that updates as it works."},{"claim":"C6","direction":"supports","note":"One agent, three unlike backends."},{"claim":"C2","direction":"supports","note":"The same agent produced different winning kernels for a datacenter GPU, a phone GPU and a RISC-V chip."}],"read":"relayed","status":"active"},{"id":"2026-11-03-looped-model-serving-speed","title":"What Sets the Serving Speed of Looped Language Models? Measurements and Optimizations Graded by Exactness","url":"https://arxiv.org/abs/2611.05150","org":"University of Tübingen, UIUC, Fudan and others","authors":"Dezhen Lu, Runguo Li, Zixiang Ni, Yuchen Tang, Xingquan Kong, Jiaxing Yang, Jiarui Guo, Lingxiang Gao","published":"2026-11-03","added":"2026-11-22","kind":"paper","layers":["engine","serving"],"mechanism":"hand","venue":"cluster","gist":"Measures two looped models, Ouro and Huginn, in vllm-rlt, an open engine built for looped models, and grades each speed-up by whether outputs stay bit-identical. A looped token pays every per-layer overhead once per pass: 5,689 small GPU kernels per Ouro token at batch 1, and many reserved cache slots that are never written.","changes":"A looped model is a new architecture with its own engine debts. Exact fixes alone made Ouro 1.65 to 2.15 times faster i
