<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--__GENERATED__-->
<title>The Recursive Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a sticky instrument bar over one working column; views swap in place like panes in a profiler.
   Figure-first: every view opens on a diagram or chart, prose is capped, depth sits behind a link.
   Colour carries meaning in three separate families that never share a chart:
   means (how an optimisation is produced), polarity (evidence for or against), status (verdicts). */
:root {
  --bg: #f3f4f9; --surface: #fcfcfe; --inset: #eceef6;
  --ink: #14151f; --ink-2: #464a5e; --ink-3: #666b80;
  --line: #dee1ec; --line-2: #c2c6d8;
  --accent: #5a48d0; --accent-soft: #e9e6fb; --on-accent: #ffffff;
  --m-agent: #6250d6; --m-online: #1baf7a; --m-rules: #eb6834; --m-hand: #464a5e; --m-frame: #8a8fa3;
  --supports: #2a78d6; --challenges: #e34948; --mixed: #8a8fa3;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-text: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c13; --surface: #141621; --inset: #1c1f2e;
    --ink: #ecedf6; --ink-2: #b5b8cc; --ink-3: #8a8ea6;
    --line: #252839; --line-2: #3a3e55;
    --accent: #9d93f0; --accent-soft: #231f40; --on-accent: #0b0c13;
    --m-agent: #9085e9; --m-online: #199e70; --m-rules: #d95926; --m-hand: #b5b8cc; --m-frame: #6f748c;
    --supports: #3987e5; --challenges: #e66767; --mixed: #7f849b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c13; --surface: #141621; --inset: #1c1f2e;
  --ink: #ecedf6; --ink-2: #b5b8cc; --ink-3: #8a8ea6;
  --line: #252839; --line-2: #3a3e55;
  --accent: #9d93f0; --accent-soft: #231f40; --on-accent: #0b0c13;
  --m-agent: #9085e9; --m-online: #199e70; --m-rules: #d95926; --m-hand: #b5b8cc; --m-frame: #6f748c;
  --supports: #3987e5; --challenges: #e66767; --mixed: #7f849b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-text); }
[hidden] { display: none !important; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p, figure { margin: 0; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* ---------- instrument bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--font-display); text-decoration: none; letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
.status { margin-left: auto; display: flex; gap: 6px 14px; flex-wrap: wrap; font: 400 12px/1.4 var(--font-data); color: var(--ink-2); }
.status b { font-weight: 500; color: var(--ink); }
.ghost { background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.ghost:hover { background: var(--inset); }
.tabs-scroll { overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; min-width: max-content; }
.tabs a { padding: 9px 12px; font-size: 14px; font-weight: 500; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .count { font: 500 11px/1 var(--font-data); background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 3px 6px; margin-left: 6px; }

/* ---------- page furniture */
main { padding-block: 32px 56px; display: grid; gap: 40px; }
main > * { min-width: 0; }
.eyebrow { font: 500 12px/1.4 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.view-head { display: grid; gap: 8px; max-width: 720px; }
.view-head h1 { font-size: clamp(26px, 4vw, 34px); }
.view-head p { color: var(--ink-2); }
.hero { display: grid; gap: 12px; max-width: 880px; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.08; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .sub { font-size: 18px; color: var(--ink); max-width: 60ch; font-weight: 500; }
.hero .intro { font-size: 15.5px; line-height: 1.65; color: var(--ink-2); max-width: 74ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font: 400 13px/1.5 var(--font-data); color: var(--ink-2); }
.facts b { color: var(--ink); font-weight: 500; }
.sec { display: grid; gap: 14px; }
.sec > h2 { font-size: 20px; }
.sec-note { color: var(--ink-2); max-width: 70ch; font-size: 14px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.stamp { font: 400 12px/1.4 var(--font-data); color: var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; align-content: start; }
.banner { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; font-size: 14px; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; font-weight: 500; }
.link:hover { text-decoration-color: var(--accent); }
.gloss { border-bottom: 1px dotted var(--ink-3); cursor: help; }
.tag { font: 500 11px/1.2 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.vhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
details > summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-2); }
details > summary:hover { color: var(--accent); }
.plain-list { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); font-size: 13.5px; }
.foot { border-top: 1px solid var(--line); padding-block: 20px 40px; color: var(--ink-3); font-size: 13px; display: flex; gap: 8px 20px; flex-wrap: wrap; justify-content: space-between; }

/* ---------- pills, chips, glyphs */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-text); padding: 5px 9px 5px 6px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); white-space: nowrap; }
.pill-i, .vicon { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--ink-3); flex: none; }
.t-good { --tone: var(--good); } .t-warn { --tone: var(--warn); } .t-serious { --tone: var(--serious); } .t-crit { --tone: var(--crit); }
.pill[class*="t-"] { border-color: color-mix(in srgb, var(--tone) 60%, var(--line)); background: color-mix(in srgb, var(--tone) 12%, var(--surface)); }
[class*="t-"] > .pill-i, [class*="t-"] > .vicon { background: var(--tone); }
.t-warn > .pill-i, .t-serious > .pill-i, .t-warn > .vicon, .t-serious > .vicon { color: #0b0b0b; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-data); padding: 5px 8px; border-radius: 6px; background: var(--inset); border: 0; cursor: pointer; color: var(--ink-2); }
.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dir { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--mixed); display: inline-block; }
.dir-supports { background: var(--supports); }
.dir-challenges { background: var(--challenges); }
/* means: colour plus shape, so identity never rests on hue alone */
.mg { display: inline-block; width: 11px; height: 11px; flex: none; background: var(--m-agent); border-radius: 50%; }
.mg.m-online { background: var(--m-online); border-radius: 1px; transform: rotate(45deg) scale(0.82); }
.mg.m-rules { background: var(--m-rules); border-radius: 2px; }
.mg.m-hand { background: var(--m-hand); border-radius: 0; clip-path: polygon(50% 2%, 100% 98%, 0 98%); }
.mg.m-frame { background: transparent; border: 2px solid var(--m-frame); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

/* ---------- figure: then / now flow */
.shift { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; }
.lane { display: grid; grid-template-columns: 158px minmax(0, 1fr); gap: 16px; align-items: center; }
.lane-tag { display: grid; gap: 2px; }
.lane-tag strong { font: 600 15px/1.2 var(--font-display); }
.lane-tag span { font-size: 12px; color: var(--ink-3); }
.flow { display: flex; list-style: none; margin: 0; padding: 0; gap: 3px; }
.flow li { flex: 1; min-width: 0; min-height: 52px; padding: 8px 20px 8px 26px; font-size: 13.5px; font-weight: 500; line-height: 1.25; display: flex; align-items: center; background: var(--inset); color: var(--ink-2);
  clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); }
.flow li:first-child { padding-left: 16px; clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%); border-radius: 8px 0 0 8px; }
.lane-now .flow li { background: var(--accent); color: var(--on-accent); }
.lane-now .lane-tag strong { color: var(--accent); }
.loopback { margin-left: 174px; display: flex; align-items: center; gap: 10px; font: 500 12px/1.2 var(--font-data); color: var(--accent); }
.loopback::before { content: ""; width: 26px; height: 12px; border: 2px solid var(--accent); border-top: 0; border-radius: 0 0 8px 8px; }
.loopback::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }

/* ---------- figure: the lever map (a request's path, the model under it, the loop around it) */
.lmap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; display: grid; gap: 6px; }
.lends { display: flex; justify-content: space-between; font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding-bottom: 2px; }
.lflow { display: flex; gap: 3px; }
.lstep, .lbase, .lloop { border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
.lstep { flex: 1; min-width: 0; min-height: 66px; padding: 9px 18px 9px 26px; background: var(--inset); display: grid; gap: 4px; align-content: center;
  clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); }
.lstep:first-child { padding-left: 16px; clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%); border-radius: 8px 0 0 8px; }
.lname { font: 600 13.5px/1.2 var(--font-display); }
.lmeta { display: flex; align-items: center; gap: 6px; font: 400 10.5px/1 var(--font-data); color: var(--ink-3); }
.lmeta i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--ink-3)); flex: none; }
.lbase { background: var(--inset); border-radius: 8px; padding: 10px 16px; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.lbase .lhint, .lloop .lhint { font-size: 12.5px; color: var(--ink-2); }
.lloop { background: var(--accent-soft); border-radius: 8px; padding: 10px 16px; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.lloop .lname { color: var(--accent); }
.lstep:hover, .lbase:hover { background: var(--line); }
.lstep[aria-pressed="true"], .lbase[aria-pressed="true"], .lloop[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
[aria-pressed="true"] > .lname, [aria-pressed="true"] .lmeta, [aria-pressed="true"] .lhint { color: var(--on-accent); }
.lstep:focus-visible { outline: none; text-decoration: underline; }
.lever-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 32px; padding: 14px 4px 0; }
.lever-detail h3 { font-size: 19px; }
.lever-detail .kv p { font-size: 14px; color: var(--ink-2); }
.lq { display: grid; gap: 10px; align-content: start; }
.levers { min-width: 860px; }
.levers td { font-size: 13.5px; }
.levers th[scope="row"] { font: 600 14px/1.25 var(--font-display); width: 170px; }

/* ---------- figure: the build path */
.steps { display: grid; gap: 0; counter-reset: s; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 14px; position: relative; padding-bottom: 16px; counter-increment: s; }
.step::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 600 14px/34px var(--font-data); text-align: center; z-index: 1; }
.step::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line-2); }
.step:last-child::after { display: none; }
.sbody { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.sbody h3 { font-size: 17px; }
.sbody > p { color: var(--ink-2); font-size: 14px; max-width: 78ch; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
.sgrid .kv { align-content: start; }
.sgrid .kv p { font-size: 13.5px; }
.chips { align-items: flex-start; }
.watch-out { font-size: 13px; color: var(--ink-2); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-radius: 8px; padding: 8px 10px; }

/* ---------- figure: five points */
.points { display: grid; gap: 0; }
.point { display: grid; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
.point:first-child { border-top: 0; padding-top: 0; }
.point h3 { font-size: 16px; }
.point p { color: var(--ink-2); font-size: 14px; max-width: 62ch; }

/* ---------- figure: course check tiles */
.quote { color: var(--ink-2); font-size: 14px; font-style: italic; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; background: color-mix(in srgb, var(--tone) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone) 40%, var(--line)); }
.tile-top { display: flex; align-items: center; gap: 8px; }
.tile .vicon { width: 20px; height: 20px; font-size: 12px; }
.tile strong { font: 600 14px/1.2 var(--font-display); }
.tile .verdict { font: 500 11px/1 var(--font-data); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.tile p { font-size: 13px; line-height: 1.4; color: var(--ink); }
.reframe { font: 500 15px/1.45 var(--font-display); }

/* ---------- figure: what it implies for the reader's position */
.impl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; grid-template-rows: auto 1fr auto; }
.icard h3 { font-size: 16px; }
.icard p { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.rests { display: grid; gap: 6px; }
.rest { display: grid; grid-template-columns: auto minmax(40px, 1fr) auto; gap: 8px; align-items: center; border: 0; background: none; padding: 0; cursor: pointer; font: 500 12px/1 var(--font-data); color: var(--ink-2); text-align: left; }
.rest:hover { color: var(--accent); }
.rest .cbar { height: 8px; }
.for-you { font: 500 10px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 3px 5px; margin-right: 6px; vertical-align: 1px; white-space: nowrap; }

/* ---------- figure: claims bars */
.cfig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 0; }
.crow { display: grid; grid-template-columns: 44px minmax(0, 1.25fr) minmax(110px, 1fr) 46px 132px; gap: 12px; align-items: center; padding: 9px 10px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; width: 100%; }
.crow:hover { background: var(--inset); }
.crow .cid { font: 500 12px/1 var(--font-data); color: var(--ink-3); white-space: nowrap; }
.crow .cid.is-focus { color: var(--accent); font-weight: 600; }
.crow .cid.is-focus::before, .focus-key { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 4px; vertical-align: 2px; }
.crow .cname { font-weight: 500; font-size: 14px; line-height: 1.3; }
.cbar { position: relative; height: 12px; background: var(--inset); border-radius: 0 4px 4px 0; }
.cbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.cbar b { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink-3); }
.cbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.crow .cval { font: 500 14px/1 var(--font-data); text-align: right; }
.cev { display: flex; gap: 8px; font: 400 12px/1 var(--font-data); color: var(--ink-2); justify-content: flex-end; }
.cev span { display: inline-flex; align-items: center; gap: 4px; }
.caxis { display: grid; grid-template-columns: 44px minmax(0, 1.25fr) minmax(110px, 1fr) 46px 132px; gap: 12px; padding: 2px 10px 6px; font: 400 10.5px/1 var(--font-data); color: var(--ink-3); }
.caxis div { display: flex; justify-content: space-between; grid-column: 3; }

/* ---------- figure: loop ring */
.loop-fig { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.ring { width: 100%; height: auto; display: block; max-width: 340px; }
.ring-arrow { fill: none; stroke: var(--line-2); stroke-width: 2.5; }
.ring-arrow.is-dashed { stroke-dasharray: 4 5; }
.ring-ah { fill: var(--line-2); }
.ring-node { cursor: pointer; }
.ring-node circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ring-node text { font: 600 13px var(--font-display); fill: var(--ink); pointer-events: none; }
.ring-node.is-bottleneck circle { fill: color-mix(in srgb, var(--warn) 30%, var(--surface)); stroke: var(--warn); }
.ring-node.is-unproven circle { stroke: var(--ink-3); stroke-dasharray: 4 4; }
.ring-node.is-on circle { stroke-width: 4.5; }
.ring-node:focus-visible { outline: none; }
.ring-node:focus-visible circle { stroke-width: 5; }
.ring-c1 { font: 600 13px var(--font-display); fill: var(--ink-2); }
.ring-c2 { font: 400 11px var(--font-data); fill: var(--ink-3); }
.loop-detail { display: grid; gap: 10px; align-content: start; }
.loop-detail h3 { font-size: 20px; }
.loop-detail p { color: var(--ink-2); font-size: 14px; max-width: 54ch; }
.loop-detail .hard { color: var(--ink); }

/* ---------- figure: data charts (pairs, bars) */
.fig-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; }
.fig-grid > .fig:last-child:nth-child(odd) { grid-column: 1 / -1; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px 14px; display: grid; gap: 10px; align-content: start; }
.fig-head { display: grid; gap: 4px; padding: 0 6px; }
.fig h3 { font-size: 16px; }
.fig .take { font-size: 14px; color: var(--ink-2); }

<script>
(function () {

  if (!D) { app.textContent = 'No data in this file. Run: python3 scripts/build.py'; return; }

  // ---------- tiny DOM helpers (data is only ever inserted as text)
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  }
  function svg(tag, attrs, ...kids) {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: carry on */ } }
  };

  // ---------- dates
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmt = iso => { if (!iso || iso === 'undated') return 'undated'; const [y, m, d] = iso.split('-').map(Number); return d ? `${d} ${MON[m - 1]} ${y}` : `${MON[m - 1]} ${y}`; };
  const utc = iso => { const [y, m, d = 1] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const todayUtc = () => { const t = new Date(); return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayDiff = iso => Math.round((utc(iso) - todayUtc()) / 864e5);
  const rel = iso => { const n = dayDiff(iso); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; return n > 0 ? `in ${n} days` : `${-n} days ago`; };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const pct = v => Math.round(v * 100) + '%';

  // ---------- indexes
  const M = D.model;
  const allClaims = D.thesis.claims;
  const claims = allClaims.filter(c => c.status === 'active');
  const claimById = Object.fromEntries(allClaims.map(c => [c.id, c]));
  const sigById = Object.fromEntries(D.signals.map(s => [s.id, s]));

  const nameOf = (list, id) => (list.find(x => x.id === id) || { name: id }).name;
  const evidence = id => active.flatMap(s => (s.bears_on || []).filter(b => b.claim === id).map(b => ({ s, direction: b.direction, note: b.note })));
  const DIRS = [['supports', 'for'], ['complicates', 'mixed'], ['challenges', 'against']];
  const checks = (D.watch.checks || []);
  const openChecks = checks.filter(c => c.status === 'open').sort((a, b) => a.due.localeCompare(b.due));
  const seenKey = 'recursive-stack.seen';
  const seen = store.get(seenKey);

    return [head('The numbers, and who checked them', 'Evidence', `The charts that carry the argument, then all ${rows.length} quantitative claims from the signals. A speed-up with no baseline is not recorded.`),
      featured.length ? el('div', { class: 'fig-grid' }, featured.map(figure)) : null,
      others.length ? section('More charts', 'Narrower comparisons, each about one lever.', el('div', { class: 'fig-grid' }, others.map(figure))) : null,
      bar,
      el('div', { class: 'sec' }, controls, el('div', { class: 'scroll-x' }, el('table', { class: 'ledger' },
        el('colgroup', null, ['24%', '20%', '20%', '12%', '14%', '10%'].map(w => el('col', { style: `width:${w}` }))),
        el('thead', null, el('tr', null, ['Measure', 'Result', 'Against', 'Setup', 'Who checked', 'Source'].map(t => el('th', { scope: 'col' }, t)))), body)))];
  }

  // =====================================================================
  // TENSIONS
  // =====================================================================
  function viewTensions() {
    return [head('Where credible people do opposite things', 'Tensions', 'Each one names its sides and what would settle it.'),
      el('div', { class: 'cards' }, D.tensions.map(t => el('article', { class: 'card', style: 'gap:12px' },
        el('div', { class: 'vhead' }, el('span', { class: 'tag' }, t.id), pill(TSTAT[t.status])),
        el('h3', { style: 'font-size:18px' }, t.question),
        el('div', { class: 'versus' }, t.sides.map(sd => el('div', { class: 'side' }, el('strong', null, sd.held_by), el('p', { 'data-prose': true }, sd.position), srcChips(sd.signals || [])))),
        el('p', { 'data-prose': true }, el('strong', { style: 'color:var(--ink)' }, 'Settles when: '), t.settles_when),
        t.lean ? el('details', null, el('summary', null, 'Current lean'), el('p', { style: 'margin-top:6px', 'data-prose': true }, t.lean)) : null,
        (t.claims || []).length ? el('div', { class: 'chips' }, t.claims.map(c => claimChip(c))) : null)))];
  }

  // =====================================================================
  // WATCH
  // =====================================================================
  function viewWatch() {
    const closed = checks.filter(c => c.status !== 'open');
    const row = c => { const late = c.status === 'open' && dayDiff(c.due) < 0; return el('tr', { id: `check-${c.id}` },
      el('td', { class: 'due num' + (late ? ' is-late' : '') }, el('strong', null, c.id), ' ', fmt(c.due), el('small', null, c.status === 'open' ? (late ? `overdue, ${rel(c.due)}` : rel(c.due)) : '')),
      el('td', null, c.lens && D.course.position ? el('span', { class: 'for-you' }, `for a ${D.course.position.label.toLowerCase()}`) : null, el('span', { 'data-prose': true }, c.what), el('details', null, el('summary', null, c.status === 'open' ? 'Why it matters' : 'How it resolved'), el('p', { class: 'small', style: 'color:var(--ink-2);margin-top:4px' }, c.status === 'open' ? c.why : c.resolution))),
      el('td', null, el('div', { class: 'chips' }, (c.claims || []).map(id => claimChip(id)))),
      el('td', null, pill(WSTAT[c.status]))); };
    const table = list => el('div', { class: 'scroll-x' }, el('table', { class: 'watch' },
      el('thead', null, el('tr', null, ['Check by', 'What to look for', 'Bears on', 'Status'].map(t => el('th', { scope: 'col' }, t)))), el('tbody', null, list.map(row))));
    return [head('Written before the answer is known', 'Watchlist', 'Dated checks. Each sweep resolves the ones that are due before it reads anything new.'),
      figWatch(),
      section('Pending', null, openChecks.length ? table(openChecks) : el('p', { class: 'muted' }, 'Nothing pending.')),
      closed.length ? section('Resolved', null, table(closed)) : null,
      section('Where each sweep looks', 'The standing sources. Hover one for why it is on the list.',
        el('div', { class: 'chips' }, (D.watch.feeds || []).map(f => el('a', { class: 'chip', href: f.url, target: '_blank', rel: 'noopener', 'data-tip': f.why, style: 'text-decoration:none' }, f.name))))];
  }

  // =====================================================================
  // SIGNALS
  // =====================================================================
  function signalCard(s) {
    return el('article', { class: 'card' + (s.status === 'active' ? '' : ' is-off') },
      el('p', { class: 'metaline' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, orgShort(s)), el('span', null, fmt(s.published)), el('span', null, nameOf(M.venues, s.venue)),
        s.status === 'active' ? null : el('span', null, s.status), s.read === 'relayed' ? el('span', { 'data-tip': 'Reported by a research sub-agent. The sweep agent has not yet read the page itself.', tabindex: '0' }, 'relayed') : null),
      el('h3', null, sigLink(s), isNew(s) ? el('span', { class: 'badge-new' }, 'new') : null),
      el('p', { 'data-prose': true }, s.changes),
      (s.bears_on || []).length ? el('div', { class: 'chips' }, s.bears_on.map(b => claimChip(b.claim, b.direction))) : null);
  }
  function viewSignals() {
    const st = state.sig;
    const listEl = el('div', { class: 'cards' });
    const count = el('span', { class: 'result-n' });
    const draw = () => {
      const q = st.q.toLowerCase();
      const hits = D.signals.filter(s => (st.off || s.status === 'active') && (!st.layer || s.layers.includes(st.layer)) && (!st.mechanism || s.mechanism === st.mechanism) && (!st.venue || s.venue === st.venue) && (!st.kind || s.kind === st.kind) && (!st.claim || (s.bears_on || []).some(b => b.claim === st.claim)) && (!q || [s.title, s.org, s.gist, s.changes, s.caveats, s.authors].join(' ').toLowerCase().includes(q)));
      count.textContent = `${hits.length} of ${D.signals.length}`;
      listEl.replaceChildren(...(hits.length ? hits.map(signalCard) : [el('p', { class: 'muted' }, 'Nothing matches. Clear a filter.')]));
      annotate(listEl);
    };
    const sel = (key, label, opts) => el('select', { id: `sig-${key}`, 'aria-label': label, onchange: e => { st[key] = e.target.value; draw(); } }, el('option', { value: '' }, label), opts.map(([v, t]) => el('option', { value: v, selected: st[key] === v }, t)));
    const kinds = [...new Set(D.signals.map(s => s.kind))].sort();
    const controls = el('div', { class: 'controls' },
      el('input', { type: 'search', id: 'sig-q', placeholder: 'Search signals', 'aria-label': 'Search signals', value: st.q, oninput: e => { st.q = e.target.value; draw(); } }),
      sel('claim', 'Any claim', claims.map(c => [c.id, `${c.id} · ${c.short}`])), sel('mechanism', 'Any means', M.mechanisms.map(l => [l.id, l.name])),
      sel('venue', 'Any place', M.venues.map(l => [l.id, l.name])), sel('layer', 'Any layer', M.layers.map(l => [l.id, l.name])), sel('kind', 'Any kind', kinds.map(k => [k, k])),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', id: 'sig-off', checked: st.off, onchange: e => { st.off = e.target.checked; draw(); } }), 'Show retired'), count);
    draw();
    return [head('The raw material', 'Signals', 'Each card says what the source changes. Select a title for the detail and the link.'),
      histogram(active), el('div', { class: 'sec' }, controls, listEl)];
  }

  // =====================================================================
  // LOG, GLOSSARY
  // =====================================================================
  function viewLog() {
    const every = D.meta.cadence_days === 1 ? 'One sweep a day' : `One sweep every ${D.meta.cadence_days} days`;
    const card = c => el('article', { class: 'card' },
        el('p', { class: 'metaline' }, el('span', null, `Cycle ${c.n}`), el('span', null, fmt(c.id)), el('span', null, c.agent), c.deep ? el('span', null, 'deep pass') : null, el('span', null, `next due ${fmt(c.next_due)}`)),
        (c.changes || []).length ? null : el('span', { class: 'tag' }, 'quiet day'),
        el('p', { style: 'color:var(--ink);font-size:15px', 'data-prose': true }, c.summary),
        el('ul', { class: 'changes' }, c.changes.map(ch => el('li', null, el('span', { class: 'tag' }, ch.type, refLabel(ch.ref)), el('span', null, ch.text)))),
        (c.rejected || []).length ? el('details', null, el('summary', null, `Looked at and left out (${c.rejected.length})`),
          el('ul', { class: 'plain-list' }, c.rejected.map(r => el('li', null, r.url ? el('a', { href: r.url, target: '_blank', rel: 'noopener' }, r.title) : r.title, ` · ${r.reason}`)))) : null);
    const recent = D.cycles.slice(0, 14), older = D.cycles.slice(14);
    return [head('What each sweep did', 'Cycle log', `${every}, and a deeper pass once a week. Each records what it changed, and what it looked at and left out.`),
      el('div', { class: 'cards' }, recent.map(card)),
      older.length ? el('details', null, el('summary', null, `Older cycles (${older.length})`), el('div', { class: 'cards', style: 'margin-top:10px' }, older.map(card))) : null];
  }
  function viewGlossary() {
    return [head('Words this field assumes you know', 'Glossary', 'Anywhere on the site, a dotted underline means the definition shows when you point at it.'),
      el('dl', { class: 'gl' }, D.glossary.map(g => el('div', null, el('dt', null, g.term), el('dd', null, g.def))))];
  }

  // =====================================================================
  // SIGNAL SHEET (the place for depth; everything else links here)
  // =====================================================================
  const sheet = document.getElementById('sheet');
  function closeSheet() { if (sheet.open) sheet.close(); }
  function openSignal(id) {
    const s = sigById[id];
    if (!s) return;
    const nums = s.numbers || [];
    sheet.replaceChildren(el('div', { class: 'sheet' },
      el('div', { class: 'sheet-head' },
        el('div', null, el('p', { class: 'stamp' }, [s.org, fmt(s.published), s.kind, s.status !== 'active' ? s.status : null].filter(Boolean).join(' · ')), el('h2', { id: 'sheet-title', style: 'margin-top:6px' }, s.title), s.authors ? el('p', { class: 'small', style: 'margin-top:4px' }, s.authors) : null),
        el('button', { class: 'ghost', type: 'button', onclick: closeSheet }, 'Close')),
      el('div', { class: 'chips', style: 'align-items:center' }, el('a', { class: 'cta', href: s.url, target: '_blank', rel: 'noopener' }, 'Read the source ↗'),
        (s.also || []).map(a => el('a', { class: 'chip', href: a.url, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, a.label + ' ↗')),
        s.read === 'relayed' ? el('span', { class: 'muted small' }, 'relayed, not yet read first-hand') : null),
      el('div', null, el('h4', null, 'What it changes'), el('p', { 'data-prose': true }, s.changes)),
      el('div', null, el('h4', null, 'What it is'), el('p', { 'data-prose': true }, s.gist)),
      el('div', null, el('h4', null, 'What to doubt'), el('p', { 'data-prose': true }, s.caveats)),
      el('div', null, el('h4', null, 'Where it sits'), el('p', { class: 'metaline', style: 'font-size:13px' }, el('span', null, mech(s.mechanism), nameOf(M.mechanisms, s.mechanism)), el('span', null, nameOf(M.venues, s.venue)), el('span', null, s.layers.map(l => nameOf(M.layers, l)).join(', ')))),
      (s.bears_on || []).length ? el('div', null, el('h4', null, 'Bears on'), el('ul', { class: 'ev' }, s.bears_on.map(b => el('li', null, el('span', { class: `dir dir-${b.direction}` }), el('div', null, claimChip(b.claim, b.direction), el('p', { style: 'margin-top:4px' }, b.note)))))) : null,
      nums.length ? el('div', null, el('h4', null, 'Numbers'), el('div', { class: 'scroll-x' }, el('table', null, el('tbody', null, nums.map(n => el('tr', null, el('td', null, n.metric), el('td', { class: 'num' }, el('strong', null, n.value)), el('td', null, n.baseline), el('td', null, pill(VERIF[n.verification])))))))) : null,
      s.superseded_by && sigById[s.superseded_by] ? el('p', null, 'Superseded by ', sigLink(sigById[s.superseded_by])) : null));
    annotate(sheet);
    if (!sheet.open) sheet.showModal();
    sheet.scrollTop = 0;
  }
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  // =====================================================================
  // GLOSSARY ANNOTATION + TOOLTIP
  // =====================================================================
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const TERMS = D.glossary.flatMap(g => [g.term].concat(g.aka || []).map(t => ({ t, def: g.def, key: g.term }))).sort((a, b) => b.t.length - a.t.length)
    .map(x => ({ ...x, re: new RegExp('(^|[^A-Za-z0-9])(' + esc(x.t) + ')(?![A-Za-z0-9])', 'i') }));
  function annotate(root) {
    const used = new Set();
    root.querySelectorAll('[data-prose]').forEach(box => {
      const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        if (!node.parentElement || node.parentElement.closest('.gloss, button, a')) return;
        for (const term of TERMS) {
          if (used.has(term.key)) continue;
          const hit = term.re.exec(node.nodeValue);
          if (!hit) continue;
          const mid = node.splitText(hit.index + hit[1].length);
          mid.splitText(hit[2].length);
          mid.replaceWith(el('span', { class: 'gloss', tabindex: '0', 'data-tip': term.def }, mid.nodeValue));
          used.add(term.key);
          break;
        }
      });
    });
  }
  const tip = document.getElementById('tip');
  function showTip(target) {
    tip.textContent = target.getAttribute('data-tip');
    tip.hidden = false;
    const r = target.getBoundingClientRect(), t = tip.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - t.width - 8, r.left + r.width / 2 - t.width / 2));
    const below = r.bottom + 8 + t.height < window.innerHeight;
    tip.style.left = left + 'px';
    tip.style.top = (below ? r.bottom + 8 : Math.max(8, r.top - t.height - 8)) + 'px';
  }
  const tipTarget = e => e.target.closest && e.target.closest('[data-tip]');
  document.addEventListener('mouseover', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (tipTarget(e)) tip.hidden = true; });
  document.addEventListener('focusin', e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  // =====================================================================
  // SHELL
  // =====================================================================
  const VIEWS = { now: viewNow, map: viewMap, build: viewBuild, who: viewWho, thesis: viewThesis, stack: viewStack, ledger: viewLedger, tensions: viewTensions, watch: viewWatch, signals: viewSignals, log: viewLog, glossary: viewGlossary };
  const TABS = [['now', 'Now'], ['map', 'Big picture'], ['build', 'Build'], ['who', 'Who'], ['thesis', 'Thesis'], ['stack', 'Stack map'], ['ledger', 'Evidence'], ['tensions', 'Tensions'], ['watch', 'Watch'], ['signals', 'Signals'], ['log', 'Cycle log'], ['glossary', 'Glossary']];
  const dueSoon = openChecks.filter(c => dayDiff(c.due) <= D.meta.cadence_days).length;
  const tabs = document.getElementById('tabs');
  tabs.append(...TABS.map(([id, label]) => el('a', { href: `#${id}`, 'data-tab': id }, label, id === 'watch' && dueSoon ? el('span', { class: 'count', title: 'Checks due by the next sweep' }, dueSoon) : null)));
  function go(id) { if (location.hash === `#${id}`) render(); else location.hash = id; }
  function render() {
    const id = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'now';
    tabs.querySelectorAll('a').forEach(a => { if (a.dataset.tab === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    app.replaceChildren(...[].concat(VIEWS[id]()).filter(Boolean));
    annotate(app);
    tip.hidden = true;
    const focus = id === 'thesis' && state.focusClaim ? document.getElementById(`claim-${state.focusClaim}`) : null;
    state.focusClaim = null;
    if (focus) focus.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);

  document.title = D.meta.title;
  document.getElementById('brand-name').textContent = D.meta.title;
  const status = document.getElementById('status');
  if (latest.id) status.append(el('span', null, 'Cycle ', el('b', null, latest.n)), el('span', null, 'swept ', el('b', null, fmt(latest.id))),
    el('span', null, 'next sweep ', el('b', null, dayDiff(latest.next_due) < 0 ? `overdue (${rel(latest.next_due)})` : rel(latest.next_due))));
  document.getElementById('foot').append(el('span', null, D.meta.tagline), el('span', null, D.meta.site ? [el('a', { href: D.meta.site }, 'Live page'), ' · '] : null, el('a', { href: D.meta.repo, target: '_blank', rel: 'noopener' }, 'Repository'), ' · generated from data/ · ', el('a', { href: '#glossary' }, 'Glossary')));

  const themeBtn = document.getElementById('theme');
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const paintTheme = () => { themeBtn.textContent = isDark() ? 'Light' : 'Dark'; themeBtn.setAttribute('aria-label', `Switch to ${isDark() ? 'light' : 'dark'} theme`); };
  const savedTheme = store.get('recursive-stack.theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('recursive-stack.theme', next); paintTheme(); });
  paintTheme();
  render();
})();
</script>
